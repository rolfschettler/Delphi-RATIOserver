docs:
  content: |-
    Hier rufst du fertige **Auswertungen aus der Datenbank** ab. Zurzeit gibt es eine: `sp_zahlungen` ermittelt die in der Finanzbuchhaltung gebuchten Zahlungen zu einer Rechnung – einzeln oder als Summe. Dazu kommt der Testendpunkt `demo`, der die mitgeschickten Werte zurückgibt. Es wird nur gelesen, nichts geändert.

    Alle Endpunkte brauchen eine Anmeldung (Token aus `/login`) und die passende Berechtigung in den Rollen des Benutzers (sonst Fehler 401 bzw. 403).

    Technik: Controller `TDataModulStoredProcedures` (`Shared/DataModuls/DataModulStoredProceduresClass.pas`), ruft Stored Procedures per `SELECT * FROM <Prozedur>(...)` auf.
  type: text/markdown
