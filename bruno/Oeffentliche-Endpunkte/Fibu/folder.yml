docs:
  content: |-
    Hier arbeitest du mit der **Finanzbuchhaltung (Fibu)**: Buchungssätze, **Gutscheine**, die Devisenkasse (Kasse für Fremdwährungen) und Bruttolöhne. Kontenstamm und Lohnarten kannst du nur lesen.

    Für Buchungssätze, Gutscheine, Devisenkasse und Bruttolöhne gibt es: auflisten, gefiltert suchen, einzeln abrufen, neue Nummer holen, anlegen, ändern und löschen. **Besonderheit Gutscheine:** Beim Anlegen vergibt der Server Nummer und Vorgangsnummer selbst, und nach jedem Anlegen, Ändern oder Löschen wird der Gutschein automatisch in der Fibu (neu) gebucht. `/fibu/demo` dient zum Testen.

    Alle Endpunkte brauchen eine Anmeldung (Token aus `/login`) und die Berechtigung für den jeweiligen Endpunkt in den Rollen des Benutzers (sonst Fehler 403).

    Technik: Controller `TDataModulFibu` in `Shared/DataModuls/DataModulFibuClass.pas`, Tabellen `FIBU`, `GUTSCHEIN`, `DEVISENKASSE`, `BRUTTOLOHN`, `KONTEN`, `LOHNART`.
  type: text/markdown
