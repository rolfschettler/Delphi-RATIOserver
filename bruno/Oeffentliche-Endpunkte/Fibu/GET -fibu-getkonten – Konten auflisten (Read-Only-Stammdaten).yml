info:
  name: GET /fibu/getkonten – Konten auflisten (Read-Only-Stammdaten)
  type: http
  seq: 22

http:
  method: GET
  url: "{{baseURL}}/fibu/getkonten"
  body:
    type: json
    data: |-
      {
        "fields": "*",
        "orderby": "konto"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Listet Datensaetze der Tabelle KONTEN ueber `DoSelect('KONTEN', ALLOWED)`. KONTEN ist reine Stammdaten-Tabelle: es existieren nur die drei Read-Endpunkte get/getFiltered/getById — kein Key/Insert/Update/Delete.

  **Erlaubte Felder (ALLOWED):** konto, bezeichnung, stschluessel, steuer, kontenart, kontengruppe, automatik, steuerkonto, ustpos, klasse, zahlung, gutscheinkonto, aktiva, passiva, eu, waehrung, op, babzuordnung, ebvortragskonto, gesperrt, mandant.

  **Body (optional):** `{ "fields": [...] | "*", "orderby": "feld", "limit": 10, "offset": 0 }`

  **Auth:** erforderlich (Bearer Token)

  **Antwort:** ohne `limit` `{"header":{"<feld>":"<typ>",...},"data":[{...},...]}` (SerializeQuery: `header` = Feldname -> Typ, `data` = Datensaetze); mit `limit` `{"total":N,"limit":N,"offset":N,"data":{"header":{...},"data":[...]}}`.
