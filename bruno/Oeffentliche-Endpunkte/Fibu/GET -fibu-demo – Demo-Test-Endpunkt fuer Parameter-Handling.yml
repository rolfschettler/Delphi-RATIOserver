info:
  name: GET /fibu/demo – Demo/Test-Endpunkt fuer Parameter-Handling
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseURL}}/fibu/demo?id=42&filter=Mueller"
  params:
    - name: id
      value: "42"
      type: query
    - name: filter
      value: Mueller
      type: query
  body:
    type: json
    data: |-
      {
        "name": "Helga",
        "menge": 5
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Referenz-/Test-Endpunkt ohne Datenbankzugriff. Demonstriert den Zugriff auf Parameter aus zwei Quellen: URL-Query-Parameter `id` (Integer) und `filter` (String) sowie JSON-Body-Parameter `name` (String) und `menge` (Integer) ueber `isParamFromBody`/`getParamFromBody`. Fehlende Werte erzeugen keinen Fehler, sondern erscheinen im Ergebnis als `null`.

  **Auth:** erforderlich (Bearer Token)

  **Antwort:** `{ "url": { "id": 42, "filter": "Mueller" }, "body": { "name": "Helga", "menge": 5 } }`
