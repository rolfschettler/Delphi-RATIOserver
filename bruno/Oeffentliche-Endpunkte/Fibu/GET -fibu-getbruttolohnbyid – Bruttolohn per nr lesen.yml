info:
  name: GET /fibu/getbruttolohnbyid – Bruttolohn per nr lesen
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseURL}}/fibu/getbruttolohnbyid"
  body:
    type: json
    data: |-
      {
        "nr": 42,
        "fields": "*"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  **Bruttolohn per nr lesen.** Liefert genau einen Eintrag aus `BRUTTOLOHN`, gesucht über `nr`.

  | | |
  |---|---|
  | **Aufruf** | `GET {{baseURL}}/fibu/getbruttolohnbyid` |
  | **Anmeldung** | nötig – Token aus `/login` (wird in Bruno automatisch mitgeschickt) |
  | **Berechtigung** | Der Benutzer braucht diesen Endpunkt in seinen Rollen (sonst Fehler 403) |

  ### Was du mitschickst
  | Parameter | Wert | Pflicht | Bedeutung |
  |---|---|---|---|
  | `nr` | Ganzzahl | **ja** | Der gesuchte Eintrag. |
  | `fields` | `"*"` oder Liste | nein | Welche Felder zurückkommen sollen. Weglassen = alle. |

  ### Verfügbare Felder
  | Feld | Typ |
  |---|---|
  | `nr` | Ganzzahl |
  | `monteurzeichen` | Text (max. 15 Zeichen) |
  | `lohnart` | Ganzzahl |
  | `datum` | Datum/Uhrzeit |
  | `einheit` | Kommazahl |
  | `satz` | Kommazahl |
  | `gesamtbetrag` | Kommazahl |
  | `auftragnr` | Ganzzahl |
  | `kostenstelle` | Ganzzahl |
  | `positionsnr` | Ganzzahl |
  | `extauftragnr` | Text (max. 20 Zeichen) |
  | `extpos` | Ganzzahl |
  | `positiosnr` | Ganzzahl |
  | `zuschlag` | Kommazahl |
  | `herkunft` | Text (max. 20 Zeichen) |
  | `faktor` | Ganzzahl |
  | `bezeichnung` | Text (max. 120 Zeichen) |
  | `fahrzeug` | Text (max. 30 Zeichen) |
  | `kostenstelle1` | Text (max. 12 Zeichen) |
  | `kostenstelle2` | Text (max. 12 Zeichen) |
  | `vonzeit` | Text (max. 5 Zeichen) |
  | `biszeit` | Text (max. 5 Zeichen) |
  | `kmanfang` | Ganzzahl |
  | `kmende` | Ganzzahl |
  | `kmgesamt` | Ganzzahl |
  | `zusatzfeld1` | Text (max. 30 Zeichen) |
  | `zusatzfeld2` | Text (max. 30 Zeichen) |
  | `kommentar` | Text (max. 1200 Zeichen) |

  ### Was zurückkommt
  ```json
  {"header": {...}, "data": [ {"nr": 42, "monteurzeichen": "Text", "lohnart": 42, ...} ]}
  ```

  ### Was schiefgehen kann
  - **401** – nicht angemeldet oder Token abgelaufen → neu einloggen.
  - **403** – keine Berechtigung für diesen Endpunkt.
  - **Fehlermeldung im Text** (`{"status":"error","message":"..."}`), z.B. wenn ein Feldname in `fields` oder `orderby` nicht erlaubt ist. Achtung: Solche Fehler kommen teilweise mit HTTP-Status 200 – deshalb immer auf `"status": "error"` prüfen.

  ### Gut zu wissen
  - **Nicht gefunden = leere Liste:** Gibt es den Eintrag nicht, kommt kein Fehler, sondern `"data": []`.
  - **`nr` muss mitgeschickt werden**, sonst kommt eine Fehlermeldung.
  - **Nicht abrufbar** sind hier: `abgerechnet_am`, `cbearbeiter`, `geprueft_am`, `provsatz`.

  <details><summary>Für Entwickler</summary>

  - Controller: `TDataModulFibu.getBruttolohnById` in `Shared/DataModuls/DataModulFibuClass.pas`
  - Tabelle: `BRUTTOLOHN`, Schlüssel `nr`
  - Umsetzung: generische Methode `DoSelectOne` der Basisklasse `TDataModulTableBase`
  - Der Server wertet die HTTP-Methode nicht aus – GET und POST funktionieren gleich.

  </details>
