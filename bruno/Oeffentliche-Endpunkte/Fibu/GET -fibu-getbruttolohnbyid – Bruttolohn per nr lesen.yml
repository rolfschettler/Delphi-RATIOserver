info:
  name: GET /fibu/getbruttolohnbyid – Bruttolohn per nr lesen
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseURL}}/fibu/getbruttolohnbyid"
  body:
    type: json
    data: |-
      {
        "nr": 42,
        "fields": "*"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Liefert genau einen Datensatz der Tabelle BRUTTOLOHN ueber `DoSelectOne('BRUTTOLOHN', ALLOWED, 'nr')`.

  **Erlaubte Felder (ALLOWED):** siehe getbruttolohn.

  **Body:** `{ "nr": <wert>, "fields": [...] | "*" }` — Primaerschluessel `nr` ist Pflicht.

  **Auth:** erforderlich (Bearer Token)

  **Antwort:** `{"header":{...},"data":[{...}]}` (SerializeQuery; `data` enthaelt den gefundenen Datensatz bzw. ist leer, wenn der Schluessel nicht existiert).
