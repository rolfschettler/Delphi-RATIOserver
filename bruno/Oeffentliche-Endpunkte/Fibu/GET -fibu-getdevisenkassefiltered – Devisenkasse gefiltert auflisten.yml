info:
  name: GET /fibu/getdevisenkassefiltered – Devisenkasse gefiltert auflisten
  type: http
  seq: 12

http:
  method: GET
  url: "{{baseURL}}/fibu/getdevisenkassefiltered"
  body:
    type: json
    data: |-
      {
        "fields": "*",
        "waehrung": "USD",
        "expedient": "MZ01",
        "orderby": "bdatum"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Listet Datensaetze der Tabelle DEVISENKASSE gefiltert ueber `DoSelectFilteredDynamic('DEVISENKASSE', ALLOWED, CONDITIONS, FILTER_PARAMS)`.

  **Erlaubte Felder (ALLOWED) und gleichzeitig moegliche Filter-Parameter:** nr, belegnr, bdatum, expedient, waehrung, betrag, referenznr, bereich, kostelle1, kostelle2, gesperrt, konto, gegenkonto, belegart, art, leistung, zusatzfeld1, bemerkung, wechselkurs, anmietnr, anmiet_uebertragung, fibu_uebertragung. Jeder gesetzte Filter-Parameter erzeugt automatisch eine per AND verknuepfte Gleichheits-Bedingung; alle Filter sind optional.

  **Body:** `{ "fields": [...] | "*", "orderby": "feld", <beliebige Filter-Parameter> }`

  **Auth:** erforderlich (Bearer Token)

  **Antwort:** wie getdevisenkasse.
