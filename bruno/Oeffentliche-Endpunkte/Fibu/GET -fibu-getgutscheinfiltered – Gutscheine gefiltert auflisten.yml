info:
  name: GET /fibu/getgutscheinfiltered – Gutscheine gefiltert auflisten
  type: http
  seq: 20

http:
  method: GET
  url: "{{baseURL}}/fibu/getgutscheinfiltered"
  body:
    type: json
    data: |-
      {
        "fields": "*",
        "vorgang": "GS501",
        "erledigt": "N",
        "orderby": "erfasst"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Listet Datensaetze der Tabelle GUTSCHEIN gefiltert ueber `DoSelectFilteredDynamic('GUTSCHEIN', ALLOWED, CONDITIONS, FILTER_PARAMS)`.

  **Erlaubte Felder (ALLOWED) und gleichzeitig moegliche Filter-Parameter:** nr, vorgang, bearbeiter, geaendert_am, geaendert_von, erfasst, faellig, kennziffer, gutscheinkonto, kurzbemerkung, bemerkung, betrag, gueltig_bis, erledigt, storniert, storniert_am, stornogrund, fuerkunde, zusatzfeld1, zusatzfeld2, zusatzfeld3, fibukto, kulanz, kostelle1, kostelle2, code, motivnr, fibu_archiv_am, nrkreis, entstehung, zahlungsart. Jeder gesetzte Filter-Parameter erzeugt automatisch eine per AND verknuepfte Gleichheits-Bedingung; alle Filter sind optional.

  **Body:** `{ "fields": [...] | "*", "orderby": "feld", <beliebige Filter-Parameter> }`

  **Auth:** erforderlich (Bearer Token)

  **Antwort:** wie getgutschein.
