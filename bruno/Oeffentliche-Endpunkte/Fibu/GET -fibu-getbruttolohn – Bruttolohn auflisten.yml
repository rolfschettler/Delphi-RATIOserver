info:
  name: GET /fibu/getbruttolohn – Bruttolohn auflisten
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseURL}}/fibu/getbruttolohn"
  body:
    type: json
    data: |-
      {
        "fields": "*",
        "orderby": "datum"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Listet Datensaetze der Tabelle BRUTTOLOHN ueber `DoSelect('BRUTTOLOHN', ALLOWED)`.

  **Erlaubte Felder (ALLOWED):** nr, monteurzeichen, lohnart, datum, einheit, satz, gesamtbetrag, auftragnr, kostenstelle, positionsnr, extauftragnr, extpos, positiosnr, zuschlag, herkunft, faktor, bezeichnung, fahrzeug, kostenstelle1, kostenstelle2, vonzeit, biszeit, kmanfang, kmende, kmgesamt, zusatzfeld1, zusatzfeld2, kommentar (Hinweis: `positionsnr` und `positiosnr` sind zwei unterschiedliche Felder im ALLOWED-Array, so im Originalcode vorhanden).

  **Body (optional):** `{ "fields": [...] | "*", "orderby": "feld", "limit": 10, "offset": 0 }`

  **Auth:** erforderlich (Bearer Token)

  **Antwort:** ohne `limit` `{"header":{"<feld>":"<typ>",...},"data":[{...},...]}` (SerializeQuery: `header` = Feldname -> Typ, `data` = Datensaetze); mit `limit` `{"total":N,"limit":N,"offset":N,"data":{"header":{...},"data":[...]}}`.
