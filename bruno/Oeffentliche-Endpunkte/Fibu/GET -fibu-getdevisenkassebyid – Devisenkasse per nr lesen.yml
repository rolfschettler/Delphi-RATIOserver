info:
  name: GET /fibu/getdevisenkassebyid – Devisenkasse per nr lesen
  type: http
  seq: 11

http:
  method: GET
  url: "{{baseURL}}/fibu/getdevisenkassebyid"
  body:
    type: json
    data: |-
      {
        "nr": 42,
        "fields": "*"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  **Devisenkasse per nr lesen.** Liefert genau einen Eintrag aus `DEVISENKASSE`, gesucht über `nr`.

  | | |
  |---|---|
  | **Aufruf** | `GET {{baseURL}}/fibu/getdevisenkassebyid` |
  | **Anmeldung** | nötig – Token aus `/login` (wird in Bruno automatisch mitgeschickt) |
  | **Berechtigung** | Der Benutzer braucht diesen Endpunkt in seinen Rollen (sonst Fehler 403) |

  ### Was du mitschickst
  | Parameter | Wert | Pflicht | Bedeutung |
  |---|---|---|---|
  | `nr` | Ganzzahl | **ja** | Der gesuchte Eintrag. |
  | `fields` | `"*"` oder Liste | nein | Welche Felder zurückkommen sollen. Weglassen = alle. |

  ### Verfügbare Felder
  | Feld | Typ |
  |---|---|
  | `nr` | Ganzzahl |
  | `belegnr` | Ganzzahl |
  | `bdatum` | Datum/Uhrzeit |
  | `expedient` | Text (max. 30 Zeichen) |
  | `waehrung` | Text (max. 3 Zeichen) |
  | `betrag` | Kommazahl |
  | `referenznr` | Ganzzahl |
  | `bereich` | Text (max. 1 Zeichen) |
  | `kostelle1` | Text (max. 12 Zeichen) |
  | `kostelle2` | Text (max. 12 Zeichen) |
  | `gesperrt` | Text (max. 4 Zeichen) |
  | `konto` | Text (max. 12 Zeichen) |
  | `gegenkonto` | Text (max. 12 Zeichen) |
  | `belegart` | Text (max. 1 Zeichen) |
  | `art` | Text (max. 8 Zeichen) |
  | `leistung` | Text (max. 120 Zeichen) |
  | `zusatzfeld1` | Text (max. 30 Zeichen) |
  | `bemerkung` | Langtext/Datei |
  | `wechselkurs` | Kommazahl |
  | `anmietnr` | Ganzzahl |
  | `anmiet_uebertragung` | Text (max. 4 Zeichen) |
  | `fibu_uebertragung` | Text (max. 4 Zeichen) |

  ### Was zurückkommt
  ```json
  {"header": {...}, "data": [ {"nr": 42, "belegnr": 42, "bdatum": "2026-09-01 08:00:00", ...} ]}
  ```

  ### Was schiefgehen kann
  - **401** – nicht angemeldet oder Token abgelaufen → neu einloggen.
  - **403** – keine Berechtigung für diesen Endpunkt.
  - **Fehlermeldung im Text** (`{"status":"error","message":"..."}`), z.B. wenn ein Feldname in `fields` oder `orderby` nicht erlaubt ist. Achtung: Solche Fehler kommen teilweise mit HTTP-Status 200 – deshalb immer auf `"status": "error"` prüfen.

  ### Gut zu wissen
  - **Nicht gefunden = leere Liste:** Gibt es den Eintrag nicht, kommt kein Fehler, sondern `"data": []`.
  - **`nr` muss mitgeschickt werden**, sonst kommt eine Fehlermeldung.

  <details><summary>Für Entwickler</summary>

  - Controller: `TDataModulFibu.getDevisenkasseById` in `Shared/DataModuls/DataModulFibuClass.pas`
  - Tabelle: `DEVISENKASSE`, Schlüssel `nr`
  - Umsetzung: generische Methode `DoSelectOne` der Basisklasse `TDataModulTableBase`
  - Der Server wertet die HTTP-Methode nicht aus – GET und POST funktionieren gleich.

  </details>
