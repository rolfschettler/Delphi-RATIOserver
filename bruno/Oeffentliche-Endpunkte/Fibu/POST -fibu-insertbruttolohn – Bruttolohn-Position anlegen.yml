info:
  name: POST /fibu/insertbruttolohn – Bruttolohn-Position anlegen
  type: http
  seq: 28

http:
  method: POST
  url: "{{baseURL}}/fibu/insertbruttolohn"
  body:
    type: json
    data: |-
      {
        "monteurzeichen": "MZ01",
        "lohnart": 1,
        "datum": "2026-07-17",
        "einheit": "STD",
        "satz": 15.5,
        "gesamtbetrag": 620.00,
        "auftragnr": "A-2026-001",
        "kostenstelle": "K100",
        "bezeichnung": "Montagearbeiten"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  **Bruttolohn-Position anlegen.** Legt einen neuen Eintrag in `BRUTTOLOHN` an.

  | | |
  |---|---|
  | **Aufruf** | `POST {{baseURL}}/fibu/insertbruttolohn` |
  | **Anmeldung** | nötig – Token aus `/login` (wird in Bruno automatisch mitgeschickt) |
  | **Berechtigung** | Der Benutzer braucht diesen Endpunkt in seinen Rollen (sonst Fehler 403) |

  ### Was du mitschickst
  Die gewünschten Felder als `"feld": wert`. Nicht mitgeschickte Felder bleiben leer, `null` macht ein Feld ausdrücklich leer.

  | Feld | Typ | Pflicht laut Datenbank |
  |---|---|---|
  | `monteurzeichen` | Text (max. 15 Zeichen) | ja |
  | `lohnart` | Ganzzahl | ja |
  | `datum` | Datum/Uhrzeit | ja |
  | `einheit` | Kommazahl |  |
  | `satz` | Kommazahl |  |
  | `gesamtbetrag` | Kommazahl |  |
  | `auftragnr` | Ganzzahl |  |
  | `kostenstelle` | Ganzzahl |  |
  | `positionsnr` | Ganzzahl |  |
  | `extauftragnr` | Text (max. 20 Zeichen) |  |
  | `extpos` | Ganzzahl |  |
  | `positiosnr` | Ganzzahl |  |
  | `zuschlag` | Kommazahl |  |
  | `herkunft` | Text (max. 20 Zeichen) |  |
  | `faktor` | Ganzzahl |  |
  | `bezeichnung` | Text (max. 120 Zeichen) |  |
  | `fahrzeug` | Text (max. 30 Zeichen) |  |
  | `kostenstelle1` | Text (max. 12 Zeichen) |  |
  | `kostenstelle2` | Text (max. 12 Zeichen) |  |
  | `vonzeit` | Text (max. 5 Zeichen) |  |
  | `biszeit` | Text (max. 5 Zeichen) |  |
  | `kmanfang` | Ganzzahl |  |
  | `kmende` | Ganzzahl |  |
  | `kmgesamt` | Ganzzahl |  |
  | `zusatzfeld1` | Text (max. 30 Zeichen) |  |
  | `zusatzfeld2` | Text (max. 30 Zeichen) |  |
  | `kommentar` | Text (max. 1200 Zeichen) |  |

  ### Was zurückkommt
  ```json
  {"status": "OK"}
  ```

  ### Was schiefgehen kann
  - **401** – nicht angemeldet oder Token abgelaufen → neu einloggen.
  - **403** – keine Berechtigung für diesen Endpunkt.
  - **400** mit Fehlermeldung – die Datenbank lehnt die Daten ab, z.B. Text zu lang für das Feld oder Buchstaben in einem Zahlenfeld.
  - **Fehlermeldung mit Status 200** (`{"status":"error","message":"..."}`), z.B. wenn kein einziges gültiges Feld mitgeschickt wurde – deshalb immer auf `"status": "error"` prüfen.

  ### Gut zu wissen
  - **Die Nummer (`nr`) vergibt die Datenbank automatisch** – mitschicken geht nicht, sie würde ignoriert. Die Antwort enthält die neue Nummer nicht; wer sie braucht, sucht den Eintrag danach (z.B. über den `…filtered`-Endpunkt).
  - **Pflichtfelder:** `monteurzeichen`, `lohnart`, `datum` – ohne sie lehnt die Datenbank den Eintrag ab.
  - **Unbekannte Felder werden ohne Meldung ignoriert.** Ein Tippfehler im Feldnamen fällt also nicht auf – das Feld bleibt einfach leer.
  - **Nicht setzbar** sind hier: `abgerechnet_am`, `cbearbeiter`, `geprueft_am`, `provsatz`.

  <details><summary>Für Entwickler</summary>

  - Controller: `TDataModulFibu.insertBruttolohn` in `Shared/DataModuls/DataModulFibuClass.pas`
  - Tabelle: `BRUTTOLOHN`, Schlüssel `nr`
  - Umsetzung: generische Methode `DoInsert` der Basisklasse `TDataModulTableBase`
  - Der Server wertet die HTTP-Methode nicht aus – GET und POST funktionieren gleich.

  </details>
