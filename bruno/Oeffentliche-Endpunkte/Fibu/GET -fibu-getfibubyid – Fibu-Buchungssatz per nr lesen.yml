info:
  name: GET /fibu/getfibubyid – Fibu-Buchungssatz per nr lesen
  type: http
  seq: 15

http:
  method: GET
  url: "{{baseURL}}/fibu/getfibubyid"
  body:
    type: json
    data: |-
      {
        "nr": 42,
        "fields": "*"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  **Fibu-Buchungssatz per nr lesen.** Liefert genau einen Eintrag aus `FIBU`, gesucht über `nr`.

  | | |
  |---|---|
  | **Aufruf** | `GET {{baseURL}}/fibu/getfibubyid` |
  | **Anmeldung** | nötig – Token aus `/login` (wird in Bruno automatisch mitgeschickt) |
  | **Berechtigung** | Der Benutzer braucht diesen Endpunkt in seinen Rollen (sonst Fehler 403) |

  ### Was du mitschickst
  | Parameter | Wert | Pflicht | Bedeutung |
  |---|---|---|---|
  | `nr` | Ganzzahl | **ja** | Der gesuchte Eintrag. |
  | `fields` | `"*"` oder Liste | nein | Welche Felder zurückkommen sollen. Weglassen = alle. |

  ### Verfügbare Felder
  | Feld | Typ |
  |---|---|
  | `nr` | Ganzzahl |
  | `betrag` | Kommazahl |
  | `soll` | Text (max. 12 Zeichen) |
  | `haben` | Text (max. 12 Zeichen) |
  | `belegfeld1` | Text (max. 20 Zeichen) |
  | `belegfeld2` | Datum/Uhrzeit |
  | `belegdatum` | Datum/Uhrzeit |
  | `kostelle1` | Text (max. 12 Zeichen) |
  | `kostelle2` | Text (max. 12 Zeichen) |
  | `skonto` | Kommazahl |
  | `text` | Text (max. 40 Zeichen) |
  | `gebucht` | Text (max. 4 Zeichen) |
  | `art` | Text (max. 2 Zeichen) |
  | `rechnungnr` | Ganzzahl |
  | `stschl` | Text (max. 2 Zeichen) |
  | `ustbetrag` | Kommazahl |
  | `steuerkonto` | Text (max. 12 Zeichen) |
  | `stkontotyp` | Text (max. 1 Zeichen) |
  | `stsatz` | Kommazahl |
  | `stapel` | Ganzzahl |
  | `opos` | Text (max. 2 Zeichen) |
  | `journalnr` | Ganzzahl |
  | `erfasstdurch` | Text (max. 20 Zeichen) |
  | `vorlaufnr` | Ganzzahl |
  | `archiv` | Text (max. 4 Zeichen) |
  | `text2` | Text (max. 40 Zeichen) |
  | `freigabe` | Ganzzahl |
  | `uebertragung` | Ganzzahl |
  | `fwbetrag` | Kommazahl |
  | `waehrung` | Text (max. 3 Zeichen) |
  | `kurs` | Kommazahl |
  | `zugeordnetzu` | Text (max. 30 Zeichen) |
  | `erfasst_am` | Datum/Uhrzeit |
  | `laufnummer` | Ganzzahl |
  | `belegart` | Text (max. 3 Zeichen) |
  | `journalisierungsnr` | Ganzzahl |
  | `stand` | Ganzzahl |
  | `fortlaufnr_provorgang` | Ganzzahl |
  | `pkguid` | Text (max. 40 Zeichen) |
  | `leistungsdatum` | Datum/Uhrzeit |
  | `iban` | Text (max. 34 Zeichen) |
  | `swift` | Text (max. 20 Zeichen) |
  | `kontoinhaber` | Text (max. 90 Zeichen) |
  | `mandant` | Text (max. 30 Zeichen) |

  ### Was zurückkommt
  ```json
  {"header": {...}, "data": [ {"nr": 42, "betrag": 12.5, "soll": "Text", ...} ]}
  ```

  ### Was schiefgehen kann
  - **401** – nicht angemeldet oder Token abgelaufen → neu einloggen.
  - **403** – keine Berechtigung für diesen Endpunkt.
  - **Fehlermeldung im Text** (`{"status":"error","message":"..."}`), z.B. wenn ein Feldname in `fields` oder `orderby` nicht erlaubt ist. Achtung: Solche Fehler kommen teilweise mit HTTP-Status 200 – deshalb immer auf `"status": "error"` prüfen.

  ### Gut zu wissen
  - **Nicht gefunden = leere Liste:** Gibt es den Eintrag nicht, kommt kein Fehler, sondern `"data": []`.
  - **`nr` muss mitgeschickt werden**, sonst kommt eine Fehlermeldung.

  <details><summary>Für Entwickler</summary>

  - Controller: `TDataModulFibu.getFibuById` in `Shared/DataModuls/DataModulFibuClass.pas`
  - Tabelle: `FIBU`, Schlüssel `nr`
  - Umsetzung: generische Methode `DoSelectOne` der Basisklasse `TDataModulTableBase`
  - Der Server wertet die HTTP-Methode nicht aus – GET und POST funktionieren gleich.

  </details>
