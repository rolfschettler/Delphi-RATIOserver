info:
  name: POST /fibu/updatebruttolohn – Bruttolohn-Position aendern
  type: http
  seq: 32

http:
  method: POST
  url: "{{baseURL}}/fibu/updatebruttolohn"
  body:
    type: json
    data: |-
      {
        "nr": 42,
        "satz": 15.5,
        "gesamtbetrag": 620.00,
        "kommentar": "korrigiert"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  **Bruttolohn-Position aendern.** Ändert einen vorhandenen Eintrag in `BRUTTOLOHN`. Gefunden wird er über `nr`.

  | | |
  |---|---|
  | **Aufruf** | `POST {{baseURL}}/fibu/updatebruttolohn` |
  | **Anmeldung** | nötig – Token aus `/login` (wird in Bruno automatisch mitgeschickt) |
  | **Berechtigung** | Der Benutzer braucht diesen Endpunkt in seinen Rollen (sonst Fehler 403) |

  ### Was du mitschickst
  | Parameter | Wert | Pflicht | Bedeutung |
  |---|---|---|---|
  | `nr` | Ganzzahl | **ja** | Welcher Eintrag geändert wird. |
  | weitere Felder | siehe Liste | mind. eins | Nur die mitgeschickten Felder werden geändert. `null` macht ein Feld leer. |

  ### Änderbare Felder
  | Feld | Typ |
  |---|---|
  | `monteurzeichen` | Text (max. 15 Zeichen) |
  | `lohnart` | Ganzzahl |
  | `datum` | Datum/Uhrzeit |
  | `einheit` | Kommazahl |
  | `satz` | Kommazahl |
  | `gesamtbetrag` | Kommazahl |
  | `auftragnr` | Ganzzahl |
  | `kostenstelle` | Ganzzahl |
  | `positionsnr` | Ganzzahl |
  | `extauftragnr` | Text (max. 20 Zeichen) |
  | `extpos` | Ganzzahl |
  | `positiosnr` | Ganzzahl |
  | `zuschlag` | Kommazahl |
  | `herkunft` | Text (max. 20 Zeichen) |
  | `faktor` | Ganzzahl |
  | `bezeichnung` | Text (max. 120 Zeichen) |
  | `fahrzeug` | Text (max. 30 Zeichen) |
  | `kostenstelle1` | Text (max. 12 Zeichen) |
  | `kostenstelle2` | Text (max. 12 Zeichen) |
  | `vonzeit` | Text (max. 5 Zeichen) |
  | `biszeit` | Text (max. 5 Zeichen) |
  | `kmanfang` | Ganzzahl |
  | `kmende` | Ganzzahl |
  | `kmgesamt` | Ganzzahl |
  | `zusatzfeld1` | Text (max. 30 Zeichen) |
  | `zusatzfeld2` | Text (max. 30 Zeichen) |
  | `kommentar` | Text (max. 1200 Zeichen) |

  ### Was zurückkommt
  ```json
  {"status": "OK"}
  ```

  ### Was schiefgehen kann
  - **401** – nicht angemeldet oder Token abgelaufen → neu einloggen.
  - **403** – keine Berechtigung für diesen Endpunkt.
  - **400** mit Fehlermeldung – die Datenbank lehnt die Daten ab, z.B. Text zu lang für das Feld oder Buchstaben in einem Zahlenfeld.
  - **Fehlermeldung mit Status 200** (`{"status":"error","message":"..."}`), z.B. wenn kein einziges gültiges Feld mitgeschickt wurde – deshalb immer auf `"status": "error"` prüfen.

  ### Gut zu wissen
  - **Nur mitgeschickte Felder werden geändert**, alle anderen bleiben, wie sie sind.
  - **Keine Meldung, wenn es den Eintrag nicht gibt:** Auch bei einem falschen oder fehlenden `nr` kommt `{"status": "OK"}` – geändert wurde dann aber nichts.
  - `nr` selbst lässt sich hier nicht ändern.
  - **Unbekannte Felder werden ohne Meldung ignoriert** – ein Tippfehler im Feldnamen fällt also nicht auf.
  - **Nicht änderbar** sind hier: `abgerechnet_am`, `cbearbeiter`, `geprueft_am`, `provsatz`.

  <details><summary>Für Entwickler</summary>

  - Controller: `TDataModulFibu.updateBruttolohn` in `Shared/DataModuls/DataModulFibuClass.pas`
  - Tabelle: `BRUTTOLOHN`, Schlüssel `nr`
  - Umsetzung: generische Methode `DoUpdate` der Basisklasse `TDataModulTableBase`
  - Der Server wertet die HTTP-Methode nicht aus – GET und POST funktionieren gleich.

  </details>
