info:
  name: GET /fibu/getlohnart – Lohnarten auflisten (Read-Only-Stammdaten)
  type: http
  seq: 25

http:
  method: GET
  url: "{{baseURL}}/fibu/getlohnart"
  body:
    type: json
    data: |-
      {
        "fields": "*",
        "orderby": "reihenfolge"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Listet Datensaetze der Tabelle LOHNART ueber `DoSelect('LOHNART', ALLOWED)`. LOHNART ist reine Stammdaten-Tabelle: es existieren nur die drei Read-Endpunkte get/getFiltered/getById — kein Key/Insert/Update/Delete.

  **Erlaubte Felder (ALLOWED):** lohnart, bezeichnung, stdlohn, vorgabe, zuschlag, fest, kalkuliertauf, faktor, reihenfolge, saldouebernahme.

  **Body (optional):** `{ "fields": [...] | "*", "orderby": "feld", "limit": 10, "offset": 0 }`

  **Auth:** erforderlich (Bearer Token)

  **Antwort:** ohne `limit` `{"header":{"<feld>":"<typ>",...},"data":[{...},...]}` (SerializeQuery: `header` = Feldname -> Typ, `data` = Datensaetze); mit `limit` `{"total":N,"limit":N,"offset":N,"data":{"header":{...},"data":[...]}}`.
