info:
  name: GET /fibu/getkontenbyid – Konto per konto lesen (Read-Only)
  type: http
  seq: 23

http:
  method: GET
  url: "{{baseURL}}/fibu/getkontenbyid"
  body:
    type: json
    data: |-
      {
        "konto": "1000",
        "fields": "*"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  **Konto per konto lesen (Read-Only).** Liefert genau einen Eintrag aus `KONTEN`, gesucht über `konto`.

  | | |
  |---|---|
  | **Aufruf** | `GET {{baseURL}}/fibu/getkontenbyid` |
  | **Anmeldung** | nötig – Token aus `/login` (wird in Bruno automatisch mitgeschickt) |
  | **Berechtigung** | Der Benutzer braucht diesen Endpunkt in seinen Rollen (sonst Fehler 403) |

  ### Was du mitschickst
  | Parameter | Wert | Pflicht | Bedeutung |
  |---|---|---|---|
  | `konto` | Text (max. 12 Zeichen) | **ja** | Der gesuchte Eintrag. |
  | `fields` | `"*"` oder Liste | nein | Welche Felder zurückkommen sollen. Weglassen = alle. |

  ### Verfügbare Felder
  | Feld | Typ |
  |---|---|
  | `konto` | Text (max. 12 Zeichen) |
  | `bezeichnung` | Text (max. 30 Zeichen) |
  | `stschluessel` | Ganzzahl |
  | `steuer` | Kommazahl |
  | `kontenart` | Ganzzahl |
  | `kontengruppe` | Ganzzahl |
  | `automatik` | Text (max. 4 Zeichen) |
  | `steuerkonto` | Text (max. 12 Zeichen) |
  | `ustpos` | Ganzzahl |
  | `klasse` | Ganzzahl |
  | `zahlung` | Ganzzahl |
  | `gutscheinkonto` | Text (max. 4 Zeichen) |
  | `aktiva` | Text (max. 15 Zeichen) |
  | `passiva` | Text (max. 15 Zeichen) |
  | `eu` | Text (max. 20 Zeichen) |
  | `waehrung` | Text (max. 3 Zeichen) |
  | `op` | Text (max. 4 Zeichen) |
  | `babzuordnung` | Text (max. 30 Zeichen) |
  | `ebvortragskonto` | Text (max. 4 Zeichen) |
  | `gesperrt` | Text (max. 4 Zeichen) |
  | `mandant` | Text (max. 30 Zeichen) |

  ### Was zurückkommt
  ```json
  {"header": {...}, "data": [ {"konto": "Text", "bezeichnung": "Text", "stschluessel": 42, ...} ]}
  ```

  ### Was schiefgehen kann
  - **401** – nicht angemeldet oder Token abgelaufen → neu einloggen.
  - **403** – keine Berechtigung für diesen Endpunkt.
  - **Fehlermeldung im Text** (`{"status":"error","message":"..."}`), z.B. wenn ein Feldname in `fields` oder `orderby` nicht erlaubt ist. Achtung: Solche Fehler kommen teilweise mit HTTP-Status 200 – deshalb immer auf `"status": "error"` prüfen.

  ### Gut zu wissen
  - **Nicht gefunden = leere Liste:** Gibt es den Eintrag nicht, kommt kein Fehler, sondern `"data": []`.
  - **`konto` muss mitgeschickt werden**, sonst kommt eine Fehlermeldung.

  <details><summary>Für Entwickler</summary>

  - Controller: `TDataModulFibu.getKontenById` in `Shared/DataModuls/DataModulFibuClass.pas`
  - Tabelle: `KONTEN`, Schlüssel `konto`
  - Umsetzung: generische Methode `DoSelectOne` der Basisklasse `TDataModulTableBase`
  - Der Server wertet die HTTP-Methode nicht aus – GET und POST funktionieren gleich.

  </details>
