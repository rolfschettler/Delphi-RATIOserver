info:
  name: GET /fibu/getlohnartfiltered – Lohnarten gefiltert auflisten (Read-Only)
  type: http
  seq: 27

http:
  method: GET
  url: "{{baseURL}}/fibu/getlohnartfiltered"
  body:
    type: json
    data: |-
      {
        "fields": "*",
        "lohnart": 10,
        "fest": "J",
        "orderby": "reihenfolge"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Listet Datensaetze der Tabelle LOHNART gefiltert ueber `DoSelectFilteredDynamic('LOHNART', ALLOWED, CONDITIONS, FILTER_PARAMS)`. Reine Read-Only-Stammdaten-Tabelle ohne Insert/Update/Delete.

  **Erlaubte Felder (ALLOWED) und gleichzeitig moegliche Filter-Parameter:** lohnart, bezeichnung, stdlohn, vorgabe, zuschlag, fest, kalkuliertauf, faktor, reihenfolge, saldouebernahme. Jeder gesetzte Filter-Parameter erzeugt automatisch eine per AND verknuepfte Gleichheits-Bedingung; alle Filter sind optional.

  **Body:** `{ "fields": [...] | "*", "orderby": "feld", <beliebige Filter-Parameter> }`

  **Auth:** erforderlich (Bearer Token)

  **Antwort:** wie getlohnart.
