info:
  name: GET /fibu/getdevisenkasse – Devisenkasse auflisten
  type: http
  seq: 10

http:
  method: GET
  url: "{{baseURL}}/fibu/getdevisenkasse"
  body:
    type: json
    data: |-
      {
        "fields": "*",
        "orderby": "bdatum"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Listet Datensaetze der Tabelle DEVISENKASSE ueber `DoSelect('DEVISENKASSE', ALLOWED)`.

  **Erlaubte Felder (ALLOWED):** nr, belegnr, bdatum, expedient, waehrung, betrag, referenznr, bereich, kostelle1, kostelle2, gesperrt, konto, gegenkonto, belegart, art, leistung, zusatzfeld1, bemerkung, wechselkurs, anmietnr, anmiet_uebertragung, fibu_uebertragung.

  **Body (optional):** `{ "fields": [...] | "*", "orderby": "feld", "limit": 10, "offset": 0 }`

  **Auth:** erforderlich (Bearer Token)

  **Antwort:** ohne `limit` `{"header":{"<feld>":"<typ>",...},"data":[{...},...]}` (SerializeQuery: `header` = Feldname -> Typ, `data` = Datensaetze); mit `limit` `{"total":N,"limit":N,"offset":N,"data":{"header":{...},"data":[...]}}`.
