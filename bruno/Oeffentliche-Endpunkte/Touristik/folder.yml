docs:
  content: |-
    Dieser Bereich enthält zurzeit nur den Testendpunkt `demo`, der die mitgeschickten Werte zurückgibt. Er dient zum Prüfen von Anmeldung und Berechtigung und als Vorlage für künftige Endpunkte. Die eigentlichen Touristik-Daten (Vorgänge, Reisen, Leistungen …) findest du im Ordner **Toupac**.

    Der Endpunkt braucht eine Anmeldung (Token aus `/login`) und die passende Berechtigung in den Rollen des Benutzers (sonst Fehler 401 bzw. 403). Eine Berechtigung für alle Endpunkte des Bereichs ist z.B. per `/touristik/*` möglich.

    Technik: Controller `TDataModulTouristik` (`Shared/DataModuls/DataModulTouristikClass.pas`).
  type: text/markdown
