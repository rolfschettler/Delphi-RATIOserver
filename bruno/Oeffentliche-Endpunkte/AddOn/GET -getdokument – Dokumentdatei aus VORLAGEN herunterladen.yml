info:
  name: GET /getdokument – Dokumentdatei aus VORLAGEN herunterladen
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseURL}}/getdokument?nr=10"
  params:
    - name: nr
      value: "10"
      type: query
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Liefert den Dateiinhalt (BLOB `haupttext`) eines VORLAGEN-Datensatzes als Binärdatei aus, z.B. eine per `/dokumente/uploaddokument` hochgeladene Datei. Kein Body.

  **Query-Parameter:** `nr` (Pflicht, Integer; fehlt/0 → Exception "Parameter 'nr' fehlt").

  **Auth:** erforderlich (Bearer Token).

  **LocalOnly:** false.

  **Antwort:** Binärdaten mit `Content-Disposition: inline; filename="<name>"`. Content-Type nach `art` (Dateiendung): `.pdf` → application/pdf, `.docx`/`.doc` → Word, `.xlsx`/`.xls` → Excel, `.png` → image/png, `.jpg`/`.jpeg` → image/jpeg, sonst application/octet-stream. Fehler, wenn kein Datensatz gefunden oder der BLOB leer ist.

  **Hinweis:** Der Kommentar im Code nennt `/addon/getdokument` – registriert ist die Route jedoch ohne Präfix als `/getdokument`.
