docs:
  content: |-
    **Zusatzfunktionen**, die zu keinem Fachbereich gehören: eine gespeicherte Dokumentvorlage als Datei herunterladen (`/getdokument`), die eigenen Firmenstammdaten abrufen (`/getfirmenstamm`), die nächste Nummer aus einem beliebigen Nummernzähler holen (`/getgeneratorvalue`) und Teilnehmer für einen Vorgang importieren – entweder per KI aus einer beliebigen Datei (`/ki_getteilnehmer`) oder aus einer CSV-Reservierungsliste (`/teilnehmerfromcsv`).

    Alle Endpunkte brauchen eine Anmeldung (Token aus `/login`), und der Benutzer muss den jeweiligen Endpunkt in seinen Rollen haben (sonst Fehler 403). Die Adressen haben kein Präfix, sie liegen direkt unter `{{baseURL}}`.

    Technik: Controller `TDataModulAddOn` (`Shared/DataModuls/DataModulAddOnClass.pas`); weitere AddOn-Routen sind nur vom Server selbst erreichbar und deshalb nicht in dieser Collection.
  type: text/markdown
