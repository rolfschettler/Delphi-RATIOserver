docs:
  content: "AddOn-Controller (TDataModulAddOn, Basis TDataModulBaseClass, KEIN generisches CRUD): Demo-Datengeneratoren (Zufallsadressen/-personal), Teilnehmer-Import aus CSV bzw. per KI (OpenAI) aus beliebigen Dateien, Routen-/Distanzberechnung ueber das PHP-Backend (PHP_Call), Dokument-Download (Binaerdatei aus VORLAGEN.HAUPTTEXT), Generatorwerte und Firmenstammdaten. Routen liegen OHNE Praefix direkt unter {{baseURL}}. **Auth:** Bearer-Token ({{jwttoken}}) erforderlich, ausser /showroute und /travelroute (Auth=false). **LocalOnly:** /adddemo, /adddemopersonal, /readteilnehmer, /showroute, /calculatedistance, /travelroute und /calculateroute sind LocalOnly (nur vom Server selbst erreichbar, sonst 403); die uebrigen AddOn-Routen sind oeffentlich. Tabellen: ADRESSEN, PERSONALSTAMM, T_TEILNEHMER (Generator T_TEILNEHMER_NR_GEN), VORLAGEN, FIRMENSTAMM, RDB$GENERATORS."
  type: text/markdown
