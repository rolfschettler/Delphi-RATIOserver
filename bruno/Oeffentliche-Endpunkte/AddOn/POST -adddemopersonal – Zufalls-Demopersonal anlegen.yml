info:
  name: POST /adddemopersonal – Zufalls-Demopersonal anlegen
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseURL}}/adddemopersonal?count=5"
  params:
    - name: count
      value: "5"
      type: query
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Erzeugt Demo-Datensätze in der Tabelle PERSONALSTAMM mit zufälligen Werten (anrede, name1, name2, strasse, plz, ort). `nr` wird als `MAX(nr) + 1` fortlaufend vergeben (kein Generator), `zeichen` = erste 2 Buchstaben des Nachnamens (groß) + nr. Kein Body.

  **Query-Parameter:** `count` (optional, Integer, Default 1).

  **Auth:** erforderlich (Bearer Token).

  **LocalOnly:** true – nur vom Server selbst erreichbar (Bruno muss auf dem Server laufen), sonst 403.

  **Antwort:** `{"status":"OK","message":"es wurden N Adresse(n) zugefügt"}`

  **Besonderheiten (Code-Auffälligkeiten):** Schleife `0 to Count` → es werden `count + 1` Datensätze angelegt. Die Schlüsselvergabe per `MAX(nr)` ist nicht nebenläufigkeitssicher (parallele Aufrufe können kollidieren).
