info:
  name: GET /dokumente/gett_bildtextbyid – Bildtext per Nr abrufen
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseURL}}/dokumente/gett_bildtextbyid"
  body:
    type: json
    data: |-
      {
        "nr": 55,
        "fields": "*"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Liefert genau einen T_BILDTEXT-Datensatz anhand des Primärschlüssels `nr` (generisches `DoSelectOne('T_BILDTEXT', ALLOWED, 'nr')`).

  **Erlaubte Felder (ALLOWED):** identisch zu `gett_bildtext` (siehe dort), inkl. `nr`.

  **Auth:** erforderlich (Bearer Token).

  **Antwort:** `{"header":{"feld":"typ",...},"data":[{...}]}` – `data` enthält genau einen Datensatz bzw. ist leer, wenn zum Schlüssel kein Datensatz existiert.
