info:
  name: GET /dokumente/getvorlagenfiltered – Dokumentvorlagen gefiltert auflisten
  type: http
  seq: 9

http:
  method: GET
  url: "{{baseURL}}/dokumente/getvorlagenfiltered"
  body:
    type: json
    data: |-
      {
        "fields": "*",
        "art": "Angebot",
        "bereich": "Anmiet",
        "orderby": "name"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Listet VORLAGEN-Datensätze gefiltert auf (`DoSelectFilteredDynamic('VORLAGEN', ALLOWED, CONDITIONS, FILTER_PARAMS)`).

  **Erlaubte Felder (ALLOWED):** identisch zu `getvorlagen` (siehe dort).

  **Filter-Parameter (alle optional, im Body; jeder gesetzte Parameter erzeugt eine AND-verknüpfte `feld = :feld`-Bedingung):** art, name, bereich, doktyp, dokkategorie, archiv, versteckt, reftable, refnr, mandant, text2.

  **Auth:** erforderlich (Bearer Token).

  **Antwort:** ohne `limit` das Ergebnis von `SerializeQuery`: `{"header":{"feld":"typ",...},"data":[{...},...]}`; mit `limit` > 0 `{"total":N,"limit":N,"offset":N,"data":{"header":{...},"data":[...]}}`.
