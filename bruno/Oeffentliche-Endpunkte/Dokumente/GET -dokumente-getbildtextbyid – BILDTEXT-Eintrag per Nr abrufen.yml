info:
  name: GET /dokumente/getbildtextbyid – BILDTEXT-Eintrag per Nr abrufen
  type: http
  seq: 16

http:
  method: GET
  url: "{{baseURL}}/dokumente/getbildtextbyid"
  body:
    type: json
    data: |-
      {
        "nr": 55,
        "fields": "*"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Liefert genau einen Datensatz der Tabelle BILDTEXT (NICHT T_BILDTEXT – eigene Tabelle mit anderer Struktur) anhand des Primärschlüssels `nr` (generisches `DoSelectOne('BILDTEXT', ALLOWED, 'nr')`).

  **Body:** `nr` (Pflicht; fehlt → Fehler "\"nr\" fehlt im Request-Body."), `fields` (optional, Array oder `"*"`).

  **Erlaubte Felder (ALLOWED):** nr, bild, text, art, code, imgtype, ueberschrift, bildindex, copr, sprache, internet, app, externe_id, nutzungsrecht_bis, urheber, lastlock, erfasst_am, versteckt, bildformat, textformat.

  **Hinweis:** `bild` und `text` sind BLOB-Felder und werden von `SerializeQuery` standardmäßig als Base64-String zurückgegeben.

  **Auth:** erforderlich (Bearer Token).

  **LocalOnly:** false.

  **Antwort:** `{"header":{"feld":"typ",...},"data":[{...}]}` – `data` enthält genau einen Datensatz bzw. ist leer, wenn zum Schlüssel kein Datensatz existiert.
