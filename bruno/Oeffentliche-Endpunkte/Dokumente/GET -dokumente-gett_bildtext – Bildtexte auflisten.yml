info:
  name: GET /dokumente/gett_bildtext – Bildtexte auflisten
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseURL}}/dokumente/gett_bildtext"
  body:
    type: json
    data: |-
      {
        "fields": "*",
        "orderby": "nr"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Listet Datensätze der Tabelle T_BILDTEXT auf (generisches `DoSelect('T_BILDTEXT', ALLOWED)`).

  **Erlaubte Felder (ALLOWED):** nr, reftable, refnr, bildindex, bildmodifed, textmodified, kategorie, bild, text, lastlock, copr, sprache, internet, app, externe_id, nutzungsrecht_bis, urheber, erfasst_am, versteckt, bildformat, textformat, bereich.

  **Hinweis:** `bild` und `text` sind BLOB-Felder und werden von `SerializeQuery` standardmäßig als Base64-String zurückgegeben.

  **Auth:** erforderlich (Bearer Token).

  **Antwort:** ohne `limit` das Ergebnis von `SerializeQuery`: `{"header":{"feld":"typ",...},"data":[{...},...]}`; mit `limit` > 0 `{"total":N,"limit":N,"offset":N,"data":{"header":{...},"data":[...]}}`.
