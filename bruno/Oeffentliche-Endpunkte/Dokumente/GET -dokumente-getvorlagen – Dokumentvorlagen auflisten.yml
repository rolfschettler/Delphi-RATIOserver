info:
  name: GET /dokumente/getvorlagen – Dokumentvorlagen auflisten
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseURL}}/dokumente/getvorlagen"
  body:
    type: json
    data: |-
      {
        "fields": "*",
        "orderby": "name"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Listet Datensätze der Tabelle VORLAGEN auf (generisches `DoSelect('VORLAGEN', ALLOWED)`).

  **Erlaubte Felder (ALLOWED):** nr, haupttext, art, standard, name, text1, text2, drucker, druckerwahl, folgeformular, datum, angepasst, bereich, doktyp, versteckt, dokkategorie, geaendertam, bearbeiter, pwd, archiv, dms_key, wiedervorlage, gueltigbis, reftable, refnr, datumfeld1, datumfeld2, zusatzfeld1, zusatzfeld2, anmietnr, senderemail, empfaengeremail, dateiname, mandant.

  **Hinweis:** `haupttext` ist ein BLOB-Feld (enthält bei per `uploaddokument` erzeugten Vorlagen den Dateiinhalt) und wird von `SerializeQuery` standardmäßig als Base64-String zurückgegeben.

  **Auth:** erforderlich (Bearer Token).

  **Antwort:** ohne `limit` das Ergebnis von `SerializeQuery`: `{"header":{"feld":"typ",...},"data":[{...},...]}`; mit `limit` > 0 `{"total":N,"limit":N,"offset":N,"data":{"header":{...},"data":[...]}}`.
