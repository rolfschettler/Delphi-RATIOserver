info:
  name: POST /dokumente/updatevorlagen – Dokumentvorlage ändern
  type: http
  seq: 14

http:
  method: POST
  url: "{{baseURL}}/dokumente/updatevorlagen"
  body:
    type: json
    data: |-
      {
        "nr": 42,
        "name": "Reisebestätigung Standard V2",
        "text1": "Sehr geehrte Damen und Herren,"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  **Dokumentvorlage ändern.** Ändert einen vorhandenen Eintrag in `VORLAGEN`. Gefunden wird er über `nr`.

  | | |
  |---|---|
  | **Aufruf** | `POST {{baseURL}}/dokumente/updatevorlagen` |
  | **Anmeldung** | nötig – Token aus `/login` (wird in Bruno automatisch mitgeschickt) |
  | **Berechtigung** | Der Benutzer braucht diesen Endpunkt in seinen Rollen (sonst Fehler 403) |

  ### Was du mitschickst
  | Parameter | Wert | Pflicht | Bedeutung |
  |---|---|---|---|
  | `nr` | Ganzzahl | **ja** | Welcher Eintrag geändert wird. |
  | weitere Felder | siehe Liste | mind. eins | Nur die mitgeschickten Felder werden geändert. `null` macht ein Feld leer. |

  ### Änderbare Felder
  | Feld | Typ |
  |---|---|
  | `haupttext` | Langtext/Datei |
  | `art` | Text (max. 15 Zeichen) |
  | `standard` | Text (max. 4 Zeichen) |
  | `name` | Text (max. 30 Zeichen) |
  | `text1` | Text (max. 200 Zeichen) |
  | `text2` | Text (max. 200 Zeichen) |
  | `drucker` | Text (max. 40 Zeichen) |
  | `druckerwahl` | Text (max. 4 Zeichen) |
  | `folgeformular` | Ganzzahl |
  | `datum` | Datum/Uhrzeit |
  | `angepasst` | Text (max. 4 Zeichen) |
  | `bereich` | Text (max. 20 Zeichen) |
  | `doktyp` | Text (max. 1 Zeichen) |
  | `versteckt` | Text (max. 4 Zeichen) |
  | `dokkategorie` | Text (max. 40 Zeichen) |
  | `geaendertam` | Datum/Uhrzeit |
  | `bearbeiter` | Text (max. 30 Zeichen) |
  | `pwd` | Text (max. 40 Zeichen) |
  | `archiv` | Text (max. 4 Zeichen) |
  | `dms_key` | Text (max. 255 Zeichen) |
  | `wiedervorlage` | Datum/Uhrzeit |
  | `gueltigbis` | Datum/Uhrzeit |
  | `reftable` | Text (max. 80 Zeichen) |
  | `refnr` | Ganzzahl |
  | `datumfeld1` | Datum/Uhrzeit |
  | `datumfeld2` | Datum/Uhrzeit |
  | `zusatzfeld1` | Text (max. 50 Zeichen) |
  | `zusatzfeld2` | Text (max. 50 Zeichen) |
  | `anmietnr` | Ganzzahl |
  | `senderemail` | Text (max. 50 Zeichen) |
  | `empfaengeremail` | Text (max. 50 Zeichen) |
  | `dateiname` | Text (max. 255 Zeichen) |
  | `mandant` | Text (max. 30 Zeichen) |

  ### Was zurückkommt
  ```json
  {"status": "OK"}
  ```

  ### Was schiefgehen kann
  - **401** – nicht angemeldet oder Token abgelaufen → neu einloggen.
  - **403** – keine Berechtigung für diesen Endpunkt.
  - **400** mit Fehlermeldung – die Datenbank lehnt die Daten ab, z.B. Text zu lang für das Feld oder Buchstaben in einem Zahlenfeld.
  - **Fehlermeldung mit Status 200** (`{"status":"error","message":"..."}`), z.B. wenn kein einziges gültiges Feld mitgeschickt wurde – deshalb immer auf `"status": "error"` prüfen.

  ### Gut zu wissen
  - **Nur mitgeschickte Felder werden geändert**, alle anderen bleiben, wie sie sind.
  - **Keine Meldung, wenn es den Eintrag nicht gibt:** Auch bei einem falschen oder fehlenden `nr` kommt `{"status": "OK"}` – geändert wurde dann aber nichts.
  - `nr` selbst lässt sich hier nicht ändern.
  - **Unbekannte Felder werden ohne Meldung ignoriert** – ein Tippfehler im Feldnamen fällt also nicht auf.

  <details><summary>Für Entwickler</summary>

  - Controller: `TDataModulDokumente.updateVorlagen` in `Shared/DataModuls/DataModulDokumenteClass.pas`
  - Tabelle: `VORLAGEN`, Schlüssel `nr`
  - Umsetzung: generische Methode `DoUpdate` der Basisklasse `TDataModulTableBase`
  - Der Server wertet die HTTP-Methode nicht aus – GET und POST funktionieren gleich.

  </details>
