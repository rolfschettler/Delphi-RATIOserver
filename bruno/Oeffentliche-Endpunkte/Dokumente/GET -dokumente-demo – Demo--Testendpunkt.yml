info:
  name: GET /dokumente/demo – Demo-/Testendpunkt
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseURL}}/dokumente/demo?id=42&filter=Mueller"
  params:
    - name: id
      value: "42"
      type: query
    - name: filter
      value: Mueller
      type: query
  body:
    type: json
    data: |-
      {
        "name": "Helga",
        "menge": 5
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Referenz-/Testendpunkt, identisch zum Demo-Endpunkt des Anmiet-Controllers. Demonstriert den sicheren Zugriff auf Parameter aus URL-Query (`id`, `filter`) und JSON-Body (`name`, `menge`). Fehlende Werte erzeugen keinen Fehler, sondern erscheinen im Ergebnis als `null`.

  **Auth:** erforderlich (Bearer Token).

  **Antwort:** `{"url":{"id":42,"filter":"Mueller"},"body":{"name":"Helga","menge":5}}`
