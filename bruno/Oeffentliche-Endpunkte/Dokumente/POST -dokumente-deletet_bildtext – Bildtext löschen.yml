info:
  name: POST /dokumente/deletet_bildtext – Bildtext löschen
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseURL}}/dokumente/deletet_bildtext"
  body:
    type: json
    data: |-
      {
        "nr": 55
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Löscht genau einen T_BILDTEXT-Datensatz anhand des Primärschlüssels `nr` (generisches `DoDelete('T_BILDTEXT', 'nr')`).

  **Auth:** erforderlich (Bearer Token).

  **Antwort:** `{"status":"OK"}`
