info:
  name: POST /toupac/updatet_reiseleistungen – Reiseleistung aktualisieren
  type: http
  seq: 53

http:
  method: POST
  url: "{{baseURL}}/toupac/updatet_reiseleistungen"
  body:
    type: json
    data: |-
      {
        "nr": 42,
        "ek_kalk": 480.00,
        "bemerkung": "EK-Preis angepasst"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  **Reiseleistung aktualisieren.** Ändert einen vorhandenen Eintrag in `T_REISELEISTUNGEN`. Gefunden wird er über `nr`.

  | | |
  |---|---|
  | **Aufruf** | `POST {{baseURL}}/toupac/updatet_reiseleistungen` |
  | **Anmeldung** | nötig – Token aus `/login` (wird in Bruno automatisch mitgeschickt) |
  | **Berechtigung** | Der Benutzer braucht diesen Endpunkt in seinen Rollen (sonst Fehler 403) |

  ### Was du mitschickst
  | Parameter | Wert | Pflicht | Bedeutung |
  |---|---|---|---|
  | `nr` | Ganzzahl | **ja** | Welcher Eintrag geändert wird. |
  | weitere Felder | siehe Liste | mind. eins | Nur die mitgeschickten Felder werden geändert. `null` macht ein Feld leer. |

  ### Änderbare Felder
  | Feld | Typ |
  |---|---|
  | `katalogreisenr` | Ganzzahl |
  | `leistungnr` | Ganzzahl |
  | `rabatterlaubt` | Text (max. 4 Zeichen) |
  | `standard` | Text (max. 4 Zeichen) |
  | `leistungsgeber` | Ganzzahl |
  | `code` | Text (max. 120 Zeichen) |
  | `geraet` | Ganzzahl |
  | `von` | Datum/Uhrzeit |
  | `bis` | Datum/Uhrzeit |
  | `internet` | Text (max. 4 Zeichen) |
  | `vontag` | Ganzzahl |
  | `bistag` | Ganzzahl |
  | `zeitvon` | Text (max. 5 Zeichen) |
  | `zeitbis` | Text (max. 5 Zeichen) |
  | `bemerkung` | Langtext/Datei |
  | `params` | Text (max. 40 Zeichen) |
  | `status` | Ganzzahl |
  | `inklusiv` | Ganzzahl |
  | `leistungsgruppe` | Ganzzahl |
  | `preisoption` | Ganzzahl |
  | `marge` | Kommazahl |
  | `adresskennziffer` | Ganzzahl |
  | `vontagref` | Text (max. 1 Zeichen) |
  | `rundungsoption` | Ganzzahl |
  | `sortierung` | Ganzzahl |
  | `ek_tats` | Kommazahl |
  | `ek_kalk` | Kommazahl |
  | `freiplatz_lt` | Ganzzahl |
  | `freiplatz_kunde` | Ganzzahl |
  | `gesperrt` | Text (max. 4 Zeichen) |
  | `kopiertaus` | Ganzzahl |
  | `ek_kalk1` | Kommazahl |
  | `ek_kalk2` | Kommazahl |
  | `ek_kalk3` | Kommazahl |
  | `ek_kalk4` | Kommazahl |
  | `bezeichnung2` | Text (max. 200 Zeichen) |
  | `provklasse` | Ganzzahl |
  | `referenz1` | Text (max. 60 Zeichen) |
  | `referenz2` | Text (max. 60 Zeichen) |
  | `preis_steuerfrei` | Kommazahl |
  | `sachkonto_steuerfrei` | Text (max. 12 Zeichen) |
  | `onlinebuchung` | Text (max. 4 Zeichen) |
  | `app` | Text (max. 4 Zeichen) |
  | `termin` | Datum/Uhrzeit |
  | `optionsdatum` | Datum/Uhrzeit |
  | `referenz3` | Text (max. 60 Zeichen) |
  | `referenz4` | Text (max. 60 Zeichen) |

  ### Was zurückkommt
  ```json
  {"status": "OK"}
  ```

  ### Was schiefgehen kann
  - **401** – nicht angemeldet oder Token abgelaufen → neu einloggen.
  - **403** – keine Berechtigung für diesen Endpunkt.
  - **400** mit Fehlermeldung – die Datenbank lehnt die Daten ab, z.B. Text zu lang für das Feld oder Buchstaben in einem Zahlenfeld.
  - **Fehlermeldung mit Status 200** (`{"status":"error","message":"..."}`), z.B. wenn kein einziges gültiges Feld mitgeschickt wurde – deshalb immer auf `"status": "error"` prüfen.

  ### Gut zu wissen
  - **Nur mitgeschickte Felder werden geändert**, alle anderen bleiben, wie sie sind.
  - **Keine Meldung, wenn es den Eintrag nicht gibt:** Auch bei einem falschen oder fehlenden `nr` kommt `{"status": "OK"}` – geändert wurde dann aber nichts.
  - `nr` selbst lässt sich hier nicht ändern.
  - **Unbekannte Felder werden ohne Meldung ignoriert** – ein Tippfehler im Feldnamen fällt also nicht auf.
  - **Nicht änderbar** sind hier: `dauer`.

  <details><summary>Für Entwickler</summary>

  - Controller: `TDataModulToupac.updateT_Reiseleistungen` in `Shared/DataModuls/DataModulToupacClass.pas`
  - Tabelle: `T_REISELEISTUNGEN`, Schlüssel `nr`
  - Umsetzung: generische Methode `DoUpdate` der Basisklasse `TDataModulTableBase`
  - Der Server wertet die HTTP-Methode nicht aus – GET und POST funktionieren gleich.

  </details>
