info:
  name: GET /toupac/gett_leistungfiltered – Leistungen gefiltert
  type: http
  seq: 56

http:
  method: GET
  url: "{{baseURL}}/toupac/gett_leistungfiltered"
  body:
    type: json
    data: |-
      {
        "fields": "*",
        "ltraeger": 42,
        "typ": "Hotel",
        "orderby": "nr"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Liefert Datensaetze aus T_LEISTUNG, optional gefiltert. Jeder im Body gesetzte (nicht-null) Filter-Parameter erzeugt eine AND-verknuepfte WHERE-Bedingung `feld = :feld`; ohne Filter werden alle Datensaetze geliefert. Ruft intern `DoSelectFilteredDynamic('T_LEISTUNG', ALLOWED, CONDITIONS, FILTER_PARAMS)` auf.

  **Tabelle:** T_LEISTUNG

  **Erlaubte Felder (ALLOWED):** nr, code, kontingentcode, ltraeger, buchungsinfo, altervon, alterbis, preisvon, preisbis, dauerbis, dauervon, stornierbar, provklasse, ustpflicht, zahlbarsofort, rabatterlaubt, typ, subtyp, sachkonto, kostelle1, kostelle2, capacity, maxcapacity, mincapacity, internet, suchbegriff, stornostaffel, params, preisoption, tarifcode, versicherungsart, onlinebuchung, kennziffer, app, gesperrt, bezeichnung, optionstage

  **Filter (FILTER_PARAMS, alle optional):** nr, code, kontingentcode, ltraeger, altervon, alterbis, preisvon, preisbis, dauerbis, dauervon, stornierbar, provklasse, ustpflicht, zahlbarsofort, rabatterlaubt, typ, subtyp, sachkonto, kostelle1, kostelle2, capacity, maxcapacity, mincapacity, internet, suchbegriff, stornostaffel, params, preisoption, tarifcode, versicherungsart, onlinebuchung, kennziffer, app, gesperrt, bezeichnung, optionstage (nicht filterbar: buchungsinfo)

  **Body:** `{ "fields": [...] | "*", "<filterfeld>": <wert>, ..., "orderby": "<feld aus ALLOWED>", "limit": 10, "offset": 0 }` -- ein gueltiges JSON-Objekt im Body ist Pflicht (sonst Fehler "Kein gueltiges JSON im Request-Body").

  **Auth:** erforderlich (Bearer Token)

  **LocalOnly:** nein

  **Antwort:** ohne `limit` `{ "header": { "<feld>": "<typ>", ... }, "data": [ { ... }, ... ] }` (Serialisierung per `SerializeQuery`, Feldnamen klein geschrieben); mit `limit` `{ "total":N, "limit":N, "offset":N, "data": { "header": {...}, "data": [...] } }`.
