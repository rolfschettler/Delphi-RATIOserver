info:
  name: GET /toupac/gett_katalogreise – Katalogreisen auflisten
  type: http
  seq: 36

http:
  method: GET
  url: "{{baseURL}}/toupac/gett_katalogreise"
  body:
    type: json
    data: |-
      {
        "fields": "*",
        "orderby": "nr"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  **Katalogreisen auflisten.** Liefert alle Einträge aus `T_KATALOGREISE` – auf Wunsch sortiert und seitenweise.

  | | |
  |---|---|
  | **Aufruf** | `GET {{baseURL}}/toupac/gett_katalogreise` |
  | **Anmeldung** | nötig – Token aus `/login` (wird in Bruno automatisch mitgeschickt) |
  | **Berechtigung** | Der Benutzer braucht diesen Endpunkt in seinen Rollen (sonst Fehler 403) |

  ### Was du mitschickst
  Alles ist optional – ein leerer Body `{}` liefert alles.

  | Parameter | Wert | Pflicht | Bedeutung |
  |---|---|---|---|
  | `fields` | `"*"` oder Liste, z.B. `["nr","bezeichnung"]` | nein | Welche Felder zurückkommen sollen. `"*"` oder weglassen = alle Felder aus der Liste unten. |
  | `orderby` | Feldname | nein | Sortierung nach genau einem Feld, aufsteigend. |
  | `limit` | Zahl | nein | Höchstens so viele Datensätze liefern (zum Blättern). Weglassen = alle. |
  | `offset` | Zahl | nein | So viele Datensätze überspringen (nur zusammen mit `limit`). Beispiel: `limit` 20 und `offset` 40 = Seite 3. |

  ### Verfügbare Felder
  | Feld | Typ |
  |---|---|
  | `nr` | Ganzzahl |
  | `reisenr` | Ganzzahl |
  | `reisethema` | Text (max. 200 Zeichen) |
  | `code` | Text (max. 20 Zeichen) |
  | `katalognr` | Ganzzahl |
  | `terminschema` | Ganzzahl |
  | `internet` | Text (max. 4 Zeichen) |
  | `befkategorie` | Text (max. 60 Zeichen) |
  | `sachkonto` | Text (max. 12 Zeichen) |
  | `sachkontostorno` | Text (max. 12 Zeichen) |
  | `sachkontoprov` | Text (max. 12 Zeichen) |
  | `kostelle1` | Text (max. 12 Zeichen) |
  | `kostelle2` | Text (max. 12 Zeichen) |
  | `kostelle1storno` | Text (max. 12 Zeichen) |
  | `kostelle2storno` | Text (max. 12 Zeichen) |
  | `kostelle1prov` | Text (max. 12 Zeichen) |
  | `kostelle2prov` | Text (max. 12 Zeichen) |
  | `erstelltam` | Datum/Uhrzeit |
  | `fbrabatt` | Kommazahl |
  | `fbbis` | Datum/Uhrzeit |
  | `angebot` | Text (max. 4 Zeichen) |
  | `status` | Ganzzahl |
  | `url1` | Text (max. 240 Zeichen) |
  | `url2` | Text (max. 240 Zeichen) |
  | `url3` | Text (max. 240 Zeichen) |
  | `url4` | Text (max. 240 Zeichen) |
  | `xkoord` | Text (max. 20 Zeichen) |
  | `ykoord` | Text (max. 20 Zeichen) |
  | `maximumpers` | Ganzzahl |
  | `minimumpers` | Ganzzahl |
  | `bemerkung` | Langtext/Datei |
  | `kategorie` | Langtext/Datei |
  | `anzahlungsbetrag` | Kommazahl |
  | `anzahlungsart` | Text (max. 4 Zeichen) |
  | `nrkreis` | Ganzzahl |
  | `stornostaffel` | Ganzzahl |
  | `zusatzinfo` | Text (max. 32000 Zeichen) |
  | `katalogseite` | Ganzzahl |
  | `veranstalter` | Text (max. 10 Zeichen) |
  | `hauptkategorie` | Text (max. 60 Zeichen) |
  | `pauschalierungsfaktor` | Kommazahl |
  | `versicherungsart` | Text (max. 254 Zeichen) |
  | `geaendertam` | Datum/Uhrzeit |
  | `geaendertvon` | Text (max. 20 Zeichen) |
  | `erstelltvon` | Text (max. 20 Zeichen) |
  | `untertitel` | Text (max. 200 Zeichen) |
  | `mandant` | Text (max. 30 Zeichen) |

  ### Was zurückkommt
  ```json
  {
    "header": {"nr": "ftinteger", ...},
    "data": [ {"nr": 42, "reisenr": 42, "reisethema": "Text", ...} ]
  }
  ```
  `data` enthält die Datensätze, `header` nennt zu jedem Feld den technischen Typ. **Mit `limit`** sieht die Antwort so aus: `{"total": 123, "limit": 20, "offset": 0, "data": { "header": ..., "data": [...] }}` – `total` ist die Gesamtzahl aller Treffer.

  ### Was schiefgehen kann
  - **401** – nicht angemeldet oder Token abgelaufen → neu einloggen.
  - **403** – keine Berechtigung für diesen Endpunkt.
  - **Fehlermeldung im Text** (`{"status":"error","message":"..."}`), z.B. wenn ein Feldname in `fields` oder `orderby` nicht erlaubt ist. Achtung: Solche Fehler kommen teilweise mit HTTP-Status 200 – deshalb immer auf `"status": "error"` prüfen.

  ### Gut zu wissen
  - **Ohne `limit` kommt die komplette Tabelle** – bei vielen Einträgen besser seitenweise abrufen.
  - **Zum Suchen** den passenden `…filtered`-Endpunkt verwenden, für einen einzelnen Eintrag `…byid`.

  <details><summary>Für Entwickler</summary>

  - Controller: `TDataModulToupac.getT_Katalogreise` in `Shared/DataModuls/DataModulToupacClass.pas`
  - Tabelle: `T_KATALOGREISE`, Schlüssel `nr`
  - Umsetzung: generische Methode `DoSelect` der Basisklasse `TDataModulTableBase`
  - Der Server wertet die HTTP-Methode nicht aus – GET und POST funktionieren gleich.

  </details>
