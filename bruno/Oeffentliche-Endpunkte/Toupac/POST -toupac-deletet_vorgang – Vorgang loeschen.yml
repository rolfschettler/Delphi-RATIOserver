docs: |-
  Loescht einen Datensatz aus T_VORGANG anhand des Primaerschluessels `nr`. Ruft intern `DoDelete('T_VORGANG', 'nr')` auf.

  **Tabelle:** T_VORGANG

  **Key-Feld:** `nr` (Pflicht im Body)

  **Body:** `{ "nr": <wert> }`

  **Auth:** erforderlich (Bearer Token)

  **LocalOnly:** nein

  **Antwort:** `{"status":"OK"}`
