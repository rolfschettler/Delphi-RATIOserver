info:
  name: GET /toupac/gett_katalogreisekey – naechste Katalogreise-Nr
  type: http
  seq: 39

http:
  method: GET
  url: "{{baseURL}}/toupac/gett_katalogreisekey"
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  **naechste Katalogreise-Nr.** Reserviert die nächste freie Nummer und gibt sie zurück – typischerweise vor dem Anlegen eines neuen Eintrags.

  | | |
  |---|---|
  | **Aufruf** | `GET {{baseURL}}/toupac/gett_katalogreisekey` |
  | **Anmeldung** | nötig – Token aus `/login` (wird in Bruno automatisch mitgeschickt) |
  | **Berechtigung** | Der Benutzer braucht diesen Endpunkt in seinen Rollen (sonst Fehler 403) |

  ### Was du mitschickst
  Nichts – ein Body wird nicht benötigt.

  ### Was zurückkommt
  ```json
  {"header": {"nr": "ftlargeint"}, "data": [ {"nr": 4711} ]}
  ```
  Die neue Nummer steht in `data[0].nr`.

  ### Was schiefgehen kann
  - **401** – nicht angemeldet oder Token abgelaufen → neu einloggen.
  - **403** – keine Berechtigung für diesen Endpunkt.

  ### Gut zu wissen
  - **Jeder Aufruf verbraucht eine Nummer** – auch wenn danach nichts angelegt wird. Lücken in der Nummerierung sind deshalb normal.
  - **Die Nummer gehört dir:** Kein anderer Aufruf bekommt dieselbe Nummer.

  <details><summary>Für Entwickler</summary>

  - Controller: `TDataModulToupac.getT_KatalogreiseKey` in `Shared/DataModuls/DataModulToupacClass.pas`
  - InterBase-Generator `T_KATALOGREISE_NR_GEN` (`GEN_ID(T_KATALOGREISE_NR_GEN, 1)`)
  - Der Server wertet die HTTP-Methode nicht aus.

  </details>
