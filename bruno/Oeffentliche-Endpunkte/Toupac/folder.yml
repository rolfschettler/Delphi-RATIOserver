request:
  auth: inherit

docs:
  content: |-
    Hier verwaltest du die **Touristik-Daten**: Buchungsvorgänge, Reisen und alles, was dazugehört.

    - **Vorgänge** (Buchungen) – mit lesendem Zugriff auf ihre **Positionen** und **Ticketdaten**.
    - **Katalogreisen**, **Reisen**, **Reisedetails** (Bezeichnungen je Sprache), **Reiseleistungen** und **Termine**.
    - **Leistungsträger** (z.B. Hotels, Busunternehmen) und **Leistungen**.
    - **Fahrtaufträge** und **Kalendereinträge**.

    Je Bereich gibt es in der Regel: auflisten, suchen, einzeln abrufen, nächste freie Nummer holen (`…key`), anlegen, ändern, löschen. Ausnahmen: Positionen und Ticketdaten nur lesen; Katalogreisen und Reisen nicht löschen. Dazu kommt der Testendpunkt `demo`.

    Alle Endpunkte brauchen eine Anmeldung (Token aus `/login`) und die passende Berechtigung in den Rollen des Benutzers (sonst Fehler 401 bzw. 403).

    Technik: Controller `TDataModulToupac` (`Shared/DataModuls/DataModulToupacClass.pas`), generische Methoden der Basisklasse `TDataModulTableBase`; Tabellen `T_VORGANG`, `T_POSITIONEN`, `T_TICKETDATEN`, `T_KATALOGREISE`, `T_REISE`, `T_REISEDETAIL`, `T_REISELEISTUNGEN`, `T_TERMINE`, `T_LTRAEGER`, `T_LEISTUNG`, `F_FAHRTAUFTRAG`, `T_KALENDER`.
  type: text/markdown
