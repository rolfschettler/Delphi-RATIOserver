info:
  name: GET /toupac/gett_ltraegerbyid – Leistungstraeger per nr
  type: http
  seq: 31

http:
  method: GET
  url: "{{baseURL}}/toupac/gett_ltraegerbyid"
  body:
    type: json
    data: |-
      {
        "nr": 42,
        "fields": "*"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Liefert genau einen Datensatz aus T_LTRAEGER anhand des Primaerschluessels `nr`. Ruft intern `DoSelectOne('T_LTRAEGER', ALLOWED, 'nr')` auf.

  **Tabelle:** T_LTRAEGER

  **Erlaubte Felder (ALLOWED):** nr, kennziffer, code, bezeichnung, land, ort, typ, sachkonto, kostelle1, kostelle2, optionstage, klasse, stornostaffel, suchbegriff, kategorie, waehrung, gesperrt, bemerkung_intern

  **Key-Feld:** `nr` (Pflicht im Body)

  **Body:** `{ "nr": <wert>, "fields": [...] | "*" }`

  **Auth:** erforderlich (Bearer Token)

  **LocalOnly:** nein

  **Antwort:** `{ "header": { "<feld>": "<typ>", ... }, "data": [ { ...Datensatz... } ] }` (Array mit genau einem Datensatz bzw. leeres `data`-Array, wenn die `nr` nicht existiert).
