info:
  name: GET /toupac/gett_ltraegerbyid – Leistungstraeger per nr
  type: http
  seq: 31

http:
  method: GET
  url: "{{baseURL}}/toupac/gett_ltraegerbyid"
  body:
    type: json
    data: |-
      {
        "nr": 42,
        "fields": "*"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  **Leistungstraeger per nr.** Liefert genau einen Eintrag aus `T_LTRAEGER`, gesucht über `nr`.

  | | |
  |---|---|
  | **Aufruf** | `GET {{baseURL}}/toupac/gett_ltraegerbyid` |
  | **Anmeldung** | nötig – Token aus `/login` (wird in Bruno automatisch mitgeschickt) |
  | **Berechtigung** | Der Benutzer braucht diesen Endpunkt in seinen Rollen (sonst Fehler 403) |

  ### Was du mitschickst
  | Parameter | Wert | Pflicht | Bedeutung |
  |---|---|---|---|
  | `nr` | Ganzzahl | **ja** | Der gesuchte Eintrag. |
  | `fields` | `"*"` oder Liste | nein | Welche Felder zurückkommen sollen. Weglassen = alle. |

  ### Verfügbare Felder
  | Feld | Typ |
  |---|---|
  | `nr` | Ganzzahl |
  | `kennziffer` | Ganzzahl |
  | `code` | Text (max. 20 Zeichen) |
  | `bezeichnung` | Text (max. 40 Zeichen) |
  | `land` | Text (max. 60 Zeichen) |
  | `ort` | Text (max. 120 Zeichen) |
  | `typ` | Ganzzahl |
  | `sachkonto` | Text (max. 12 Zeichen) |
  | `kostelle1` | Text (max. 12 Zeichen) |
  | `kostelle2` | Text (max. 12 Zeichen) |
  | `optionstage` | Ganzzahl |
  | `klasse` | Text (max. 60 Zeichen) |
  | `stornostaffel` | Ganzzahl |
  | `suchbegriff` | Text (max. 400 Zeichen) |
  | `kategorie` | Langtext/Datei |
  | `waehrung` | Text (max. 5 Zeichen) |
  | `gesperrt` | Text (max. 4 Zeichen) |
  | `bemerkung_intern` | Text (max. 32000 Zeichen) |

  ### Was zurückkommt
  ```json
  {"header": {...}, "data": [ {"nr": 42, "kennziffer": 42, "code": "Text", ...} ]}
  ```

  ### Was schiefgehen kann
  - **401** – nicht angemeldet oder Token abgelaufen → neu einloggen.
  - **403** – keine Berechtigung für diesen Endpunkt.
  - **Fehlermeldung im Text** (`{"status":"error","message":"..."}`), z.B. wenn ein Feldname in `fields` oder `orderby` nicht erlaubt ist. Achtung: Solche Fehler kommen teilweise mit HTTP-Status 200 – deshalb immer auf `"status": "error"` prüfen.

  ### Gut zu wissen
  - **Nicht gefunden = leere Liste:** Gibt es den Eintrag nicht, kommt kein Fehler, sondern `"data": []`.
  - **`nr` muss mitgeschickt werden**, sonst kommt eine Fehlermeldung.

  <details><summary>Für Entwickler</summary>

  - Controller: `TDataModulToupac.getT_LtraegerById` in `Shared/DataModuls/DataModulToupacClass.pas`
  - Tabelle: `T_LTRAEGER`, Schlüssel `nr`
  - Umsetzung: generische Methode `DoSelectOne` der Basisklasse `TDataModulTableBase`
  - Der Server wertet die HTTP-Methode nicht aus – GET und POST funktionieren gleich.

  </details>
