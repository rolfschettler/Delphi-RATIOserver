info:
  name: GET /toupac/gett_ticketdatenbyid – Ticketdatensatz per nr
  type: http
  seq: 28

http:
  method: GET
  url: "{{baseURL}}/toupac/gett_ticketdatenbyid"
  body:
    type: json
    data: |-
      {
        "nr": 42,
        "fields": "*"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Liefert genau einen Datensatz aus T_TICKETDATEN anhand des Primaerschluessels `nr`. Ruft intern `DoSelectOne('T_TICKETDATEN', ALLOWED, 'nr')` auf.

  **Tabelle:** T_TICKETDATEN

  **Erlaubte Felder (ALLOWED):** nr, gueltigvon, gueltigbis, daten, reftable, refnr, art, bezeichnung, datum1, datum2, datum3, datum4, wtag

  **Key-Feld:** `nr` (Pflicht im Body)

  **Body:** `{ "nr": <wert>, "fields": [...] | "*" }`

  **Auth:** erforderlich (Bearer Token)

  **LocalOnly:** nein

  **Antwort:** `{ "header": { "<feld>": "<typ>", ... }, "data": [ { ...Datensatz... } ] }` (Array mit genau einem Datensatz bzw. leeres `data`-Array, wenn die `nr` nicht existiert).
