info:
  name: POST /toupac/insertt_termine – Termin anlegen
  type: http
  seq: 66

http:
  method: POST
  url: "{{baseURL}}/toupac/insertt_termine"
  body:
    type: json
    data: |-
      {
        "nr": 42,
        "katalogreisenr": 42,
        "von": "2027-05-01",
        "bis": "2027-05-08",
        "storniert": "N",
        "gesperrt": "N",
        "internet": "J",
        "minimumpers": 12,
        "maximumpers": 30,
        "bemerkung": "Fruehjahrstermin"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  **Termin anlegen.** Legt einen neuen Eintrag in `T_TERMINE` an.

  | | |
  |---|---|
  | **Aufruf** | `POST {{baseURL}}/toupac/insertt_termine` |
  | **Anmeldung** | nötig – Token aus `/login` (wird in Bruno automatisch mitgeschickt) |
  | **Berechtigung** | Der Benutzer braucht diesen Endpunkt in seinen Rollen (sonst Fehler 403) |

  ### Was du mitschickst
  Die gewünschten Felder als `"feld": wert`. Nicht mitgeschickte Felder bleiben leer, `null` macht ein Feld ausdrücklich leer.

  | Feld | Typ | Pflicht laut Datenbank |
  |---|---|---|
  | `nr` | Ganzzahl | ja |
  | `katalogreisenr` | Ganzzahl |  |
  | `von` | Datum/Uhrzeit |  |
  | `bis` | Datum/Uhrzeit |  |
  | `vw` | Ganzzahl |  |
  | `vtage` | Ganzzahl |  |
  | `bemerkung` | Langtext/Datei |  |
  | `storniert` | Text (max. 4 Zeichen) |  |
  | `gesperrt` | Text (max. 4 Zeichen) |  |
  | `sonderangebot` | Text (max. 4 Zeichen) |  |
  | `internet` | Text (max. 4 Zeichen) |  |
  | `sachkonto` | Text (max. 12 Zeichen) |  |
  | `kostelle1` | Text (max. 12 Zeichen) |  |
  | `kostelle2` | Text (max. 12 Zeichen) |  |
  | `minimumpers` | Ganzzahl |  |
  | `maximumpers` | Ganzzahl |  |
  | `provisionskonto` | Text (max. 12 Zeichen) |  |
  | `sachkontostorno` | Text (max. 12 Zeichen) |  |
  | `bemerkung_intern` | Langtext/Datei |  |
  | `abgesagt_am` | Datum/Uhrzeit |  |
  | `schnittstelle_sendtime` | Datum/Uhrzeit |  |

  ### Was zurückkommt
  ```json
  {"status": "OK"}
  ```

  ### Was schiefgehen kann
  - **401** – nicht angemeldet oder Token abgelaufen → neu einloggen.
  - **403** – keine Berechtigung für diesen Endpunkt.
  - **400** mit Fehlermeldung – die Datenbank lehnt die Daten ab, z.B. Text zu lang für das Feld oder Buchstaben in einem Zahlenfeld.
  - **Fehlermeldung mit Status 200** (`{"status":"error","message":"..."}`), z.B. wenn kein einziges gültiges Feld mitgeschickt wurde – deshalb immer auf `"status": "error"` prüfen.

  ### Gut zu wissen
  - **Die Nummer (`nr`) kannst du mitschicken** – eine freie Nummer liefert vorher der passende `…key`-Endpunkt. Lässt du sie weg, vergibt die Datenbank automatisch eine. Die Antwort enthält keine Nummer.
  - **Unbekannte Felder werden ohne Meldung ignoriert.** Ein Tippfehler im Feldnamen fällt also nicht auf – das Feld bleibt einfach leer.

  <details><summary>Für Entwickler</summary>

  - Controller: `TDataModulToupac.insertT_Termine` in `Shared/DataModuls/DataModulToupacClass.pas`
  - Tabelle: `T_TERMINE`, Schlüssel `nr`
  - Umsetzung: generische Methode `DoInsert` der Basisklasse `TDataModulTableBase`
  - Der Server wertet die HTTP-Methode nicht aus – GET und POST funktionieren gleich.

  </details>
