info:
  name: POST /toupac/insertt_reisedetail – Reisedetail anlegen
  type: http
  seq: 73

http:
  method: POST
  url: "{{baseURL}}/toupac/insertt_reisedetail"
  body:
    type: json
    data: |-
      {
        "nr": 42,
        "reisenr": 42,
        "sprache": "DEU",
        "bezeichnung": "Reisebeschreibung deutsch"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Legt einen neuen Datensatz in T_REISEDETAIL an. Ruft intern `DoInsert('T_REISEDETAIL', ALLOWED)` auf; nur die in ALLOWED gelisteten Felder werden aus dem Body uebernommen, unbekannte Felder werden ignoriert, JSON `null` wird als NULL geschrieben. Die `nr` sollte vorher per `/toupac/gett_reisedetailkey` ermittelt werden.

  **Tabelle:** T_REISEDETAIL

  **Erlaubte Felder (ALLOWED):** nr, reisenr, sprache, bezeichnung (`sprache` max. 3, `bezeichnung` max. 60 Zeichen)

  **Key-Feld:** `nr` (NOT NULL, wird wie ein normales Feld mitgeschrieben)

  **Body:** `{ "nr": <wert>, "<feld>": <wert>, ... }` (mindestens ein gueltiges Feld)

  **Auth:** erforderlich (Bearer Token)

  **LocalOnly:** nein

  **Antwort:** `{"status":"OK"}`
