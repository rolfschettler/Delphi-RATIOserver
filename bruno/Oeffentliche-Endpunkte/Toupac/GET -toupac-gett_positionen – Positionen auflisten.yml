info:
  name: GET /toupac/gett_positionen – Positionen auflisten
  type: http
  seq: 23

http:
  method: GET
  url: "{{baseURL}}/toupac/gett_positionen"
  body:
    type: json
    data: |-
      {
        "fields": "*",
        "orderby": "nr"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Listet Datensaetze aus T_POSITIONEN auf (ungefiltert). Ruft intern `DoSelect('T_POSITIONEN', ALLOWED)` auf.

  **Tabelle:** T_POSITIONEN

  **Erlaubte Felder (ALLOWED):** nr, masterpos, postyp, erstellt, geaendert, vorgangnr, agenturnr, menge, personen, leistungscode, kontingentcode, kostelle1, kostelle2, ltraeger, datum_von, datum_bis, leistungnr, provklasse, prov, prov_betrag, provust, ustpflichtig, sachkonto, maxcapacity, mincapacity, capacity, rabatterlaubt, stornierbar, typ, zahlbarsofort, geraet, leistungsgeber, belegt_nr, einzelpreis, gesamtpreis, endpreis, optionstage, regel_mitltyp, katalogreisenr, direktinkasso, ltbezeichnung, reisebezeichnung, alter_von, alter_bis, bemerkung, erm, ermdatum, status, provisionskonto, stornostaffel, sachkontostorno, zeitvon, zeitbis, params, preisschema, leistungsgruppe, inklusiv, preisoption, marge, packagenr, leistungsstatus, ltraegerkennziffer, personenpreis, preisberechnet, kurs, sortierung, rundungsoption, ek_tats, ek_kalk, freiplatz_lt, freiplatz_kunde, termin, referenz1, referenz2, waehrung, ek_kalk1, ek_kalk2, ek_kalk3, ek_kalk4, bezeichnung2, optionsdatum, teilnehmernr, rabatt, externenr1, externenr2, buchungsdatum, stornodatum, referenz3, referenz4, gruppe, internet, onlinebuchung, app, vk_preis_fremdwaehrung, kurs_vk_fremdwaehrung, waehrung_ek, lcode, menge_alt, auskatalogreise, mindestnaechte, bezeichnung

  **Body (optional):** `{ "fields": [...] | "*", "orderby": "<feld aus ALLOWED>", "limit": 10, "offset": 0 }` (ohne `fields` bzw. mit `"*"` werden alle ALLOWED-Felder geliefert).

  **Auth:** erforderlich (Bearer Token)

  **LocalOnly:** nein

  **Antwort:** ohne `limit` `{ "header": { "<feld>": "<typ>", ... }, "data": [ { ... }, ... ] }` (Serialisierung per `SerializeQuery`, Feldnamen klein geschrieben); mit `limit` `{ "total":N, "limit":N, "offset":N, "data": { "header": {...}, "data": [...] } }`.
