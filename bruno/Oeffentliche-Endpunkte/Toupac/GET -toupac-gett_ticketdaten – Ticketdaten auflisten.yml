info:
  name: GET /toupac/gett_ticketdaten – Ticketdaten auflisten
  type: http
  seq: 26

http:
  method: GET
  url: "{{baseURL}}/toupac/gett_ticketdaten"
  body:
    type: json
    data: |-
      {
        "fields": "*",
        "orderby": "nr"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Listet Datensaetze aus T_TICKETDATEN auf (ungefiltert). Ruft intern `DoSelect('T_TICKETDATEN', ALLOWED)` auf.

  **Tabelle:** T_TICKETDATEN

  **Erlaubte Felder (ALLOWED):** nr, gueltigvon, gueltigbis, daten, reftable, refnr, art, bezeichnung, datum1, datum2, datum3, datum4, wtag

  **Body (optional):** `{ "fields": [...] | "*", "orderby": "<feld aus ALLOWED>", "limit": 10, "offset": 0 }` (ohne `fields` bzw. mit `"*"` werden alle ALLOWED-Felder geliefert).

  **Auth:** erforderlich (Bearer Token)

  **LocalOnly:** nein

  **Antwort:** ohne `limit` `{ "header": { "<feld>": "<typ>", ... }, "data": [ { ... }, ... ] }` (Serialisierung per `SerializeQuery`, Feldnamen klein geschrieben); mit `limit` `{ "total":N, "limit":N, "offset":N, "data": { "header": {...}, "data": [...] } }`.
