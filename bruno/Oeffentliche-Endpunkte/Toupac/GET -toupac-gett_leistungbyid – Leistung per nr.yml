info:
  name: GET /toupac/gett_leistungbyid – Leistung per nr
  type: http
  seq: 57

http:
  method: GET
  url: "{{baseURL}}/toupac/gett_leistungbyid"
  body:
    type: json
    data: |-
      {
        "nr": 42,
        "fields": "*"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  **Leistung per nr.** Liefert genau einen Eintrag aus `T_LEISTUNG`, gesucht über `nr`.

  | | |
  |---|---|
  | **Aufruf** | `GET {{baseURL}}/toupac/gett_leistungbyid` |
  | **Anmeldung** | nötig – Token aus `/login` (wird in Bruno automatisch mitgeschickt) |
  | **Berechtigung** | Der Benutzer braucht diesen Endpunkt in seinen Rollen (sonst Fehler 403) |

  ### Was du mitschickst
  | Parameter | Wert | Pflicht | Bedeutung |
  |---|---|---|---|
  | `nr` | Ganzzahl | **ja** | Der gesuchte Eintrag. |
  | `fields` | `"*"` oder Liste | nein | Welche Felder zurückkommen sollen. Weglassen = alle. |

  ### Verfügbare Felder
  | Feld | Typ |
  |---|---|
  | `nr` | Ganzzahl |
  | `code` | Text (max. 20 Zeichen) |
  | `kontingentcode` | Text (max. 20 Zeichen) |
  | `ltraeger` | Ganzzahl |
  | `buchungsinfo` | Langtext/Datei |
  | `altervon` | Ganzzahl |
  | `alterbis` | Ganzzahl |
  | `preisvon` | Kommazahl |
  | `preisbis` | Kommazahl |
  | `dauerbis` | Ganzzahl |
  | `dauervon` | Ganzzahl |
  | `stornierbar` | Text (max. 4 Zeichen) |
  | `provklasse` | Ganzzahl |
  | `ustpflicht` | Text (max. 4 Zeichen) |
  | `zahlbarsofort` | Text (max. 4 Zeichen) |
  | `rabatterlaubt` | Text (max. 4 Zeichen) |
  | `typ` | Ganzzahl |
  | `subtyp` | Text (max. 4 Zeichen) |
  | `sachkonto` | Text (max. 12 Zeichen) |
  | `kostelle1` | Text (max. 12 Zeichen) |
  | `kostelle2` | Text (max. 12 Zeichen) |
  | `capacity` | Ganzzahl |
  | `maxcapacity` | Ganzzahl |
  | `mincapacity` | Ganzzahl |
  | `internet` | Text (max. 4 Zeichen) |
  | `suchbegriff` | Text (max. 200 Zeichen) |
  | `stornostaffel` | Ganzzahl |
  | `params` | Text (max. 40 Zeichen) |
  | `preisoption` | Ganzzahl |
  | `tarifcode` | Text (max. 254 Zeichen) |
  | `versicherungsart` | Text (max. 254 Zeichen) |
  | `onlinebuchung` | Text (max. 4 Zeichen) |
  | `kennziffer` | Ganzzahl |
  | `app` | Text (max. 4 Zeichen) |
  | `gesperrt` | Text (max. 4 Zeichen) |
  | `bezeichnung` | Text (max. 200 Zeichen) |
  | `optionstage` | Ganzzahl |

  ### Was zurückkommt
  ```json
  {"header": {...}, "data": [ {"nr": 42, "code": "Text", "kontingentcode": "Text", ...} ]}
  ```

  ### Was schiefgehen kann
  - **401** – nicht angemeldet oder Token abgelaufen → neu einloggen.
  - **403** – keine Berechtigung für diesen Endpunkt.
  - **Fehlermeldung im Text** (`{"status":"error","message":"..."}`), z.B. wenn ein Feldname in `fields` oder `orderby` nicht erlaubt ist. Achtung: Solche Fehler kommen teilweise mit HTTP-Status 200 – deshalb immer auf `"status": "error"` prüfen.

  ### Gut zu wissen
  - **Nicht gefunden = leere Liste:** Gibt es den Eintrag nicht, kommt kein Fehler, sondern `"data": []`.
  - **`nr` muss mitgeschickt werden**, sonst kommt eine Fehlermeldung.
  - **Nicht abrufbar** sind hier: `dauer`.

  <details><summary>Für Entwickler</summary>

  - Controller: `TDataModulToupac.getT_LeistungById` in `Shared/DataModuls/DataModulToupacClass.pas`
  - Tabelle: `T_LEISTUNG`, Schlüssel `nr`
  - Umsetzung: generische Methode `DoSelectOne` der Basisklasse `TDataModulTableBase`
  - Der Server wertet die HTTP-Methode nicht aus – GET und POST funktionieren gleich.

  </details>
