info:
  name: GET /toupac/getf_fahrtauftragkey – naechste Fahrtauftrag-Nr
  type: http
  seq: 8

http:
  method: GET
  url: "{{baseURL}}/toupac/getf_fahrtauftragkey"
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Liefert eine neue, eindeutige `nr` fuer einen neuen F_FAHRTAUFTRAG-Datensatz. Keine generische Do*-Methode, sondern eigene Query: `SELECT GEN_ID(F_FAHRTAUFTRAG_NR_GEN,1) AS nr FROM RDB$DATABASE` (der Generator wird bei jedem Aufruf um 1 erhoeht).

  **Tabelle:** F_FAHRTAUFTRAG

  **Key-Feld:** `nr`

  **Body:** kein Body erforderlich.

  **Auth:** erforderlich (Bearer Token)

  **LocalOnly:** nein

  **Antwort:** `{ "header": { "nr": "ftinteger" }, "data": [ { "nr": <neue Nummer> } ] }`
