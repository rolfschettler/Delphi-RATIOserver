info:
  name: POST /toupac/deletet_reisedetail – Reisedetail loeschen
  type: http
  seq: 75

http:
  method: POST
  url: "{{baseURL}}/toupac/deletet_reisedetail"
  body:
    type: json
    data: |-
      {
        "nr": 42
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
