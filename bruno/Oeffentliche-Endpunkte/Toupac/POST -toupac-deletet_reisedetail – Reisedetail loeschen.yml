docs: |-
  Loescht einen Datensatz aus T_REISEDETAIL anhand des Primaerschluessels `nr`. Ruft intern `DoDelete('T_REISEDETAIL', 'nr')` auf.

  **Tabelle:** T_REISEDETAIL

  **Key-Feld:** `nr` (Pflicht im Body)

  **Body:** `{ "nr": <wert> }`

  **Auth:** erforderlich (Bearer Token)

  **LocalOnly:** nein

  **Antwort:** `{"status":"OK"}`
