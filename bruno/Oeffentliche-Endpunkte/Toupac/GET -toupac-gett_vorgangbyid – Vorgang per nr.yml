info:
  name: GET /toupac/gett_vorgangbyid – Vorgang per nr
  type: http
  seq: 14

http:
  method: GET
  url: "{{baseURL}}/toupac/gett_vorgangbyid"
  body:
    type: json
    data: |-
      {
        "nr": 42,
        "fields": "*"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  **Vorgang per nr.** Liefert genau einen Eintrag aus `T_VORGANG`, gesucht über `nr`.

  | | |
  |---|---|
  | **Aufruf** | `GET {{baseURL}}/toupac/gett_vorgangbyid` |
  | **Anmeldung** | nötig – Token aus `/login` (wird in Bruno automatisch mitgeschickt) |
  | **Berechtigung** | Der Benutzer braucht diesen Endpunkt in seinen Rollen (sonst Fehler 403) |

  ### Was du mitschickst
  | Parameter | Wert | Pflicht | Bedeutung |
  |---|---|---|---|
  | `nr` | Ganzzahl | **ja** | Der gesuchte Eintrag. |
  | `fields` | `"*"` oder Liste | nein | Welche Felder zurückkommen sollen. Weglassen = alle. |

  ### Verfügbare Felder
