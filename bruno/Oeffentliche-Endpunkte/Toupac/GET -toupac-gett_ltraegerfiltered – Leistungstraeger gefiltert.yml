info:
  name: GET /toupac/gett_ltraegerfiltered – Leistungstraeger gefiltert
  type: http
  seq: 30

http:
  method: GET
  url: "{{baseURL}}/toupac/gett_ltraegerfiltered"
  body:
    type: json
    data: |-
      {
        "fields": "*",
        "land": "Spanien",
        "gesperrt": "N",
        "orderby": "nr"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Liefert Datensaetze aus T_LTRAEGER, optional gefiltert. Jeder im Body gesetzte (nicht-null) Filter-Parameter erzeugt eine AND-verknuepfte WHERE-Bedingung `feld = :feld`; ohne Filter werden alle Datensaetze geliefert. Ruft intern `DoSelectFilteredDynamic('T_LTRAEGER', ALLOWED, CONDITIONS, FILTER_PARAMS)` auf.

  **Tabelle:** T_LTRAEGER

  **Erlaubte Felder (ALLOWED):** nr, kennziffer, code, bezeichnung, land, ort, typ, sachkonto, kostelle1, kostelle2, optionstage, klasse, stornostaffel, suchbegriff, kategorie, waehrung, gesperrt, bemerkung_intern

  **Filter (FILTER_PARAMS, alle optional):** nr, kennziffer, code, bezeichnung, land, ort, typ, sachkonto, kostelle1, kostelle2, optionstage, klasse, stornostaffel, suchbegriff, waehrung, gesperrt, bemerkung_intern (nicht filterbar: kategorie)

  **Body:** `{ "fields": [...] | "*", "<filterfeld>": <wert>, ..., "orderby": "<feld aus ALLOWED>", "limit": 10, "offset": 0 }` -- ein gueltiges JSON-Objekt im Body ist Pflicht (sonst Fehler "Kein gueltiges JSON im Request-Body").

  **Auth:** erforderlich (Bearer Token)

  **LocalOnly:** nein

  **Antwort:** ohne `limit` `{ "header": { "<feld>": "<typ>", ... }, "data": [ { ... }, ... ] }` (Serialisierung per `SerializeQuery`, Feldnamen klein geschrieben); mit `limit` `{ "total":N, "limit":N, "offset":N, "data": { "header": {...}, "data": [...] } }`.
