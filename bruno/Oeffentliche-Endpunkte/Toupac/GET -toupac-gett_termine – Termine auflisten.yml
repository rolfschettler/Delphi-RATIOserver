info:
  name: GET /toupac/gett_termine – Termine auflisten
  type: http
  seq: 62

http:
  method: GET
  url: "{{baseURL}}/toupac/gett_termine"
  body:
    type: json
    data: |-
      {
        "fields": "*",
        "orderby": "von"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Listet Datensaetze aus T_TERMINE auf (ungefiltert). Ruft intern `DoSelect('T_TERMINE', ALLOWED)` auf.

  **Tabelle:** T_TERMINE

  **Erlaubte Felder (ALLOWED):** nr, katalogreisenr, von, bis, vw, vtage, bemerkung, storniert, gesperrt, sonderangebot, internet, sachkonto, kostelle1, kostelle2, minimumpers, maximumpers, provisionskonto, sachkontostorno, bemerkung_intern, abgesagt_am, schnittstelle_sendtime

  **Body (optional):** `{ "fields": [...] | "*", "orderby": "<feld aus ALLOWED>", "limit": 10, "offset": 0 }` (ohne `fields` bzw. mit `"*"` werden alle ALLOWED-Felder geliefert).

  **Auth:** erforderlich (Bearer Token)

  **LocalOnly:** nein

  **Antwort:** ohne `limit` `{ "header": { "<feld>": "<typ>", ... }, "data": [ { ... }, ... ] }` (Serialisierung per `SerializeQuery`, Feldnamen klein geschrieben); mit `limit` `{ "total":N, "limit":N, "offset":N, "data": { "header": {...}, "data": [...] } }`.
