info:
  name: POST /toupac/insertt_katalogreise – Katalogreise anlegen
  type: http
  seq: 40

http:
  method: POST
  url: "{{baseURL}}/toupac/insertt_katalogreise"
  body:
    type: json
    data: |-
      {
        "nr": 42,
        "reisenr": 7,
        "reisethema": "Rundreise Andalusien",
        "code": "AND08",
        "katalognr": 2027,
        "internet": "J",
        "status": "aktiv",
        "maximumpers": 30,
        "minimumpers": 12,
        "veranstalter": "RATIO Reisen",
        "erstelltam": "2026-10-02",
        "erstelltvon": "hwiest"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Legt einen neuen Datensatz in T_KATALOGREISE an. Ruft intern `DoInsert('T_KATALOGREISE', ALLOWED)` auf; nur die in ALLOWED gelisteten Felder werden aus dem Body uebernommen, unbekannte Felder werden ignoriert, JSON `null` wird als NULL geschrieben. Die `nr` sollte vorher per `/toupac/gett_katalogreisekey` ermittelt werden.

  **Tabelle:** T_KATALOGREISE

  **Erlaubte Felder (ALLOWED):** nr, reisenr, reisethema, code, katalognr, terminschema, internet, befkategorie, sachkonto, sachkontostorno, sachkontoprov, kostelle1, kostelle2, kostelle1storno, kostelle2storno, kostelle1prov, kostelle2prov, erstelltam, fbrabatt, fbbis, angebot, status, url1, url2, url3, url4, xkoord, ykoord, maximumpers, minimumpers, bemerkung, kategorie, anzahlungsbetrag, anzahlungsart, nrkreis, stornostaffel, zusatzinfo, katalogseite, veranstalter, hauptkategorie, pauschalierungsfaktor, versicherungsart, geaendertam, geaendertvon, erstelltvon, untertitel, mandant

  **Key-Feld:** `nr` (wird wie ein normales Feld mitgeschrieben)

  **Body:** `{ "nr": <wert>, "<feld>": <wert>, ... }` (mindestens ein gueltiges Feld)

  **Auth:** erforderlich (Bearer Token)

  **LocalOnly:** nein

  **Antwort:** `{"status":"OK"}`
