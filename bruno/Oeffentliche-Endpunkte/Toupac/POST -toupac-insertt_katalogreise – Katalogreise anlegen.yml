info:
  name: POST /toupac/insertt_katalogreise – Katalogreise anlegen
  type: http
  seq: 40

http:
  method: POST
  url: "{{baseURL}}/toupac/insertt_katalogreise"
  body:
    type: json
    data: |-
      {
        "nr": 42,
        "reisenr": 42,
        "reisethema": "Rundreise Andalusien",
        "code": "AND08",
        "katalognr": 2027,
        "internet": "J",
        "status": "aktiv",
        "maximumpers": 30,
        "minimumpers": 12,
        "veranstalter": "RATIO Reisen",
