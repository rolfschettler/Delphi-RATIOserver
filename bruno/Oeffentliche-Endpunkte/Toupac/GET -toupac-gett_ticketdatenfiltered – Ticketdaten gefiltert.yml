info:
  name: GET /toupac/gett_ticketdatenfiltered – Ticketdaten gefiltert
  type: http
  seq: 27

http:
  method: GET
  url: "{{baseURL}}/toupac/gett_ticketdatenfiltered"
  body:
    type: json
    data: |-
      {
        "fields": "*",
        "reftable": "T_VORGANG",
        "refnr": 4711,
        "art": "Bahn",
        "orderby": "nr"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Liefert Datensaetze aus T_TICKETDATEN, optional gefiltert. Jeder im Body gesetzte (nicht-null) Filter-Parameter erzeugt eine AND-verknuepfte WHERE-Bedingung `feld = :feld`; ohne Filter werden alle Datensaetze geliefert. Ruft intern `DoSelectFilteredDynamic('T_TICKETDATEN', ALLOWED, CONDITIONS, FILTER_PARAMS)` auf.

  **Tabelle:** T_TICKETDATEN

  **Erlaubte Felder (ALLOWED):** nr, gueltigvon, gueltigbis, daten, reftable, refnr, art, bezeichnung, datum1, datum2, datum3, datum4, wtag

  **Filter (FILTER_PARAMS, alle optional):** nr, reftable, refnr, art, bezeichnung, wtag

  **Body:** `{ "fields": [...] | "*", "<filterfeld>": <wert>, ..., "orderby": "<feld aus ALLOWED>", "limit": 10, "offset": 0 }` -- ein gueltiges JSON-Objekt im Body ist Pflicht (sonst Fehler "Kein gueltiges JSON im Request-Body").

  **Auth:** erforderlich (Bearer Token)

  **LocalOnly:** nein

  **Antwort:** ohne `limit` `{ "header": { "<feld>": "<typ>", ... }, "data": [ { ... }, ... ] }` (Serialisierung per `SerializeQuery`, Feldnamen klein geschrieben); mit `limit` `{ "total":N, "limit":N, "offset":N, "data": { "header": {...}, "data": [...] } }`.
