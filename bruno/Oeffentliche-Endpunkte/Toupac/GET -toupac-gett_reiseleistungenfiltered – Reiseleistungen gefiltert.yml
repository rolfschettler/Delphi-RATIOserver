info:
  name: GET /toupac/gett_reiseleistungenfiltered – Reiseleistungen gefiltert
  type: http
  seq: 49

http:
  method: GET
  url: "{{baseURL}}/toupac/gett_reiseleistungenfiltered"
  body:
    type: json
    data: |-
      {
        "fields": "*",
        "katalogreisenr": 42,
        "status": "aktiv",
        "orderby": "nr"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  **Reiseleistungen gefiltert.** Sucht Einträge in `T_REISELEISTUNGEN` – du gibst die Suchkriterien als Felder im Body mit.

  | | |
  |---|---|
  | **Aufruf** | `GET {{baseURL}}/toupac/gett_reiseleistungenfiltered` |
  | **Anmeldung** | nötig – Token aus `/login` (wird in Bruno automatisch mitgeschickt) |
  | **Berechtigung** | Der Benutzer braucht diesen Endpunkt in seinen Rollen (sonst Fehler 403) |

  ### Suchkriterien (Filter)
  **Alle Felder außer Blobfeldern und Passwortfeldern können als Filterparameter verwendet werden.** Hier nicht filterbar: `bemerkung`.

  So funktioniert die Suche:
  - Jedes mitgeschickte Feld ist ein Kriterium, z.B. `{"ort": "Berlin"}`.
  - **Mehrere Kriterien müssen alle zutreffen** (UND): `{"ort": "Berlin", "plz": "10115"}`.
  - **Der Wert muss genau stimmen** – keine Teilsuche, Groß-/Kleinschreibung zählt („berlin“ findet nicht „Berlin“).
  - Datum als `"2026-09-01"` oder mit Uhrzeit `"2026-09-01 08:00:00"`. Bei Feldern mit Uhrzeit findet ein reines Datum nur Einträge um 00:00 Uhr.
  - Ohne Kriterien kommen alle Einträge.

  ### Weitere Angaben (optional)
  | Parameter | Wert | Pflicht | Bedeutung |
  |---|---|---|---|
  | `fields` | `"*"` oder Liste, z.B. `["nr","bezeichnung"]` | nein | Welche Felder zurückkommen sollen. `"*"` oder weglassen = alle Felder aus der Liste unten. |
  | `orderby` | Feldname | nein | Sortierung nach genau einem Feld, aufsteigend. |
  | `limit` | Zahl | nein | Höchstens so viele Datensätze liefern (zum Blättern). Weglassen = alle. |
  | `offset` | Zahl | nein | So viele Datensätze überspringen (nur zusammen mit `limit`). Beispiel: `limit` 20 und `offset` 40 = Seite 3. |

  ### Verfügbare Felder (für `fields` und `orderby`)
  | Feld | Typ |
  |---|---|
  | `nr` | Ganzzahl |
  | `katalogreisenr` | Ganzzahl |
  | `leistungnr` | Ganzzahl |
  | `rabatterlaubt` | Text (max. 4 Zeichen) |
  | `standard` | Text (max. 4 Zeichen) |
  | `leistungsgeber` | Ganzzahl |
  | `code` | Text (max. 120 Zeichen) |
  | `geraet` | Ganzzahl |
  | `von` | Datum/Uhrzeit |
  | `bis` | Datum/Uhrzeit |
  | `internet` | Text (max. 4 Zeichen) |
  | `vontag` | Ganzzahl |
  | `bistag` | Ganzzahl |
  | `zeitvon` | Text (max. 5 Zeichen) |
  | `zeitbis` | Text (max. 5 Zeichen) |
  | `bemerkung` | Langtext/Datei |
  | `params` | Text (max. 40 Zeichen) |
  | `status` | Ganzzahl |
  | `inklusiv` | Ganzzahl |
  | `leistungsgruppe` | Ganzzahl |
  | `preisoption` | Ganzzahl |
  | `marge` | Kommazahl |
  | `adresskennziffer` | Ganzzahl |
  | `vontagref` | Text (max. 1 Zeichen) |
  | `rundungsoption` | Ganzzahl |
  | `sortierung` | Ganzzahl |
  | `ek_tats` | Kommazahl |
  | `ek_kalk` | Kommazahl |
  | `freiplatz_lt` | Ganzzahl |
  | `freiplatz_kunde` | Ganzzahl |
  | `gesperrt` | Text (max. 4 Zeichen) |
  | `kopiertaus` | Ganzzahl |
  | `ek_kalk1` | Kommazahl |
  | `ek_kalk2` | Kommazahl |
  | `ek_kalk3` | Kommazahl |
  | `ek_kalk4` | Kommazahl |
  | `bezeichnung2` | Text (max. 200 Zeichen) |
  | `provklasse` | Ganzzahl |
  | `referenz1` | Text (max. 60 Zeichen) |
  | `referenz2` | Text (max. 60 Zeichen) |
  | `preis_steuerfrei` | Kommazahl |
  | `sachkonto_steuerfrei` | Text (max. 12 Zeichen) |
  | `onlinebuchung` | Text (max. 4 Zeichen) |
  | `app` | Text (max. 4 Zeichen) |
  | `termin` | Datum/Uhrzeit |
  | `optionsdatum` | Datum/Uhrzeit |
  | `referenz3` | Text (max. 60 Zeichen) |
  | `referenz4` | Text (max. 60 Zeichen) |

  ### Was zurückkommt
  ```json
  {
    "header": {"nr": "ftinteger", ...},
    "data": [ {"nr": 42, "katalogreisenr": 42, "leistungnr": 42, ...} ]
  }
  ```
  `data` enthält die Datensätze, `header` nennt zu jedem Feld den technischen Typ. **Mit `limit`** sieht die Antwort so aus: `{"total": 123, "limit": 20, "offset": 0, "data": { "header": ..., "data": [...] }}` – `total` ist die Gesamtzahl aller Treffer.

  ### Was schiefgehen kann
  - **401** – nicht angemeldet oder Token abgelaufen → neu einloggen.
  - **403** – keine Berechtigung für diesen Endpunkt.
  - **Fehlermeldung im Text** (`{"status":"error","message":"..."}`), z.B. wenn ein Feldname in `fields` oder `orderby` nicht erlaubt ist. Achtung: Solche Fehler kommen teilweise mit HTTP-Status 200 – deshalb immer auf `"status": "error"` prüfen.

  ### Gut zu wissen
  - **Achtung bei Tippfehlern:** Ein falsch geschriebener Feldname wird einfach ignoriert – dann kommen *alle* Einträge statt der gesuchten.
  - Der Body muss mindestens `{}` sein, sonst kommt ein Fehler.
  - **Nicht abrufbar** (aber teils filterbar): `dauer`.

  <details><summary>Für Entwickler</summary>

  - Controller: `TDataModulToupac.getT_ReiseleistungenFiltered` in `Shared/DataModuls/DataModulToupacClass.pas`
  - Tabelle: `T_REISELEISTUNGEN`, Schlüssel `nr`
  - Umsetzung: generische Methode `DoSelectFilteredDynamic` der Basisklasse `TDataModulTableBase`; Filter über `CONDITIONS`/`FILTER_PARAMS`
  - Der Server wertet die HTTP-Methode nicht aus – GET und POST funktionieren gleich.

  </details>
