  ### Was zurückkommt
  ```json
  {"status": "OK"}
  ```

  ### Was schiefgehen kann
  - **401** – nicht angemeldet oder Token abgelaufen → neu einloggen.
  - **403** – keine Berechtigung für diesen Endpunkt.
  - **400** mit Fehlermeldung – die Datenbank lehnt die Daten ab, z.B. Text zu lang für das Feld oder Buchstaben in einem Zahlenfeld.
  - **Fehlermeldung mit Status 200** (`{"status":"error","message":"..."}`), z.B. wenn kein einziges gültiges Feld mitgeschickt wurde – deshalb immer auf `"status": "error"` prüfen.

  ### Gut zu wissen
  - **Die Nummer (`nr`) kannst du mitschicken** – eine freie Nummer liefert vorher der passende `…key`-Endpunkt. Lässt du sie weg, vergibt die Datenbank automatisch eine. Die Antwort enthält keine Nummer.
  - **Unbekannte Felder werden ohne Meldung ignoriert.** Ein Tippfehler im Feldnamen fällt also nicht auf – das Feld bleibt einfach leer.
  - **Nicht setzbar** sind hier: `logo`, `anrede`, `titel`, `name1`, `name2`, `namenszusatz`, `name3`, `strasse`, `land`, `plz`, `ort`, `telefon`, `email`, `registrierung_nr`, `gastbuchung`.

  <details><summary>Für Entwickler</summary>

  - Controller: `TDataModulToupac.insertT_Vorgang` in `Shared/DataModuls/DataModulToupacClass.pas`
  - Tabelle: `T_VORGANG`, Schlüssel `nr`
  - Umsetzung: generische Methode `DoInsert` der Basisklasse `TDataModulTableBase`
  - Der Server wertet die HTTP-Methode nicht aus – GET und POST funktionieren gleich.

  </details>
