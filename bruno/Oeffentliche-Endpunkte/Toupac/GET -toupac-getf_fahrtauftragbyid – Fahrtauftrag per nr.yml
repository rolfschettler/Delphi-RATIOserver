info:
  name: GET /toupac/getf_fahrtauftragbyid – Fahrtauftrag per nr
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseURL}}/toupac/getf_fahrtauftragbyid"
  body:
    type: json
    data: |-
      {
        "nr": 42,
        "fields": "*"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  **Fahrtauftrag per nr.** Liefert genau einen Eintrag aus `F_FAHRTAUFTRAG`, gesucht über `nr`.

  | | |
  |---|---|
  | **Aufruf** | `GET {{baseURL}}/toupac/getf_fahrtauftragbyid` |
  | **Anmeldung** | nötig – Token aus `/login` (wird in Bruno automatisch mitgeschickt) |
  | **Berechtigung** | Der Benutzer braucht diesen Endpunkt in seinen Rollen (sonst Fehler 403) |

  ### Was du mitschickst
  | Parameter | Wert | Pflicht | Bedeutung |
  |---|---|---|---|
  | `nr` | Ganzzahl | **ja** | Der gesuchte Eintrag. |
  | `fields` | `"*"` oder Liste | nein | Welche Felder zurückkommen sollen. Weglassen = alle. |

  ### Verfügbare Felder
  | Feld | Typ |
  |---|---|
  | `nr` | Ganzzahl |
  | `fahrtnr` | Text (max. 20 Zeichen) |
  | `einsatznr` | Ganzzahl |
  | `fahrtabrechnungsnr` | Ganzzahl |
  | `fahrtenbuchnr` | Ganzzahl |
  | `auftragsart` | Text (max. 40 Zeichen) |
  | `personenzahl` | Ganzzahl |
  | `fahrzeugprofil` | Langtext/Datei |
  | `fahrerprofil` | Langtext/Datei |
  | `status` | Ganzzahl |
  | `filiale` | Text (max. 10 Zeichen) |
  | `gedruckt` | Text (max. 4 Zeichen) |
  | `erledigt` | Text (max. 4 Zeichen) |
  | `angelegt_am` | Datum/Uhrzeit |
  | `geaendert_am` | Datum/Uhrzeit |
  | `erstelltvon` | Text (max. 20 Zeichen) |
  | `geaendertvon` | Text (max. 20 Zeichen) |
  | `zusatzinfo` | Langtext/Datei |
  | `fahrtenplan` | Langtext/Datei |
  | `reftable` | Text (max. 80 Zeichen) |
  | `refnr` | Ganzzahl |

  ### Was zurückkommt
  ```json
  {"header": {...}, "data": [ {"nr": 42, "fahrtnr": "Text", "einsatznr": 42, ...} ]}
  ```

  ### Was schiefgehen kann
  - **401** – nicht angemeldet oder Token abgelaufen → neu einloggen.
  - **403** – keine Berechtigung für diesen Endpunkt.
  - **Fehlermeldung im Text** (`{"status":"error","message":"..."}`), z.B. wenn ein Feldname in `fields` oder `orderby` nicht erlaubt ist. Achtung: Solche Fehler kommen teilweise mit HTTP-Status 200 – deshalb immer auf `"status": "error"` prüfen.

  ### Gut zu wissen
  - **Nicht gefunden = leere Liste:** Gibt es den Eintrag nicht, kommt kein Fehler, sondern `"data": []`.
  - **`nr` muss mitgeschickt werden**, sonst kommt eine Fehlermeldung.
  - **Nicht abrufbar** sind hier: `logo`.

  <details><summary>Für Entwickler</summary>

  - Controller: `TDataModulToupac.getF_FahrtauftragById` in `Shared/DataModuls/DataModulToupacClass.pas`
  - Tabelle: `F_FAHRTAUFTRAG`, Schlüssel `nr`
  - Umsetzung: generische Methode `DoSelectOne` der Basisklasse `TDataModulTableBase`
  - Der Server wertet die HTTP-Methode nicht aus – GET und POST funktionieren gleich.

  </details>
