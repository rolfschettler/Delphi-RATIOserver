info:
  name: POST /toupac/insertt_reiseleistungen – Reiseleistung anlegen
  type: http
  seq: 52

http:
  method: POST
  url: "{{baseURL}}/toupac/insertt_reiseleistungen"
  body:
    type: json
    data: |-
      {
        "nr": 42,
        "katalogreisenr": 42,
        "leistungnr": 17,
        "code": "DZHP",
        "von": "2027-05-01",
        "bis": "2027-05-08",
        "vontag": 1,
        "bistag": 8,
        "inklusiv": "J",
        "status": "aktiv",
        "sortierung": 10,
        "ek_kalk": 450.00
