info:
  name: POST /toupac/updatet_reise – Reise aktualisieren
  type: http
  seq: 47

http:
  method: POST
  url: "{{baseURL}}/toupac/updatet_reise"
  body:
    type: json
    data: |-
      {
        "nr": 42,
        "bezeichnung": "Andalusien intensiv",
        "gesperrt": "N"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Aktualisiert einen bestehenden Datensatz in T_REISE anhand des Primaerschluessels `nr`. Ruft intern `DoUpdate('T_REISE', ALLOWED, 'nr')` auf; geschrieben werden nur die im Body enthaltenen ALLOWED-Felder, `nr` dient nur als WHERE-Schluessel und wird nicht geaendert.

  **Tabelle:** T_REISE

  **Erlaubte Felder (ALLOWED):** nr, bezeichnung, code, land, region, suchbegriff, gesperrt, kategorie

  **Key-Feld:** `nr` (Pflicht im Body)

  **Body:** `{ "nr": <wert>, "<feld>": <wert>, ... }` (mindestens ein Feld ausser `nr`)

  **Auth:** erforderlich (Bearer Token)

  **LocalOnly:** nein

  **Antwort:** `{"status":"OK"}`
