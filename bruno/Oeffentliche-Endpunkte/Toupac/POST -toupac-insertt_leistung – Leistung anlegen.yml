info:
  name: POST /toupac/insertt_leistung – Leistung anlegen
  type: http
  seq: 59

http:
  method: POST
  url: "{{baseURL}}/toupac/insertt_leistung"
  body:
    type: json
    data: |-
      {
        "nr": 42,
        "code": "DZHP",
        "ltraeger": 42,
        "bezeichnung": "Doppelzimmer Halbpension",
        "typ": "Hotel",
        "stornierbar": "J",
        "rabatterlaubt": "J",
        "capacity": 20,
        "maxcapacity": 25,
        "mincapacity": 1,
        "internet": "J",
        "optionstage": 14,
        "gesperrt": "N"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  **Leistung anlegen.** Legt einen neuen Eintrag in `T_LEISTUNG` an.

  | | |
  |---|---|
  | **Aufruf** | `POST {{baseURL}}/toupac/insertt_leistung` |
  | **Anmeldung** | nötig – Token aus `/login` (wird in Bruno automatisch mitgeschickt) |
  | **Berechtigung** | Der Benutzer braucht diesen Endpunkt in seinen Rollen (sonst Fehler 403) |

  ### Was du mitschickst
  Die gewünschten Felder als `"feld": wert`. Nicht mitgeschickte Felder bleiben leer, `null` macht ein Feld ausdrücklich leer.

  | Feld | Typ | Pflicht laut Datenbank |
  |---|---|---|
  | `nr` | Ganzzahl | ja |
  | `code` | Text (max. 20 Zeichen) |  |
  | `kontingentcode` | Text (max. 20 Zeichen) |  |
  | `ltraeger` | Ganzzahl |  |
  | `buchungsinfo` | Langtext/Datei |  |
  | `altervon` | Ganzzahl |  |
  | `alterbis` | Ganzzahl |  |
  | `preisvon` | Kommazahl |  |
  | `preisbis` | Kommazahl |  |
  | `dauerbis` | Ganzzahl |  |
  | `dauervon` | Ganzzahl |  |
  | `stornierbar` | Text (max. 4 Zeichen) |  |
  | `provklasse` | Ganzzahl |  |
  | `ustpflicht` | Text (max. 4 Zeichen) |  |
  | `zahlbarsofort` | Text (max. 4 Zeichen) |  |
  | `rabatterlaubt` | Text (max. 4 Zeichen) |  |
  | `typ` | Ganzzahl |  |
  | `subtyp` | Text (max. 4 Zeichen) |  |
  | `sachkonto` | Text (max. 12 Zeichen) |  |
  | `kostelle1` | Text (max. 12 Zeichen) |  |
  | `kostelle2` | Text (max. 12 Zeichen) |  |
  | `capacity` | Ganzzahl |  |
  | `maxcapacity` | Ganzzahl |  |
  | `mincapacity` | Ganzzahl |  |
  | `internet` | Text (max. 4 Zeichen) |  |
  | `suchbegriff` | Text (max. 200 Zeichen) |  |
  | `stornostaffel` | Ganzzahl |  |
  | `params` | Text (max. 40 Zeichen) |  |
  | `preisoption` | Ganzzahl |  |
  | `tarifcode` | Text (max. 254 Zeichen) |  |
  | `versicherungsart` | Text (max. 254 Zeichen) |  |
  | `onlinebuchung` | Text (max. 4 Zeichen) |  |
  | `kennziffer` | Ganzzahl |  |
  | `app` | Text (max. 4 Zeichen) |  |
  | `gesperrt` | Text (max. 4 Zeichen) |  |
  | `bezeichnung` | Text (max. 200 Zeichen) |  |
  | `optionstage` | Ganzzahl |  |

  ### Was zurückkommt
  ```json
  {"status": "OK"}
  ```

  ### Was schiefgehen kann
  - **401** – nicht angemeldet oder Token abgelaufen → neu einloggen.
  - **403** – keine Berechtigung für diesen Endpunkt.
  - **400** mit Fehlermeldung – die Datenbank lehnt die Daten ab, z.B. Text zu lang für das Feld oder Buchstaben in einem Zahlenfeld.
  - **Fehlermeldung mit Status 200** (`{"status":"error","message":"..."}`), z.B. wenn kein einziges gültiges Feld mitgeschickt wurde – deshalb immer auf `"status": "error"` prüfen.

  ### Gut zu wissen
  - **Die Nummer (`nr`) kannst du mitschicken** – eine freie Nummer liefert vorher der passende `…key`-Endpunkt. Lässt du sie weg, vergibt die Datenbank automatisch eine. Die Antwort enthält keine Nummer.
  - **Unbekannte Felder werden ohne Meldung ignoriert.** Ein Tippfehler im Feldnamen fällt also nicht auf – das Feld bleibt einfach leer.
  - **Nicht setzbar** sind hier: `dauer`.

  <details><summary>Für Entwickler</summary>

  - Controller: `TDataModulToupac.insertT_Leistung` in `Shared/DataModuls/DataModulToupacClass.pas`
  - Tabelle: `T_LEISTUNG`, Schlüssel `nr`
  - Umsetzung: generische Methode `DoInsert` der Basisklasse `TDataModulTableBase`
  - Der Server wertet die HTTP-Methode nicht aus – GET und POST funktionieren gleich.

  </details>
