info:
  name: GET /schuelerverkehr/getsv_teilnehmerfiltered – Teilnehmer filtern
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseURL}}/schuelerverkehr/getsv_teilnehmerfiltered"
  body:
    type: json
    data: |-
      {
        "fields": ["nr", "persnr", "vorname", "nachname", "ort", "einrichtungnr_fk"],
        "nachname": "Muster",
        "orderby": "nachname"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Implementierung: `DoSelectFilteredDynamic('SV_TEILNEHMER', ALLOWED, CONDITIONS, FILTER_PARAMS)`. Alle 60 ALLOWED-Felder sind zugleich Filterparameter (jeweils exakter Vergleich `feld = :feld`); jeder im Body gesetzte (nicht-null) Parameter erzeugt eine AND-verknüpfte WHERE-Bedingung, alle sind optional.

  **Filter-/ALLOWED-Felder (60):** identisch zu `/schuelerverkehr/getsv_teilnehmer` (siehe dort), z. B. `nachname`, `einrichtungnr_fk`, `kostentraeger_fk`, `tourbereich`, `inaktiv`.

  **Body:** `{"fields":[...]|"*","<feld>":<wert>,...,"orderby":"feld","limit":10,"offset":0}` – ein gültiges JSON-Objekt ist Pflicht (ggf. `{}`).

  **Hinweis:** Auch `pwd` ist als Filterparameter zugelassen (siehe Auffälligkeit in `/schuelerverkehr/getsv_teilnehmer`).

  **Auth:** erforderlich (Bearer Token). **LocalOnly:** nein.

  **Antwort:** ohne `limit` `{"header":{...},"data":[...]}`; mit `limit` `{"total":N,"limit":N,"offset":N,"data":{"header":{...},"data":[...]}}`.
