  | `hilfsmittel` | Text (max. 4 Zeichen) |
  | `hilfsmittelhinweis` | Text (max. 200 Zeichen) |
  | `sv_fahrzeugprofil` | Text (max. 40 Zeichen) |
  | `abrechnungstarif_fk` | Text (max. 10 Zeichen) |
