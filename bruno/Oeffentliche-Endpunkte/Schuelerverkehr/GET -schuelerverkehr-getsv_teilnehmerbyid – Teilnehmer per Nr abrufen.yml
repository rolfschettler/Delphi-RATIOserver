info:
  name: GET /schuelerverkehr/getsv_teilnehmerbyid – Teilnehmer per Nr abrufen
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseURL}}/schuelerverkehr/getsv_teilnehmerbyid"
  body:
    type: json
    data: |-
      {
        "nr": 42,
        "fields": ["nr", "persnr", "vorname", "nachname", "strasse", "plz", "ort", "einrichtungnr_fk", "haltepunktnr_fk"]
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  **Teilnehmer per Nr abrufen.** Liefert genau einen Eintrag aus `SV_TEILNEHMER`, gesucht über `nr`.

  | | |
  |---|---|
  | **Aufruf** | `GET {{baseURL}}/schuelerverkehr/getsv_teilnehmerbyid` |
  | **Anmeldung** | nötig – Token aus `/login` (wird in Bruno automatisch mitgeschickt) |
  | **Berechtigung** | Der Benutzer braucht diesen Endpunkt in seinen Rollen (sonst Fehler 403) |

  ### Was du mitschickst
  | Parameter | Wert | Pflicht | Bedeutung |
  |---|---|---|---|
  | `nr` | Ganzzahl | **ja** | Der gesuchte Eintrag. |
  | `fields` | `"*"` oder Liste | nein | Welche Felder zurückkommen sollen. Weglassen = alle. |

  ### Verfügbare Felder
  | Feld | Typ |
  |---|---|
  | `nr` | Ganzzahl |
  | `persnr` | Text (max. 30 Zeichen) |
  | `los` | Text (max. 30 Zeichen) |
  | `einrichtungnr_fk` | Ganzzahl |
  | `kennziffer_fk` | Ganzzahl |
  | `kostentraeger_fk` | Ganzzahl |
  | `tourbereich` | Text (max. 30 Zeichen) |
  | `berufsverkehr` | Text (max. 4 Zeichen) |
  | `anrede` | Text (max. 20 Zeichen) |
  | `vorname` | Text (max. 30 Zeichen) |
  | `nachname` | Text (max. 30 Zeichen) |
  | `strasse` | Text (max. 50 Zeichen) |
  | `land` | Text (max. 15 Zeichen) |
  | `plz` | Text (max. 15 Zeichen) |
  | `ort` | Text (max. 30 Zeichen) |
  | `ortsteil` | Text (max. 60 Zeichen) |
  | `bezirk` | Text (max. 30 Zeichen) |
  | `email` | Text (max. 60 Zeichen) |
  | `xkoord` | Text (max. 20 Zeichen) |
  | `ykoord` | Text (max. 20 Zeichen) |
  | `haltepunktnr_fk` | Ganzzahl |
  | `ansprech1` | Text (max. 50 Zeichen) |
  | `ansprech1_tel` | Text (max. 30 Zeichen) |
  | `ansprech2` | Text (max. 50 Zeichen) |
  | `ansprech2_tel` | Text (max. 30 Zeichen) |
  | `hinweis` | Text (max. 200 Zeichen) |
  | `importhinweis1` | Text (max. 2000 Zeichen) |
  | `rolli` | Text (max. 4 Zeichen) |
  | `einzelbefoerderung` | Text (max. 4 Zeichen) |
  | `begleitperson` | Text (max. 4 Zeichen) |
  | `begleitpersonname` | Text (max. 50 Zeichen) |
  | `hilfsmittel` | Text (max. 4 Zeichen) |
  | `hilfsmittelhinweis` | Text (max. 200 Zeichen) |
  | `sv_fahrzeugprofil` | Text (max. 40 Zeichen) |
  | `abrechnungstarif_fk` | Text (max. 10 Zeichen) |
  | `gruppe` | Text (max. 10 Zeichen) |
  | `geburtstag` | Datum/Uhrzeit |
  | `geprueft` | Text (max. 4 Zeichen) |
  | `inaktiv` | Text (max. 4 Zeichen) |
  | `erfasstvon` | Text (max. 20 Zeichen) |
  | `erfasstam` | Datum/Uhrzeit |
  | `geaendertvon` | Text (max. 20 Zeichen) |
  | `geaendertam` | Datum/Uhrzeit |
  | `ansprech1_email` | Text (max. 60 Zeichen) |
  | `ansprech1_vorname` | Text (max. 30 Zeichen) |
  | `ansprech1_nachname` | Text (max. 30 Zeichen) |
  | `ansprech2_email` | Text (max. 60 Zeichen) |
  | `ansprech2_vorname` | Text (max. 30 Zeichen) |
  | `ansprech2_nachname` | Text (max. 30 Zeichen) |
  | `pushid` | Text (max. 255 Zeichen) |
  | `pwd` | Text (max. 255 Zeichen) |
  | `datumfeld1` | Datum/Uhrzeit |
  | `datumfeld2` | Datum/Uhrzeit |
  | `datumfeld3` | Datum/Uhrzeit |
  | `datumfeld4` | Datum/Uhrzeit |
  | `textfeld1` | Text (max. 50 Zeichen) |
  | `textfeld2` | Text (max. 50 Zeichen) |
  | `textfeld3` | Text (max. 50 Zeichen) |
  | `textfeld4` | Text (max. 50 Zeichen) |
  | `textfeld5` | Text (max. 50 Zeichen) |

  ### Was zurückkommt
  ```json
  {"header": {...}, "data": [ {"nr": 42, "persnr": "Text", "los": "Text", ...} ]}
  ```

  ### Was schiefgehen kann
  - **401** – nicht angemeldet oder Token abgelaufen → neu einloggen.
  - **403** – keine Berechtigung für diesen Endpunkt.
  - **Fehlermeldung im Text** (`{"status":"error","message":"..."}`), z.B. wenn ein Feldname in `fields` oder `orderby` nicht erlaubt ist. Achtung: Solche Fehler kommen teilweise mit HTTP-Status 200 – deshalb immer auf `"status": "error"` prüfen.

  ### Gut zu wissen
  - **Nicht gefunden = leere Liste:** Gibt es den Eintrag nicht, kommt kein Fehler, sondern `"data": []`.
  - **`nr` muss mitgeschickt werden**, sonst kommt eine Fehlermeldung.

  <details><summary>Für Entwickler</summary>

  - Controller: `TDataModulSchuelerverkehr.getSV_TeilnehmerById` in `Shared/DataModuls/DataModulSchuelerverkehrClass.pas`
  - Tabelle: `SV_TEILNEHMER`, Schlüssel `nr`
  - Umsetzung: generische Methode `DoSelectOne` der Basisklasse `TDataModulTableBase`
  - Der Server wertet die HTTP-Methode nicht aus – GET und POST funktionieren gleich.

  </details>
