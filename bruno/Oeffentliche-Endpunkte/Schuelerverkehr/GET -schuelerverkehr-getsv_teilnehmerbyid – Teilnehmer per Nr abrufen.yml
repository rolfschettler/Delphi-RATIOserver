info:
  name: GET /schuelerverkehr/getsv_teilnehmerbyid – Teilnehmer per Nr abrufen
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseURL}}/schuelerverkehr/getsv_teilnehmerbyid"
  body:
    type: json
    data: |-
      {
        "nr": 42,
        "fields": ["nr", "persnr", "vorname", "nachname", "strasse", "plz", "ort", "einrichtungnr_fk", "haltepunktnr_fk"]
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Liefert genau einen Datensatz aus SV_TEILNEHMER anhand des Primärschlüssels. Implementierung: `DoSelectOne('SV_TEILNEHMER', ALLOWED, 'nr')`.

  **Key-Feld:** `nr` (Pflicht im Body, sonst Fehler `"nr" fehlt im Request-Body.`).

  **Body:** `{"nr":<Teilnehmer-Nr>,"fields":[...]|"*"}`

  **Erlaubte Felder:** identisch zu `/schuelerverkehr/getsv_teilnehmer` (60 Felder inkl. `pwd`, siehe dort).

  **Auth:** erforderlich (Bearer Token). **LocalOnly:** nein.

  **Antwort:** `{"header":{...},"data":[{...}]}` – 0 oder 1 Datensatz.
