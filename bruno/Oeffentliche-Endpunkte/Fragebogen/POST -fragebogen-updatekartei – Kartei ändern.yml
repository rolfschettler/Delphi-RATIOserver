info:
  name: POST /fragebogen/updatekartei – Kartei ändern
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseURL}}/fragebogen/updatekartei"
  body:
    type: json
    data: |-
      {
        "id": {{karteiid}},
        "karteiname": "Anmeldung Klassenfahrt 2027",
        "beschreibung": "Geänderte Beschreibung"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  **Kartei ändern.** Ändert Name und/oder Beschreibung einer vorhandenen Kartei. Die Felder der Kartei bleiben unberührt.

  | | |
  |---|---|
  | **Aufruf** | `POST {{baseURL}}/fragebogen/updatekartei` |
  | **Anmeldung** | nötig – Token aus `/login` (wird in Bruno automatisch mitgeschickt) |
  | **Berechtigung** | Der Benutzer braucht diesen Endpunkt in seinen Rollen (sonst Fehler 403) |

  ### Was du mitschickst
  `id` plus mindestens eines der beiden anderen Felder. Was du nicht mitschickst, bleibt, wie es ist.

  | Parameter | Wert | Pflicht | Bedeutung |
  |---|---|---|---|
  | `id` | Ganzzahl über 0 | **ja** | Welche Kartei geändert wird. Die Nummer selbst ändert sich nicht. |
  | `karteiname` | Text (max. 80 Zeichen) | nein | Neuer Name. Wenn mitgeschickt, darf er nicht leer oder `null` sein. |
  | `beschreibung` | Text (max. 255 Zeichen) | nein | Neue Beschreibung. `null` löscht die Beschreibung. |

  In Bruno steht bei `id` die Variable `{{karteiid}}`. Bruno füllt sie automatisch, sobald du „Kartei anlegen“ ausgeführt hast. Für eine andere Kartei trägst du die Zahl einfach direkt ein.

  ### Was zurückkommt
  ```json
  {"status": "OK"}
  ```

  ### Was schiefgehen kann
  - **401** – nicht angemeldet oder Token abgelaufen → neu einloggen.
  - **403** – keine Berechtigung für diesen Endpunkt.
  - **400** mit `{"status":"ERROR","message":"\"id\" fehlt oder ist keine Zahl."}` – `id` fehlt, ist keine ganze Zahl oder nicht größer als 0.
  - **400** mit `{"status":"ERROR","message":"Name ist ein Pflichtfeld."}` – `karteiname` mitgeschickt, aber leer oder `null`.
  - **400** mit `{"status":"ERROR","message":"Der Name darf höchstens 80 Zeichen lang sein."}`
  - **400** mit `{"status":"ERROR","message":"Die Beschreibung darf höchstens 255 Zeichen lang sein."}`
  - **404** mit `{"status":"ERROR","message":"Kartei nicht gefunden."}`
  - **Fehlermeldung mit Status 200**: `{"status":"error","message":"Keine gueltigen Felder uebergeben."}` – weder `karteiname` noch `beschreibung` war dabei. Deshalb immer auf `"status"` prüfen.
  - **400** mit `{"status":"error","message":"..."}` – Fehler in der Datenbank.

  ### Gut zu wissen
  - **Leerzeichen am Rand bleiben hier erhalten** – anders als beim Anlegen. Die Längenprüfung zählt ohne diese Leerzeichen, gespeichert wird aber der Text genau so, wie du ihn schickst.
  - **Leere Beschreibung `""` wird als leerer Text gespeichert**, nicht als „keine Beschreibung“ (anders als beim Anlegen). Für „keine Beschreibung“ `null` schicken.
  - **Andere Felder im Body werden ohne Meldung ignoriert.**

  <details><summary>Für Entwickler</summary>

  - Controller: `TDataModulFragebogen.updateKartei` in `Shared/DataModuls/DataModulFragebogenClass.pas` – eigene Prüfungen, danach generisches `DoUpdate` der Basisklasse `TDataModulTableBase` (Spalten `KARTEI_SCHREIBEN`)
  - Tabelle: `FORM_KARTEI`, Schlüssel `id`
  - `DoUpdate` schreibt die Rohwerte aus dem Body (ungetrimmt, JSON-`null` = NULL) und läuft in einer Transaktion
  - Der Server wertet die HTTP-Methode nicht aus – GET und POST funktionieren gleich.

  </details>
