info:
  name: GET /adressen/getadrtochterfiltered – Adresstöchter gefiltert
  type: http
  seq: 32

http:
  method: GET
  url: "{{baseURL}}/adressen/getadrtochterfiltered"
  body:
    type: json
    data: |-
      {
        "fields": "*",
        "hauptadresse": 1,
        "orderby": "nr"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Listet Datensätze aus ADRTOCHTER gefiltert auf (generisches `DoSelectFilteredDynamic`).

  **Tabelle:** ADRTOCHTER

  **Erlaubte Felder (ALLOWED):** nr, hauptadresse, kennziffer, bemerkung

  **Filterparameter (alle optional, AND-verknüpft, je `feld = :feld`):** nr, hauptadresse, kennziffer, bemerkung – nur im Body vorhandene (nicht-null) Parameter erzeugen eine WHERE-Bedingung; ohne Filter werden alle Datensätze geliefert.

  **Body:** `{ "fields": [...] | "*", "nr": 1, "hauptadresse": 1, "kennziffer": 1, "bemerkung": "..." }` – zusätzlich `orderby` (ALLOWED-Feld), `limit`, `offset`. Der Body muss ein gültiges JSON-Objekt sein (mindestens `{}`), sonst Fehler.

  **Besonderheit:** `bemerkung` ist CHAR(60) (fixed char) – beim Filter wird exakt verglichen; InterBase füllt CHAR-Werte mit Leerzeichen auf, der Vergleich `=` ignoriert nachfolgende Leerzeichen.

  **Auth:** erforderlich (Bearer Token); zusätzlich Rollenprüfung gegen REGISTRIERUNG.ROLLEN (leer/Supervisor/passende Rolle oder Endpunkt, sonst 403)

  **LocalOnly:** nein (auch extern erreichbar)

  **Antwort:** ohne `limit` das Ergebnis von `SerializeQuery`: `{"header":{"feld":"typ",...},"data":[{...},...]}`; mit `limit` > 0 `{"total":N,"limit":N,"offset":N,"data":{"header":{...},"data":[...]}}`.
