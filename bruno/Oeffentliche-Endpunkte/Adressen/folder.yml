request:
  auth: inherit

docs:
  content: |-
    **Adressen verwalten:** Kunden- und Kontaktadressen auflisten, suchen, anlegen, ändern und löschen. Dazu gehören die Adress-Kategorien (Gruppen, nach denen Adressen eingeteilt werden) und Zusatzdatensätze, mit denen sich an beliebige Einträge zusätzliche Felder anhängen lassen.

    Außerdem lesend erreichbar: Adresstöchter, die Code-/Kürzeltabelle und zwei Konfigurationstabellen. Für die meisten Bereiche gibt es je einen Endpunkt zum Auflisten, zum gefilterten Suchen und zum Abruf eines einzelnen Eintrags.

    Alle Endpunkte brauchen eine Anmeldung (Token aus `/login`), und der Benutzer muss den jeweiligen Endpunkt in seinen Rollen haben (sonst Fehler 403).

    Technik: Controller `TDataModulAdressen` (`Shared/DataModuls/DataModulAdressenClass.pas`), Tabellen u.a. `ADRESSEN`, `ADRKATS`, `ZUSATZTABELLE`.
  type: text/markdown
