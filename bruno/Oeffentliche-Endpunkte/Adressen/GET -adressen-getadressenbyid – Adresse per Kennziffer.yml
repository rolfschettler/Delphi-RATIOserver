info:
  name: GET /adressen/getadressenbyid – Adresse per Kennziffer
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseURL}}/adressen/getadressenbyid"
  body:
    type: json
    data: |-
      {
        "kennziffer": 42,
        "fields": "*"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  **Adresse per Kennziffer.** Liefert genau einen Eintrag aus `ADRESSEN`, gesucht über `kennziffer`.

  | | |
  |---|---|
  | **Aufruf** | `GET {{baseURL}}/adressen/getadressenbyid` |
  | **Anmeldung** | nötig – Token aus `/login` (wird in Bruno automatisch mitgeschickt) |
  | **Berechtigung** | Der Benutzer braucht diesen Endpunkt in seinen Rollen (sonst Fehler 403) |

  ### Was du mitschickst
  | Parameter | Wert | Pflicht | Bedeutung |
  |---|---|---|---|
  | `kennziffer` | Ganzzahl | **ja** | Der gesuchte Eintrag. |
  | `fields` | `"*"` oder Liste | nein | Welche Felder zurückkommen sollen. Weglassen = alle. |

  ### Verfügbare Felder
  | Feld | Typ |
  |---|---|
  | `kennziffer` | Ganzzahl |
  | `gruppe` | Ganzzahl |
  | `anrede` | Text (max. 20 Zeichen) |
  | `titel` | Text (max. 20 Zeichen) |
  | `name1` | Text (max. 30 Zeichen) |
  | `name2` | Text (max. 30 Zeichen) |
  | `name3` | Text (max. 30 Zeichen) |
  | `namenszusatz` | Text (max. 60 Zeichen) |
  | `strasse` | Text (max. 30 Zeichen) |
  | `plz` | Text (max. 15 Zeichen) |
  | `ort` | Text (max. 30 Zeichen) |
  | `telefon1` | Text (max. 25 Zeichen) |
  | `email` | Text (max. 60 Zeichen) |

  ### Was zurückkommt
  ```json
  {"header": {...}, "data": [ {"kennziffer": 42, "gruppe": 42, "anrede": "Text", ...} ]}
  ```

  ### Was schiefgehen kann
  - **401** – nicht angemeldet oder Token abgelaufen → neu einloggen.
  - **403** – keine Berechtigung für diesen Endpunkt.
  - **Fehlermeldung im Text** (`{"status":"error","message":"..."}`), z.B. wenn ein Feldname in `fields` oder `orderby` nicht erlaubt ist. Achtung: Solche Fehler kommen teilweise mit HTTP-Status 200 – deshalb immer auf `"status": "error"` prüfen.

  ### Gut zu wissen
  - **Nicht gefunden = leere Liste:** Gibt es den Eintrag nicht, kommt kein Fehler, sondern `"data": []`.
  - **`kennziffer` muss mitgeschickt werden**, sonst kommt eine Fehlermeldung.
  - **Nicht abrufbar** sind hier: `code`, `land`, `ansprech`, `briefanrede`, `ntermin`, `lvorgang`, `lmailing`, `bearbeitet`, `kontostand`, `rabatt`, `skonto`, `provision1`, `provision2`, `provision3`, `zahltage`, `telefon2`, `fax`, `bemerkung`, `subadresse`, `substrasse`, `subland`, `subplz`, `subort`, `berechnung`, `mahnkennung`, `kreditlimit`, `sammelrechnung`, `kdnreigen`, `preisgruppe`, `betreuer`, `rechmpfaenger`, `skonto2`, `skonto3`, `zahltage2`, `zahltage3`, `ustid`, `ustpflichtig`, `kat1`, `kat2`, `kat3`, `kat4`, `kat5`, `kat6`, `kat7`, `kat8`, `kat9`, `kat10`, `kat11`, `kat12`, `rename`, `rename2`, `reland`, `replz`, `restrasse`, `reort`, `erfasst_am`, `datevkto`, `zahlungsart`, `zahlungper`, `matchcode`, `gebtag`, `gebmonat`, `gebjahr`, `geburtstag`, `zugriffe`, `adressenbaum`, `phonetic`, `vermittler`, `vertreter`, `status`, `gesperrt`, `bank`, `blz`, `ktonr`, `inet`, `textfeld1`, `textfeld2`, `textfeld3`, `textfeld4`, `textfeld5`, `textfeld6`, `textfeld7`, `textfeld8`, `datumfeld1`, `datumfeld2`, `hinweis`, `region`, `lzugriff`, `bearbeitetvon`, `lastlock`, `erfasst_von`, `geaendert_von`, `iban`, `swift`, `iban2`, `xkoord`, `ykoord`, `adrinfibu`, `kundenart`, `sammelkonto`, `passnummer`, `pass_gueltig_bis`, `pass_aussgestelltin`, `pass_aussgestelltam`, `pass_info`, `nation`, `uebertragung`, `kontoinhaber`, `iban3`, `strasse2`, `referenznr`, `geburtsort`, `freigabe`, `adresszeile1`, `adresszeile2`, `adresszeile3`, `ort2`, `newsletter`, `einverstaendnis__erhalten_am`, `namenszusatz2`, `dse_am`, `dse_per`, `textfeld9`, `textfeld10`, `textfeld11`, `textfeld12`, `textfeld13`, `textfeld14`, `textfeld15`, `textfeld16`, `textfeld17`, `textfeld18`, `datumfeld3`, `datumfeld4`, `anschrift`, `teilnehmerinfo1`, `teilnehmerinfo2`, `dsgvo1`, `dsgvo2`, `dsgvo3`, `dsgvo4`, `dsgvo5`, `dsgvo6`, `dsgvo_lock`, `dsgvo_letzte_pruefung`, `leitid`, `passid`, `versandart`, `kat13`, `kat14`, `kat15`, `kat16`, `kat17`, `kat18`, `kat19`, `kat20`, `kat21`, `kat22`, `kat23`, `kat24`