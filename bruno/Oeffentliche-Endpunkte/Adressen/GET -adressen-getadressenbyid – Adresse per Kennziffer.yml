info:
  name: GET /adressen/getadressenbyid – Adresse per Kennziffer
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseURL}}/adressen/getadressenbyid"
  body:
    type: json
    data: |-
      {
        "kennziffer": 42,
        "fields": "*"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Liefert genau einen Adressdatensatz aus ADRESSEN anhand des Primärschlüssels `kennziffer` (generisches `DoSelectOne`).

  **Tabelle:** ADRESSEN

  **Erlaubte Felder (ALLOWED):** kennziffer, gruppe, anrede, titel, name1, name2, strasse, plz, ort, telefon1, email

  **Hinweis:** `matchcode` und `lvorgang` sind hier – anders als bei `getadressen`/`getadressenfiltered` – NICHT erlaubt.

  **Key-Feld:** `kennziffer`

  **Body:** `{ "kennziffer": <wert>, "fields": [...] | "*" }` – kennziffer ist Pflicht.

  **Auth:** erforderlich (Bearer Token); zusätzlich Rollenprüfung gegen REGISTRIERUNG.ROLLEN (leer/Supervisor/passende Rolle oder Endpunkt, sonst 403)

  **LocalOnly:** nein (auch extern erreichbar)

  **Antwort:** `{"header":{"feld":"typ",...},"data":[{...}]}` – `data` enthält genau einen Datensatz bzw. ist leer, wenn zum Schlüssel kein Datensatz existiert.
