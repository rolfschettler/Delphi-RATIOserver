info:
  name: GET /adressen/getadressenkey – nächste Kennziffer ermitteln
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseURL}}/adressen/getadressenkey"
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  **Nächste Kennziffer ermitteln.** Reserviert die nächste freie Kennziffer (Adressnummer) und liefert sie zurück.

  | | |
  |---|---|
  | **Aufruf** | `GET {{baseURL}}/adressen/getadressenkey` |
  | **Anmeldung** | nötig – Token aus `/login` (wird in Bruno automatisch mitgeschickt) |
  | **Berechtigung** | Der Benutzer braucht diesen Endpunkt in seinen Rollen (sonst Fehler 403) |

  ### Was du mitschickst
  Nichts. URL-Parameter und Body werden nicht ausgewertet.

  ### Was zurückkommt
  ```json
  {"header": {"kennziffer": "ftinteger"}, "data": [{"kennziffer": 10263}]}
  ```
  Die neue Nummer steht in `data[0].kennziffer`.

  ### Was schiefgehen kann
  - **401** – nicht angemeldet oder Token abgelaufen → neu einloggen.
  - **403** – keine Berechtigung für diesen Endpunkt.
  - **400** mit Fehlermeldung – Datenbankfehler.

  ### Gut zu wissen
  - **Jeder Aufruf verbraucht eine Nummer.** Die Kennziffer wird sofort weitergezählt – auch wenn du sie danach nicht verwendest. Zwei Aufrufe liefern nie dieselbe Nummer; Lücken in der Nummerierung sind normal.
  - **Für das Anlegen einer Adresse brauchst du diesen Endpunkt nicht.** Beim Anlegen über `/adressen/insertadressen` vergibt die Datenbank die Kennziffer automatisch – aus demselben Zähler.
  - **Die geholte Nummer lässt sich beim Anlegen nicht mitgeben:** `/adressen/insertadressen` nimmt keine `kennziffer` an und ignoriert sie ohne Meldung. Die Adresse bekommt dann eine weitere neue Nummer, die hier geholte bleibt ungenutzt.

  <details><summary>Für Entwickler</summary>

  - Controller: `TDataModulAdressen.getNextKennziffer` in `Shared/DataModuls/DataModulAdressenClass.pas` (Route heißt `/adressen/getadressenkey`)
  - Abfrage `SELECT * FROM ADRESSEN_NEXTKENNZIFFER` – das ist eine Stored Procedure: `kennziffer = GEN_ID(ADRESSEN_KENNZIFFER_GEN, 1); suspend;`
  - Trigger `TI_ADRESSEN` setzt `KENNZIFFER = GEN_ID(ADRESSEN_KENNZIFFER_GEN, 1)`, wenn sie beim Insert NULL ist.
  - Auffälligkeit: `insertAdresse` hat `kennziffer` nicht in `ALLOWED` – ein vorab geholter Schlüssel kann dort nicht verwendet werden; der Endpunkt verbraucht also nur Nummern.
  - Der Server wertet die HTTP-Methode nicht aus – GET und POST funktionieren gleich.

  </details>
