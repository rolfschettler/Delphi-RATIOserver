info:
  name: POST /adressen/insertkategorie – Kategorie anlegen
  type: http
  seq: 16

http:
  method: POST
  url: "{{baseURL}}/adressen/insertkategorie"
  body:
    type: json
    data: |-
      {
        "gruppe": 1,
        "bezeichnung": "Kunden",
        "debitkredit": "D",
        "symbol": "K"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  **Kategorie anlegen.** Legt einen neuen Eintrag in `ADRKATS` an.

  | | |
  |---|---|
  | **Aufruf** | `POST {{baseURL}}/adressen/insertkategorie` |
  | **Anmeldung** | nötig – Token aus `/login` (wird in Bruno automatisch mitgeschickt) |
  | **Berechtigung** | Der Benutzer braucht diesen Endpunkt in seinen Rollen (sonst Fehler 403) |

  ### Was du mitschickst
  Die gewünschten Felder als `"feld": wert`. Nicht mitgeschickte Felder bleiben leer, `null` macht ein Feld ausdrücklich leer.

  | Feld | Typ | Pflicht laut Datenbank |
  |---|---|---|
  | `gruppe` | Ganzzahl | ja |
  | `kat1` | Text (max. 20 Zeichen) |  |
  | `kat2` | Text (max. 20 Zeichen) |  |
  | `kat3` | Text (max. 20 Zeichen) |  |
  | `kat4` | Text (max. 20 Zeichen) |  |
  | `kat5` | Text (max. 20 Zeichen) |  |
  | `kat6` | Text (max. 20 Zeichen) |  |
  | `kat7` | Text (max. 20 Zeichen) |  |
  | `kat8` | Text (max. 20 Zeichen) |  |
  | `kat9` | Text (max. 20 Zeichen) |  |
  | `kat10` | Text (max. 20 Zeichen) |  |
  | `kat11` | Text (max. 20 Zeichen) |  |
  | `kat12` | Text (max. 20 Zeichen) |  |
  | `bezeichnung` | Text (max. 20 Zeichen) |  |
  | `debitkredit` | Text (max. 1 Zeichen) |  |
  | `symbol` | Ganzzahl |  |
  | `kat13` | Text (max. 20 Zeichen) |  |
  | `kat14` | Text (max. 20 Zeichen) |  |
  | `kat15` | Text (max. 20 Zeichen) |  |
  | `kat16` | Text (max. 20 Zeichen) |  |
  | `kat17` | Text (max. 20 Zeichen) |  |
  | `kat18` | Text (max. 20 Zeichen) |  |
  | `kat19` | Text (max. 20 Zeichen) |  |
  | `kat20` | Text (max. 20 Zeichen) |  |
  | `kat21` | Text (max. 20 Zeichen) |  |
  | `kat22` | Text (max. 20 Zeichen) |  |
  | `kat23` | Text (max. 20 Zeichen) |  |
  | `kat24` | Text (max. 20 Zeichen) |  |

  ### Was zurückkommt
  ```json
  {"status": "OK"}
  ```

  ### Was schiefgehen kann
  - **401** – nicht angemeldet oder Token abgelaufen → neu einloggen.
  - **403** – keine Berechtigung für diesen Endpunkt.
  - **400** mit Fehlermeldung – die Datenbank lehnt die Daten ab, z.B. Text zu lang für das Feld oder Buchstaben in einem Zahlenfeld.
  - **Fehlermeldung mit Status 200** (`{"status":"error","message":"..."}`), z.B. wenn kein einziges gültiges Feld mitgeschickt wurde – deshalb immer auf `"status": "error"` prüfen.

  ### Gut zu wissen
  - **Die Nummer (`gruppe`) kannst du mitschicken** – eine freie Nummer liefert vorher der passende `…key`-Endpunkt. Lässt du sie weg, vergibt die Datenbank automatisch eine. Die Antwort enthält keine Nummer.
  - **Unbekannte Felder werden ohne Meldung ignoriert.** Ein Tippfehler im Feldnamen fällt also nicht auf – das Feld bleibt einfach leer.

  <details><summary>Für Entwickler</summary>

  - Controller: `TDataModulAdressen.insertKategorie` in `Shared/DataModuls/DataModulAdressenClass.pas`
  - Tabelle: `ADRKATS`, Schlüssel `gruppe`
  - Umsetzung: generische Methode `DoInsert` der Basisklasse `TDataModulTableBase`
  - Der Server wertet die HTTP-Methode nicht aus – GET und POST funktionieren gleich.

  </details>
