info:
  name: POST /adressen/updatezusatztabelle – Zusatzdatensatz ändern
  type: http
  seq: 20

http:
  method: POST
  url: "{{baseURL}}/adressen/updatezusatztabelle"
  body:
    type: json
    data: |-
      {
        "nr": 42,
        "bemerkung": "Aktualisierter Kommentar",
        "bereich": "Kontakt"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  **Zusatzdatensatz ändern.** Ändert einen vorhandenen Eintrag in `ZUSATZTABELLE`. Gefunden wird er über `nr`.

  | | |
  |---|---|
  | **Aufruf** | `POST {{baseURL}}/adressen/updatezusatztabelle` |
  | **Anmeldung** | nötig – Token aus `/login` (wird in Bruno automatisch mitgeschickt) |
  | **Berechtigung** | Der Benutzer braucht diesen Endpunkt in seinen Rollen (sonst Fehler 403) |

  ### Was du mitschickst
  | Parameter | Wert | Pflicht | Bedeutung |
  |---|---|---|---|
  | `nr` | Ganzzahl | **ja** | Welcher Eintrag geändert wird. |
  | weitere Felder | siehe Liste | mind. eins | Nur die mitgeschickten Felder werden geändert. `null` macht ein Feld leer. |

  ### Änderbare Felder
  | Feld | Typ |
  |---|---|
  | `reftable` | Text (max. 80 Zeichen) |
  | `refnr` | Ganzzahl |
  | `modul` | Text (max. 80 Zeichen) |
  | `bereich` | Text (max. 80 Zeichen) |
  | `zusatzfeld1` | Text (max. 255 Zeichen) |
  | `zusatzfeld2` | Text (max. 255 Zeichen) |
  | `zusatzfeld3` | Text (max. 255 Zeichen) |
  | `zusatzfeld4` | Text (max. 255 Zeichen) |
  | `zusatzfeld5` | Text (max. 255 Zeichen) |
  | `zusatzfeld6` | Text (max. 255 Zeichen) |
  | `zusatzfeld7` | Text (max. 255 Zeichen) |
  | `zusatzfeld8` | Text (max. 255 Zeichen) |
  | `zusatzfeld9` | Text (max. 255 Zeichen) |
  | `zusatzfeld10` | Text (max. 255 Zeichen) |
  | `zusatzdatum1` | Datum/Uhrzeit |
  | `zusatzdatum2` | Datum/Uhrzeit |
  | `zusatzdatum3` | Datum/Uhrzeit |
  | `zusatzzahl1` | Ganzzahl |
  | `zusatzzahl2` | Ganzzahl |
  | `zusatzzahl3` | Ganzzahl |
  | `zusatznum1` | Kommazahl |
  | `zusatznum2` | Kommazahl |
  | `zusatznum3` | Kommazahl |
  | `zusatzblob1` | Langtext/Datei |
  | `zusatzblob2` | Langtext/Datei |
  | `zusatzblob3` | Langtext/Datei |
  | `erstellt` | Datum/Uhrzeit |
  | `geaendert` | Datum/Uhrzeit |
  | `erfasstvon` | Text (max. 80 Zeichen) |
  | `geaendertvon` | Text (max. 80 Zeichen) |
  | `kennziffer` | Ganzzahl |
  | `sortierung` | Ganzzahl |
  | `bemerkung` | Text (max. 255 Zeichen) |

  ### Was zurückkommt
  ```json
  {"status": "OK"}
  ```

  ### Was schiefgehen kann
  - **401** – nicht angemeldet oder Token abgelaufen → neu einloggen.
  - **403** – keine Berechtigung für diesen Endpunkt.
  - **400** mit Fehlermeldung – die Datenbank lehnt die Daten ab, z.B. Text zu lang für das Feld oder Buchstaben in einem Zahlenfeld.
  - **Fehlermeldung mit Status 200** (`{"status":"error","message":"..."}`), z.B. wenn kein einziges gültiges Feld mitgeschickt wurde – deshalb immer auf `"status": "error"` prüfen.

  ### Gut zu wissen
  - **Nur mitgeschickte Felder werden geändert**, alle anderen bleiben, wie sie sind.
  - **Keine Meldung, wenn es den Eintrag nicht gibt:** Auch bei einem falschen oder fehlenden `nr` kommt `{"status": "OK"}` – geändert wurde dann aber nichts.
  - `nr` selbst lässt sich hier nicht ändern.
  - **Unbekannte Felder werden ohne Meldung ignoriert** – ein Tippfehler im Feldnamen fällt also nicht auf.

  <details><summary>Für Entwickler</summary>

  - Controller: `TDataModulAdressen.updateZusatztabelle` in `Shared/DataModuls/DataModulAdressenClass.pas`
  - Tabelle: `ZUSATZTABELLE`, Schlüssel `nr`
  - Umsetzung: generische Methode `DoUpdate` der Basisklasse `TDataModulTableBase`
  - Der Server wertet die HTTP-Methode nicht aus – GET und POST funktionieren gleich.

  </details>
