info:
  name: GET /adressen/getkategoriebyid – Kategorie per Gruppe
  type: http
  seq: 9

http:
  method: GET
  url: "{{baseURL}}/adressen/getkategoriebyid"
  body:
    type: json
    data: |-
      {
        "gruppe": 1,
        "fields": "*"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  **Kategorie per Gruppe.** Liefert genau einen Eintrag aus `ADRKATS`, gesucht über `gruppe`.

  | | |
  |---|---|
  | **Aufruf** | `GET {{baseURL}}/adressen/getkategoriebyid` |
  | **Anmeldung** | nötig – Token aus `/login` (wird in Bruno automatisch mitgeschickt) |
  | **Berechtigung** | Der Benutzer braucht diesen Endpunkt in seinen Rollen (sonst Fehler 403) |

  ### Was du mitschickst
  | Parameter | Wert | Pflicht | Bedeutung |
  |---|---|---|---|
  | `gruppe` | Ganzzahl | **ja** | Der gesuchte Eintrag. |
  | `fields` | `"*"` oder Liste | nein | Welche Felder zurückkommen sollen. Weglassen = alle. |

  ### Verfügbare Felder
  | Feld | Typ |
  |---|---|
  | `gruppe` | Ganzzahl |
  | `kat1` | Text (max. 20 Zeichen) |
  | `kat2` | Text (max. 20 Zeichen) |
  | `kat3` | Text (max. 20 Zeichen) |
  | `kat4` | Text (max. 20 Zeichen) |
  | `kat5` | Text (max. 20 Zeichen) |
  | `kat6` | Text (max. 20 Zeichen) |
  | `kat7` | Text (max. 20 Zeichen) |
  | `kat8` | Text (max. 20 Zeichen) |
  | `kat9` | Text (max. 20 Zeichen) |
  | `kat10` | Text (max. 20 Zeichen) |
  | `kat11` | Text (max. 20 Zeichen) |
  | `kat12` | Text (max. 20 Zeichen) |
  | `bezeichnung` | Text (max. 20 Zeichen) |
  | `debitkredit` | Text (max. 1 Zeichen) |
  | `symbol` | Ganzzahl |
  | `kat13` | Text (max. 20 Zeichen) |
  | `kat14` | Text (max. 20 Zeichen) |
  | `kat15` | Text (max. 20 Zeichen) |
  | `kat16` | Text (max. 20 Zeichen) |
  | `kat17` | Text (max. 20 Zeichen) |
  | `kat18` | Text (max. 20 Zeichen) |
  | `kat19` | Text (max. 20 Zeichen) |
  | `kat20` | Text (max. 20 Zeichen) |
  | `kat21` | Text (max. 20 Zeichen) |
  | `kat22` | Text (max. 20 Zeichen) |
  | `kat23` | Text (max. 20 Zeichen) |
  | `kat24` | Text (max. 20 Zeichen) |

  ### Was zurückkommt
  ```json
  {"header": {...}, "data": [ {"gruppe": 42, "kat1": "Text", "kat2": "Text", ...} ]}
  ```

  ### Was schiefgehen kann
  - **401** – nicht angemeldet oder Token abgelaufen → neu einloggen.
  - **403** – keine Berechtigung für diesen Endpunkt.
  - **Fehlermeldung im Text** (`{"status":"error","message":"..."}`), z.B. wenn ein Feldname in `fields` oder `orderby` nicht erlaubt ist. Achtung: Solche Fehler kommen teilweise mit HTTP-Status 200 – deshalb immer auf `"status": "error"` prüfen.

  ### Gut zu wissen
  - **Nicht gefunden = leere Liste:** Gibt es den Eintrag nicht, kommt kein Fehler, sondern `"data": []`.
  - **`gruppe` muss mitgeschickt werden**, sonst kommt eine Fehlermeldung.

  <details><summary>Für Entwickler</summary>

  - Controller: `TDataModulAdressen.getKategorieById` in `Shared/DataModuls/DataModulAdressenClass.pas`
  - Tabelle: `ADRKATS`, Schlüssel `gruppe`
  - Umsetzung: generische Methode `DoSelectOne` der Basisklasse `TDataModulTableBase`
  - Der Server wertet die HTTP-Methode nicht aus – GET und POST funktionieren gleich.

  </details>
