info:
  name: GET /adressen/getkonfiguration – Konfigurationen auflisten
  type: http
  seq: 24

http:
  method: GET
  url: "{{baseURL}}/adressen/getkonfiguration"
  body:
    type: json
    data: |-
      {
        "fields": "*",
        "orderby": "name"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Listet Datensätze aus der Tabelle KONFIGURATION auf (generisches `DoSelect`, kein Filter).

  **Tabelle:** KONFIGURATION

  **Erlaubte Felder (ALLOWED):** nr, name, art, id, content, art2

  **Hinweis:** `content` ist ein BLOB-Feld und wird von `SerializeQuery` als Base64-String geliefert.

  **Body (optional):** `{ "fields": [...] | "*", "orderby": "feld", "limit": 10, "offset": 0 }` – ohne `fields` bzw. mit `"*"` werden alle ALLOWED-Felder geliefert; `orderby` muss ein ALLOWED-Feld sein. Ein leerer/fehlender Body ist erlaubt.

  **Auth:** erforderlich (Bearer Token); zusätzlich Rollenprüfung gegen REGISTRIERUNG.ROLLEN (leer/Supervisor/passende Rolle oder Endpunkt, sonst 403)

  **LocalOnly:** nein (auch extern erreichbar)

  **Antwort:** ohne `limit` das Ergebnis von `SerializeQuery`: `{"header":{"feld":"typ",...},"data":[{...},...]}`; mit `limit` > 0 `{"total":N,"limit":N,"offset":N,"data":{"header":{...},"data":[...]}}`.
