info:
  name: POST /adressen/deletekategorie – Kategorie löschen
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseURL}}/adressen/deletekategorie"
  body:
    type: json
    data: |-
      {
        "gruppe": 1
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  **Kategorie löschen.** Löscht einen Eintrag aus `ADRKATS` endgültig.

  | | |
  |---|---|
  | **Aufruf** | `POST {{baseURL}}/adressen/deletekategorie` |
  | **Anmeldung** | nötig – Token aus `/login` (wird in Bruno automatisch mitgeschickt) |
  | **Berechtigung** | Der Benutzer braucht diesen Endpunkt in seinen Rollen (sonst Fehler 403) |

  ### Was du mitschickst
  | Parameter | Wert | Pflicht | Bedeutung |
  |---|---|---|---|
  | `gruppe` | Ganzzahl | **ja** | Welcher Eintrag gelöscht wird. |

  ### Was zurückkommt
  ```json
  {"status": "OK"}
  ```

  ### Was schiefgehen kann
  - **401** – nicht angemeldet oder Token abgelaufen → neu einloggen.
  - **403** – keine Berechtigung für diesen Endpunkt.
  - **400** mit Fehlermeldung – die Datenbank lehnt die Daten ab, z.B. weil noch andere Daten auf diesen Eintrag verweisen.
  - **Fehlermeldung mit Status 200** (`{"status":"error","message":"..."}`), z.B. wenn `gruppe` fehlt – deshalb immer auf `"status": "error"` prüfen.

  ### Gut zu wissen
  - **Endgültig:** Es gibt keinen Papierkorb und kein Rückgängig.
  - **Keine Meldung, wenn es den Eintrag nicht gibt:** Auch dann kommt `{"status": "OK"}`.
  - **Löschen wird abgelehnt (Fehler 400)**, solange noch Einträge in `ADRESSEN` auf diesen Eintrag verweisen – diese zuerst löschen.

  <details><summary>Für Entwickler</summary>

  - Controller: `TDataModulAdressen.deleteKategorie` in `Shared/DataModuls/DataModulAdressenClass.pas`
  - Tabelle: `ADRKATS`, Schlüssel `gruppe`
  - Umsetzung: generische Methode `DoDelete` der Basisklasse `TDataModulTableBase`
  - Der Server wertet die HTTP-Methode nicht aus – GET und POST funktionieren gleich.

  </details>
