info:
  name: GET /adressen/getzusatztabelle – Zusatzdatensätze auflisten
  type: http
  seq: 11

http:
  method: GET
  url: "{{baseURL}}/adressen/getzusatztabelle"
  body:
    type: json
    data: |-
      {
        "fields": "*",
        "orderby": "nr"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Listet Datensätze aus der Tabelle ZUSATZTABELLE auf (generisches `DoSelect`, kein Filter). ZUSATZTABELLE hält generische Zusatzfelder, die per `reftable`/`refnr` an Datensätze beliebiger anderer Tabellen (z.B. ADRESSEN) angehängt werden.

  **Tabelle:** ZUSATZTABELLE

  **Erlaubte Felder (ALLOWED):** nr, reftable, refnr, modul, bereich, zusatzfeld1–zusatzfeld10, zusatzdatum1–zusatzdatum3, zusatzzahl1–zusatzzahl3, zusatznum1–zusatznum3, zusatzblob1–zusatzblob3, erstellt, geaendert, erfasstvon, geaendertvon, kennziffer, sortierung, bemerkung

  **Hinweis:** `zusatzblob1–3` sind BLOB-Felder und werden von `SerializeQuery` als Base64-String geliefert.

  **Body (optional):** `{ "fields": [...] | "*", "orderby": "feld", "limit": 10, "offset": 0 }` – ohne `fields` bzw. mit `"*"` werden alle ALLOWED-Felder geliefert; `orderby` muss ein ALLOWED-Feld sein. Ein leerer/fehlender Body ist erlaubt.

  **Auth:** erforderlich (Bearer Token); zusätzlich Rollenprüfung gegen REGISTRIERUNG.ROLLEN (leer/Supervisor/passende Rolle oder Endpunkt, sonst 403)

  **LocalOnly:** nein (auch extern erreichbar)

  **Antwort:** ohne `limit` das Ergebnis von `SerializeQuery`: `{"header":{"feld":"typ",...},"data":[{...},...]}`; mit `limit` > 0 `{"total":N,"limit":N,"offset":N,"data":{"header":{...},"data":[...]}}`.
