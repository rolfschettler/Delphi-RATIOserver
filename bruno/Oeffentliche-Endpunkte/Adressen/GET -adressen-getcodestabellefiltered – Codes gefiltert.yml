info:
  name: GET /adressen/getcodestabellefiltered – Codes gefiltert
  type: http
  seq: 23

http:
  method: GET
  url: "{{baseURL}}/adressen/getcodestabellefiltered"
  body:
    type: json
    data: |-
      {
        "fields": "*",
        "bereich": "ADRESSEN",
        "orderby": "bezeichnung"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Listet Datensätze aus CODESTABELLE gefiltert auf (generisches `DoSelectFilteredDynamic`).

  **Tabelle:** CODESTABELLE

  **Erlaubte Felder (ALLOWED):** nr, bezeichnung, code, bereich

  **Filterparameter (alle optional, AND-verknüpft, je `feld = :feld`):** nr, bezeichnung, code, bereich – nur im Body vorhandene (nicht-null) Parameter erzeugen eine WHERE-Bedingung; ohne Filter werden alle Datensätze geliefert.

  **Body:** `{ "fields": [...] | "*", "nr": 1, "bezeichnung": "...", "code": "...", "bereich": "..." }` – zusätzlich `orderby` (ALLOWED-Feld), `limit`, `offset`. Der Body muss ein gültiges JSON-Objekt sein (mindestens `{}`), sonst Fehler.

  **Auth:** erforderlich (Bearer Token); zusätzlich Rollenprüfung gegen REGISTRIERUNG.ROLLEN (leer/Supervisor/passende Rolle oder Endpunkt, sonst 403)

  **LocalOnly:** nein (auch extern erreichbar)

  **Antwort:** ohne `limit` das Ergebnis von `SerializeQuery`: `{"header":{"feld":"typ",...},"data":[{...},...]}`; mit `limit` > 0 `{"total":N,"limit":N,"offset":N,"data":{"header":{...},"data":[...]}}`.
