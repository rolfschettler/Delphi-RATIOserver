info:
  name: GET /adressen/getzusatztabellebyid – Zusatzdatensatz per Nr
  type: http
  seq: 12

http:
  method: GET
  url: "{{baseURL}}/adressen/getzusatztabellebyid"
  body:
    type: json
    data: |-
      {
        "nr": 42,
        "fields": "*"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Liefert genau einen Datensatz aus ZUSATZTABELLE anhand des Primärschlüssels `nr` (generisches `DoSelectOne`).

  **Tabelle:** ZUSATZTABELLE

  **Erlaubte Felder (ALLOWED):** nr, reftable, refnr, modul, bereich, zusatzfeld1–zusatzfeld10, zusatzdatum1–zusatzdatum3, zusatzzahl1–zusatzzahl3, zusatznum1–zusatznum3, zusatzblob1–zusatzblob3, erstellt, geaendert, erfasstvon, geaendertvon, kennziffer, sortierung, bemerkung

  **Key-Feld:** `nr`

  **Body:** `{ "nr": <wert>, "fields": [...] | "*" }` – nr ist Pflicht.

  **Auth:** erforderlich (Bearer Token); zusätzlich Rollenprüfung gegen REGISTRIERUNG.ROLLEN (leer/Supervisor/passende Rolle oder Endpunkt, sonst 403)

  **LocalOnly:** nein (auch extern erreichbar)

  **Antwort:** `{"header":{"feld":"typ",...},"data":[{...}]}` – `data` enthält genau einen Datensatz bzw. ist leer, wenn zum Schlüssel kein Datensatz existiert.
