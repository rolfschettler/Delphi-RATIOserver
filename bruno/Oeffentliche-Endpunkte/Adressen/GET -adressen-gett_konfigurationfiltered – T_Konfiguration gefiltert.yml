info:
  name: GET /adressen/gett_konfigurationfiltered – T_Konfiguration gefiltert
  type: http
  seq: 29

http:
  method: GET
  url: "{{baseURL}}/adressen/gett_konfigurationfiltered"
  body:
    type: json
    data: |-
      {
        "fields": "*",
        "kategorie": "Allgemein",
        "bereich": "Adressen",
        "orderby": "bezeichnung"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Listet Datensätze aus T_KONFIGURATION gefiltert auf (generisches `DoSelectFilteredDynamic`).

  **Tabelle:** T_KONFIGURATION

  **Erlaubte Felder (ALLOWED):** nr, bezeichnung, wert, werttyp, kategorie, bereich, vorgabe, bereich2, beschreibung

  **Filterparameter (alle optional, AND-verknüpft, je `feld = :feld`):** nr, bezeichnung, wert, werttyp, kategorie, bereich, vorgabe, bereich2, beschreibung – nur im Body vorhandene (nicht-null) Parameter erzeugen eine WHERE-Bedingung; ohne Filter werden alle Datensätze geliefert.

  **Body:** `{ "fields": [...] | "*", "nr": 1, "bezeichnung": "...", "wert": "...", "werttyp": "...", "kategorie": "...", "bereich": "...", "vorgabe": "...", "bereich2": "...", "beschreibung": "..." }` – zusätzlich `orderby` (ALLOWED-Feld), `limit`, `offset`. Der Body muss ein gültiges JSON-Objekt sein (mindestens `{}`), sonst Fehler.

  **Auth:** erforderlich (Bearer Token); zusätzlich Rollenprüfung gegen REGISTRIERUNG.ROLLEN (leer/Supervisor/passende Rolle oder Endpunkt, sonst 403)

  **LocalOnly:** nein (auch extern erreichbar)

  **Antwort:** ohne `limit` das Ergebnis von `SerializeQuery`: `{"header":{"feld":"typ",...},"data":[{...},...]}`; mit `limit` > 0 `{"total":N,"limit":N,"offset":N,"data":{"header":{...},"data":[...]}}`.
