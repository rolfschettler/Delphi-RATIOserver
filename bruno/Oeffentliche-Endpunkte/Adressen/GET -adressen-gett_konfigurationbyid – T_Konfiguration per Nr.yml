info:
  name: GET /adressen/gett_konfigurationbyid – T_Konfiguration per Nr
  type: http
  seq: 28

http:
  method: GET
  url: "{{baseURL}}/adressen/gett_konfigurationbyid"
  body:
    type: json
    data: |-
      {
        "nr": 1,
        "fields": "*"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Liefert genau einen Datensatz aus T_KONFIGURATION anhand des Primärschlüssels `nr` (generisches `DoSelectOne`).

  **Tabelle:** T_KONFIGURATION

  **Erlaubte Felder (ALLOWED):** nr, bezeichnung, wert, werttyp, kategorie, bereich, vorgabe, bereich2, beschreibung

  **Key-Feld:** `nr`

  **Body:** `{ "nr": <wert>, "fields": [...] | "*" }` – nr ist Pflicht.

  **Auth:** erforderlich (Bearer Token); zusätzlich Rollenprüfung gegen REGISTRIERUNG.ROLLEN (leer/Supervisor/passende Rolle oder Endpunkt, sonst 403)

  **LocalOnly:** nein (auch extern erreichbar)

  **Antwort:** `{"header":{"feld":"typ",...},"data":[{...}]}` – `data` enthält genau einen Datensatz bzw. ist leer, wenn zum Schlüssel kein Datensatz existiert.
