info:
  name: GET /adressen/getkonfigurationfiltered – Konfigurationen gefiltert
  type: http
  seq: 26

http:
  method: GET
  url: "{{baseURL}}/adressen/getkonfigurationfiltered"
  body:
    type: json
    data: |-
      {
        "fields": [
          "nr",
          "name",
          "art",
          "id",
          "art2"
        ],
        "art": "LAYOUT",
        "orderby": "name"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Listet Datensätze aus KONFIGURATION gefiltert auf (generisches `DoSelectFilteredDynamic`).

  **Tabelle:** KONFIGURATION

  **Erlaubte Felder (ALLOWED):** nr, name, art, id, content, art2

  **Filterparameter (alle optional, AND-verknüpft, je `feld = :feld`):** nr, name, art, id, art2 – nur im Body vorhandene (nicht-null) Parameter erzeugen eine WHERE-Bedingung; ohne Filter werden alle Datensätze geliefert.

  **Hinweis:** `content` ist ein Blob-Feld und steht daher nur in ALLOWED, NICHT als Filterparameter zur Verfügung.

  **Body:** `{ "fields": [...] | "*", "nr": 1, "name": "...", "art": "...", "id": 1, "art2": "..." }` – zusätzlich `orderby` (ALLOWED-Feld), `limit`, `offset`. Der Body muss ein gültiges JSON-Objekt sein (mindestens `{}`), sonst Fehler.

  **Auth:** erforderlich (Bearer Token); zusätzlich Rollenprüfung gegen REGISTRIERUNG.ROLLEN (leer/Supervisor/passende Rolle oder Endpunkt, sonst 403)

  **LocalOnly:** nein (auch extern erreichbar)

  **Antwort:** ohne `limit` das Ergebnis von `SerializeQuery`: `{"header":{"feld":"typ",...},"data":[{...},...]}`; mit `limit` > 0 `{"total":N,"limit":N,"offset":N,"data":{"header":{...},"data":[...]}}`.
