info:
  name: GET /fahrtenplanung/gett_z_fahrzeug – Fahrzeuge auflisten
  type: http
  seq: 15

http:
  method: GET
  url: "{{baseURL}}/fahrtenplanung/gett_z_fahrzeug"
  body:
    type: json
    data: |-
      {
        "fields": "*",
        "orderby": "nr"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Listet alle Datensätze aus T_Z_FAHRZEUG auf (generisches `DoSelect`).

  **Tabelle:** T_Z_FAHRZEUG

  **Erlaubte Felder (ALLOWED):** nr, zplanungsnr, bezeichnung, typ, kennzeichen, kennziffer, zielhaltnr, kmprofil, zieluhrzeit, refnr, status, zusatzinfo, info, erledigt, farbe, zusatzfeld1, zusatzfeld2

  **Body:** `{ "fields": [...] | "*", "orderby": "<feld>" }` – zusätzlich `limit`, `offset`. Der Body muss ein gültiges JSON-Objekt sein (mindestens `{}`).

  **Auth:** erforderlich (Bearer Token); zusätzlich Rollenprüfung gegen REGISTRIERUNG.ROLLEN (leer/Supervisor/passende Rolle oder Endpunkt, sonst 403)

  **LocalOnly:** nein (auch extern erreichbar)

  **Antwort:** `{"header":{"feld":"typ",...},"data":[{...},...]}`
