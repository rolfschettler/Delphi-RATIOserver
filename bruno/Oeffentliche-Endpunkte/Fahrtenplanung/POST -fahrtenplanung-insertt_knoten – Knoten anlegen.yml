info:
  name: POST /fahrtenplanung/insertt_knoten – Knoten anlegen
  type: http
  seq: 40

http:
  method: POST
  url: "{{baseURL}}/fahrtenplanung/insertt_knoten"
  body:
    type: json
    data: |-
      {
        "nr": 42,
        "zubringer": 1,
        "reisenr": 2,
        "datum": "2026-11-03",
        "land": "DE",
        "ort": "Musterstadt",
        "region": "Musterregion",
        "zielknoten": 0,
        "reihenfolge": 1,
        "art": "HA",
        "geraet": 0,
        "zielknotenhaltnr": 0,
        "knotenladen": "N",
        "internet": "J",
        "sortierung": 1
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Legt einen neuen Datensatz in der Tabelle T_KNOTEN an (generisches `DoInsert`).

  **Tabelle:** T_KNOTEN

  **Erlaubte Felder (ALLOWED):** nr, zubringer, reisenr, datum, land, ort, region, zielknoten, reihenfolge, art, geraet, zielknotenhaltnr, knotenladen, internet, sortierung – nur diese Felder werden aus dem Body übernommen, alle anderen ignoriert (mindestens ein gültiges Feld nötig, sonst „Keine gueltigen Felder uebergeben.“).

  **Hinweis:** `nr` ist Primärschlüssel und NOT NULL – vorher über `/fahrtenplanung/gett_knotenkey` den nächsten Wert holen und im Body mitsenden. Feldlängen (CHAR): land 2, ort 60, region 60, art 2, knotenladen 4, internet 4. Die Beispielwerte im Body sind Platzhalter.

  **Body:** `{ "nr": <wert>, "zubringer": <wert>, "reisenr": <wert>, "datum": "...", "land": "..", ... }`

  **Auth:** erforderlich (Bearer Token); zusätzlich Rollenprüfung gegen REGISTRIERUNG.ROLLEN (leer/Supervisor/passende Rolle oder Endpunkt, sonst 403)

  **LocalOnly:** nein (auch extern erreichbar)

  **Antwort:** `{"status":"OK"}`
