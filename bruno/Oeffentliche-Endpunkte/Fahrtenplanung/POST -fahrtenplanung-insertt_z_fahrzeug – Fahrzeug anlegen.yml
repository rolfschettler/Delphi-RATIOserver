info:
  name: POST /fahrtenplanung/insertt_z_fahrzeug – Fahrzeug anlegen
  type: http
  seq: 19

http:
  method: POST
  url: "{{baseURL}}/fahrtenplanung/insertt_z_fahrzeug"
  body:
    type: json
    data: |-
      {
        "nr": 42,
        "zplanungsnr": 1,
        "bezeichnung": "Bus 1",
        "typ": "Reisebus",
        "kennzeichen": "AB-CD 123",
        "zieluhrzeit": "07:45",
        "status": "OFFEN",
        "erledigt": "N"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Legt einen neuen Datensatz in der Tabelle T_Z_FAHRZEUG an (generisches `DoInsert`).

  **Tabelle:** T_Z_FAHRZEUG

  **Erlaubte Felder (ALLOWED):** nr, zplanungsnr, bezeichnung, typ, kennzeichen, kennziffer, zielhaltnr, kmprofil, zieluhrzeit, refnr, status, zusatzinfo, info, erledigt, farbe, zusatzfeld1, zusatzfeld2 – nur diese Felder werden aus dem Body übernommen, alle anderen ignoriert (mindestens ein gültiges Feld nötig, sonst „Keine gueltigen Felder uebergeben.“).

  **Hinweis:** `nr` ist Primärschlüssel und NOT NULL – vorher über `/fahrtenplanung/gett_z_fahrzeugkey` den nächsten Wert holen und im Body mitsenden. `info` ist ein Blob-Feld. Maximale Feldlängen: refnr, zusatzinfo je 255; bezeichnung, zusatzfeld1, zusatzfeld2 je 200; typ 40; status 30; kennzeichen 15; zieluhrzeit 6; erledigt 4 Zeichen.

  **Body:** `{ "nr": <wert>, "zplanungsnr": <wert>, "bezeichnung": "...", ... }`

  **Auth:** erforderlich (Bearer Token); zusätzlich Rollenprüfung gegen REGISTRIERUNG.ROLLEN (leer/Supervisor/passende Rolle oder Endpunkt, sonst 403)

  **LocalOnly:** nein (auch extern erreichbar)

  **Antwort:** `{"status":"OK"}`
