info:
  name: GET /fahrtenplanung/gett_zustiegebyid – Zustieg per Nr
  type: http
  seq: 52

http:
  method: GET
  url: "{{baseURL}}/fahrtenplanung/gett_zustiegebyid"
  body:
    type: json
    data: |-
      {
        "nr": 42,
        "fields": "*"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Liefert genau einen Datensatz aus T_ZUSTIEGE anhand des Primärschlüssels `nr` (generisches `DoSelectOne`).

  **Tabelle:** T_ZUSTIEGE

  **Erlaubte Felder (ALLOWED):** nr, knotenhaltnr, teilnehmernr, art, richtung, platznummer

  **Key-Feld:** `nr`

  **Body:** `{ "nr": <wert>, "fields": [...] | "*" }` – nr ist Pflicht.

  **Auth:** erforderlich (Bearer Token); zusätzlich Rollenprüfung gegen REGISTRIERUNG.ROLLEN (leer/Supervisor/passende Rolle oder Endpunkt, sonst 403)

  **LocalOnly:** nein (auch extern erreichbar)

  **Antwort:** `{"header":{"feld":"typ",...},"data":[{...}]}` – `data` enthält genau einen Datensatz bzw. ist leer, wenn zum Schlüssel kein Datensatz existiert.
