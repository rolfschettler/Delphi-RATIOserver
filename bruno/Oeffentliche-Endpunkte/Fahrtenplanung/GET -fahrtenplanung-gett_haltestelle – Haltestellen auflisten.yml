info:
  name: GET /fahrtenplanung/gett_haltestelle – Haltestellen auflisten
  type: http
  seq: 57

http:
  method: GET
  url: "{{baseURL}}/fahrtenplanung/gett_haltestelle"
  body:
    type: json
    data: |-
      {
        "fields": "*",
        "orderby": "nr"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Listet alle Datensätze aus T_HALTESTELLE auf (generisches `DoSelect`).

  **Tabelle:** T_HALTESTELLE

  **Erlaubte Felder (ALLOWED):** nr, land, plz, ort, strasse, gesperrt, xkoord, ykoord, code, zuschlag, bezeichnung, hausabholung, sortierung, externenr1, externenr2, internet, exportierbar

  **Body:** `{ "fields": [...] | "*", "orderby": "<feld>" }` – zusätzlich `limit`, `offset`. Der Body muss ein gültiges JSON-Objekt sein (mindestens `{}`).

  **Auth:** erforderlich (Bearer Token); zusätzlich Rollenprüfung gegen REGISTRIERUNG.ROLLEN (leer/Supervisor/passende Rolle oder Endpunkt, sonst 403)

  **LocalOnly:** nein (auch extern erreichbar)

  **Antwort:** `{"header":{"feld":"typ",...},"data":[{...},...]}`
