info:
  name: Fahrtenplanung
  type: folder
  seq: 17

request:
  auth: inherit

docs:
  content: |-
    Hier planst du **Zubringer und Zustiege für Reisen**: Haltestellen, Knoten und Knotenhalte (Zustiegsorte mit Datum, Uhrzeit und Zuschlag) sowie die Zustiege der Teilnehmer (wer wo in welche Richtung einsteigt, mit Platznummer).

    Dazu gehört die Zubringerplanung: Planungen, die zugehörigen Reisen, Zubringerfahrzeuge, Wege (die Halte eines Fahrzeugs in ihrer Reihenfolge) und Einteilungen (welcher Zustieg zu welchem Weg gehört). Für jeden dieser Bereiche gibt es: auflisten, gefiltert suchen, einzeln abrufen, neue Nummer holen, anlegen, ändern und löschen.

    Alle Endpunkte brauchen eine Anmeldung (Token aus `/login`) und die Berechtigung für den jeweiligen Endpunkt in den Rollen des Benutzers (sonst Fehler 403).

    Technik: Controller `TDataModulFahrtenplanung` in `Shared/DataModuls/DataModulFahrtenplanungClass.pas`, Tabellen `T_HALTESTELLE`, `T_KNOTEN`, `T_KNOTENHALT`, `T_ZUSTIEGE`, `T_Z_PLANUNG`, `T_Z_REISE`, `T_Z_FAHRZEUG`, `T_Z_WEG`, `T_Z_EINTEILUNG`.
  type: text/markdown
