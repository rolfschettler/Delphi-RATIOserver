info:
  name: GET /fahrtenplanung/gett_z_weg – Wege auflisten
  type: http
  seq: 22

http:
  method: GET
  url: "{{baseURL}}/fahrtenplanung/gett_z_weg"
  body:
    type: json
    data: |-
      {
        "fields": "*",
        "orderby": "nr"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Listet alle Datensätze aus T_Z_WEG auf (generisches `DoSelect`).

  **Tabelle:** T_Z_WEG

  **Erlaubte Felder (ALLOWED):** nr, zubringerfahrzeugnr, haltnr, wegefolge, uhrzeit

  **Body:** `{ "fields": [...] | "*", "orderby": "<feld>" }` – zusätzlich `limit`, `offset`. Der Body muss ein gültiges JSON-Objekt sein (mindestens `{}`).

  **Auth:** erforderlich (Bearer Token); zusätzlich Rollenprüfung gegen REGISTRIERUNG.ROLLEN (leer/Supervisor/passende Rolle oder Endpunkt, sonst 403)

  **LocalOnly:** nein (auch extern erreichbar)

  **Antwort:** `{"header":{"feld":"typ",...},"data":[{...},...]}`
