info:
  name: GET /fahrtenplanung/gett_knotenhaltfiltered – Knotenhalte gefiltert
  type: http
  seq: 44

http:
  method: GET
  url: "{{baseURL}}/fahrtenplanung/gett_knotenhaltfiltered"
  body:
    type: json
    data: |-
      {
        "fields": "*",
        "knoten": 42,
        "orderby": "sortierung"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Listet Datensätze aus T_KNOTENHALT gefiltert auf (generisches `DoSelectFilteredDynamic`).

  **Tabelle:** T_KNOTENHALT

  **Erlaubte Felder (ALLOWED):** nr, knoten, halt, datum, zeit, zuschlag, internet, sortierung, inhouse, maximumpers, exportierbar

  **Filterparameter (alle optional, AND-verknüpft, je `feld = :feld`):** nr, knoten, halt, datum, zeit, zuschlag, internet, sortierung, inhouse, maximumpers, exportierbar – nur im Body vorhandene (nicht-null) Parameter erzeugen eine WHERE-Bedingung; ohne Filter werden alle Datensätze geliefert.

  **Hinweis:** `zeit`, `internet`, `inhouse`, `exportierbar` sind CHAR-Felder (feste Länge) – Vergleich per Gleichheit. `datum` ist ein Zeitstempel, `zuschlag` eine Gleitkommazahl; beide Filter treffen nur exakt gleiche Werte.

  **Body:** `{ "fields": [...] | "*", "knoten": <wert>, "halt": <wert>, ... }` – zusätzlich `orderby` (ALLOWED-Feld), `limit`, `offset`. Der Body muss ein gültiges JSON-Objekt sein (mindestens `{}`), sonst Fehler.

  **Auth:** erforderlich (Bearer Token); zusätzlich Rollenprüfung gegen REGISTRIERUNG.ROLLEN (leer/Supervisor/passende Rolle oder Endpunkt, sonst 403)

  **LocalOnly:** nein (auch extern erreichbar)

  **Antwort:** ohne `limit` das Ergebnis von `SerializeQuery`: `{"header":{"feld":"typ",...},"data":[{...},...]}`; mit `limit` > 0 `{"total":N,"limit":N,"offset":N,"data":{"header":{...},"data":[...]}}`.
