info:
  name: GET /fahrtenplanung/gett_haltestellekey – nächste Nr ermitteln
  type: http
  seq: 60

http:
  method: GET
  url: "{{baseURL}}/fahrtenplanung/gett_haltestellekey"
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Kein generischer CRUD-Endpunkt: führt die feste Abfrage `SELECT GEN_ID(T_HALTESTELLE_NR_GEN, 1) AS nr FROM RDB$DATABASE` aus und liefert den nächsten Generatorwert für den Primärschlüssel `nr` der Tabelle T_HALTESTELLE. Body wird nicht ausgewertet.

  **Tabelle:** T_HALTESTELLE

  **Key-Feld:** `nr`

  **Body:** keiner

  **Auth:** erforderlich (Bearer Token); zusätzlich Rollenprüfung gegen REGISTRIERUNG.ROLLEN (leer/Supervisor/passende Rolle oder Endpunkt, sonst 403)

  **LocalOnly:** nein (auch extern erreichbar)

  **Antwort:** `{"header":{"nr":"ftinteger"},"data":[{"nr":<nächster Wert>}]}`
