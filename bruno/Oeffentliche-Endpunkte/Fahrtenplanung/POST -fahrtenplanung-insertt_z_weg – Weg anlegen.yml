info:
  name: POST /fahrtenplanung/insertt_z_weg – Weg anlegen
  type: http
  seq: 26

http:
  method: POST
  url: "{{baseURL}}/fahrtenplanung/insertt_z_weg"
  body:
    type: json
    data: |-
      {
        "nr": 42,
        "zubringerfahrzeugnr": 1,
        "haltnr": 2,
        "wegefolge": 1,
        "uhrzeit": "07:30"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Legt einen neuen Datensatz in der Tabelle T_Z_WEG an (generisches `DoInsert`).

  **Tabelle:** T_Z_WEG

  **Erlaubte Felder (ALLOWED):** nr, zubringerfahrzeugnr, haltnr, wegefolge, uhrzeit – nur diese Felder werden aus dem Body übernommen, alle anderen ignoriert (mindestens ein gültiges Feld nötig, sonst „Keine gueltigen Felder uebergeben.“).

  **Hinweis:** `nr` ist Primärschlüssel und NOT NULL – vorher über `/fahrtenplanung/gett_z_wegkey` den nächsten Wert holen und im Body mitsenden. `uhrzeit` ist ein CHAR-Feld mit max. 6 Zeichen.

  **Body:** `{ "nr": <wert>, "zubringerfahrzeugnr": <wert>, "haltnr": <wert>, "wegefolge": <wert>, "uhrzeit": "..." }`

  **Auth:** erforderlich (Bearer Token); zusätzlich Rollenprüfung gegen REGISTRIERUNG.ROLLEN (leer/Supervisor/passende Rolle oder Endpunkt, sonst 403)

  **LocalOnly:** nein (auch extern erreichbar)

  **Antwort:** `{"status":"OK"}`
