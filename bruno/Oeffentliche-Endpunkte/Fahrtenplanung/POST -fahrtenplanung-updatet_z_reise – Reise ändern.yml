info:
  name: POST /fahrtenplanung/updatet_z_reise – Reise ändern
  type: http
  seq: 13

http:
  method: POST
  url: "{{baseURL}}/fahrtenplanung/updatet_z_reise"
  body:
    type: json
    data: |-
      {
        "nr": 42,
        "tzubringernr": 3
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Ändert einen Datensatz in T_Z_REISE anhand des Primärschlüssels `nr` (generisches `DoUpdate`).

  **Tabelle:** T_Z_REISE

  **Erlaubte Felder (ALLOWED):** zplanungsnr, tzubringernr – nur übergebene Felder werden geändert.

  **Key-Feld:** `nr` (Pflicht, wird selbst nicht geändert)

  **Body:** `{ "nr": <wert>, "zplanungsnr": <wert>, "tzubringernr": <wert> }`

  **Auth:** erforderlich (Bearer Token); zusätzlich Rollenprüfung gegen REGISTRIERUNG.ROLLEN (leer/Supervisor/passende Rolle oder Endpunkt, sonst 403)

  **LocalOnly:** nein (auch extern erreichbar)

  **Antwort:** `{"status":"OK"}`
