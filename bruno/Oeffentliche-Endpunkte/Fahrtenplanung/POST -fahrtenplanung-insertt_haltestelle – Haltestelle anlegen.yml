info:
  name: POST /fahrtenplanung/insertt_haltestelle – Haltestelle anlegen
  type: http
  seq: 61

http:
  method: POST
  url: "{{baseURL}}/fahrtenplanung/insertt_haltestelle"
  body:
    type: json
    data: |-
      {
        "nr": 42,
        "land": "DE",
        "plz": "12345",
        "ort": "Musterstadt",
        "strasse": "Musterstrasse 1",
        "gesperrt": "N",
        "xkoord": "8.0000",
        "ykoord": "49.0000",
        "code": "MUS01",
        "zuschlag": 0,
        "bezeichnung": "Musterstadt ZOB",
        "hausabholung": "N",
        "sortierung": 1,
        "externenr1": "",
        "externenr2": "",
        "internet": "J",
        "exportierbar": "J"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Legt einen neuen Datensatz in der Tabelle T_HALTESTELLE an (generisches `DoInsert`).

  **Tabelle:** T_HALTESTELLE

  **Erlaubte Felder (ALLOWED):** nr, land, plz, ort, strasse, gesperrt, xkoord, ykoord, code, zuschlag, bezeichnung, hausabholung, sortierung, externenr1, externenr2, internet, exportierbar – nur diese Felder werden aus dem Body übernommen, alle anderen ignoriert (mindestens ein gültiges Feld nötig, sonst „Keine gueltigen Felder uebergeben.“).

  **Hinweis:** `nr` ist Primärschlüssel und NOT NULL – vorher über `/fahrtenplanung/gett_haltestellekey` den nächsten Wert holen und im Body mitsenden. Feldlängen (CHAR): land 2, plz 15, ort 60, strasse 60, gesperrt 4, xkoord 20, ykoord 20, code 20, bezeichnung 200, hausabholung 4, internet 4, exportierbar 4; externenr1/externenr2 VARCHAR(255). Die Beispielwerte im Body sind Platzhalter.

  **Body:** `{ "nr": <wert>, "land": "..", "plz": "...", "ort": "...", "bezeichnung": "...", ... }`

  **Auth:** erforderlich (Bearer Token); zusätzlich Rollenprüfung gegen REGISTRIERUNG.ROLLEN (leer/Supervisor/passende Rolle oder Endpunkt, sonst 403)

  **LocalOnly:** nein (auch extern erreichbar)

  **Antwort:** `{"status":"OK"}`
