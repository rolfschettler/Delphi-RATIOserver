info:
  name: GET /fahrtenplanung/gett_z_planungbyid – Planung per Nr
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseURL}}/fahrtenplanung/gett_z_planungbyid"
  body:
    type: json
    data: |-
      {
        "nr": 42,
        "fields": "*"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Liefert genau einen Datensatz aus T_Z_PLANUNG anhand des Primärschlüssels `nr` (generisches `DoSelectOne`).

  **Tabelle:** T_Z_PLANUNG

  **Erlaubte Felder (ALLOWED):** nr, bezeichnung, datum, planung, art, text, erstellt, erstellt_von, geandert, geandert_von, status, gesperrt, zusatzfeld1, zusatzfeld2

  **Key-Feld:** `nr`

  **Body:** `{ "nr": <wert>, "fields": [...] | "*" }` – nr ist Pflicht.

  **Auth:** erforderlich (Bearer Token); zusätzlich Rollenprüfung gegen REGISTRIERUNG.ROLLEN (leer/Supervisor/passende Rolle oder Endpunkt, sonst 403)

  **LocalOnly:** nein (auch extern erreichbar)

  **Antwort:** `{"header":{"feld":"typ",...},"data":[{...}]}` – `data` enthält genau einen Datensatz bzw. ist leer, wenn zum Schlüssel kein Datensatz existiert.
