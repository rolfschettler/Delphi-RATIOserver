info:
  name: GET /fahrtenplanung/gett_z_planungbyid – Planung per Nr
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseURL}}/fahrtenplanung/gett_z_planungbyid"
  body:
    type: json
    data: |-
      {
        "nr": 42,
        "fields": "*"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  **Planung per Nr.** Liefert genau einen Eintrag aus `T_Z_PLANUNG`, gesucht über `nr`.

  | | |
  |---|---|
  | **Aufruf** | `GET {{baseURL}}/fahrtenplanung/gett_z_planungbyid` |
  | **Anmeldung** | nötig – Token aus `/login` (wird in Bruno automatisch mitgeschickt) |
  | **Berechtigung** | Der Benutzer braucht diesen Endpunkt in seinen Rollen (sonst Fehler 403) |

  ### Was du mitschickst
  | Parameter | Wert | Pflicht | Bedeutung |
  |---|---|---|---|
  | `nr` | Ganzzahl | **ja** | Der gesuchte Eintrag. |
  | `fields` | `"*"` oder Liste | nein | Welche Felder zurückkommen sollen. Weglassen = alle. |

  ### Verfügbare Felder
  | Feld | Typ |
  |---|---|
  | `nr` | Ganzzahl |
  | `bezeichnung` | Text (max. 200 Zeichen) |
  | `datum` | Datum/Uhrzeit |
  | `planung` | Text (max. 10 Zeichen) |
  | `art` | Text (max. 30 Zeichen) |
  | `text` | Text (max. 200 Zeichen) |
  | `erstellt` | Datum/Uhrzeit |
  | `erstellt_von` | Text (max. 30 Zeichen) |
  | `geandert` | Datum/Uhrzeit |
  | `geandert_von` | Text (max. 30 Zeichen) |
  | `status` | Text (max. 20 Zeichen) |
  | `gesperrt` | Text (max. 4 Zeichen) |
  | `zusatzfeld1` | Text (max. 200 Zeichen) |
  | `zusatzfeld2` | Text (max. 200 Zeichen) |

  ### Was zurückkommt
  ```json
  {"header": {...}, "data": [ {"nr": 42, "bezeichnung": "Text", "datum": "2026-09-01 08:00:00", ...} ]}
  ```

  ### Was schiefgehen kann
  - **401** – nicht angemeldet oder Token abgelaufen → neu einloggen.
  - **403** – keine Berechtigung für diesen Endpunkt.
  - **Fehlermeldung im Text** (`{"status":"error","message":"..."}`), z.B. wenn ein Feldname in `fields` oder `orderby` nicht erlaubt ist. Achtung: Solche Fehler kommen teilweise mit HTTP-Status 200 – deshalb immer auf `"status": "error"` prüfen.

  ### Gut zu wissen
  - **Nicht gefunden = leere Liste:** Gibt es den Eintrag nicht, kommt kein Fehler, sondern `"data": []`.
  - **`nr` muss mitgeschickt werden**, sonst kommt eine Fehlermeldung.

  <details><summary>Für Entwickler</summary>

  - Controller: `TDataModulFahrtenplanung.getT_Z_PlanungById` in `Shared/DataModuls/DataModulFahrtenplanungClass.pas`
  - Tabelle: `T_Z_PLANUNG`, Schlüssel `nr`
  - Umsetzung: generische Methode `DoSelectOne` der Basisklasse `TDataModulTableBase`
  - Der Server wertet die HTTP-Methode nicht aus – GET und POST funktionieren gleich.

  </details>
