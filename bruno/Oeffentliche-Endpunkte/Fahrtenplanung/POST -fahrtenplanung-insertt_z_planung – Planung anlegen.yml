info:
  name: POST /fahrtenplanung/insertt_z_planung – Planung anlegen
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseURL}}/fahrtenplanung/insertt_z_planung"
  body:
    type: json
    data: |-
      {
        "nr": 42,
        "bezeichnung": "Schulfahrten KW 46",
        "datum": "2026-11-09 07:00:00",
        "planung": "KW46",
        "art": "Schulfahrt",
        "text": "Neu angelegte Planung",
        "status": "OFFEN",
        "gesperrt": "N"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Legt einen neuen Datensatz in der Tabelle T_Z_PLANUNG an (generisches `DoInsert`).

  **Tabelle:** T_Z_PLANUNG

  **Erlaubte Felder (ALLOWED):** nr, bezeichnung, datum, planung, art, text, erstellt, erstellt_von, geandert, geandert_von, status, gesperrt, zusatzfeld1, zusatzfeld2 – nur diese Felder werden aus dem Body übernommen, alle anderen ignoriert (mindestens ein gültiges Feld nötig, sonst „Keine gueltigen Felder uebergeben.“).

  **Hinweis:** `nr` ist Primärschlüssel und NOT NULL – vorher über `/fahrtenplanung/gett_z_planungkey` den nächsten Wert holen und im Body mitsenden. Maximale Feldlängen: bezeichnung, text, zusatzfeld1, zusatzfeld2 je 200; art, erstellt_von, geandert_von je 30; status 20; planung 10; gesperrt 4 Zeichen.

  **Body:** `{ "nr": <wert>, "bezeichnung": "...", "datum": "...", ... }`

  **Auth:** erforderlich (Bearer Token); zusätzlich Rollenprüfung gegen REGISTRIERUNG.ROLLEN (leer/Supervisor/passende Rolle oder Endpunkt, sonst 403)

  **LocalOnly:** nein (auch extern erreichbar)

  **Antwort:** `{"status":"OK"}`
