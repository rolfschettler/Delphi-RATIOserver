info:
  name: POST /fahrtenplanung/insertt_zustiege – Zustieg anlegen
  type: http
  seq: 54

http:
  method: POST
  url: "{{baseURL}}/fahrtenplanung/insertt_zustiege"
  body:
    type: json
    data: |-
      {
        "nr": 42,
        "knotenhaltnr": 1,
        "teilnehmernr": 2,
        "art": "ZU",
        "richtung": "H",
        "platznummer": "12A"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Legt einen neuen Datensatz in der Tabelle T_ZUSTIEGE an (generisches `DoInsert`).

  **Tabelle:** T_ZUSTIEGE

  **Erlaubte Felder (ALLOWED):** nr, knotenhaltnr, teilnehmernr, art, richtung, platznummer – nur diese Felder werden aus dem Body übernommen, alle anderen ignoriert (mindestens ein gültiges Feld nötig, sonst „Keine gueltigen Felder uebergeben.“).

  **Hinweis:** `nr` ist Primärschlüssel und NOT NULL – vorher über `/fahrtenplanung/gett_zustiegekey` den nächsten Wert holen und im Body mitsenden. Feldlängen (CHAR): art 2, richtung 1, platznummer 20. Die Beispielwerte im Body sind Platzhalter.

  **Body:** `{ "nr": <wert>, "knotenhaltnr": <wert>, "teilnehmernr": <wert>, "art": "..", "richtung": ".", "platznummer": "..." }`

  **Auth:** erforderlich (Bearer Token); zusätzlich Rollenprüfung gegen REGISTRIERUNG.ROLLEN (leer/Supervisor/passende Rolle oder Endpunkt, sonst 403)

  **LocalOnly:** nein (auch extern erreichbar)

  **Antwort:** `{"status":"OK"}`
