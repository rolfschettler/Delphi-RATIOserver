info:
  name: GET /fahrtenplanung/gett_z_planungfiltered – Planungen gefiltert
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseURL}}/fahrtenplanung/gett_z_planungfiltered"
  body:
    type: json
    data: |-
      {
        "fields": "*",
        "status": "OFFEN",
        "art": "Schulfahrt",
        "orderby": "datum"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Listet Datensätze aus T_Z_PLANUNG gefiltert auf (generisches `DoSelectFilteredDynamic`).

  **Tabelle:** T_Z_PLANUNG

  **Erlaubte Felder (ALLOWED):** nr, bezeichnung, datum, planung, art, text, erstellt, erstellt_von, geandert, geandert_von, status, gesperrt, zusatzfeld1, zusatzfeld2

  **Filterparameter (alle optional, AND-verknüpft, je `feld = :feld`):** nr, bezeichnung, datum, planung, art, text, erstellt, erstellt_von, geandert, geandert_von, status, gesperrt, zusatzfeld1, zusatzfeld2 – nur im Body vorhandene (nicht-null) Parameter erzeugen eine WHERE-Bedingung; ohne Filter werden alle Datensätze geliefert.

  **Hinweis:** Alle Filter vergleichen auf exakte Gleichheit. Die Datumsfelder datum, erstellt und geandert werden inkl. Uhrzeit verglichen.

  **Body:** `{ "fields": [...] | "*", "status": "...", "art": "...", ... }` – zusätzlich `orderby` (ALLOWED-Feld), `limit`, `offset`. Der Body muss ein gültiges JSON-Objekt sein (mindestens `{}`), sonst Fehler.

  **Auth:** erforderlich (Bearer Token); zusätzlich Rollenprüfung gegen REGISTRIERUNG.ROLLEN (leer/Supervisor/passende Rolle oder Endpunkt, sonst 403)

  **LocalOnly:** nein (auch extern erreichbar)

  **Antwort:** ohne `limit` das Ergebnis von `SerializeQuery`: `{"header":{"feld":"typ",...},"data":[{...},...]}`; mit `limit` > 0 `{"total":N,"limit":N,"offset":N,"data":{"header":{...},"data":[...]}}`.
