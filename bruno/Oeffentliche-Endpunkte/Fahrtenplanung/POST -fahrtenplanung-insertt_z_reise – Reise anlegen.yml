info:
  name: POST /fahrtenplanung/insertt_z_reise – Reise anlegen
  type: http
  seq: 12

http:
  method: POST
  url: "{{baseURL}}/fahrtenplanung/insertt_z_reise"
  body:
    type: json
    data: |-
      {
        "nr": 42,
        "zplanungsnr": 1,
        "tzubringernr": 2
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Legt einen neuen Datensatz in der Tabelle T_Z_REISE an (generisches `DoInsert`).

  **Tabelle:** T_Z_REISE

  **Erlaubte Felder (ALLOWED):** nr, zplanungsnr, tzubringernr – nur diese Felder werden aus dem Body übernommen, alle anderen ignoriert (mindestens ein gültiges Feld nötig, sonst „Keine gueltigen Felder uebergeben.“).

  **Hinweis:** `nr` ist Primärschlüssel und NOT NULL – vorher über `/fahrtenplanung/gett_z_reisekey` den nächsten Wert holen und im Body mitsenden.

  **Body:** `{ "nr": <wert>, "zplanungsnr": <wert>, "tzubringernr": <wert> }`

  **Auth:** erforderlich (Bearer Token); zusätzlich Rollenprüfung gegen REGISTRIERUNG.ROLLEN (leer/Supervisor/passende Rolle oder Endpunkt, sonst 403)

  **LocalOnly:** nein (auch extern erreichbar)

  **Antwort:** `{"status":"OK"}`
