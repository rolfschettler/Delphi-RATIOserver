info:
  name: POST /fahrtenplanung/updatet_knoten – Knoten ändern
  type: http
  seq: 41

http:
  method: POST
  url: "{{baseURL}}/fahrtenplanung/updatet_knoten"
  body:
    type: json
    data: |-
      {
        "nr": 42,
        "ort": "Musterstadt",
        "reihenfolge": 2
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Ändert einen Datensatz in T_KNOTEN anhand des Primärschlüssels `nr` (generisches `DoUpdate`).

  **Tabelle:** T_KNOTEN

  **Erlaubte Felder (ALLOWED):** zubringer, reisenr, datum, land, ort, region, zielknoten, reihenfolge, art, geraet, zielknotenhaltnr, knotenladen, internet, sortierung – nur übergebene Felder werden geändert.

  **Key-Feld:** `nr` (Pflicht, wird selbst nicht geändert)

  **Body:** `{ "nr": <wert>, "ort": "...", "reihenfolge": <wert>, ... }`

  **Auth:** erforderlich (Bearer Token); zusätzlich Rollenprüfung gegen REGISTRIERUNG.ROLLEN (leer/Supervisor/passende Rolle oder Endpunkt, sonst 403)

  **LocalOnly:** nein (auch extern erreichbar)

  **Antwort:** `{"status":"OK"}`
