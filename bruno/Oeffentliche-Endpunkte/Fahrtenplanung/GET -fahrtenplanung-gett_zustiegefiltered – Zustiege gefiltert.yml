info:
  name: GET /fahrtenplanung/gett_zustiegefiltered – Zustiege gefiltert
  type: http
  seq: 51

http:
  method: GET
  url: "{{baseURL}}/fahrtenplanung/gett_zustiegefiltered"
  body:
    type: json
    data: |-
      {
        "fields": "*",
        "knotenhaltnr": 42,
        "orderby": "nr"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Listet Datensätze aus T_ZUSTIEGE gefiltert auf (generisches `DoSelectFilteredDynamic`).

  **Tabelle:** T_ZUSTIEGE

  **Erlaubte Felder (ALLOWED):** nr, knotenhaltnr, teilnehmernr, art, richtung, platznummer

  **Filterparameter (alle optional, AND-verknüpft, je `feld = :feld`):** nr, knotenhaltnr, teilnehmernr, art, richtung, platznummer – nur im Body vorhandene (nicht-null) Parameter erzeugen eine WHERE-Bedingung; ohne Filter werden alle Datensätze geliefert.

  **Hinweis:** `art`, `richtung`, `platznummer` sind CHAR-Felder (feste Länge) – Vergleich per Gleichheit.

  **Body:** `{ "fields": [...] | "*", "knotenhaltnr": <wert>, "teilnehmernr": <wert>, ... }` – zusätzlich `orderby` (ALLOWED-Feld), `limit`, `offset`. Der Body muss ein gültiges JSON-Objekt sein (mindestens `{}`), sonst Fehler.

  **Auth:** erforderlich (Bearer Token); zusätzlich Rollenprüfung gegen REGISTRIERUNG.ROLLEN (leer/Supervisor/passende Rolle oder Endpunkt, sonst 403)

  **LocalOnly:** nein (auch extern erreichbar)

  **Antwort:** ohne `limit` das Ergebnis von `SerializeQuery`: `{"header":{"feld":"typ",...},"data":[{...},...]}`; mit `limit` > 0 `{"total":N,"limit":N,"offset":N,"data":{"header":{...},"data":[...]}}`.
