info:
  name: POST /fahrtenplanung/updatet_z_planung – Planung ändern
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseURL}}/fahrtenplanung/updatet_z_planung"
  body:
    type: json
    data: |-
      {
        "nr": 42,
        "status": "GEPLANT",
        "text": "Planung aktualisiert"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Ändert einen Datensatz in T_Z_PLANUNG anhand des Primärschlüssels `nr` (generisches `DoUpdate`).

  **Tabelle:** T_Z_PLANUNG

  **Erlaubte Felder (ALLOWED):** bezeichnung, datum, planung, art, text, erstellt, erstellt_von, geandert, geandert_von, status, gesperrt, zusatzfeld1, zusatzfeld2 – nur übergebene Felder werden geändert.

  **Key-Feld:** `nr` (Pflicht, wird selbst nicht geändert)

  **Body:** `{ "nr": <wert>, "status": "...", ... }`

  **Auth:** erforderlich (Bearer Token); zusätzlich Rollenprüfung gegen REGISTRIERUNG.ROLLEN (leer/Supervisor/passende Rolle oder Endpunkt, sonst 403)

  **LocalOnly:** nein (auch extern erreichbar)

  **Antwort:** `{"status":"OK"}`
