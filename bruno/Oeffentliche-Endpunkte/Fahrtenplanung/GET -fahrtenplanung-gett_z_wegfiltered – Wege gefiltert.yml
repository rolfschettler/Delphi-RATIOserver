info:
  name: GET /fahrtenplanung/gett_z_wegfiltered – Wege gefiltert
  type: http
  seq: 23

http:
  method: GET
  url: "{{baseURL}}/fahrtenplanung/gett_z_wegfiltered"
  body:
    type: json
    data: |-
      {
        "fields": "*",
        "zubringerfahrzeugnr": 42,
        "orderby": "wegefolge"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Listet Datensätze aus T_Z_WEG gefiltert auf (generisches `DoSelectFilteredDynamic`).

  **Tabelle:** T_Z_WEG

  **Erlaubte Felder (ALLOWED):** nr, zubringerfahrzeugnr, haltnr, wegefolge, uhrzeit

  **Filterparameter (alle optional, AND-verknüpft, je `feld = :feld`):** nr, zubringerfahrzeugnr, haltnr, wegefolge, uhrzeit – nur im Body vorhandene (nicht-null) Parameter erzeugen eine WHERE-Bedingung; ohne Filter werden alle Datensätze geliefert.

  **Body:** `{ "fields": [...] | "*", "zubringerfahrzeugnr": <wert>, "haltnr": <wert>, ... }` – zusätzlich `orderby` (ALLOWED-Feld), `limit`, `offset`. Der Body muss ein gültiges JSON-Objekt sein (mindestens `{}`), sonst Fehler.

  **Auth:** erforderlich (Bearer Token); zusätzlich Rollenprüfung gegen REGISTRIERUNG.ROLLEN (leer/Supervisor/passende Rolle oder Endpunkt, sonst 403)

  **LocalOnly:** nein (auch extern erreichbar)

  **Antwort:** ohne `limit` das Ergebnis von `SerializeQuery`: `{"header":{"feld":"typ",...},"data":[{...},...]}`; mit `limit` > 0 `{"total":N,"limit":N,"offset":N,"data":{"header":{...},"data":[...]}}`.
