info:
  name: GET /fahrtenplanung/gett_knotenhaltbyid – Knotenhalt per Nr
  type: http
  seq: 45

http:
  method: GET
  url: "{{baseURL}}/fahrtenplanung/gett_knotenhaltbyid"
  body:
    type: json
    data: |-
      {
        "nr": 42,
        "fields": "*"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Liefert genau einen Datensatz aus T_KNOTENHALT anhand des Primärschlüssels `nr` (generisches `DoSelectOne`).

  **Tabelle:** T_KNOTENHALT

  **Erlaubte Felder (ALLOWED):** nr, knoten, halt, datum, zeit, zuschlag, internet, sortierung, inhouse, maximumpers, exportierbar

  **Key-Feld:** `nr`

  **Body:** `{ "nr": <wert>, "fields": [...] | "*" }` – nr ist Pflicht.

  **Auth:** erforderlich (Bearer Token); zusätzlich Rollenprüfung gegen REGISTRIERUNG.ROLLEN (leer/Supervisor/passende Rolle oder Endpunkt, sonst 403)

  **LocalOnly:** nein (auch extern erreichbar)

  **Antwort:** `{"header":{"feld":"typ",...},"data":[{...}]}` – `data` enthält genau einen Datensatz bzw. ist leer, wenn zum Schlüssel kein Datensatz existiert.
