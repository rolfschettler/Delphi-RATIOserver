info:
  name: GET /fahrtenplanung/gett_z_fahrzeugfiltered – Fahrzeuge gefiltert
  type: http
  seq: 16

http:
  method: GET
  url: "{{baseURL}}/fahrtenplanung/gett_z_fahrzeugfiltered"
  body:
    type: json
    data: |-
      {
        "fields": "*",
        "zplanungsnr": 42,
        "orderby": "nr"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Listet Datensätze aus T_Z_FAHRZEUG gefiltert auf (generisches `DoSelectFilteredDynamic`).

  **Tabelle:** T_Z_FAHRZEUG

  **Erlaubte Felder (ALLOWED):** nr, zplanungsnr, bezeichnung, typ, kennzeichen, kennziffer, zielhaltnr, kmprofil, zieluhrzeit, refnr, status, zusatzinfo, info, erledigt, farbe, zusatzfeld1, zusatzfeld2

  **Filterparameter (alle optional, AND-verknüpft, je `feld = :feld`):** nr, zplanungsnr, bezeichnung, typ, kennzeichen, kennziffer, zielhaltnr, kmprofil, zieluhrzeit, refnr, status, zusatzinfo, erledigt, farbe, zusatzfeld1, zusatzfeld2 – nur im Body vorhandene (nicht-null) Parameter erzeugen eine WHERE-Bedingung; ohne Filter werden alle Datensätze geliefert.

  **Hinweis:** das Blob-Feld `info` ist nur in ALLOWED enthalten und steht bewusst NICHT als Filterparameter zur Verfügung. Alle Filter vergleichen auf exakte Gleichheit.

  **Body:** `{ "fields": [...] | "*", "zplanungsnr": <wert>, "kennzeichen": "...", ... }` – zusätzlich `orderby` (ALLOWED-Feld), `limit`, `offset`. Der Body muss ein gültiges JSON-Objekt sein (mindestens `{}`), sonst Fehler.

  **Auth:** erforderlich (Bearer Token); zusätzlich Rollenprüfung gegen REGISTRIERUNG.ROLLEN (leer/Supervisor/passende Rolle oder Endpunkt, sonst 403)

  **LocalOnly:** nein (auch extern erreichbar)

  **Antwort:** ohne `limit` das Ergebnis von `SerializeQuery`: `{"header":{"feld":"typ",...},"data":[{...},...]}`; mit `limit` > 0 `{"total":N,"limit":N,"offset":N,"data":{"header":{...},"data":[...]}}`.
