info:
  name: POST /fahrtenplanung/insertt_z_einteilung – Einteilung anlegen
  type: http
  seq: 33

http:
  method: POST
  url: "{{baseURL}}/fahrtenplanung/insertt_z_einteilung"
  body:
    type: json
    data: |-
      {
        "nr": 42,
        "zwegenr": 1,
        "tzustiegenr": 2,
        "einteilungsfolge": 1,
        "uhrzeit_ha": "07:30"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Legt einen neuen Datensatz in der Tabelle T_Z_EINTEILUNG an (generisches `DoInsert`).

  **Tabelle:** T_Z_EINTEILUNG

  **Erlaubte Felder (ALLOWED):** nr, zwegenr, tzustiegenr, einteilungsfolge, uhrzeit_ha – nur diese Felder werden aus dem Body übernommen, alle anderen ignoriert (mindestens ein gültiges Feld nötig, sonst „Keine gueltigen Felder uebergeben.“).

  **Hinweis:** `nr` ist Primärschlüssel und NOT NULL – vorher über `/fahrtenplanung/gett_z_einteilungkey` den nächsten Wert holen und im Body mitsenden. `uhrzeit_ha` ist ein CHAR-Feld mit max. 6 Zeichen.

  **Body:** `{ "nr": <wert>, "zwegenr": <wert>, "tzustiegenr": <wert>, "einteilungsfolge": <wert>, "uhrzeit_ha": "..." }`

  **Auth:** erforderlich (Bearer Token); zusätzlich Rollenprüfung gegen REGISTRIERUNG.ROLLEN (leer/Supervisor/passende Rolle oder Endpunkt, sonst 403)

  **LocalOnly:** nein (auch extern erreichbar)

  **Antwort:** `{"status":"OK"}`
