info:
  name: GET /fahrtenplanung/gett_knoten – Knoten auflisten
  type: http
  seq: 36

http:
  method: GET
  url: "{{baseURL}}/fahrtenplanung/gett_knoten"
  body:
    type: json
    data: |-
      {
        "fields": "*",
        "orderby": "nr"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Listet alle Datensätze aus T_KNOTEN auf (generisches `DoSelect`).

  **Tabelle:** T_KNOTEN

  **Erlaubte Felder (ALLOWED):** nr, zubringer, reisenr, datum, land, ort, region, zielknoten, reihenfolge, art, geraet, zielknotenhaltnr, knotenladen, internet, sortierung

  **Body:** `{ "fields": [...] | "*", "orderby": "<feld>" }` – zusätzlich `limit`, `offset`. Der Body muss ein gültiges JSON-Objekt sein (mindestens `{}`).

  **Auth:** erforderlich (Bearer Token); zusätzlich Rollenprüfung gegen REGISTRIERUNG.ROLLEN (leer/Supervisor/passende Rolle oder Endpunkt, sonst 403)

  **LocalOnly:** nein (auch extern erreichbar)

  **Antwort:** `{"header":{"feld":"typ",...},"data":[{...},...]}`
