info:
  name: POST /fahrtenplanung/updatet_z_einteilung – Einteilung ändern
  type: http
  seq: 34

http:
  method: POST
  url: "{{baseURL}}/fahrtenplanung/updatet_z_einteilung"
  body:
    type: json
    data: |-
      {
        "nr": 42,
        "einteilungsfolge": 2,
        "uhrzeit_ha": "07:35"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Ändert einen Datensatz in T_Z_EINTEILUNG anhand des Primärschlüssels `nr` (generisches `DoUpdate`).

  **Tabelle:** T_Z_EINTEILUNG

  **Erlaubte Felder (ALLOWED):** zwegenr, tzustiegenr, einteilungsfolge, uhrzeit_ha – nur übergebene Felder werden geändert.

  **Key-Feld:** `nr` (Pflicht, wird selbst nicht geändert)

  **Body:** `{ "nr": <wert>, "einteilungsfolge": <wert>, "uhrzeit_ha": "...", ... }`

  **Auth:** erforderlich (Bearer Token); zusätzlich Rollenprüfung gegen REGISTRIERUNG.ROLLEN (leer/Supervisor/passende Rolle oder Endpunkt, sonst 403)

  **LocalOnly:** nein (auch extern erreichbar)

  **Antwort:** `{"status":"OK"}`
