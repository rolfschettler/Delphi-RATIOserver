info:
  name: GET /fahrtenplanung/gett_knotenfiltered – Knoten gefiltert
  type: http
  seq: 37

http:
  method: GET
  url: "{{baseURL}}/fahrtenplanung/gett_knotenfiltered"
  body:
    type: json
    data: |-
      {
        "fields": "*",
        "reisenr": 42,
        "orderby": "reihenfolge"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Listet Datensätze aus T_KNOTEN gefiltert auf (generisches `DoSelectFilteredDynamic`).

  **Tabelle:** T_KNOTEN

  **Erlaubte Felder (ALLOWED):** nr, zubringer, reisenr, datum, land, ort, region, zielknoten, reihenfolge, art, geraet, zielknotenhaltnr, knotenladen, internet, sortierung

  **Filterparameter (alle optional, AND-verknüpft, je `feld = :feld`):** nr, zubringer, reisenr, datum, land, ort, region, zielknoten, reihenfolge, art, geraet, zielknotenhaltnr, knotenladen, internet, sortierung – nur im Body vorhandene (nicht-null) Parameter erzeugen eine WHERE-Bedingung; ohne Filter werden alle Datensätze geliefert.

  **Hinweis:** `land`, `ort`, `region`, `art`, `knotenladen`, `internet` sind CHAR-Felder (feste Länge) – Vergleich per Gleichheit. `datum` ist ein Zeitstempel; der Filter trifft nur exakt gleiche Werte.

  **Body:** `{ "fields": [...] | "*", "reisenr": <wert>, "zubringer": <wert>, ... }` – zusätzlich `orderby` (ALLOWED-Feld), `limit`, `offset`. Der Body muss ein gültiges JSON-Objekt sein (mindestens `{}`), sonst Fehler.

  **Auth:** erforderlich (Bearer Token); zusätzlich Rollenprüfung gegen REGISTRIERUNG.ROLLEN (leer/Supervisor/passende Rolle oder Endpunkt, sonst 403)

  **LocalOnly:** nein (auch extern erreichbar)

  **Antwort:** ohne `limit` das Ergebnis von `SerializeQuery`: `{"header":{"feld":"typ",...},"data":[{...},...]}`; mit `limit` > 0 `{"total":N,"limit":N,"offset":N,"data":{"header":{...},"data":[...]}}`.
