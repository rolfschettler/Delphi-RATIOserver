info:
  name: POST /fahrtenplanung/deletet_z_fahrzeug – Fahrzeug löschen
  type: http
  seq: 21

http:
  method: POST
  url: "{{baseURL}}/fahrtenplanung/deletet_z_fahrzeug"
  body:
    type: json
    data: |-
      {
        "nr": 42
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  **Fahrzeug löschen.** Löscht einen Eintrag aus `T_Z_FAHRZEUG` endgültig.

  | | |
  |---|---|
  | **Aufruf** | `POST {{baseURL}}/fahrtenplanung/deletet_z_fahrzeug` |
  | **Anmeldung** | nötig – Token aus `/login` (wird in Bruno automatisch mitgeschickt) |
  | **Berechtigung** | Der Benutzer braucht diesen Endpunkt in seinen Rollen (sonst Fehler 403) |

  ### Was du mitschickst
  | Parameter | Wert | Pflicht | Bedeutung |
  |---|---|---|---|
  | `nr` | Ganzzahl | **ja** | Welcher Eintrag gelöscht wird. |

  ### Was zurückkommt
  ```json
  {"status": "OK"}
  ```

  ### Was schiefgehen kann
  - **401** – nicht angemeldet oder Token abgelaufen → neu einloggen.
  - **403** – keine Berechtigung für diesen Endpunkt.
  - **400** mit Fehlermeldung – die Datenbank lehnt die Daten ab, z.B. bei einem ungültigen Wert für den Schlüssel.
  - **Fehlermeldung mit Status 200** (`{"status":"error","message":"..."}`), z.B. wenn `nr` fehlt – deshalb immer auf `"status": "error"` prüfen.

  ### Gut zu wissen
  - **Endgültig:** Es gibt keinen Papierkorb und kein Rückgängig.
  - **Keine Meldung, wenn es den Eintrag nicht gibt:** Auch dann kommt `{"status": "OK"}`.
  - **Abhängige Daten:** Die Datenbank kennt keine festen Verknüpfungen zu dieser Tabelle – es wird nichts mitgelöscht und nichts blockiert. Daten, die nur über die Nummer auf den Eintrag zeigen, bleiben stehen.

  <details><summary>Für Entwickler</summary>

  - Controller: `TDataModulFahrtenplanung.deleteT_Z_Fahrzeug` in `Shared/DataModuls/DataModulFahrtenplanungClass.pas`
  - Tabelle: `T_Z_FAHRZEUG`, Schlüssel `nr`
  - Umsetzung: generische Methode `DoDelete` der Basisklasse `TDataModulTableBase`
  - Der Server wertet die HTTP-Methode nicht aus – GET und POST funktionieren gleich.

  </details>
