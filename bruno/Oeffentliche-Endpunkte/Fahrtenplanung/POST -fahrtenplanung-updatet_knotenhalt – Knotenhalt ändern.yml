info:
  name: POST /fahrtenplanung/updatet_knotenhalt – Knotenhalt ändern
  type: http
  seq: 48

http:
  method: POST
  url: "{{baseURL}}/fahrtenplanung/updatet_knotenhalt"
  body:
    type: json
    data: |-
      {
        "nr": 42,
        "zeit": "07:35",
        "sortierung": 2
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  **Knotenhalt ändern.** Ändert einen vorhandenen Eintrag in `T_KNOTENHALT`. Gefunden wird er über `nr`.

  | | |
  |---|---|
  | **Aufruf** | `POST {{baseURL}}/fahrtenplanung/updatet_knotenhalt` |
  | **Anmeldung** | nötig – Token aus `/login` (wird in Bruno automatisch mitgeschickt) |
  | **Berechtigung** | Der Benutzer braucht diesen Endpunkt in seinen Rollen (sonst Fehler 403) |

  ### Was du mitschickst
  | Parameter | Wert | Pflicht | Bedeutung |
  |---|---|---|---|
  | `nr` | Ganzzahl | **ja** | Welcher Eintrag geändert wird. |
  | weitere Felder | siehe Liste | mind. eins | Nur die mitgeschickten Felder werden geändert. `null` macht ein Feld leer. |

  ### Änderbare Felder
  | Feld | Typ |
  |---|---|
  | `knoten` | Ganzzahl |
  | `halt` | Ganzzahl |
  | `datum` | Datum/Uhrzeit |
  | `zeit` | Text (max. 5 Zeichen) |
  | `zuschlag` | Kommazahl |
  | `internet` | Text (max. 4 Zeichen) |
  | `sortierung` | Ganzzahl |
  | `inhouse` | Text (max. 4 Zeichen) |
  | `maximumpers` | Ganzzahl |
  | `exportierbar` | Text (max. 4 Zeichen) |

  ### Was zurückkommt
  ```json
  {"status": "OK"}
  ```

  ### Was schiefgehen kann
  - **401** – nicht angemeldet oder Token abgelaufen → neu einloggen.
  - **403** – keine Berechtigung für diesen Endpunkt.
  - **400** mit Fehlermeldung – die Datenbank lehnt die Daten ab, z.B. Text zu lang für das Feld oder Buchstaben in einem Zahlenfeld.
  - **Fehlermeldung mit Status 200** (`{"status":"error","message":"..."}`), z.B. wenn kein einziges gültiges Feld mitgeschickt wurde – deshalb immer auf `"status": "error"` prüfen.

  ### Gut zu wissen
  - **Nur mitgeschickte Felder werden geändert**, alle anderen bleiben, wie sie sind.
  - **Keine Meldung, wenn es den Eintrag nicht gibt:** Auch bei einem falschen oder fehlenden `nr` kommt `{"status": "OK"}` – geändert wurde dann aber nichts.
  - `nr` selbst lässt sich hier nicht ändern.
  - **Unbekannte Felder werden ohne Meldung ignoriert** – ein Tippfehler im Feldnamen fällt also nicht auf.

  <details><summary>Für Entwickler</summary>

  - Controller: `TDataModulFahrtenplanung.updateT_Knotenhalt` in `Shared/DataModuls/DataModulFahrtenplanungClass.pas`
  - Tabelle: `T_KNOTENHALT`, Schlüssel `nr`
  - Umsetzung: generische Methode `DoUpdate` der Basisklasse `TDataModulTableBase`
  - Der Server wertet die HTTP-Methode nicht aus – GET und POST funktionieren gleich.

  </details>
