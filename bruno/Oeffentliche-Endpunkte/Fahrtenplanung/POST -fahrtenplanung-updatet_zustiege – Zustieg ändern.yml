info:
  name: POST /fahrtenplanung/updatet_zustiege – Zustieg ändern
  type: http
  seq: 55

http:
  method: POST
  url: "{{baseURL}}/fahrtenplanung/updatet_zustiege"
  body:
    type: json
    data: |-
      {
        "nr": 42,
        "platznummer": "14B"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Ändert einen Datensatz in T_ZUSTIEGE anhand des Primärschlüssels `nr` (generisches `DoUpdate`).

  **Tabelle:** T_ZUSTIEGE

  **Erlaubte Felder (ALLOWED):** knotenhaltnr, teilnehmernr, art, richtung, platznummer – nur übergebene Felder werden geändert.

  **Key-Feld:** `nr` (Pflicht, wird selbst nicht geändert)

  **Body:** `{ "nr": <wert>, "platznummer": "...", ... }`

  **Auth:** erforderlich (Bearer Token); zusätzlich Rollenprüfung gegen REGISTRIERUNG.ROLLEN (leer/Supervisor/passende Rolle oder Endpunkt, sonst 403)

  **LocalOnly:** nein (auch extern erreichbar)

  **Antwort:** `{"status":"OK"}`
