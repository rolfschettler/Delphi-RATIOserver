info:
  name: GET /fahrtenplanung/gett_haltestellefiltered – Haltestellen gefiltert
  type: http
  seq: 58

http:
  method: GET
  url: "{{baseURL}}/fahrtenplanung/gett_haltestellefiltered"
  body:
    type: json
    data: |-
      {
        "fields": "*",
        "plz": "12345",
        "orderby": "sortierung"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Listet Datensätze aus T_HALTESTELLE gefiltert auf (generisches `DoSelectFilteredDynamic`).

  **Tabelle:** T_HALTESTELLE

  **Erlaubte Felder (ALLOWED):** nr, land, plz, ort, strasse, gesperrt, xkoord, ykoord, code, zuschlag, bezeichnung, hausabholung, sortierung, externenr1, externenr2, internet, exportierbar

  **Filterparameter (alle optional, AND-verknüpft, je `feld = :feld`):** nr, land, plz, ort, strasse, gesperrt, xkoord, ykoord, code, zuschlag, bezeichnung, hausabholung, sortierung, externenr1, externenr2, internet, exportierbar – nur im Body vorhandene (nicht-null) Parameter erzeugen eine WHERE-Bedingung; ohne Filter werden alle Datensätze geliefert.

  **Hinweis:** Die Textfelder sind überwiegend CHAR-Felder (feste Länge), `externenr1`/`externenr2` VARCHAR(255) – Vergleich jeweils per exakter Gleichheit (kein LIKE). `zuschlag` ist eine Gleitkommazahl; der Filter trifft nur exakt gleiche Werte.

  **Body:** `{ "fields": [...] | "*", "plz": "...", "ort": "...", ... }` – zusätzlich `orderby` (ALLOWED-Feld), `limit`, `offset`. Der Body muss ein gültiges JSON-Objekt sein (mindestens `{}`), sonst Fehler.

  **Auth:** erforderlich (Bearer Token); zusätzlich Rollenprüfung gegen REGISTRIERUNG.ROLLEN (leer/Supervisor/passende Rolle oder Endpunkt, sonst 403)

  **LocalOnly:** nein (auch extern erreichbar)

  **Antwort:** ohne `limit` das Ergebnis von `SerializeQuery`: `{"header":{"feld":"typ",...},"data":[{...},...]}`; mit `limit` > 0 `{"total":N,"limit":N,"offset":N,"data":{"header":{...},"data":[...]}}`.
