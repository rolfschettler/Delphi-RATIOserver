info:
  name: GET /dispo/getliniewegeobjektebyid – Linienwegeobjekt per Nr abrufen
  type: http
  seq: 22

http:
  method: GET
  url: "{{baseURL}}/dispo/getliniewegeobjektebyid"
  body:
    type: json
    data: |-
      {
        "nr": 42,
        "fields": "*"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  **Linienwegeobjekt per Nr abrufen.** Liefert genau einen Eintrag aus `LINIEWEGEOBJEKTE`, gesucht über `nr`.

  | | |
  |---|---|
  | **Aufruf** | `GET {{baseURL}}/dispo/getliniewegeobjektebyid` |
  | **Anmeldung** | nötig – Token aus `/login` (wird in Bruno automatisch mitgeschickt) |
  | **Berechtigung** | Der Benutzer braucht diesen Endpunkt in seinen Rollen (sonst Fehler 403) |

  ### Was du mitschickst
  | Parameter | Wert | Pflicht | Bedeutung |
  |---|---|---|---|
  | `nr` | Ganzzahl | **ja** | Der gesuchte Eintrag. |
  | `fields` | `"*"` oder Liste | nein | Welche Felder zurückkommen sollen. Weglassen = alle. |

  ### Verfügbare Felder
  | Feld | Typ |
  |---|---|
  | `nr` | Ganzzahl |
  | `art` | Text (max. 20 Zeichen) |
  | `beschreibung` | Text (max. 80 Zeichen) |
  | `imageindex` | Ganzzahl |
  | `dauer` | Text (max. 8 Zeichen) |
  | `farbe` | Ganzzahl |
  | `fahrerkostenkm` | Kommazahl |
  | `fahrerkostenstd` | Kommazahl |
  | `fahrzeugkostenkm` | Kommazahl |
  | `fahrzeugkostenstd` | Kommazahl |
  | `profil` | Ganzzahl |
  | `system` | Ganzzahl |
  | `eart` | Text (max. 1 Zeichen) |
  | `lohnart` | Ganzzahl |

  ### Was zurückkommt
  ```json
  {"header": {...}, "data": [ {"nr": 42, "art": "Text", "beschreibung": "Text", ...} ]}
  ```

  ### Was schiefgehen kann
  - **401** – nicht angemeldet oder Token abgelaufen → neu einloggen.
  - **403** – keine Berechtigung für diesen Endpunkt.
  - **Fehlermeldung im Text** (`{"status":"error","message":"..."}`), z.B. wenn ein Feldname in `fields` oder `orderby` nicht erlaubt ist. Achtung: Solche Fehler kommen teilweise mit HTTP-Status 200 – deshalb immer auf `"status": "error"` prüfen.

  ### Gut zu wissen
  - **Nicht gefunden = leere Liste:** Gibt es den Eintrag nicht, kommt kein Fehler, sondern `"data": []`.
  - **`nr` muss mitgeschickt werden**, sonst kommt eine Fehlermeldung.

  <details><summary>Für Entwickler</summary>

  - Controller: `TDataModulDispo.getLiniewegeobjekteById` in `Shared/DataModuls/DataModulDispoClass.pas`
  - Tabelle: `LINIEWEGEOBJEKTE`, Schlüssel `nr`
  - Umsetzung: generische Methode `DoSelectOne` der Basisklasse `TDataModulTableBase`
  - Der Server wertet die HTTP-Methode nicht aus – GET und POST funktionieren gleich.

  </details>
