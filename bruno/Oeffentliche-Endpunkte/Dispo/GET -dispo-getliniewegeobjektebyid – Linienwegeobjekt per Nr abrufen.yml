docs: |-
  Liefert genau einen Datensatz aus LINIEWEGEOBJEKTE anhand des Primärschlüssels. Implementierung: `DoSelectOne('LINIEWEGEOBJEKTE', ALLOWED, 'nr')`. Body: `{"nr":<Nr>,"fields":[...]|"*"}`.

  **Erlaubte Felder:** identisch zu `/dispo/getliniewegeobjekte` (14 Felder, siehe dort).

  **Antwort:** `{"header":{...},"data":[{...}]}` – 0 oder 1 Datensatz.

  **Auth:** erforderlich (Bearer Token). **LocalOnly:** nein.
