info:
  name: GET /dispo/getliniewegeobjektefiltered – Linienwegeobjekte filtern
  type: http
  seq: 23

http:
  method: GET
  url: "{{baseURL}}/dispo/getliniewegeobjektefiltered"
  body:
    type: json
    data: |-
      {
        "fields": "*",
        "art": "HALT",
        "profil": 1,
        "orderby": "nr"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Implementierung: `DoSelectFilteredDynamic('LINIEWEGEOBJEKTE', ALLOWED, CONDITIONS, FILTER_PARAMS)`. Alle 14 ALLOWED-Felder sind zugleich Filterparameter (jeweils `feld = :feld`), alle optional, AND-verknüpft.

  **Filter-/ALLOWED-Felder (14):** nr, art, beschreibung, imageindex, dauer, farbe, fahrerkostenkm, fahrerkostenstd, fahrzeugkostenkm, fahrzeugkostenstd, profil, system, eart, lohnart.

  **Antwort:** ohne `limit` `{"header":{...},"data":[...]}`; mit `limit` `{"total":N,"limit":N,"offset":N,"data":{"header":{...},"data":[...]}}`.

  **Auth:** erforderlich (Bearer Token). **LocalOnly:** nein.
