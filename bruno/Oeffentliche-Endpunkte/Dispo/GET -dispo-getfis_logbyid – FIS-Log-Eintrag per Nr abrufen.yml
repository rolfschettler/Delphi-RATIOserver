info:
  name: GET /dispo/getfis_logbyid – FIS-Log-Eintrag per Nr abrufen
  type: http
  seq: 17

http:
  method: GET
  url: "{{baseURL}}/dispo/getfis_logbyid"
  body:
    type: json
    data: |-
      {
        "nr": 9001,
        "fields": "*"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Liefert genau einen Datensatz aus FIS_LOG anhand des Primärschlüssels. Implementierung: `DoSelectOne('FIS_LOG', ALLOWED, 'nr')`. Body: `{"nr":<FIS_LOG-Nr>,"fields":[...]|"*"}`.

  **Erlaubte Felder:** identisch zu `/dispo/getfis_log` (30 Felder, siehe dort).

  **Antwort:** `{"header":{...},"data":[{...}]}` – 0 oder 1 Datensatz.

  **Auth:** erforderlich (Bearer Token). **LocalOnly:** nein.
