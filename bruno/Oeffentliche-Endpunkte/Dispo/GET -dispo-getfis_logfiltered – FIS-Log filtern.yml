info:
  name: GET /dispo/getfis_logfiltered – FIS-Log filtern
  type: http
  seq: 18

http:
  method: GET
  url: "{{baseURL}}/dispo/getfis_logfiltered"
  body:
    type: json
    data: |-
      {
        "fields": "*",
        "einsatznr": 4711,
        "datum": "2026-09-01",
        "fahrer": "MM",
        "orderby": "datum"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  **FIS-Log filtern.** Sucht Einträge in `FIS_LOG` – du gibst die Suchkriterien als Felder im Body mit.

  | | |
  |---|---|
  | **Aufruf** | `GET {{baseURL}}/dispo/getfis_logfiltered` |
  | **Anmeldung** | nötig – Token aus `/login` (wird in Bruno automatisch mitgeschickt) |
  | **Berechtigung** | Der Benutzer braucht diesen Endpunkt in seinen Rollen (sonst Fehler 403) |

  ### Suchkriterien (Filter)
  **Alle Felder außer Blobfeldern und Passwortfeldern können als Filterparameter verwendet werden.**

  So funktioniert die Suche:
  - Jedes mitgeschickte Feld ist ein Kriterium, z.B. `{"ort": "Berlin"}`.
  - **Mehrere Kriterien müssen alle zutreffen** (UND): `{"ort": "Berlin", "plz": "10115"}`.
  - **Der Wert muss genau stimmen** – keine Teilsuche, Groß-/Kleinschreibung zählt („berlin“ findet nicht „Berlin“).
  - Datum als `"2026-09-01"` oder mit Uhrzeit `"2026-09-01 08:00:00"`. Bei Feldern mit Uhrzeit findet ein reines Datum nur Einträge um 00:00 Uhr.
  - Ohne Kriterien kommen alle Einträge.

  **Besondere Kriterien in diesem Endpunkt:**
  - `datum`: vergleicht nur das **Datum** von `datum` – die Uhrzeit spielt keine Rolle.

  ### Weitere Angaben (optional)
  | Parameter | Wert | Pflicht | Bedeutung |
  |---|---|---|---|
  | `fields` | `"*"` oder Liste, z.B. `["nr","bezeichnung"]` | nein | Welche Felder zurückkommen sollen. `"*"` oder weglassen = alle Felder aus der Liste unten. |
  | `orderby` | Feldname | nein | Sortierung nach genau einem Feld, aufsteigend. |
  | `limit` | Zahl | nein | Höchstens so viele Datensätze liefern (zum Blättern). Weglassen = alle. |
  | `offset` | Zahl | nein | So viele Datensätze überspringen (nur zusammen mit `limit`). Beispiel: `limit` 20 und `offset` 40 = Seite 3. |

  ### Verfügbare Felder (für `fields` und `orderby`)
  | Feld | Typ |
  |---|---|
  | `nr` | Ganzzahl |
  | `datum` | Datum/Uhrzeit |
  | `xkoord` | Text (max. 20 Zeichen) |
  | `ykoord` | Text (max. 20 Zeichen) |
  | `status` | Text (max. 4 Zeichen) |
  | `einsatznr` | Ganzzahl |
  | `taetigkeit` | Ganzzahl |
  | `herkunft` | Text (max. 20 Zeichen) |
  | `fahrer` | Text (max. 30 Zeichen) |
  | `fahrzeug` | Text (max. 30 Zeichen) |
  | `zusatzfeld1` | Text (max. 60 Zeichen) |
  | `zusatzfeld2` | Text (max. 60 Zeichen) |
  | `kmstand` | Ganzzahl |
  | `distance` | Ganzzahl |
  | `dauer` | Ganzzahl |
  | `fremdnr` | Ganzzahl |
  | `text` | Text (max. 500 Zeichen) |
  | `standort` | Text (max. 255 Zeichen) |
  | `zeitpunkt` | Datum/Uhrzeit |
  | `sortierung` | Ganzzahl |
  | `loginname` | Text (max. 20 Zeichen) |
  | `art` | Text (max. 3 Zeichen) |
  | `textfeld1` | Text (max. 255 Zeichen) |
  | `textfeld2` | Text (max. 255 Zeichen) |
  | `textfeld3` | Text (max. 255 Zeichen) |
  | `datumfeld1` | Datum/Uhrzeit |
  | `datumfeld2` | Datum/Uhrzeit |
  | `datumfeld3` | Datum/Uhrzeit |
  | `wert` | Text (max. 3200 Zeichen) |
  | `erledigt_am` | Datum/Uhrzeit |

  ### Was zurückkommt
  ```json
  {
    "header": {"nr": "ftinteger", ...},
    "data": [ {"nr": 42, "datum": "2026-09-01 08:00:00", "xkoord": "Text", ...} ]
  }
  ```
  `data` enthält die Datensätze, `header` nennt zu jedem Feld den technischen Typ. **Mit `limit`** sieht die Antwort so aus: `{"total": 123, "limit": 20, "offset": 0, "data": { "header": ..., "data": [...] }}` – `total` ist die Gesamtzahl aller Treffer.

  ### Was schiefgehen kann
  - **401** – nicht angemeldet oder Token abgelaufen → neu einloggen.
  - **403** – keine Berechtigung für diesen Endpunkt.
  - **Fehlermeldung im Text** (`{"status":"error","message":"..."}`), z.B. wenn ein Feldname in `fields` oder `orderby` nicht erlaubt ist. Achtung: Solche Fehler kommen teilweise mit HTTP-Status 200 – deshalb immer auf `"status": "error"` prüfen.

  ### Gut zu wissen
  - **Achtung bei Tippfehlern:** Ein falsch geschriebener Feldname wird einfach ignoriert – dann kommen *alle* Einträge statt der gesuchten.
  - Der Body muss mindestens `{}` sein, sonst kommt ein Fehler.

  <details><summary>Für Entwickler</summary>

  - Controller: `TDataModulDispo.getFis_LogFiltered` in `Shared/DataModuls/DataModulDispoClass.pas`
  - Tabelle: `FIS_LOG`, Schlüssel `nr`
  - Umsetzung: generische Methode `DoSelectFilteredDynamic` der Basisklasse `TDataModulTableBase`; Filter über `CONDITIONS`/`FILTER_PARAMS`
  - Der Server wertet die HTTP-Methode nicht aus – GET und POST funktionieren gleich.

  </details>
