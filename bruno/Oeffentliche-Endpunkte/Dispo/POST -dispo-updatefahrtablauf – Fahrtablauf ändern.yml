info:
  name: POST /dispo/updatefahrtablauf – Fahrtablauf ändern
  type: http
  seq: 39

http:
  method: POST
  url: "{{baseURL}}/dispo/updatefahrtablauf"
  body:
    type: json
    data: |-
      {
        "nr": 42,
        "bis_ist": "2026-09-01 06:22:00",
        "geprueft": true
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
