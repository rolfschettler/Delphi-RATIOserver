  ### Was zurückkommt
  ```json
  {
    "header": {"nr": "ftinteger", "von": "ftdatetime", ...},
    "data": [ {"nr": 4711, "von": "2026-09-03 07:30:00", "bis": "2026-09-03 16:00:00", "fahrer1": "MU", ...} ]
  }
  ```
  `data` enthält die Einsätze, `header` nennt zu jedem Feld den technischen Typ. **Mit `limit`** sieht die Antwort so aus: `{"total": 123, "limit": 20, "offset": 0, "data": { "header": ..., "data": [...] }}` – `total` ist die Gesamtzahl aller Treffer.

  ### Was schiefgehen kann
  - **401** – nicht angemeldet oder Token abgelaufen → neu einloggen.
  - **403** – keine Berechtigung für diesen Endpunkt.
  - **400** mit Fehlermeldung – die Datenbank kann einen Wert nicht verarbeiten, z.B. ein ungültiges Datum.
  - **Fehlermeldung mit Status 200** (`{"status":"error","message":"..."}`) – deshalb immer auf `"status": "error"` prüfen:
    - `Kein gueltiges JSON im Request-Body.` – Body fehlt oder ist kein JSON-Objekt.
    - `Feld "x" ist nicht erlaubt.` bzw. `Sortierfeld "x" ist nicht erlaubt.` – unbekannter Feldname in `fields` oder `orderby`.

  ### Gut zu wissen
  - **Ohne `von` und `bis` kommt eine leere Liste** – keine Fehlermeldung. Beide Angaben deshalb immer mitschicken.
  - **`timemode` in der URL genau so schreiben: `overlaps_range`** (klein). Im Body ist die Schreibweise egal. Steht `timemode` in der URL, gilt dieser Wert und der Body wird dafür nicht mehr gelesen. In Bruno ist der URL-Parameter vorbereitet und muss nur aktiviert werden.
  - **Fahrer-Feldnamen klein schreiben.** Bei `"Fahrer1"` statt `"fahrer1"` kommt eine leere Liste.
  - **Nicht abrufbar:** `refnr` und `reftable` gibt es in der Tabelle, sie stehen aber nicht in der Feldliste. `fahrtenplan` (Langtext) kannst du abrufen, aber nicht danach suchen.
  - **Achtung bei Tippfehlern:** Unbekannte Angaben werden ohne Meldung ignoriert.
  - **Der Body muss mindestens `{}` sein**, sonst kommt ein Fehler.

  <details><summary>Für Entwickler</summary>

  - Controller: `TDataModulDispo.getEinsatzFiltered` in `Shared/DataModuls/DataModulDispoClass.pas`
  - Tabelle: `EINSATZ`, Schlüssel `nr`
  - Umsetzung: `DoSelectFiltered` der Basisklasse `TDataModulTableBase` mit festem Filter: Standard `von >= :von AND von <= :bis`, bei `overlaps_range` `bis >= :von AND von <= :bis`; gesetzte Fahrerfilter werden als `fahrerN = :fahrerN` angehängt.
  - `timemode`: zuerst `Request.QueryFields`, nur wenn leer aus dem Body (Schlüssel `timemode` case-sensitiv, Wert per `LowerCase`); der URL-Wert wird nicht umgewandelt.
  - Fehlende `von`/`bis` werden als NULL gebunden → Bedingung nie erfüllt → leeres Ergebnis (anders als bei `getdispofiltered`/`geturlaubsantragfiltered`, die einen Fehler melden).
  - Auffälligkeit: Ob ein Fahrerfilter angehängt wird, prüft `isParamFromBody` (ohne Beachtung der Groß-/Kleinschreibung); der Wert wird in `DoSelectFiltered` aber über `Body.GetValue` (case-sensitiv) gelesen. Bei `"Fahrer1"` wird die Bedingung also angehängt, der Wert als NULL gebunden → leeres Ergebnis.
  - Der Server wertet die HTTP-Methode nicht aus – GET und POST funktionieren gleich.

  </details>
