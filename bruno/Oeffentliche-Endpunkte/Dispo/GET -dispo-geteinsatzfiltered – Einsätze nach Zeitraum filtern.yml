info:
  name: GET /dispo/geteinsatzfiltered – Einsätze nach Zeitraum filtern
  type: http
  seq: 10

http:
  method: GET
  url: "{{baseURL}}/dispo/geteinsatzfiltered"
  params:
    - name: timemode
      value: overlaps_range
      type: query
      disabled: true
  body:
    type: json
    data: |-
      {
        "fields": "*",
        "von": "2026-09-01 00:00:00",
        "bis": "2026-09-30 23:59:59",
        "orderby": "von"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  **Einsätze nach Zeitraum filtern.** Liefert die Einsätze (Fahrten bzw. Dienste mit Fahrzeug und Fahrern) in einem Zeitraum – auf Wunsch nur für bestimmte Fahrer.

  | | |
  |---|---|
  | **Aufruf** | `GET {{baseURL}}/dispo/geteinsatzfiltered` |
  | **Anmeldung** | nötig – Token aus `/login` (wird in Bruno automatisch mitgeschickt) |
  | **Berechtigung** | Der Benutzer braucht diesen Endpunkt in seinen Rollen (sonst Fehler 403) |

  ### Suchkriterien (Filter)
  **Alle Felder außer Blobfeldern und Passwortfeldern können als Filterparameter verwendet werden.**
  **Ausnahme in diesem Endpunkt:** Hier gibt es nur den Zeitraum (`von` + `bis`, Art der Suche über `timemode`) und die drei Fahrerfelder `fahrer1`, `fahrer2`, `fahrer3`. Alle anderen Felder kannst du nicht als Suchkriterium verwenden – sie werden ignoriert.

  | Parameter | Wert | Pflicht | Bedeutung |
  |---|---|---|---|
  | `von` | Datum/Uhrzeit, im Body | ja (siehe Gut zu wissen) | Beginn des Zeitraums, z.B. `"2026-09-01 00:00:00"` |
  | `bis` | Datum/Uhrzeit, im Body | ja (siehe Gut zu wissen) | Ende des Zeitraums, z.B. `"2026-09-30 23:59:59"` |
  | `timemode` | Text, in der URL (`?timemode=overlaps_range`) oder im Body | nein | Wie der Zeitraum gesucht wird (siehe unten) |
  | `fahrer1` | Text (max. 30 Zeichen), im Body | nein | nur Einsätze mit genau diesem ersten Fahrer |
  | `fahrer2` | Text (max. 30 Zeichen), im Body | nein | nur Einsätze mit genau diesem zweiten Fahrer |
  | `fahrer3` | Text (max. 30 Zeichen), im Body | nein | nur Einsätze mit genau diesem dritten Fahrer |

  **So wird der Zeitraum gesucht:**
  - **Standard** (ohne `timemode`): Einsätze, die im Zeitraum **beginnen**.
  - **`timemode` = `overlaps_range`:** alle Einsätze, die den Zeitraum ganz oder teilweise **berühren** – auch solche, die vorher beginnen und in den Zeitraum hineinlaufen.
  - Mitgeschickte Fahrerfilter müssen zusätzlich zutreffen (UND). Der Wert muss genau stimmen – keine Teilsuche, Groß-/Kleinschreibung zählt.

  ### Weitere Angaben (optional)
  | Parameter | Wert | Pflicht | Bedeutung |
  |---|---|---|---|
  | `fields` | `"*"` oder Liste, z.B. `["nr","von","bis","fahrer1"]` | nein | Welche Felder zurückkommen sollen. `"*"` oder weglassen = alle Felder aus der Liste unten. |
  | `orderby` | Feldname | nein | Sortierung nach genau einem Feld, aufsteigend. |
  | `limit` | Zahl | nein | Höchstens so viele Datensätze liefern (zum Blättern). Weglassen = alle. |
  | `offset` | Zahl | nein | So viele Datensätze überspringen (nur zusammen mit `limit`). Beispiel: `limit` 20 und `offset` 40 = Seite 3. |

