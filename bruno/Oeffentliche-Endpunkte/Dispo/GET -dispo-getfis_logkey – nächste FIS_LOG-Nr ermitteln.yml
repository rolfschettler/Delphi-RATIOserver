info:
  name: GET /dispo/getfis_logkey – nächste FIS_LOG-Nr ermitteln
  type: http
  seq: 19

http:
  method: GET
  url: "{{baseURL}}/dispo/getfis_logkey"
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Liefert den nächsten Primärschlüsselwert für FIS_LOG über den InterBase-Generator: `SELECT GEN_ID(FIS_LOG_NR_GEN,1) AS NR FROM RDB$DATABASE`. Kein Body erforderlich.

  **Antwort:** `{"header":{"nr":"ftinteger"},"data":[{"nr":9002}]}` (Generator-Wert wird bei jedem Aufruf hochgezählt).

  **Auth:** erforderlich (Bearer Token). **LocalOnly:** nein.
