info:
  name: GET /dispo/getdispotourfiltered – Dispotouren filtern
  type: http
  seq: 48

http:
  method: GET
  url: "{{baseURL}}/dispo/getdispotourfiltered"
  body:
    type: json
    data: |-
      {
        "fields": "*",
        "firma": "1",
        "orderby": "bezeichnung"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Implementierung: `DoSelectFilteredDynamic('DISPOTOUR', ALLOWED, CONDITIONS, FILTER_PARAMS)`. Jeder im Body gesetzte (nicht-null) Filterparameter erzeugt eine AND-verknüpfte WHERE-Bedingung, alle sind optional.

  **Filterparameter (5):**
  - `nr` → `nr = :nr`
  - `bezeichnung` → `bezeichnung = :bezeichnung`
  - `bemerkung` → `bemerkung = :bemerkung`
  - `firma` → `firma = :firma`
  - `dienstnr` → `dienstnr = :dienstnr`

  **Erlaubte Felder (ALLOWED, 58):** identisch zu `/dispo/getdispotour` (siehe dort).

  **Body:** `{"fields":[...]|"*","nr":N,"bezeichnung":"...","bemerkung":"...","firma":"...","dienstnr":"...","orderby":"feld","limit":10,"offset":0}` – ein gültiges JSON-Objekt ist Pflicht (ggf. `{}`).

  **Auth:** erforderlich (Bearer Token). **LocalOnly:** nein.

  **Antwort:** ohne `limit` `{"header":{...},"data":[...]}`; mit `limit` `{"total":N,"limit":N,"offset":N,"data":{"header":{...},"data":[...]}}`.
