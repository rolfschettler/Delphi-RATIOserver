info:
  name: GET /dispo/getdispo – Dispo-Einträge auflisten
  type: http
  seq: 43

http:
  method: GET
  url: "{{baseURL}}/dispo/getdispo"
  body:
    type: json
    data: |-
      {
        "fields": "*",
        "orderby": "von"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Listet Datensätze aus der Tabelle DISPO (Personal-/Fahrzeug-Belegungen je Zeitraum) ohne Filter. Implementierung: `DoSelect('DISPO', ALLOWED)`.

  **Erlaubte Felder (ALLOWED, 9):** nr, von, bis, objekt, einsatznr, dienstobjnr, art, bemerkung, fahrtablaufnr.

  **Body (optional):** `{"fields":[...]|"*","orderby":"feld","limit":10,"offset":0}` – `orderby` muss ein ALLOWED-Feld sein.

  **Auth:** erforderlich (Bearer Token). **LocalOnly:** nein.

  **Antwort:** ohne `limit` `{"header":{feld:typ,...},"data":[...]}` (SerializeQuery, Feldnamen klein); mit `limit` `{"total":N,"limit":N,"offset":N,"data":{"header":{...},"data":[...]}}`.
