info:
  name: GET /dispo/geteinsatzarten – Einsatzarten auflisten
  type: http
  seq: 8

http:
  method: GET
  url: "{{baseURL}}/dispo/geteinsatzarten"
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  **Einsatzarten auflisten.** Liefert alle Einsatzarten mit Kürzel, Beschreibung und Farbe – z.B. für eine Auswahlliste. Sortiert nach Kürzel.

  | | |
  |---|---|
  | **Aufruf** | `GET {{baseURL}}/dispo/geteinsatzarten` |
  | **Anmeldung** | nötig – Token aus `/login` (wird in Bruno automatisch mitgeschickt) |
  | **Berechtigung** | Der Benutzer braucht diesen Endpunkt in seinen Rollen (sonst Fehler 403) |

  ### Was du mitschickst
  Nichts – ein Body wird nicht benötigt (und ignoriert).

  ### Was zurückkommt
  ```json
  {
    "header": {"nr": "ftinteger", "code": "ftstring 1", "beschreibung": "ftstring 30", "farbe": "ftinteger"},
    "data": [ {"nr": 1, "code": "A", "beschreibung": "Anmietverkehr", "farbe": 8454143} ]
  }
  ```
  Die Einsatzarten stehen in `data`, je Eintrag diese Felder:

  | Feld | Typ | Bedeutung |
  |---|---|---|
  | `nr` | Ganzzahl | Nummer der Einsatzart |
  | `code` | Text (1 Zeichen) | Kürzel, z.B. `A`, `L`, `T` |
  | `beschreibung` | Text (max. 30 Zeichen) | Bezeichnung, z.B. „Linienverkehr“ |
  | `farbe` | Ganzzahl | Anzeigefarbe als Zahl |

  ### Was schiefgehen kann
  - **401** – nicht angemeldet oder Token abgelaufen → neu einloggen.
  - **403** – keine Berechtigung für diesen Endpunkt.
  - **400** mit Fehlermeldung – Datenbankfehler.

  ### Gut zu wissen
  - **Es kommen immer alle Einsatzarten mit genau diesen vier Feldern.** Angaben wie `fields`, `orderby`, `limit` oder `offset` haben hier keine Wirkung.
  - **`farbe` reicht der Server unverändert aus der Datenbank durch.** Die vorhandenen Werte haben das Delphi-Farbformat (hexadezimal Blau-Grün-Rot): `8454143` = hex `80FFFF` = Hellgelb.

  <details><summary>Für Entwickler</summary>

  - Controller: `TDataModulDispo.geteinsatzarten` in `Shared/DataModuls/DataModulDispoClass.pas`
  - Tabelle: `EINSATZARTEN` (nur lesend)
  - Festes SQL: `SELECT nr, code, beschreibung, farbe FROM einsatzarten ORDER BY code`, in eigener Transaktion.
  - `farbe` als Delphi-`TColor` (`$00BBGGRR`) – im Server-Code nicht interpretiert; Format aus den DB-Werten abgeleitet.
  - Der Server wertet die HTTP-Methode nicht aus.

  </details>
