info:
  name: GET /dispo/getfahrtablaufbyid – Fahrtablauf per Nr abrufen
  type: http
  seq: 13

http:
  method: GET
  url: "{{baseURL}}/dispo/getfahrtablaufbyid"
  body:
    type: json
    data: |-
      {
        "nr": 815,
        "fields": "*"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Liefert genau einen Datensatz aus FAHRTABLAUF anhand des Primärschlüssels. Implementierung: `DoSelectOne('FAHRTABLAUF', ALLOWED, 'nr')`. Body: `{"nr":<Fahrtablauf-Nr>,"fields":[...]|"*"}`.

  **Erlaubte Felder:** identisch zu `/dispo/getfahrtablauf` (70 Felder, siehe dort).

  **Antwort:** `{"header":{...},"data":[{...}]}` – 0 oder 1 Datensatz.

  **Auth:** erforderlich (Bearer Token). **LocalOnly:** nein.
