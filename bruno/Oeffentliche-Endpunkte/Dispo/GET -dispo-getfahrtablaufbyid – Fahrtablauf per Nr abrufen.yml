info:
  name: GET /dispo/getfahrtablaufbyid – Fahrtablauf per Nr abrufen
  type: http
  seq: 13

http:
  method: GET
  url: "{{baseURL}}/dispo/getfahrtablaufbyid"
  body:
    type: json
    data: |-
      {
        "nr": 42,
        "fields": "*"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  **Fahrtablauf per Nr abrufen.** Liefert genau einen Eintrag aus `FAHRTABLAUF`, gesucht über `nr`.

  | | |
  |---|---|
  | **Aufruf** | `GET {{baseURL}}/dispo/getfahrtablaufbyid` |
  | **Anmeldung** | nötig – Token aus `/login` (wird in Bruno automatisch mitgeschickt) |
  | **Berechtigung** | Der Benutzer braucht diesen Endpunkt in seinen Rollen (sonst Fehler 403) |

  ### Was du mitschickst
  | Parameter | Wert | Pflicht | Bedeutung |
  |---|---|---|---|
  | `nr` | Ganzzahl | **ja** | Der gesuchte Eintrag. |
  | `fields` | `"*"` oder Liste | nein | Welche Felder zurückkommen sollen. Weglassen = alle. |

  ### Verfügbare Felder
  | Feld | Typ |
  |---|---|
  | `nr` | Ganzzahl |
  | `datum` | Datum/Uhrzeit |
  | `von_soll` | Datum/Uhrzeit |
  | `von_ist` | Datum/Uhrzeit |
  | `bis_soll` | Datum/Uhrzeit |
  | `bis_ist` | Datum/Uhrzeit |
  | `bereich` | Text (max. 60 Zeichen) |
  | `art` | Text (max. 12 Zeichen) |
  | `xkoord` | Text (max. 20 Zeichen) |
  | `ykoord` | Text (max. 20 Zeichen) |
  | `sortierung` | Ganzzahl |
  | `disponr` | Ganzzahl |
  | `zeichen` | Text (max. 15 Zeichen) |
  | `kennzeichen` | Text (max. 15 Zeichen) |
  | `eart` | Text (max. 1 Zeichen) |
  | `dienstelementnr` | Ganzzahl |
  | `dienstelementart` | Text (max. 2 Zeichen) |
  | `bemerkung` | Text (max. 255 Zeichen) |
  | `zusatzfeld1` | Text (max. 120 Zeichen) |
  | `zusatzfeld2` | Text (max. 120 Zeichen) |
  | `zusatzfeld3` | Text (max. 120 Zeichen) |
  | `datumfeld1` | Datum/Uhrzeit |
  | `datumfeld2` | Datum/Uhrzeit |
  | `datumfeld3` | Datum/Uhrzeit |
  | `zustiege_soll` | Ganzzahl |
  | `zustiege_ist` | Ganzzahl |
  | `ausstiege_soll` | Ganzzahl |
  | `ausstiege_ist` | Ganzzahl |
  | `reftable` | Text (max. 80 Zeichen) |
  | `refnr` | Ganzzahl |
  | `hinweis` | Text (max. 255 Zeichen) |
  | `typ` | Text (max. 2 Zeichen) |
  | `einsatznr` | Ganzzahl |
  | `haltnr` | Ganzzahl |
  | `bezeichnung` | Text (max. 255 Zeichen) |
  | `sv_tournummer` | Text (max. 30 Zeichen) |
  | `sv_fahrtnummer` | Text (max. 30 Zeichen) |
  | `sv_abrechnungsstatus` | Text (max. 30 Zeichen) |
  | `geprueft` | Datum/Uhrzeit |
  | `einsatznr_ist` | Ganzzahl |
  | `disponr_ist` | Ganzzahl |
  | `tag` | Ganzzahl |
  | `von_kalk` | Datum/Uhrzeit |
  | `bis_kalk` | Datum/Uhrzeit |
  | `strasse` | Text (max. 110 Zeichen) |
  | `plz` | Text (max. 15 Zeichen) |
  | `ort` | Text (max. 110 Zeichen) |
  | `ortsteil` | Text (max. 80 Zeichen) |
  | `region` | Text (max. 20 Zeichen) |
  | `land` | Text (max. 5 Zeichen) |
  | `meter_soll` | Ganzzahl |
  | `meter_ist` | Ganzzahl |
  | `meter_kalk` | Ganzzahl |
  | `sekunden_soll` | Ganzzahl |
  | `sekunden_ist` | Ganzzahl |
  | `sekunden_kalk` | Ganzzahl |
  | `fahrzeugprofil` | Text (max. 40 Zeichen) |
  | `anzahl_fahrer` | Ganzzahl |
  | `kosten` | Kommazahl |
  | `leerfahrt` | Text (max. 4 Zeichen) |
  | `wochenende` | Text (max. 4 Zeichen) |
  | `feiertag` | Text (max. 4 Zeichen) |
  | `dienstnr` | Text (max. 10 Zeichen) |
  | `umlaufnr` | Text (max. 10 Zeichen) |
  | `sv_teilnehmernr` | Ganzzahl |
  | `sv_typ` | Text (max. 40 Zeichen) |
  | `sv_abrechenbar` | Text (max. 4 Zeichen) |
  | `sv_streckenpreis` | Kommazahl |
  | `freigabe` | Ganzzahl |
  | `umlauf` | Text (max. 30 Zeichen) |

  ### Was zurückkommt
  ```json
  {"header": {...}, "data": [ {"nr": 42, "datum": "2026-09-01 08:00:00", "von_soll": "2026-09-01 08:00:00", ...} ]}
  ```

  ### Was schiefgehen kann
  - **401** – nicht angemeldet oder Token abgelaufen → neu einloggen.
  - **403** – keine Berechtigung für diesen Endpunkt.
  - **Fehlermeldung im Text** (`{"status":"error","message":"..."}`), z.B. wenn ein Feldname in `fields` oder `orderby` nicht erlaubt ist. Achtung: Solche Fehler kommen teilweise mit HTTP-Status 200 – deshalb immer auf `"status": "error"` prüfen.

  ### Gut zu wissen
  - **Nicht gefunden = leere Liste:** Gibt es den Eintrag nicht, kommt kein Fehler, sondern `"data": []`.
  - **`nr` muss mitgeschickt werden**, sonst kommt eine Fehlermeldung.
  - **Nicht abrufbar** sind hier: `fa_knoten`, `fa_knotenhaltnr`, `fa_zfahrzeugnr`.

  <details><summary>Für Entwickler</summary>

  - Controller: `TDataModulDispo.getFahrtablaufById` in `Shared/DataModuls/DataModulDispoClass.pas`
  - Tabelle: `FAHRTABLAUF`, Schlüssel `nr`
  - Umsetzung: generische Methode `DoSelectOne` der Basisklasse `TDataModulTableBase`
  - Der Server wertet die HTTP-Methode nicht aus – GET und POST funktionieren gleich.

  </details>
