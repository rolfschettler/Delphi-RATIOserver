info:
  name: GET /dispo/getdispotour – Dispotouren auflisten
  type: http
  seq: 46

http:
  method: GET
  url: "{{baseURL}}/dispo/getdispotour"
  body:
    type: json
    data: |-
      {
        "fields": "*",
        "orderby": "bezeichnung"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  **Dispotouren auflisten.** Liefert alle Einträge aus `DISPOTOUR` – auf Wunsch sortiert und seitenweise.

  | | |
  |---|---|
  | **Aufruf** | `GET {{baseURL}}/dispo/getdispotour` |
  | **Anmeldung** | nötig – Token aus `/login` (wird in Bruno automatisch mitgeschickt) |
  | **Berechtigung** | Der Benutzer braucht diesen Endpunkt in seinen Rollen (sonst Fehler 403) |

  ### Was du mitschickst
  Alles ist optional – ein leerer Body `{}` liefert alles.

  | Parameter | Wert | Pflicht | Bedeutung |
  |---|---|---|---|
  | `fields` | `"*"` oder Liste, z.B. `["nr","bezeichnung"]` | nein | Welche Felder zurückkommen sollen. `"*"` oder weglassen = alle Felder aus der Liste unten. |
  | `orderby` | Feldname | nein | Sortierung nach genau einem Feld, aufsteigend. |
  | `limit` | Zahl | nein | Höchstens so viele Datensätze liefern (zum Blättern). Weglassen = alle. |
  | `offset` | Zahl | nein | So viele Datensätze überspringen (nur zusammen mit `limit`). Beispiel: `limit` 20 und `offset` 40 = Seite 3. |

  ### Verfügbare Felder
  | Feld | Typ |
  |---|---|
  | `nr` | Ganzzahl |
  | `bezeichnung` | Text (max. 120 Zeichen) |
  | `bemerkung` | Text (max. 600 Zeichen) |
  | `mon` | Text (max. 1 Zeichen) |
  | `die` | Text (max. 1 Zeichen) |
  | `mit` | Text (max. 1 Zeichen) |
  | `don` | Text (max. 1 Zeichen) |
  | `fre` | Text (max. 1 Zeichen) |
  | `sam` | Text (max. 1 Zeichen) |
  | `son` | Text (max. 1 Zeichen) |
  | `feiertag` | Text (max. 1 Zeichen) |
  | `ferien` | Text (max. 1 Zeichen) |
  | `nichtvon` | Datum/Uhrzeit |
  | `nichtbis` | Datum/Uhrzeit |
  | `typ` | Text (max. 1 Zeichen) |
  | `gruppe` | Text (max. 20 Zeichen) |
  | `firma` | Text (max. 10 Zeichen) |
  | `dienstnr` | Text (max. 10 Zeichen) |
  | `text1` | Text (max. 30 Zeichen) |
  | `text2` | Text (max. 30 Zeichen) |
  | `text3` | Text (max. 30 Zeichen) |
  | `text4` | Text (max. 30 Zeichen) |
  | `text5` | Text (max. 30 Zeichen) |
  | `text6` | Text (max. 30 Zeichen) |
  | `datum1` | Datum/Uhrzeit |
  | `datum2` | Datum/Uhrzeit |
  | `gueltig_von` | Datum/Uhrzeit |
  | `gueltig_bis` | Datum/Uhrzeit |
  | `nurferien` | Text (max. 1 Zeichen) |
  | `berechnungswert` | Kommazahl |
  | `einrichtung` | Ganzzahl |
  | `einzelrechnung` | Text (max. 4 Zeichen) |
  | `einzelvorgabe` | Text (max. 4 Zeichen) |
  | `erfasstam` | Datum/Uhrzeit |
  | `erfasstvon` | Text (max. 20 Zeichen) |
  | `fahrer` | Text (max. 30 Zeichen) |
  | `geaendertam` | Datum/Uhrzeit |
  | `geaendertvon` | Text (max. 20 Zeichen) |
  | `hinweis` | Text (max. 200 Zeichen) |
  | `km` | Ganzzahl |
  | `kostentraeger` | Ganzzahl |
  | `minuten` | Ganzzahl |
  | `nach` | Text (max. 120 Zeichen) |
  | `preisschema` | Text (max. 10 Zeichen) |
  | `tournummer` | Text (max. 120 Zeichen) |
  | `von` | Text (max. 120 Zeichen) |
  | `zusatzinfo` | Langtext/Datei |
  | `pauschalbetrag` | Kommazahl |
  | `ktogruppe` | Text (max. 30 Zeichen) |
  | `haupttour` | Text (max. 4 Zeichen) |
  | `monatspauschale` | Text (max. 4 Zeichen) |
  | `haupttournummer` | Text (max. 120 Zeichen) |
  | `altetournummer` | Text (max. 120 Zeichen) |
  | `googlelink` | Text (max. 2000 Zeichen) |
  | `leistungsdaten` | Text (max. 4 Zeichen) |
  | `leistungsdatenvon` | Text (max. 20 Zeichen) |
  | `abrechnungsdaten` | Text (max. 4 Zeichen) |
  | `abrechnungsdatenvon` | Text (max. 20 Zeichen) |

  ### Was zurückkommt
  ```json
  {
    "header": {"nr": "ftinteger", ...},
    "data": [ {"nr": 42, "bezeichnung": "Text", "bemerkung": "Text", ...} ]
  }
  ```
  `data` enthält die Datensätze, `header` nennt zu jedem Feld den technischen Typ. **Mit `limit`** sieht die Antwort so aus: `{"total": 123, "limit": 20, "offset": 0, "data": { "header": ..., "data": [...] }}` – `total` ist die Gesamtzahl aller Treffer.

  ### Was schiefgehen kann
  - **401** – nicht angemeldet oder Token abgelaufen → neu einloggen.
  - **403** – keine Berechtigung für diesen Endpunkt.
  - **Fehlermeldung im Text** (`{"status":"error","message":"..."}`), z.B. wenn ein Feldname in `fields` oder `orderby` nicht erlaubt ist. Achtung: Solche Fehler kommen teilweise mit HTTP-Status 200 – deshalb immer auf `"status": "error"` prüfen.

  ### Gut zu wissen
  - **Ohne `limit` kommt die komplette Tabelle** – bei vielen Einträgen besser seitenweise abrufen.
  - **Zum Suchen** den passenden `…filtered`-Endpunkt verwenden, für einen einzelnen Eintrag `…byid`.

  <details><summary>Für Entwickler</summary>

  - Controller: `TDataModulDispo.getDispotour` in `Shared/DataModuls/DataModulDispoClass.pas`
  - Tabelle: `DISPOTOUR`, Schlüssel `nr`
  - Umsetzung: generische Methode `DoSelect` der Basisklasse `TDataModulTableBase`
  - Der Server wertet die HTTP-Methode nicht aus – GET und POST funktionieren gleich.

  </details>
