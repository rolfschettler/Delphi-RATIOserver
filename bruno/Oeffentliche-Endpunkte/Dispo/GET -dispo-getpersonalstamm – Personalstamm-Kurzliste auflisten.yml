info:
  name: GET /dispo/getpersonalstamm – Personalstamm-Kurzliste auflisten
  type: http
  seq: 25

http:
  method: GET
  url: "{{baseURL}}/dispo/getpersonalstamm"
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Nicht-generischer Endpunkt mit fest verdrahtetem SQL (kein Body, keine Parameter, keine Filter-/ById-/Insert-/Key-Varianten vorhanden): `Select nr, name1, name2, zeichen from PERSONALSTAMM order by name2`.

  **Antwort:** `{"header":{...},"data":[...]}` (SerializeQuery, Feldnamen klein), z. B. `{"header":{...},"data":[{"nr":55,"name1":"Hans","name2":"Mustermann","zeichen":"MU"}, ...]}`.

  **Auth:** erforderlich (Bearer Token). **LocalOnly:** nein.
