  | `anrede` | Text (max. 20 Zeichen) |
  | `name1` | Text (max. 30 Zeichen) |
  | `name2` | Text (max. 30 Zeichen) |
  | `zeichen` | Text (max. 15 Zeichen) |
  | `strasse` | Text (max. 30 Zeichen) |
  | `land` | Text (max. 15 Zeichen) |
  | `plz` | Text (max. 15 Zeichen) |
  | `ort` | Text (max. 30 Zeichen) |
  | `telefon1` | Text (max. 25 Zeichen) |
  | `telefon2` | Text (max. 25 Zeichen) |
  | `fsnummer` | Text (max. 25 Zeichen) |
  | `pbs_gueltig_bis` | Datum/Uhrzeit |
  | `verwendung` | Text (max. 25 Zeichen) |
  | `geburtstag` | Datum/Uhrzeit |
  | `bemerkung` | Text (max. 1200 Zeichen) |
  | `angestellt_seit` | Datum/Uhrzeit |
  | `urlaubgesamt` | Ganzzahl |
  | `resturlaub` | Ganzzahl |
