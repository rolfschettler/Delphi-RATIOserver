  | `profil` | Text (max. 40 Zeichen) |
  | `feiertagsberechtigt` | Text (max. 4 Zeichen) |
  | `zulageberechtigt` | Text (max. 4 Zeichen) |
  | `mindestregelungsberechtigt` | Text (max. 4 Zeichen) |
  | `arbeitsvertragsart` | Text (max. 40 Zeichen) |
  | `urlaubsstunden` | Kommazahl |
  | `krankheitsstunden` | Kommazahl |
  | `durchschnittsstunden` | Kommazahl |
  | `ausgeschieden_am` | Datum/Uhrzeit |
