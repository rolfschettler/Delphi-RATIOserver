info:
  name: GET /dispo/getzeitraum – Zeiträume auflisten
  type: http
  seq: 31

http:
  method: GET
  url: "{{baseURL}}/dispo/getzeitraum"
  body:
    type: json
    data: |-
      {
        "fields": "*",
        "orderby": "von"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Listet Datensätze aus der Tabelle ZEITRAUM (`DoSelect('ZEITRAUM', ALLOWED)`) ohne Filter. Body optional: `{"fields":[...]|"*","orderby":"feld","limit":10,"offset":0}`.

  **Erlaubte Felder (ALLOWED, 9):** nr, von, bis, bezeichnung, farbe, art, code, gueltig_bis, gueltig_von.

  **Antwort:** ohne `limit` `{"header":{feld:typ,...},"data":[...]}` (SerializeQuery, Feldnamen klein); mit `limit` `{"total":N,"limit":N,"offset":N,"data":{"header":{...},"data":[...]}}`.

  **Auth:** erforderlich (Bearer Token). **LocalOnly:** nein.
