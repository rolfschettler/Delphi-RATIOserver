info:
  name: GET /dispo/getfahrergruppen – Fahrergruppen (Konfiguration) auflisten
  type: http
  seq: 11

http:
  method: GET
  url: "{{baseURL}}/dispo/getfahrergruppen"
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  **Fahrergruppen auflisten.** Liefert die in der Konfiguration angelegten Personal- bzw. Fahrergruppen, sortiert nach Gruppenname.

  | | |
  |---|---|
  | **Aufruf** | `GET {{baseURL}}/dispo/getfahrergruppen` |
  | **Anmeldung** | nötig – Token aus `/login` (wird in Bruno automatisch mitgeschickt) |
  | **Berechtigung** | Der Benutzer braucht diesen Endpunkt in seinen Rollen (sonst Fehler 403) |

  ### Was du mitschickst
  Nichts – ein Body wird nicht benötigt (und ignoriert).

  ### Was zurückkommt
  ```json
  {
    "header": {"nr": "ftinteger", "name": "ftstring 80", "ids": "ftstring 20000"},
    "data": [ {"nr": 1, "name": "Nachtfahrer", "ids": "..."} ]
  }
  ```
  Die Gruppen stehen in `data`, je Gruppe diese Felder:

  | Feld | Typ | Bedeutung |
  |---|---|---|
  | `nr` | Ganzzahl | Nummer des Konfigurationseintrags |
  | `name` | Text (max. 80 Zeichen) | Name der Gruppe |
  | `ids` | Text (max. 20000 Zeichen) | gespeicherter Inhalt der Gruppe (die Mitglieder), so wie er in der Konfiguration steht |

  ### Was schiefgehen kann
  - **401** – nicht angemeldet oder Token abgelaufen → neu einloggen.
  - **403** – keine Berechtigung für diesen Endpunkt.
  - **400** mit Fehlermeldung – Datenbankfehler, z.B. wenn der Inhalt einer Gruppe länger als 20000 Zeichen ist.

  ### Gut zu wissen
  - **Es kommen immer alle Gruppen mit genau diesen drei Feldern.** Angaben wie `fields`, `orderby`, `limit` oder `offset` haben hier keine Wirkung.
  - **`ids` wird vom Server nicht ausgewertet**, sondern unverändert als Text geliefert. Das Format bestimmt die Anwendung, die die Gruppe gespeichert hat.
  - **Sehr große Gruppen führen zum Fehler:** Der Inhalt wird in Text mit höchstens 20000 Zeichen umgewandelt. Ist er länger, bricht die Abfrage mit einem Datenbankfehler ab – dann kommt gar keine Gruppe zurück.
  - **Eine leere Liste ist normal**, wenn in der Konfiguration noch keine Fahrergruppen angelegt sind.

  <details><summary>Für Entwickler</summary>

  - Controller: `TDataModulDispo.getfahrergruppen` in `Shared/DataModuls/DataModulDispoClass.pas`
  - Tabelle: `KONFIGURATION` (nur lesend), Einträge mit `art = 'G_R_P'` und `art2 = 'PERSON'`
  - Festes SQL: `SELECT nr, name, CAST(content AS VARCHAR(20000)) AS ids FROM KONFIGURATION WHERE art='G_R_P' AND art2='PERSON' ORDER BY name` – `content` ist ein Blob; bei mehr als 20000 Zeichen String-Überlauf.
  - Der Server wertet die HTTP-Methode nicht aus.

  </details>
