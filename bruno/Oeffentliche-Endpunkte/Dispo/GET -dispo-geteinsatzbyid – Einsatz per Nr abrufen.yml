info:
  name: GET /dispo/geteinsatzbyid – Einsatz per Nr abrufen
  type: http
  seq: 9

http:
  method: GET
  url: "{{baseURL}}/dispo/geteinsatzbyid"
  body:
    type: json
    data: |-
      {
        "nr": 4711,
        "fields": "*"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Liefert genau einen Datensatz aus EINSATZ anhand des Primärschlüssels. Implementierung: `DoSelectOne('EINSATZ', ALLOWED, 'nr')`. Body: `{"nr":<Einsatz-Nr>,"fields":[...]|"*"}`.

  **Erlaubte Felder:** identisch zu `/dispo/geteinsatz` (103 Felder, siehe dort).

  **Antwort:** `{"header":{...},"data":[{...}]}` – 0 oder 1 Datensatz.

  **Auth:** erforderlich (Bearer Token). **LocalOnly:** nein.
