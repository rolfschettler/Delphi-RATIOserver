info:
  name: POST /dispo/deleteurlaubsantrag – Urlaubsantrag löschen
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseURL}}/dispo/deleteurlaubsantrag"
  body:
    type: json
    data: |-
      {
        "nr": 302
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
