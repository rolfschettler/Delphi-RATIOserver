docs: |-
  Löscht einen Datensatz aus der Tabelle URLAUBSANTRAG. Implementierung: `DoDelete('URLAUBSANTRAG', 'nr')`.

  **Body:** `{"nr": <Urlaubsantrag-Nr>}`

  **Antwort:** `{"status":"OK"}`

  **Auth:** erforderlich (Bearer Token). **LocalOnly:** nein.
