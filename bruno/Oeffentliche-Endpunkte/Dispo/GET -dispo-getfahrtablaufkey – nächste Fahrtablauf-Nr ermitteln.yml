info:
  name: GET /dispo/getfahrtablaufkey – nächste Fahrtablauf-Nr ermitteln
  type: http
  seq: 15

http:
  method: GET
  url: "{{baseURL}}/dispo/getfahrtablaufkey"
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Liefert den nächsten Primärschlüsselwert für FAHRTABLAUF über den InterBase-Generator: `SELECT GEN_ID(FAHRTABLAUF_NR_GEN,1) AS NR FROM RDB$DATABASE`. Kein Body erforderlich.

  **Antwort:** `{"header":{"nr":"ftinteger"},"data":[{"nr":816}]}` (Generator-Wert wird bei jedem Aufruf hochgezählt).

  **Auth:** erforderlich (Bearer Token). **LocalOnly:** nein.
