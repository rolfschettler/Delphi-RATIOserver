info:
  name: POST /dispo/updateeinsatz – Einsatz ändern
  type: http
  seq: 38

http:
  method: POST
  url: "{{baseURL}}/dispo/updateeinsatz"
  body:
    type: json
    data: |-
      {
        "nr": 42,
        "bemerkung": "Fahrzeug getauscht",
        "fahrzeugstatus": "bestaetigt",
        "geprueft": true
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  **Einsatz ändern.** Ändert einen vorhandenen Eintrag in `EINSATZ`. Gefunden wird er über `nr`.

  | | |
  |---|---|
  | **Aufruf** | `POST {{baseURL}}/dispo/updateeinsatz` |
  | **Anmeldung** | nötig – Token aus `/login` (wird in Bruno automatisch mitgeschickt) |
  | **Berechtigung** | Der Benutzer braucht diesen Endpunkt in seinen Rollen (sonst Fehler 403) |

  ### Was du mitschickst
  | Parameter | Wert | Pflicht | Bedeutung |
  |---|---|---|---|
  | `nr` | Ganzzahl | **ja** | Welcher Eintrag geändert wird. |
  | weitere Felder | siehe Liste | mind. eins | Nur die mitgeschickten Felder werden geändert. `null` macht ein Feld leer. |

  ### Änderbare Felder
