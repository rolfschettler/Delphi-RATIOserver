info:
  name: GET /dispo/getzeitraumbyid – Zeitraum per Nr abrufen
  type: http
  seq: 32

http:
  method: GET
  url: "{{baseURL}}/dispo/getzeitraumbyid"
  body:
    type: json
    data: |-
      {
        "nr": 1,
        "fields": "*"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Liefert genau einen Datensatz aus ZEITRAUM anhand des Primärschlüssels. Implementierung: `DoSelectOne('ZEITRAUM', ALLOWED, 'nr')`. Body: `{"nr":<Nr>,"fields":[...]|"*"}`.

  **Erlaubte Felder:** identisch zu `/dispo/getzeitraum` (9 Felder, siehe dort).

  **Antwort:** `{"header":{...},"data":[{...}]}` – 0 oder 1 Datensatz.

  **Auth:** erforderlich (Bearer Token). **LocalOnly:** nein.
