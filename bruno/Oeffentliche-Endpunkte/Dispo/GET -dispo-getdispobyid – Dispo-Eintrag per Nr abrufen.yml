info:
  name: GET /dispo/getdispobyid – Dispo-Eintrag per Nr abrufen
  type: http
  seq: 44

http:
  method: GET
  url: "{{baseURL}}/dispo/getdispobyid"
  body:
    type: json
    data: |-
      {
        "nr": 1001,
        "fields": "*"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Liefert genau einen Datensatz aus DISPO anhand des Primärschlüssels. Implementierung: `DoSelectOne('DISPO', ALLOWED, 'nr')`.

  **Key-Feld:** `nr` (Pflicht im Body, sonst Fehler `"nr" fehlt im Request-Body.`).

  **Body:** `{"nr":<Dispo-Nr>,"fields":[...]|"*"}`

  **Erlaubte Felder:** identisch zu `/dispo/getdispo` (9 Felder, siehe dort).

  **Auth:** erforderlich (Bearer Token). **LocalOnly:** nein.

  **Antwort:** `{"header":{...},"data":[{...}]}` – 0 oder 1 Datensatz.
