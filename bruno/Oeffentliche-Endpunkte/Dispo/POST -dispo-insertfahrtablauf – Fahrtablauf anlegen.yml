info:
  name: POST /dispo/insertfahrtablauf – Fahrtablauf anlegen
  type: http
  seq: 35

http:
  method: POST
  url: "{{baseURL}}/dispo/insertfahrtablauf"
  body:
    type: json
    data: |-
      {
        "nr": 816,
        "datum": "2026-09-01",
        "von_soll": "2026-09-01 06:00:00",
        "bis_soll": "2026-09-01 06:20:00",
        "art": "H",
        "einsatznr": 4711,
        "bezeichnung": "Hauptbahnhof"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Legt einen neuen Datensatz in FAHRTABLAUF an. Implementierung: `DoInsert('FAHRTABLAUF', ALLOWED)` – nur ALLOWED-Felder werden aus dem Body übernommen.

  **Erlaubte Felder (ALLOWED, 70):** identisch zu `/dispo/getfahrtablauf` (siehe dort).

  **Antwort:** `{"status":"OK"}`

  **Auth:** erforderlich (Bearer Token). **LocalOnly:** nein.
