info:
  name: GET /dispo/geturlaubsantragfiltered – Urlaubsanträge filtern
  type: http
  seq: 29

http:
  method: GET
  url: "{{baseURL}}/dispo/geturlaubsantragfiltered"
  body:
    type: json
    data: |-
      {
        "fields": "*",
        "von": "2026-10-01",
        "bis": "2026-10-31",
        "mitarbeiter": "MU",
        "status": "offen",
        "orderby": "von"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  **Urlaubsanträge gefiltert auflisten.** Liefert die Urlaubsanträge, die einen bestimmten Zeitraum berühren – auf Wunsch weiter eingeschränkt, z.B. auf einen Mitarbeiter oder einen Status.

  | | |
  |---|---|
  | **Aufruf** | `GET {{baseURL}}/dispo/geturlaubsantragfiltered` |
  | **Anmeldung** | nötig – Token aus `/login` (wird in Bruno automatisch mitgeschickt) |
  | **Berechtigung** | Der Benutzer braucht diesen Endpunkt in seinen Rollen (sonst Fehler 403) |

  ### Suchkriterien (Filter)
  **Alle Felder außer Blobfeldern und Passwortfeldern können als Filterparameter verwendet werden.**
  **Ausnahme in diesem Endpunkt:** `von` und `bis` sind **Pflicht** und suchen nicht nach genau diesem Wert, sondern bilden zusammen einen **Zeitraum**. Gefunden werden alle Anträge, die diesen Zeitraum ganz oder teilweise berühren – auch solche, die vorher beginnen oder später enden. Das Langtextfeld `bemerkung` ist nicht filterbar.

  So funktioniert die Suche:
  - Jedes weitere mitgeschickte Feld ist ein zusätzliches Kriterium, z.B. `{"mitarbeiter": "MU"}`.
  - **Alle Kriterien müssen zutreffen** (UND): Zeitraum und `"mitarbeiter": "MU"` und `"status": "offen"`.
  - **Der Wert muss genau stimmen** – keine Teilsuche, Groß-/Kleinschreibung zählt („Offen“ findet nicht „offen“).
  - Datum als `"2026-10-01"` oder mit Uhrzeit `"2026-10-01 08:00:00"`. Ein Datum ohne Uhrzeit bedeutet 00:00 Uhr.

  | Filter | Typ | Pflicht | Bedeutung |
  |---|---|---|---|
  | `von` + `bis` | Datum/Uhrzeit | **ja** | Zeitraum (siehe oben) |
  | `nr` | Ganzzahl | nein | Nummer des Antrags |
  | `mitarbeiter` | Text (max. 15 Zeichen) | nein | Personalkürzel des Antragstellers |
  | `status` | Text (max. 30 Zeichen) | nein | Status des Antrags |
  | `statusam` | Datum/Uhrzeit | nein | wann der Status gesetzt wurde |
  | `statusvon` | Text (max. 15 Zeichen) | nein | wer den Status gesetzt hat |
  | `vertretung` | Text (max. 15 Zeichen) | nein | Vertretung |
  | `beantragtam` | Datum/Uhrzeit | nein | wann beantragt wurde |
  | `genehmigtam` | Datum/Uhrzeit | nein | wann genehmigt wurde |
  | `genehmigtvon` | Text (max. 15 Zeichen) | nein | wer genehmigt hat |
  | `text1`, `text2`, `text3` | Text (max. 60 Zeichen) | nein | freie Textfelder |

  ### Weitere Angaben (optional)
  | Parameter | Wert | Pflicht | Bedeutung |
  |---|---|---|---|
  | `fields` | `"*"` oder Liste, z.B. `["nr","mitarbeiter","von","bis"]` | nein | Welche Felder zurückkommen sollen. `"*"` oder weglassen = alle Felder aus der Liste unten. |
  | `orderby` | Feldname | nein | Sortierung nach genau einem Feld, aufsteigend. |
  | `limit` | Zahl | nein | Höchstens so viele Datensätze liefern (zum Blättern). Weglassen = alle. |
  | `offset` | Zahl | nein | So viele Datensätze überspringen (nur zusammen mit `limit`). Beispiel: `limit` 20 und `offset` 40 = Seite 3. |

  ### Verfügbare Felder (für `fields` und `orderby`)
  | Feld | Typ |
  |---|---|
  | `nr` | Ganzzahl |
  | `mitarbeiter` | Text (max. 15 Zeichen) |
  | `von` | Datum/Uhrzeit |
  | `bis` | Datum/Uhrzeit |
  | `beantragtam` | Datum/Uhrzeit |
  | `genehmigtam` | Datum/Uhrzeit |
  | `genehmigtvon` | Text (max. 15 Zeichen) |
  | `bemerkung` | Langtext |
  | `text1` | Text (max. 60 Zeichen) |
  | `text2` | Text (max. 60 Zeichen) |
  | `text3` | Text (max. 60 Zeichen) |
  | `status` | Text (max. 30 Zeichen) |
  | `statusam` | Datum/Uhrzeit |
  | `statusvon` | Text (max. 15 Zeichen) |
  | `vertretung` | Text (max. 15 Zeichen) |

  ### Was zurückkommt
  ```json
  {
    "header": {"nr": "ftinteger", "mitarbeiter": "ftstring 15", ...},
    "data": [ {"nr": 7, "mitarbeiter": "MU", "von": "2026-10-12 00:00:00", "bis": "2026-10-16 00:00:00", ...} ]
  }
  ```
  `data` enthält die Anträge, `header` nennt zu jedem Feld den technischen Typ. **Mit `limit`** sieht die Antwort so aus: `{"total": 123, "limit": 20, "offset": 0, "data": { "header": ..., "data": [...] }}` – `total` ist die Gesamtzahl aller Treffer.

  ### Was schiefgehen kann
  - **401** – nicht angemeldet oder Token abgelaufen → neu einloggen.
  - **403** – keine Berechtigung für diesen Endpunkt.
  - **400** mit Fehlermeldung – die Datenbank kann einen Suchwert nicht verarbeiten, z.B. ein ungültiges Datum oder Buchstaben in einem Zahlenfeld.
  - **Fehlermeldung mit Status 200** (`{"status":"error","message":"..."}`) – deshalb immer auf `"status": "error"` prüfen:
    - `"von" und "bis" sind Pflichtfelder.` – `von` oder `bis` fehlt bzw. ist `null`, oder der Body fehlt bzw. ist kein JSON-Objekt.
    - `Feld "x" ist nicht erlaubt.` bzw. `Sortierfeld "x" ist nicht erlaubt.` – unbekannter Feldname in `fields` oder `orderby`.

  ### Gut zu wissen
  - **Feldnamen klein schreiben.** `"Von"` gilt als fehlend und führt zum Pflichtfeld-Fehler; andere falsch geschriebene Kriterien werden einfach ignoriert.
  - **Achtung bei Tippfehlern:** Ein ignoriertes Kriterium schränkt nichts ein – dann kommen *alle* Anträge im Zeitraum.
  - **Randfälle zählen mit:** Ein Antrag, der genau am Beginn deines Zeitraums endet oder genau an dessen Ende beginnt, wird gefunden.
  - **`bemerkung` kannst du abrufen** (über `fields`), aber nicht danach suchen.

  <details><summary>Für Entwickler</summary>

  - Controller: `TDataModulDispo.getUrlaubsantragFiltered` in `Shared/DataModuls/DataModulDispoClass.pas`
  - Tabelle: `URLAUBSANTRAG`, Schlüssel `nr`
  - Umsetzung: `DoSelectFilteredDynamic` der Basisklasse `TDataModulTableBase`; Zeitraum über `bis >= :von` und `von <= :bis` (Überschneidung inkl. Grenzen), alle übrigen Nicht-Blob-Felder als Gleichheitsfilter. Vorab-Prüfung `von`/`bis` per `Body.GetValue` (case-sensitiv).
  - `bemerkung` ist ein Blob – nur in `ALLOWED`, nicht in `CONDITIONS`/`FILTER_PARAMS`.
  - Der Server wertet die HTTP-Methode nicht aus – GET und POST funktionieren gleich.

  </details>
