info:
  name: GET /incoming/gett_teilnehmernextnr – Naechste T_TEILNEHMER-Nr ermitteln
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseURL}}/incoming/gett_teilnehmernextnr"
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Eigene (nicht-generische) Query-Logik: liefert den naechsten Wert des Generators `T_TEILNEHMER_NR_GEN` (`SELECT GEN_ID(T_TEILNEHMER_NR_GEN,1) FROM RDB$DATABASE`). Kein Request-Body erforderlich.

  **Antwort (Beispiel):** `{"header":{"gen_id":"ftinteger"},"data":[{"gen_id":502}]}` (SerializeQuery). Achtung: die Query vergibt keinen Alias, das Feld heisst deshalb `gen_id` (nicht `nr` wie bei den uebrigen Key-Endpunkten).

  **Auth:** erforderlich (Bearer Token).
