docs:
  content: |-
    **Teilnehmer im Incoming-Geschäft verwalten:** Teilnehmer auflisten, gefiltert suchen, einzeln abrufen, anlegen, ändern und löschen. Vor dem Anlegen holst du mit `/incoming/gett_teilnehmernextnr` eine neue Teilnehmer-Nummer – die Datenbank vergibt sie hier nicht von selbst.

    Dazu kommt ein Demo-Endpunkt zum Testen von Anmeldung und Berechtigungen.

    Alle Endpunkte brauchen eine Anmeldung (Token aus `/login`), und der Benutzer muss den jeweiligen Endpunkt in seinen Rollen haben (sonst Fehler 403).

    Technik: Controller `TDataModulIncoming` (`Shared/DataModuls/DataModulIncomingClass.pas`), Tabelle `T_TEILNEHMER`.
  type: text/markdown
