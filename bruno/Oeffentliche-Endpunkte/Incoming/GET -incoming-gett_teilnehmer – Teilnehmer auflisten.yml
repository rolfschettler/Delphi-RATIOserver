info:
  name: GET /incoming/gett_teilnehmer – Teilnehmer auflisten
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseURL}}/incoming/gett_teilnehmer"
  body:
    type: json
    data: |-
      {
        "fields": "*",
        "orderby": "name"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Generische Liste aller T_TEILNEHMER-Datensaetze (`DoSelect('T_TEILNEHMER', ALLOWED)`).

  **Erlaubte Felder (ALLOWED):** nr, vorgangnr, anrede, name, kennziffer, geburtstag, jahre, shuttle, info1, info2, ref1, ref2, gruppe, sitzfest, hininfo, rueckinfo, ausstiegrueck, profil, status, reservierungsnr, kabinengruppe, infofaehre, zustieghin, ausstieghin, zustiegrueck, ausstieg_rueck, sitzhin, sitzrueck, leistungen, passnummer, ausgestellt_in, ausgestellt_am, gueltig_bis, passinfo, passid, nation, geburtsort, name1, name2, name3, namenszusatz, titel, email, land, ort, ortsteil, plz, region, strasse, telefon1, telefon2, telefon3, xkoord, ykoord, heimatort, pass_name1, pass_name2, zusatzdaten.

  **Body (optional):** `fields` (Array der gewuenschten Felder oder `"*"` fuer alle), `orderby` (Feldname), `limit`, `offset`.

  **Antwort:** ohne `limit` `{"header":{"<feld>":"<typ>",...},"data":[{...},...]}` (SerializeQuery: `header` = Feldname -> Typ, `data` = Datensaetze); mit `limit` `{"total":N,"limit":N,"offset":N,"data":{"header":{...},"data":[...]}}`.

  **Auth:** erforderlich (Bearer Token).
