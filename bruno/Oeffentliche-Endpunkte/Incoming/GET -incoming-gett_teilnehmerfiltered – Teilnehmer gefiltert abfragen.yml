info:
  name: GET /incoming/gett_teilnehmerfiltered – Teilnehmer gefiltert abfragen
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseURL}}/incoming/gett_teilnehmerfiltered"
  body:
    type: json
    data: |-
      {
        "fields": "*",
        "vorgangnr": 1001,
        "orderby": "name"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  **Teilnehmer gefiltert abfragen.** Sucht Einträge in `T_TEILNEHMER` – du gibst die Suchkriterien als Felder im Body mit.

  | | |
  |---|---|
  | **Aufruf** | `GET {{baseURL}}/incoming/gett_teilnehmerfiltered` |
  | **Anmeldung** | nötig – Token aus `/login` (wird in Bruno automatisch mitgeschickt) |
  | **Berechtigung** | Der Benutzer braucht diesen Endpunkt in seinen Rollen (sonst Fehler 403) |

  ### Suchkriterien (Filter)
  **Alle Felder außer Blobfeldern und Passwortfeldern können als Filterparameter verwendet werden.** Hier nicht filterbar: `zusatzdaten`.

  So funktioniert die Suche:
  - Jedes mitgeschickte Feld ist ein Kriterium, z.B. `{"ort": "Berlin"}`.
  - **Mehrere Kriterien müssen alle zutreffen** (UND): `{"ort": "Berlin", "plz": "10115"}`.
  - **Der Wert muss genau stimmen** – keine Teilsuche, Groß-/Kleinschreibung zählt („berlin“ findet nicht „Berlin“).
  - Datum als `"2026-09-01"` oder mit Uhrzeit `"2026-09-01 08:00:00"`. Bei Feldern mit Uhrzeit findet ein reines Datum nur Einträge um 00:00 Uhr.
  - Ohne Kriterien kommen alle Einträge.

  ### Weitere Angaben (optional)
  | Parameter | Wert | Pflicht | Bedeutung |
  |---|---|---|---|
  | `fields` | `"*"` oder Liste, z.B. `["nr","bezeichnung"]` | nein | Welche Felder zurückkommen sollen. `"*"` oder weglassen = alle Felder aus der Liste unten. |
  | `orderby` | Feldname | nein | Sortierung nach genau einem Feld, aufsteigend. |
  | `limit` | Zahl | nein | Höchstens so viele Datensätze liefern (zum Blättern). Weglassen = alle. |
  | `offset` | Zahl | nein | So viele Datensätze überspringen (nur zusammen mit `limit`). Beispiel: `limit` 20 und `offset` 40 = Seite 3. |

  ### Verfügbare Felder (für `fields` und `orderby`)
  | Feld | Typ |
  |---|---|
  | `nr` | Ganzzahl |
  | `vorgangnr` | Ganzzahl |
  | `anrede` | Text (max. 5 Zeichen) |
  | `name` | Text (max. 90 Zeichen) |
  | `kennziffer` | Ganzzahl |
  | `geburtstag` | Datum/Uhrzeit |
  | `jahre` | Ganzzahl |
  | `shuttle` | Text (max. 2 Zeichen) |
  | `info1` | Text (max. 120 Zeichen) |
  | `info2` | Text (max. 120 Zeichen) |
  | `ref1` | Text (max. 60 Zeichen) |
  | `ref2` | Text (max. 60 Zeichen) |
  | `gruppe` | Ganzzahl |
  | `sitzfest` | Text (max. 4 Zeichen) |
  | `hininfo` | Text (max. 60 Zeichen) |
  | `rueckinfo` | Text (max. 60 Zeichen) |
  | `ausstiegrueck` | Text (max. 120 Zeichen) |
  | `profil` | Text (max. 20 Zeichen) |
  | `status` | Text (max. 10 Zeichen) |
  | `reservierungsnr` | Text (max. 50 Zeichen) |
  | `kabinengruppe` | Ganzzahl |
  | `infofaehre` | Text (max. 250 Zeichen) |
  | `zustieghin` | Ganzzahl |
  | `ausstieghin` | Ganzzahl |
  | `zustiegrueck` | Ganzzahl |
  | `ausstieg_rueck` | Ganzzahl |
  | `sitzhin` | Text (max. 20 Zeichen) |
  | `sitzrueck` | Text (max. 20 Zeichen) |
  | `leistungen` | Text (max. 3200 Zeichen) |
  | `passnummer` | Text (max. 40 Zeichen) |
  | `ausgestellt_in` | Text (max. 40 Zeichen) |
  | `ausgestellt_am` | Datum/Uhrzeit |
  | `gueltig_bis` | Datum/Uhrzeit |
  | `passinfo` | Text (max. 70 Zeichen) |
  | `passid` | Text (max. 40 Zeichen) |
  | `nation` | Text (max. 40 Zeichen) |
  | `geburtsort` | Text (max. 60 Zeichen) |
  | `name1` | Text (max. 30 Zeichen) |
  | `name2` | Text (max. 30 Zeichen) |
  | `name3` | Text (max. 30 Zeichen) |
  | `namenszusatz` | Text (max. 180 Zeichen) |
  | `titel` | Text (max. 20 Zeichen) |
  | `email` | Text (max. 60 Zeichen) |
  | `land` | Text (max. 15 Zeichen) |
  | `ort` | Text (max. 110 Zeichen) |
  | `ortsteil` | Text (max. 80 Zeichen) |
  | `plz` | Text (max. 15 Zeichen) |
  | `region` | Text (max. 20 Zeichen) |
  | `strasse` | Text (max. 110 Zeichen) |
  | `telefon1` | Text (max. 25 Zeichen) |
  | `telefon2` | Text (max. 25 Zeichen) |
  | `telefon3` | Text (max. 25 Zeichen) |
  | `xkoord` | Text (max. 20 Zeichen) |
  | `ykoord` | Text (max. 20 Zeichen) |
  | `heimatort` | Text (max. 60 Zeichen) |
  | `pass_name1` | Text (max. 30 Zeichen) |
  | `pass_name2` | Text (max. 30 Zeichen) |
  | `zusatzdaten` | Langtext/Datei |

  ### Was zurückkommt
  ```json
  {
    "header": {"nr": "ftinteger", ...},
    "data": [ {"nr": 42, "vorgangnr": 42, "anrede": "Text", ...} ]
  }
  ```
  `data` enthält die Datensätze, `header` nennt zu jedem Feld den technischen Typ. **Mit `limit`** sieht die Antwort so aus: `{"total": 123, "limit": 20, "offset": 0, "data": { "header": ..., "data": [...] }}` – `total` ist die Gesamtzahl aller Treffer.

  ### Was schiefgehen kann
  - **401** – nicht angemeldet oder Token abgelaufen → neu einloggen.
  - **403** – keine Berechtigung für diesen Endpunkt.
  - **Fehlermeldung im Text** (`{"status":"error","message":"..."}`), z.B. wenn ein Feldname in `fields` oder `orderby` nicht erlaubt ist. Achtung: Solche Fehler kommen teilweise mit HTTP-Status 200 – deshalb immer auf `"status": "error"` prüfen.

  ### Gut zu wissen
  - **Achtung bei Tippfehlern:** Ein falsch geschriebener Feldname wird einfach ignoriert – dann kommen *alle* Einträge statt der gesuchten.
  - Der Body muss mindestens `{}` sein, sonst kommt ein Fehler.

  <details><summary>Für Entwickler</summary>

  - Controller: `TDataModulIncoming.getTeilnehmerFiltered` in `Shared/DataModuls/DataModulIncomingClass.pas`
  - Tabelle: `T_TEILNEHMER`, Schlüssel `nr`
  - Umsetzung: generische Methode `DoSelectFilteredDynamic` der Basisklasse `TDataModulTableBase`; Filter über `CONDITIONS`/`FILTER_PARAMS`
  - Der Server wertet die HTTP-Methode nicht aus – GET und POST funktionieren gleich.

  </details>
