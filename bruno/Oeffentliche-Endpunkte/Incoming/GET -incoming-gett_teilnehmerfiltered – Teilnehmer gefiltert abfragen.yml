info:
  name: GET /incoming/gett_teilnehmerfiltered – Teilnehmer gefiltert abfragen
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseURL}}/incoming/gett_teilnehmerfiltered"
  body:
    type: json
    data: |-
      {
        "fields": "*",
        "vorgangnr": 1001,
        "orderby": "name"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Dynamisch gefilterte Liste von T_TEILNEHMER-Datensaetzen (`DoSelectFilteredDynamic('T_TEILNEHMER', ALLOWED, CONDITIONS, FILTER_PARAMS)`). Jeder im Body gesetzte Filter-Parameter erzeugt automatisch eine AND-verknuepfte WHERE-Bedingung.

  **Erlaubte Felder (ALLOWED):** nr, vorgangnr, anrede, name, kennziffer, geburtstag, jahre, shuttle, info1, info2, ref1, ref2, gruppe, sitzfest, hininfo, rueckinfo, ausstiegrueck, profil, status, reservierungsnr, kabinengruppe, infofaehre, zustieghin, ausstieghin, zustiegrueck, ausstieg_rueck, sitzhin, sitzrueck, leistungen, passnummer, ausgestellt_in, ausgestellt_am, gueltig_bis, passinfo, passid, nation, geburtsort, name1, name2, name3, namenszusatz, titel, email, land, ort, ortsteil, plz, region, strasse, telefon1, telefon2, telefon3, xkoord, ykoord, heimatort, pass_name1, pass_name2, zusatzdaten.

  **Filter-Parameter (optional):** `vorgangnr` (aktuell einziger Filter-Parameter).

  **Body (weitere optionale Parameter):** `fields` (Array oder `"*"`), `orderby`, `limit`, `offset`.

  **Antwort:** wie die ungefilterte Liste – ohne `limit` `{"header":{...},"data":[...]}` (SerializeQuery), mit `limit` `{"total":N,"limit":N,"offset":N,"data":{"header":{...},"data":[...]}}`.

  **Auth:** erforderlich (Bearer Token).
