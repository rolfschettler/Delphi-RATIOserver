info:
  name: GET /incoming/gett_teilnehmerbyid – Teilnehmer per nr abfragen
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseURL}}/incoming/gett_teilnehmerbyid"
  body:
    type: json
    data: |-
      {
        "nr": 501,
        "fields": "*"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Liefert genau einen T_TEILNEHMER-Datensatz anhand des Primaerschluessels (`DoSelectOne('T_TEILNEHMER', ALLOWED, 'nr')`).

  **Erlaubte Felder (ALLOWED):** nr, vorgangnr, anrede, name, kennziffer, geburtstag, jahre, shuttle, info1, info2, ref1, ref2, gruppe, sitzfest, hininfo, rueckinfo, ausstiegrueck, profil, status, reservierungsnr, kabinengruppe, infofaehre, zustieghin, ausstieghin, zustiegrueck, ausstieg_rueck, sitzhin, sitzrueck, leistungen, passnummer, ausgestellt_in, ausgestellt_am, gueltig_bis, passinfo, passid, nation, geburtsort, name1, name2, name3, namenszusatz, titel, email, land, ort, ortsteil, plz, region, strasse, telefon1, telefon2, telefon3, xkoord, ykoord, heimatort, pass_name1, pass_name2, zusatzdaten.

  **Body:** `nr` (Pflicht, Integer, Primaerschluessel), `fields` (optional, Array oder `"*"`).

  **Antwort:** `{"header":{...},"data":[{...}]}` (SerializeQuery; `data` enthaelt den gefundenen Datensatz bzw. ist leer, wenn der Schluessel nicht existiert).

  **Auth:** erforderlich (Bearer Token).
