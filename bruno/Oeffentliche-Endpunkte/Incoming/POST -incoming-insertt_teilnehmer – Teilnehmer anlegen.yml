docs: |-
  **Teilnehmer anlegen.** Legt einen neuen Eintrag in `T_TEILNEHMER` an.

  | | |
  |---|---|
  | **Aufruf** | `POST {{baseURL}}/incoming/insertt_teilnehmer` |
  | **Anmeldung** | nötig – Token aus `/login` (wird in Bruno automatisch mitgeschickt) |
  | **Berechtigung** | Der Benutzer braucht diesen Endpunkt in seinen Rollen (sonst Fehler 403) |

  ### Was du mitschickst
  Die gewünschten Felder als `"feld": wert`. Nicht mitgeschickte Felder bleiben leer, `null` macht ein Feld ausdrücklich leer.

  | Feld | Typ | Pflicht laut Datenbank |
  |---|---|---|
  | `nr` | Ganzzahl | ja |
  | `vorgangnr` | Ganzzahl |  |
  | `anrede` | Text (max. 5 Zeichen) |  |
  | `name` | Text (max. 90 Zeichen) |  |
  | `kennziffer` | Ganzzahl |  |
  | `geburtstag` | Datum/Uhrzeit |  |
  | `jahre` | Ganzzahl |  |
  | `shuttle` | Text (max. 2 Zeichen) |  |
  | `info1` | Text (max. 120 Zeichen) |  |
  | `info2` | Text (max. 120 Zeichen) |  |
  | `ref1` | Text (max. 60 Zeichen) |  |
  | `ref2` | Text (max. 60 Zeichen) |  |
  | `gruppe` | Ganzzahl |  |
  | `sitzfest` | Text (max. 4 Zeichen) |  |
  | `hininfo` | Text (max. 60 Zeichen) |  |
  | `rueckinfo` | Text (max. 60 Zeichen) |  |
  | `ausstiegrueck` | Text (max. 120 Zeichen) |  |
  | `profil` | Text (max. 20 Zeichen) |  |
  | `status` | Text (max. 10 Zeichen) |  |
  | `reservierungsnr` | Text (max. 50 Zeichen) |  |
  | `kabinengruppe` | Ganzzahl |  |
  | `infofaehre` | Text (max. 250 Zeichen) |  |
  | `zustieghin` | Ganzzahl |  |
  | `ausstieghin` | Ganzzahl |  |
  | `zustiegrueck` | Ganzzahl |  |
  | `ausstieg_rueck` | Ganzzahl |  |
  | `sitzhin` | Text (max. 20 Zeichen) |  |
  | `sitzrueck` | Text (max. 20 Zeichen) |  |
  | `leistungen` | Text (max. 3200 Zeichen) |  |
  | `passnummer` | Text (max. 40 Zeichen) |  |
  | `ausgestellt_in` | Text (max. 40 Zeichen) |  |
  | `ausgestellt_am` | Datum/Uhrzeit |  |
  | `gueltig_bis` | Datum/Uhrzeit |  |
  | `passinfo` | Text (max. 70 Zeichen) |  |
  | `passid` | Text (max. 40 Zeichen) |  |
  | `nation` | Text (max. 40 Zeichen) |  |
  | `geburtsort` | Text (max. 60 Zeichen) |  |
  | `name1` | Text (max. 30 Zeichen) |  |
  | `name2` | Text (max. 30 Zeichen) |  |
  | `name3` | Text (max. 30 Zeichen) |  |
  | `namenszusatz` | Text (max. 180 Zeichen) |  |
  | `titel` | Text (max. 20 Zeichen) |  |
  | `email` | Text (max. 60 Zeichen) |  |
  | `land` | Text (max. 15 Zeichen) |  |
  | `ort` | Text (max. 110 Zeichen) |  |
  | `ortsteil` | Text (max. 80 Zeichen) |  |
  | `plz` | Text (max. 15 Zeichen) |  |
  | `region` | Text (max. 20 Zeichen) |  |
  | `strasse` | Text (max. 110 Zeichen) |  |
  | `telefon1` | Text (max. 25 Zeichen) |  |
  | `telefon2` | Text (max. 25 Zeichen) |  |
  | `telefon3` | Text (max. 25 Zeichen) |  |
  | `xkoord` | Text (max. 20 Zeichen) |  |
  | `ykoord` | Text (max. 20 Zeichen) |  |
  | `heimatort` | Text (max. 60 Zeichen) |  |
  | `pass_name1` | Text (max. 30 Zeichen) |  |
  | `pass_name2` | Text (max. 30 Zeichen) |  |
  | `zusatzdaten` | Langtext/Datei |  |

  ### Was zurückkommt
  ```json
  {"status": "OK"}
  ```

  ### Was schiefgehen kann
  - **401** – nicht angemeldet oder Token abgelaufen → neu einloggen.
  - **403** – keine Berechtigung für diesen Endpunkt.
  - **400** mit Fehlermeldung – die Datenbank lehnt die Daten ab, z.B. Text zu lang für das Feld oder Buchstaben in einem Zahlenfeld.
  - **Fehlermeldung mit Status 200** (`{"status":"error","message":"..."}`), z.B. wenn kein einziges gültiges Feld mitgeschickt wurde – deshalb immer auf `"status": "error"` prüfen.

  ### Gut zu wissen
  - **Die Nummer (`nr`) kannst du mitschicken** – eine freie Nummer liefert vorher der passende `…key`-Endpunkt. **Pflicht:** Die Datenbank vergibt hier keine Nummer automatisch. Die Antwort enthält keine Nummer.
  - **Unbekannte Felder werden ohne Meldung ignoriert.** Ein Tippfehler im Feldnamen fällt also nicht auf – das Feld bleibt einfach leer.

  <details><summary>Für Entwickler</summary>

  - Controller: `TDataModulIncoming.insertT_Teilnehmer` in `Shared/DataModuls/DataModulIncomingClass.pas`
  - Tabelle: `T_TEILNEHMER`, Schlüssel `nr`
  - Umsetzung: generische Methode `DoInsert` der Basisklasse `TDataModulTableBase`
  - Der Server wertet die HTTP-Methode nicht aus – GET und POST funktionieren gleich.

  </details>
