http:
  method: POST
  url: "{{baseURL}}/incoming/insertt_teilnehmer"
  body:
    type: json
    data: |-
      {
        "nr": 42,
        "vorgangnr": 1001,
        "anrede": "Herr",
        "name": "Max Mustermann",
        "name1": "Max",
        "name2": "Mustermann",
        "geburtstag": "1980-05-12",
        "email": "max.mustermann@example.com",
