info:
  name: GET /fuhrpark/getfahrtenbuchkey – neuen Fahrtenbuch-Schlüssel erzeugen
  type: http
  seq: 14

http:
  method: GET
  url: "{{baseURL}}/fuhrpark/getfahrtenbuchkey"
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Erzeugt per InterBase-Generator einen neuen Primärschlüsselwert für die Tabelle FAHRTENBUCH: `SELECT GEN_ID(FAHRTENBUCH_NR, 1) AS nr FROM RDB$DATABASE`. Kein Body erforderlich, es wird kein Datensatz gelesen oder geschrieben – reine Schlüsselvergabe (z. B. vor einem nachfolgenden Insert).

  **Auth:** erforderlich (Bearer Token)

  **Beispiel-Antwort:** `{"header":{"nr":"ftinteger"},"data":[{"nr":123}]}` (SerializeQuery)
