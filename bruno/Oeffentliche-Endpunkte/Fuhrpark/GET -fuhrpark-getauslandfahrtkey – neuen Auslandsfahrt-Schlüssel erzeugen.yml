info:
  name: GET /fuhrpark/getauslandfahrtkey – neuen Auslandsfahrt-Schlüssel erzeugen
  type: http
  seq: 10

http:
  method: GET
  url: "{{baseURL}}/fuhrpark/getauslandfahrtkey"
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Erzeugt per InterBase-Generator einen neuen Primärschlüsselwert für die Tabelle AUSLANDFAHRT: `SELECT GEN_ID(AUSLANDFAHRT_NR, 1) AS nr FROM RDB$DATABASE`. Kein Body erforderlich, es wird kein Datensatz gelesen oder geschrieben – reine Schlüsselvergabe (z. B. vor einem nachfolgenden Insert).

  **Auth:** erforderlich (Bearer Token)

  **Beispiel-Antwort:** `{"header":{"nr":"ftinteger"},"data":[{"nr":123}]}` (SerializeQuery)
