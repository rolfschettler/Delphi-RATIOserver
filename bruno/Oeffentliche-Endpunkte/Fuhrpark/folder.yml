docs:
  content: |-
    **Fuhrpark verwalten:** Fahrzeuge, Tankungen, Fahrtenbuch, Reparaturvorgänge und Auslandsfahrten. Für Tankungen, Fahrtenbuch, Reparaturen und Auslandsfahrten gibt es jeweils Endpunkte zum Auflisten, gefilterten Suchen, Abrufen eines Eintrags, Anlegen, Ändern und Löschen sowie zum Holen einer neuen Nummer.

    Fahrzeuge lassen sich auflisten, suchen, ändern und löschen, aber hier nicht anlegen – ihr Schlüssel ist das Kennzeichen. Die Länderliste ist nur lesbar. Dazu kommt ein Demo-Endpunkt zum Testen von Anmeldung und Berechtigungen.

    Alle Endpunkte brauchen eine Anmeldung (Token aus `/login`), und der Benutzer muss den jeweiligen Endpunkt in seinen Rollen haben (sonst Fehler 403).

    Technik: Controller `TDataModulFuhrpark` (`Shared/DataModuls/DataModulFuhrparkClass.pas`), Tabellen `FAHRZEUG`, `TANKUNG`, `FAHRTENBUCH`, `REPVORGANG`, `AUSLANDFAHRT`, `LAND`.
  type: text/markdown
