info:
  name: POST /fuhrpark/updatefahrzeug – Fahrzeug ändern
  type: http
  seq: 35

http:
  method: POST
  url: "{{baseURL}}/fuhrpark/updatefahrzeug"
  body:
    type: json
    data: |-
      {
        "kennzeichen": "B-RX 123",
        "bezeichnung": "Setra S 431 DT",
        "standort": "Berlin",
        "status": "aktiv"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  **Fahrzeug ändern.** Ändert einen vorhandenen Eintrag in `FAHRZEUG`. Gefunden wird er über `kennzeichen`.

  | | |
  |---|---|
  | **Aufruf** | `POST {{baseURL}}/fuhrpark/updatefahrzeug` |
  | **Anmeldung** | nötig – Token aus `/login` (wird in Bruno automatisch mitgeschickt) |
  | **Berechtigung** | Der Benutzer braucht diesen Endpunkt in seinen Rollen (sonst Fehler 403) |

  ### Was du mitschickst
  | Parameter | Wert | Pflicht | Bedeutung |
  |---|---|---|---|
  | `kennzeichen` | Text (max. 15 Zeichen) | **ja** | Welcher Eintrag geändert wird. |
  | weitere Felder | siehe Liste | mind. eins | Nur die mitgeschickten Felder werden geändert. `null` macht ein Feld leer. |

  ### Änderbare Felder
  | Feld | Typ |
  |---|---|
  | `bezeichnung` | Text (max. 40 Zeichen) |
  | `hersteller` | Text (max. 40 Zeichen) |
  | `typ` | Text (max. 40 Zeichen) |
  | `fahrzeugart` | Text (max. 40 Zeichen) |
  | `baujahr` | Ganzzahl |
  | `leistung` | Text (max. 20 Zeichen) |
  | `hubraum` | Text (max. 20 Zeichen) |
  | `fahrgestellnr` | Text (max. 20 Zeichen) |
  | `motornr` | Text (max. 20 Zeichen) |
  | `briefnr` | Text (max. 20 Zeichen) |
  | `scheinnr` | Text (max. 20 Zeichen) |
  | `standort` | Text (max. 40 Zeichen) |
  | `angeschaft` | Datum/Uhrzeit |
  | `abgeschaft` | Datum/Uhrzeit |
  | `status` | Text (max. 1 Zeichen) |
  | `treibstoff` | Text (max. 40 Zeichen) |
  | `sitzplatz` | Text (max. 20 Zeichen) |
  | `achsen` | Ganzzahl |
  | `text` | Langtext |
  | `bild` | Langtext/Datei |
  | `sitznummern` | Text (max. 2100 Zeichen) |
  | `sitzgesperrt` | Text (max. 140 Zeichen) |
  | `personen` | Ganzzahl |
  | `gesperrt` | Text (max. 4 Zeichen) |
  | `zusatzfeld1` | Text (max. 30 Zeichen) |
  | `zusatzfeld2` | Text (max. 30 Zeichen) |
  | `kmsatz` | Kommazahl |
  | `sortierung` | Ganzzahl |
  | `reihen` | Text (max. 80 Zeichen) |
  | `betrieb` | Text (max. 8 Zeichen) |
  | `profil` | Text (max. 40 Zeichen) |
  | `zuschlag1` | Kommazahl |
  | `zuschlag2` | Kommazahl |
  | `zuschlagarten` | Text (max. 20 Zeichen) |
  | `pin` | Text (max. 30 Zeichen) |
  | `telematikdevice` | Text (max. 50 Zeichen) |
  | `xkoord` | Text (max. 20 Zeichen) |
  | `ykoord` | Text (max. 20 Zeichen) |
  | `standort_aktuell` | Text (max. 120 Zeichen) |
  | `sv_fahrzeugprofil` | Text (max. 40 Zeichen) |
  | `din_norm` | Text (max. 30 Zeichen) |
  | `hinweise` | Text (max. 255 Zeichen) |
  | `km` | Ganzzahl |
  | `lift` | Text (max. 4 Zeichen) |
  | `rueckfahrkamera` | Text (max. 4 Zeichen) |
  | `stammfahrer1` | Text (max. 30 Zeichen) |
  | `stammfahrer2` | Text (max. 30 Zeichen) |
  | `telematik_gelesen_am` | Datum/Uhrzeit |

  ### Was zurückkommt
  ```json
  {"status": "OK"}
  ```

  ### Was schiefgehen kann
  - **401** – nicht angemeldet oder Token abgelaufen → neu einloggen.
  - **403** – keine Berechtigung für diesen Endpunkt.
  - **400** mit Fehlermeldung – die Datenbank lehnt die Daten ab, z.B. Text zu lang für das Feld oder Buchstaben in einem Zahlenfeld.
  - **Fehlermeldung mit Status 200** (`{"status":"error","message":"..."}`), z.B. wenn kein einziges gültiges Feld mitgeschickt wurde – deshalb immer auf `"status": "error"` prüfen.

  ### Gut zu wissen
  - **Nur mitgeschickte Felder werden geändert**, alle anderen bleiben, wie sie sind.
  - **Keine Meldung, wenn es den Eintrag nicht gibt:** Auch bei einem falschen oder fehlenden `kennzeichen` kommt `{"status": "OK"}` – geändert wurde dann aber nichts.
  - `kennzeichen` selbst lässt sich hier nicht ändern.
  - **Unbekannte Felder werden ohne Meldung ignoriert** – ein Tippfehler im Feldnamen fällt also nicht auf.

  <details><summary>Für Entwickler</summary>

  - Controller: `TDataModulFuhrpark.updateFahrzeug` in `Shared/DataModuls/DataModulFuhrparkClass.pas`
  - Tabelle: `FAHRZEUG`, Schlüssel `kennzeichen`
  - Umsetzung: generische Methode `DoUpdate` der Basisklasse `TDataModulTableBase`
  - Der Server wertet die HTTP-Methode nicht aus – GET und POST funktionieren gleich.

  </details>
