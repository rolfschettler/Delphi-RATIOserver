info:
  name: GET /fuhrpark/getauslandfahrtbyid – Auslandsfahrt per nr abrufen
  type: http
  seq: 8

http:
  method: GET
  url: "{{baseURL}}/fuhrpark/getauslandfahrtbyid"
  body:
    type: json
    data: |-
      {
        "nr": 42,
        "fields": "*"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Liefert genau einen Datensatz der Tabelle AUSLANDFAHRT anhand des Primärschlüssels `nr` (Aufruf: `DoSelectOne('AUSLANDFAHRT', ALLOWED, 'nr')`).

  **Erlaubte Felder (ALLOWED):** nr, fahrtnr, landkennung, kmausland, transit, betrag, steuer, grenzeintritt, grenzaustritt, kmleer, grenzeintritt_am, grenzaustritt_am, datum

  **Body:** `{ "nr": <wert>, "fields": [...] | "*" }`

  **Auth:** erforderlich (Bearer Token)

  **Antwort:** `{"header":{...},"data":[{...}]}` (SerializeQuery; `data` enthaelt den gefundenen Datensatz bzw. ist leer, wenn der Schluessel nicht existiert).
