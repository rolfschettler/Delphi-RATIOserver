info:
  name: GET /fuhrpark/getrepvorgangbyid – Reparaturvorgang per nr abrufen
  type: http
  seq: 22

http:
  method: GET
  url: "{{baseURL}}/fuhrpark/getrepvorgangbyid"
  body:
    type: json
    data: |-
      {
        "nr": 42,
        "fields": "*"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Liefert genau einen Datensatz der Tabelle REPVORGANG anhand des Primärschlüssels `nr` (Aufruf: `DoSelectOne('REPVORGANG', ALLOWED, 'nr')`).

  **Erlaubte Felder (ALLOWED):** nr, kennzeichen, bezeichnung, vorgangsart, unfall, erledigt, datum, meldungam, meldungvon, beschreibung, dringlichkeit, zyklischertermin, wiedervorlage, notizen

  **Body:** `{ "nr": <wert>, "fields": [...] | "*" }`

  **Auth:** erforderlich (Bearer Token)

  **Antwort:** `{"header":{...},"data":[{...}]}` (SerializeQuery; `data` enthaelt den gefundenen Datensatz bzw. ist leer, wenn der Schluessel nicht existiert).
