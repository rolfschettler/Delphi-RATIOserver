info:
  name: GET /fuhrpark/getrepvorgangbyid – Reparaturvorgang per nr abrufen
  type: http
  seq: 22

http:
  method: GET
  url: "{{baseURL}}/fuhrpark/getrepvorgangbyid"
  body:
    type: json
    data: |-
      {
        "nr": 42,
        "fields": "*"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  **Reparaturvorgang per nr abrufen.** Liefert genau einen Eintrag aus `REPVORGANG`, gesucht über `nr`.

  | | |
  |---|---|
  | **Aufruf** | `GET {{baseURL}}/fuhrpark/getrepvorgangbyid` |
  | **Anmeldung** | nötig – Token aus `/login` (wird in Bruno automatisch mitgeschickt) |
  | **Berechtigung** | Der Benutzer braucht diesen Endpunkt in seinen Rollen (sonst Fehler 403) |

  ### Was du mitschickst
  | Parameter | Wert | Pflicht | Bedeutung |
  |---|---|---|---|
  | `nr` | Ganzzahl | **ja** | Der gesuchte Eintrag. |
  | `fields` | `"*"` oder Liste | nein | Welche Felder zurückkommen sollen. Weglassen = alle. |

  ### Verfügbare Felder
  | Feld | Typ |
  |---|---|
  | `nr` | Ganzzahl |
  | `kennzeichen` | Text (max. 15 Zeichen) |
  | `bezeichnung` | Text (max. 200 Zeichen) |
  | `vorgangsart` | Text (max. 30 Zeichen) |
  | `unfall` | Text (max. 4 Zeichen) |
  | `erledigt` | Text (max. 4 Zeichen) |
  | `datum` | Datum/Uhrzeit |
  | `meldungam` | Datum/Uhrzeit |
  | `meldungvon` | Text (max. 30 Zeichen) |
  | `beschreibung` | Langtext/Datei |
  | `dringlichkeit` | Text (max. 30 Zeichen) |
  | `zyklischertermin` | Text (max. 4 Zeichen) |
  | `wiedervorlage` | Datum/Uhrzeit |
  | `notizen` | Langtext/Datei |

  ### Was zurückkommt
  ```json
  {"header": {...}, "data": [ {"nr": 42, "kennzeichen": "Text", "bezeichnung": "Text", ...} ]}
  ```

  ### Was schiefgehen kann
  - **401** – nicht angemeldet oder Token abgelaufen → neu einloggen.
  - **403** – keine Berechtigung für diesen Endpunkt.
  - **Fehlermeldung im Text** (`{"status":"error","message":"..."}`), z.B. wenn ein Feldname in `fields` oder `orderby` nicht erlaubt ist. Achtung: Solche Fehler kommen teilweise mit HTTP-Status 200 – deshalb immer auf `"status": "error"` prüfen.

  ### Gut zu wissen
  - **Nicht gefunden = leere Liste:** Gibt es den Eintrag nicht, kommt kein Fehler, sondern `"data": []`.
  - **`nr` muss mitgeschickt werden**, sonst kommt eine Fehlermeldung.
  - **Nicht abrufbar** sind hier: `beteiligtes_fahrzeug_verursacher`, `linie_umlauf`, `unfallnummer_polizei`, `unfallort`, `verunglueckte_person_verhalten`, `zusatzfeld1`, `zusatzfeld2`, `zusatzfeld3`, `zusatzfeld4`, `zusatzfeld5`, `zusatzfeld6`, `zusatzfeld7`, `zusatzfeld8`.

  <details><summary>Für Entwickler</summary>

  - Controller: `TDataModulFuhrpark.getRepvorgangById` in `Shared/DataModuls/DataModulFuhrparkClass.pas`
  - Tabelle: `REPVORGANG`, Schlüssel `nr`
  - Umsetzung: generische Methode `DoSelectOne` der Basisklasse `TDataModulTableBase`
  - Der Server wertet die HTTP-Methode nicht aus – GET und POST funktionieren gleich.

  </details>
