info:
  name: GET /fuhrpark/getrepvorgangfiltered – Reparaturvorgänge gefiltert auflisten
  type: http
  seq: 23

http:
  method: GET
  url: "{{baseURL}}/fuhrpark/getrepvorgangfiltered"
  body:
    type: json
    data: |-
      {
        "fields": "*",
        "kennzeichen": "B-RX 123",
        "erledigt": "N",
        "orderby": "datum"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Listet Datensätze der Tabelle REPVORGANG gefiltert auf (Aufruf: `DoSelectFilteredDynamic('REPVORGANG', ALLOWED, CONDITIONS, FILTER_PARAMS)`).

  **Erlaubte Felder (ALLOWED):** nr, kennzeichen, bezeichnung, vorgangsart, unfall, erledigt, datum, meldungam, meldungvon, beschreibung, dringlichkeit, zyklischertermin, wiedervorlage, notizen

  **Filter-Parameter (alle optional, jeder gesetzte erzeugt eine AND-verknüpfte WHERE-Bedingung `feld = :feld`):** nr, kennzeichen, bezeichnung, vorgangsart, unfall, erledigt, datum, meldungam, meldungvon, beschreibung, dringlichkeit, zyklischertermin, wiedervorlage, notizen

  **Body:** `{ "fields": [...] | "*", "<filterfeld>": <wert>, ..., "orderby": "feld", "limit": 10, "offset": 0 }`

  **Auth:** erforderlich (Bearer Token)

  **Antwort:** ohne `limit` `{"header":{"<feld>":"<typ>",...},"data":[{...},...]}` (SerializeQuery: `header` = Feldname -> Typ, `data` = Datensaetze); mit `limit` `{"total":N,"limit":N,"offset":N,"data":{"header":{...},"data":[...]}}`.
