info:
  name: POST /fuhrpark/insertauslandfahrt – Auslandsfahrt anlegen
  type: http
  seq: 29

http:
  method: POST
  url: "{{baseURL}}/fuhrpark/insertauslandfahrt"
  body:
    type: json
    data: |-
      {
        "fahrtnr": 100,
        "landkennung": "F",
        "kmausland": 250,
        "transit": "N",
        "betrag": 120.00,
        "steuer": 22.80,
        "grenzeintritt": "Kehl",
        "grenzaustritt": "Kehl",
        "kmleer": 0,
        "grenzeintritt_am": "2026-07-01T08:00",
        "grenzaustritt_am": "2026-07-03T18:00",
        "datum": "2026-07-01"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  **Auslandsfahrt anlegen.** Legt einen neuen Eintrag in `AUSLANDFAHRT` an.

  | | |
  |---|---|
  | **Aufruf** | `POST {{baseURL}}/fuhrpark/insertauslandfahrt` |
  | **Anmeldung** | nötig – Token aus `/login` (wird in Bruno automatisch mitgeschickt) |
  | **Berechtigung** | Der Benutzer braucht diesen Endpunkt in seinen Rollen (sonst Fehler 403) |

  ### Was du mitschickst
  Die gewünschten Felder als `"feld": wert`. Nicht mitgeschickte Felder bleiben leer, `null` macht ein Feld ausdrücklich leer.

  | Feld | Typ |
  |---|---|
  | `fahrtnr` | Ganzzahl |
  | `landkennung` | Text (max. 4 Zeichen) |
  | `kmausland` | Ganzzahl |
  | `transit` | Text (max. 4 Zeichen) |
  | `betrag` | Kommazahl |
  | `steuer` | Kommazahl |
  | `grenzeintritt` | Ganzzahl |
  | `grenzaustritt` | Ganzzahl |
  | `kmleer` | Ganzzahl |
  | `grenzeintritt_am` | Datum/Uhrzeit |
  | `grenzaustritt_am` | Datum/Uhrzeit |
  | `datum` | Datum/Uhrzeit |

  ### Was zurückkommt
  ```json
  {"status": "OK"}
  ```

  ### Was schiefgehen kann
  - **401** – nicht angemeldet oder Token abgelaufen → neu einloggen.
  - **403** – keine Berechtigung für diesen Endpunkt.
  - **400** mit Fehlermeldung – die Datenbank lehnt die Daten ab, z.B. Text zu lang für das Feld oder Buchstaben in einem Zahlenfeld.
  - **Fehlermeldung mit Status 200** (`{"status":"error","message":"..."}`), z.B. wenn kein einziges gültiges Feld mitgeschickt wurde – deshalb immer auf `"status": "error"` prüfen.

  ### Gut zu wissen
  - **Die Nummer (`nr`) vergibt die Datenbank automatisch** – mitschicken geht nicht, sie würde ignoriert. Die Antwort enthält die neue Nummer nicht; wer sie braucht, sucht den Eintrag danach (z.B. über den `…filtered`-Endpunkt).
  - **Unbekannte Felder werden ohne Meldung ignoriert.** Ein Tippfehler im Feldnamen fällt also nicht auf – das Feld bleibt einfach leer.

  <details><summary>Für Entwickler</summary>

  - Controller: `TDataModulFuhrpark.insertAuslandfahrt` in `Shared/DataModuls/DataModulFuhrparkClass.pas`
  - Tabelle: `AUSLANDFAHRT`, Schlüssel `nr`
  - Umsetzung: generische Methode `DoInsert` der Basisklasse `TDataModulTableBase`
  - Der Server wertet die HTTP-Methode nicht aus – GET und POST funktionieren gleich.

  </details>
