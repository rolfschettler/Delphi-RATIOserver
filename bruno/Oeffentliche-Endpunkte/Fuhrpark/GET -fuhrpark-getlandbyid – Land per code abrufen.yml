info:
  name: GET /fuhrpark/getlandbyid – Land per code abrufen
  type: http
  seq: 19

http:
  method: GET
  url: "{{baseURL}}/fuhrpark/getlandbyid"
  body:
    type: json
    data: |-
      {
        "code": "D",
        "fields": "*"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  **Land per code abrufen.** Liefert genau einen Eintrag aus `LAND`, gesucht über `code`.

  | | |
  |---|---|
  | **Aufruf** | `GET {{baseURL}}/fuhrpark/getlandbyid` |
  | **Anmeldung** | nötig – Token aus `/login` (wird in Bruno automatisch mitgeschickt) |
  | **Berechtigung** | Der Benutzer braucht diesen Endpunkt in seinen Rollen (sonst Fehler 403) |

  ### Was du mitschickst
  | Parameter | Wert | Pflicht | Bedeutung |
  |---|---|---|---|
  | `code` | Text (max. 5 Zeichen) | **ja** | Der gesuchte Eintrag. |
  | `fields` | `"*"` oder Liste | nein | Welche Felder zurückkommen sollen. Weglassen = alle. |

  ### Verfügbare Felder
  | Feld | Typ |
  |---|---|
  | `code` | Text (max. 5 Zeichen) |
  | `staat` | Text (max. 20 Zeichen) |
  | `steuer` | Kommazahl |
  | `fiskel` | Text (max. 4 Zeichen) |
  | `euland` | Text (max. 4 Zeichen) |
  | `inland` | Text (max. 1 Zeichen) |
  | `formular` | Text (max. 20 Zeichen) |
  | `iso2` | Text (max. 2 Zeichen) |
  | `iso3` | Text (max. 3 Zeichen) |
  | `sortierung` | Ganzzahl |
  | `sachkonto` | Text (max. 12 Zeichen) |

  ### Was zurückkommt
  ```json
  {"header": {...}, "data": [ {"code": "Text", "staat": "Text", "steuer": 12.5, ...} ]}
  ```

  ### Was schiefgehen kann
  - **401** – nicht angemeldet oder Token abgelaufen → neu einloggen.
  - **403** – keine Berechtigung für diesen Endpunkt.
  - **Fehlermeldung im Text** (`{"status":"error","message":"..."}`), z.B. wenn ein Feldname in `fields` oder `orderby` nicht erlaubt ist. Achtung: Solche Fehler kommen teilweise mit HTTP-Status 200 – deshalb immer auf `"status": "error"` prüfen.

  ### Gut zu wissen
  - **Nicht gefunden = leere Liste:** Gibt es den Eintrag nicht, kommt kein Fehler, sondern `"data": []`.
  - **`code` muss mitgeschickt werden**, sonst kommt eine Fehlermeldung.

  <details><summary>Für Entwickler</summary>

  - Controller: `TDataModulFuhrpark.getLandById` in `Shared/DataModuls/DataModulFuhrparkClass.pas`
  - Tabelle: `LAND`, Schlüssel `code`
  - Umsetzung: generische Methode `DoSelectOne` der Basisklasse `TDataModulTableBase`
  - Der Server wertet die HTTP-Methode nicht aus – GET und POST funktionieren gleich.

  </details>
