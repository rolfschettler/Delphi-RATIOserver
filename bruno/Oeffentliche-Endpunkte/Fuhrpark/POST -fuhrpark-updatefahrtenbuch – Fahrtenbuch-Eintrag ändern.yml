info:
  name: POST /fuhrpark/updatefahrtenbuch – Fahrtenbuch-Eintrag ändern
  type: http
  seq: 34

http:
  method: POST
  url: "{{baseURL}}/fuhrpark/updatefahrtenbuch"
  body:
    type: json
    data: |-
      {
        "nr": 42,
        "kz": "A",
        "von": "2026-06-19T08:00",
        "kmgesamt": 620
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  **Fahrtenbuch-Eintrag ändern.** Ändert einen vorhandenen Eintrag in `FAHRTENBUCH`. Gefunden wird er über `nr`.

  | | |
  |---|---|
  | **Aufruf** | `POST {{baseURL}}/fuhrpark/updatefahrtenbuch` |
  | **Anmeldung** | nötig – Token aus `/login` (wird in Bruno automatisch mitgeschickt) |
  | **Berechtigung** | Der Benutzer braucht diesen Endpunkt in seinen Rollen (sonst Fehler 403) |

  ### Was du mitschickst
  | Parameter | Wert | Pflicht | Bedeutung |
  |---|---|---|---|
  | `nr` | Ganzzahl | **ja** | Welcher Eintrag geändert wird. |
  | weitere Felder | siehe Liste | mind. eins | Nur die mitgeschickten Felder werden geändert. `null` macht ein Feld leer. |

  ### Änderbare Felder
  | Feld | Typ |
  |---|---|
  | `kz` | Text (max. 1 Zeichen) |
  | `von` | Datum/Uhrzeit |
  | `bis` | Datum/Uhrzeit |
  | `strecke` | Text (max. 120 Zeichen) |
  | `auftragsgeber` | Text (max. 90 Zeichen) |
  | `kminland` | Ganzzahl |
  | `kmausland` | Ganzzahl |
  | `kmleer` | Ganzzahl |
  | `kmanfang` | Ganzzahl |
  | `kmende` | Ganzzahl |
  | `kmgesamt` | Ganzzahl |
  | `personen` | Ganzzahl |
  | `fahrer` | Text (max. 50 Zeichen) |
  | `umsatz` | Kommazahl |
  | `rvlin` | Kommazahl |
  | `rvlaus` | Kommazahl |
  | `eleistung` | Kommazahl |
  | `kennzeichen` | Text (max. 15 Zeichen) |
  | `text` | Text (max. 50 Zeichen) |
  | `steuerfahr` | Kommazahl |
  | `steuermarge` | Kommazahl |
  | `freiemarge` | Kommazahl |
  | `freieumsatz` | Kommazahl |
  | `ratiobusfahrtnr` | Ganzzahl |
  | `steuer` | Kommazahl |
  | `sonstigervl` | Kommazahl |
  | `sonstrvlpz` | Kommazahl |
  | `steuermarge2` | Kommazahl |
  | `fahrer2` | Text (max. 50 Zeichen) |
  | `beguenstigt` | Text (max. 4 Zeichen) |
  | `zusatz1` | Text (max. 50 Zeichen) |
  | `zusatz2` | Text (max. 50 Zeichen) |
  | `km_stand_zustieg_1_kunde` | Ganzzahl |
  | `km_stand_ausstieg_l_kunde` | Ganzzahl |

  ### Was zurückkommt
  ```json
  {"status": "OK"}
  ```

  ### Was schiefgehen kann
  - **401** – nicht angemeldet oder Token abgelaufen → neu einloggen.
  - **403** – keine Berechtigung für diesen Endpunkt.
  - **400** mit Fehlermeldung – die Datenbank lehnt die Daten ab, z.B. Text zu lang für das Feld oder Buchstaben in einem Zahlenfeld.
  - **Fehlermeldung mit Status 200** (`{"status":"error","message":"..."}`), z.B. wenn kein einziges gültiges Feld mitgeschickt wurde – deshalb immer auf `"status": "error"` prüfen.

  ### Gut zu wissen
  - **Nur mitgeschickte Felder werden geändert**, alle anderen bleiben, wie sie sind.
  - **Keine Meldung, wenn es den Eintrag nicht gibt:** Auch bei einem falschen oder fehlenden `nr` kommt `{"status": "OK"}` – geändert wurde dann aber nichts.
  - `nr` selbst lässt sich hier nicht ändern.
  - **Unbekannte Felder werden ohne Meldung ignoriert** – ein Tippfehler im Feldnamen fällt also nicht auf.

  <details><summary>Für Entwickler</summary>

  - Controller: `TDataModulFuhrpark.updateFahrtenbuch` in `Shared/DataModuls/DataModulFuhrparkClass.pas`
  - Tabelle: `FAHRTENBUCH`, Schlüssel `nr`
  - Umsetzung: generische Methode `DoUpdate` der Basisklasse `TDataModulTableBase`
  - Der Server wertet die HTTP-Methode nicht aus – GET und POST funktionieren gleich.

  </details>
