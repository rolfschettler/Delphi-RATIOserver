info:
  name: GET /fuhrpark/getrepvorgangkey – neuen Reparaturvorgang-Schlüssel erzeugen
  type: http
  seq: 24

http:
  method: GET
  url: "{{baseURL}}/fuhrpark/getrepvorgangkey"
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Erzeugt per InterBase-Generator einen neuen Primärschlüsselwert für die Tabelle REPVORGANG: `SELECT GEN_ID(REPVORGANG_NR_GEN, 1) AS nr FROM RDB$DATABASE`. Kein Body erforderlich, es wird kein Datensatz gelesen oder geschrieben – reine Schlüsselvergabe (z. B. vor einem nachfolgenden Insert).

  **Auth:** erforderlich (Bearer Token)

  **Beispiel-Antwort:** `{"header":{"nr":"ftinteger"},"data":[{"nr":123}]}` (SerializeQuery)
