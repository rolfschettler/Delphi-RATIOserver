info:
  name: GET /fuhrpark/gettankungbyid – Tankung per nr abrufen
  type: http
  seq: 26

http:
  method: GET
  url: "{{baseURL}}/fuhrpark/gettankungbyid"
  body:
    type: json
    data: |-
      {
        "nr": 42,
        "fields": "*"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  **Tankung per nr abrufen.** Liefert genau einen Eintrag aus `TANKUNG`, gesucht über `nr`.

  | | |
  |---|---|
  | **Aufruf** | `GET {{baseURL}}/fuhrpark/gettankungbyid` |
  | **Anmeldung** | nötig – Token aus `/login` (wird in Bruno automatisch mitgeschickt) |
  | **Berechtigung** | Der Benutzer braucht diesen Endpunkt in seinen Rollen (sonst Fehler 403) |

  ### Was du mitschickst
  | Parameter | Wert | Pflicht | Bedeutung |
  |---|---|---|---|
  | `nr` | Ganzzahl | **ja** | Der gesuchte Eintrag. |
  | `fields` | `"*"` oder Liste | nein | Welche Felder zurückkommen sollen. Weglassen = alle. |

  ### Verfügbare Felder
  | Feld | Typ |
  |---|---|
  | `nr` | Ganzzahl |
  | `datum` | Datum/Uhrzeit |
  | `bezeichnung` | Text (max. 20 Zeichen) |
  | `kraftstoffart` | Text (max. 20 Zeichen) |
  | `menge` | Kommazahl |
  | `preis` | Kommazahl |
  | `km` | Ganzzahl |
  | `landkennung` | Text (max. 4 Zeichen) |
  | `heimtankung` | Text (max. 4 Zeichen) |
  | `kennzeichen` | Text (max. 15 Zeichen) |
  | `lieferantennr` | Text (max. 30 Zeichen) |
  | `lieferantenname` | Text (max. 40 Zeichen) |
  | `exttanknr` | Text (max. 30 Zeichen) |
  | `einsatznr` | Text (max. 30 Zeichen) |
  | `mitarbeiter` | Text (max. 30 Zeichen) |
  | `waehrung` | Text (max. 3 Zeichen) |

  ### Was zurückkommt
  ```json
  {"header": {...}, "data": [ {"nr": 42, "datum": "2026-09-01 08:00:00", "bezeichnung": "Text", ...} ]}
  ```

  ### Was schiefgehen kann
  - **401** – nicht angemeldet oder Token abgelaufen → neu einloggen.
  - **403** – keine Berechtigung für diesen Endpunkt.
  - **Fehlermeldung im Text** (`{"status":"error","message":"..."}`), z.B. wenn ein Feldname in `fields` oder `orderby` nicht erlaubt ist. Achtung: Solche Fehler kommen teilweise mit HTTP-Status 200 – deshalb immer auf `"status": "error"` prüfen.

  ### Gut zu wissen
  - **Nicht gefunden = leere Liste:** Gibt es den Eintrag nicht, kommt kein Fehler, sondern `"data": []`.
  - **`nr` muss mitgeschickt werden**, sonst kommt eine Fehlermeldung.
  - **Nicht abrufbar** sind hier: `bild`, `bild_klein`.

  <details><summary>Für Entwickler</summary>

  - Controller: `TDataModulFuhrpark.getTankungById` in `Shared/DataModuls/DataModulFuhrparkClass.pas`
  - Tabelle: `TANKUNG`, Schlüssel `nr`
  - Umsetzung: generische Methode `DoSelectOne` der Basisklasse `TDataModulTableBase`
  - Der Server wertet die HTTP-Methode nicht aus – GET und POST funktionieren gleich.

  </details>
