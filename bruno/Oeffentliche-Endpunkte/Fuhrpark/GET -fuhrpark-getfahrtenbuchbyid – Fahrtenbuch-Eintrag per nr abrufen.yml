info:
  name: GET /fuhrpark/getfahrtenbuchbyid – Fahrtenbuch-Eintrag per nr abrufen
  type: http
  seq: 12

http:
  method: GET
  url: "{{baseURL}}/fuhrpark/getfahrtenbuchbyid"
  body:
    type: json
    data: |-
      {
        "nr": 42,
        "fields": "*"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  **Fahrtenbuch-Eintrag per nr abrufen.** Liefert genau einen Eintrag aus `FAHRTENBUCH`, gesucht über `nr`.

  | | |
  |---|---|
  | **Aufruf** | `GET {{baseURL}}/fuhrpark/getfahrtenbuchbyid` |
  | **Anmeldung** | nötig – Token aus `/login` (wird in Bruno automatisch mitgeschickt) |
  | **Berechtigung** | Der Benutzer braucht diesen Endpunkt in seinen Rollen (sonst Fehler 403) |

  ### Was du mitschickst
  | Parameter | Wert | Pflicht | Bedeutung |
  |---|---|---|---|
  | `nr` | Ganzzahl | **ja** | Der gesuchte Eintrag. |
  | `fields` | `"*"` oder Liste | nein | Welche Felder zurückkommen sollen. Weglassen = alle. |

  ### Verfügbare Felder
  | Feld | Typ |
  |---|---|
  | `nr` | Ganzzahl |
  | `kz` | Text (max. 1 Zeichen) |
  | `von` | Datum/Uhrzeit |
  | `bis` | Datum/Uhrzeit |
  | `strecke` | Text (max. 120 Zeichen) |
  | `auftragsgeber` | Text (max. 90 Zeichen) |
  | `kminland` | Ganzzahl |
  | `kmausland` | Ganzzahl |
  | `kmleer` | Ganzzahl |
  | `kmanfang` | Ganzzahl |
  | `kmende` | Ganzzahl |
  | `kmgesamt` | Ganzzahl |
  | `personen` | Ganzzahl |
  | `fahrer` | Text (max. 50 Zeichen) |
  | `umsatz` | Kommazahl |
  | `rvlin` | Kommazahl |
  | `rvlaus` | Kommazahl |
  | `eleistung` | Kommazahl |
  | `kennzeichen` | Text (max. 15 Zeichen) |
  | `text` | Text (max. 50 Zeichen) |
  | `steuerfahr` | Kommazahl |
  | `steuermarge` | Kommazahl |
  | `freiemarge` | Kommazahl |
  | `freieumsatz` | Kommazahl |
  | `ratiobusfahrtnr` | Ganzzahl |
  | `steuer` | Kommazahl |
  | `sonstigervl` | Kommazahl |
  | `sonstrvlpz` | Kommazahl |
  | `steuermarge2` | Kommazahl |
  | `fahrer2` | Text (max. 50 Zeichen) |
  | `beguenstigt` | Text (max. 4 Zeichen) |
  | `zusatz1` | Text (max. 50 Zeichen) |
  | `zusatz2` | Text (max. 50 Zeichen) |
  | `km_stand_zustieg_1_kunde` | Ganzzahl |
  | `km_stand_ausstieg_l_kunde` | Ganzzahl |

  ### Was zurückkommt
  ```json
  {"header": {...}, "data": [ {"nr": 42, "kz": "Text", "von": "2026-09-01 08:00:00", ...} ]}
  ```

  ### Was schiefgehen kann
  - **401** – nicht angemeldet oder Token abgelaufen → neu einloggen.
  - **403** – keine Berechtigung für diesen Endpunkt.
  - **Fehlermeldung im Text** (`{"status":"error","message":"..."}`), z.B. wenn ein Feldname in `fields` oder `orderby` nicht erlaubt ist. Achtung: Solche Fehler kommen teilweise mit HTTP-Status 200 – deshalb immer auf `"status": "error"` prüfen.

  ### Gut zu wissen
  - **Nicht gefunden = leere Liste:** Gibt es den Eintrag nicht, kommt kein Fehler, sondern `"data": []`.
  - **`nr` muss mitgeschickt werden**, sonst kommt eine Fehlermeldung.

  <details><summary>Für Entwickler</summary>

  - Controller: `TDataModulFuhrpark.getFahrtenbuchById` in `Shared/DataModuls/DataModulFuhrparkClass.pas`
  - Tabelle: `FAHRTENBUCH`, Schlüssel `nr`
  - Umsetzung: generische Methode `DoSelectOne` der Basisklasse `TDataModulTableBase`
  - Der Server wertet die HTTP-Methode nicht aus – GET und POST funktionieren gleich.

  </details>
