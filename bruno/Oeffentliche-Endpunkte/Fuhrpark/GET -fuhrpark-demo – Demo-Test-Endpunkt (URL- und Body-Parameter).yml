info:
  name: GET /fuhrpark/demo – Demo/Test-Endpunkt (URL- und Body-Parameter)
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseURL}}/fuhrpark/demo?id=42&filter=Mueller"
  params:
    - name: id
      value: "42"
      type: query
    - name: filter
      value: Mueller
      type: query
  body:
    type: json
    data: |-
      {
        "name": "Helga",
        "menge": 5
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Referenz-/Testendpunkt ohne Bezug zu einer Datenbanktabelle. Demonstriert den sicheren Zugriff auf Parameter aus zwei Quellen und den Umgang mit fehlenden Werten:

  - **URL/QueryString** (`Request.QueryFields`): `id` (numerisch; fehlt er, wird `null` geliefert, ein nicht-numerischer Wert ergibt 0), `filter` (String; fehlt er bzw. ist leer, wird `null` geliefert)
  - **JSON-Body** (`isParamFromBody`/`getParamFromBody`): `name` (String), `menge` (Zahl, per `StrToIntDef` gewandelt)

  Fehlende Werte erzeugen keinen Fehler, sondern erscheinen im Ergebnis als JSON `null`. Body ist optional – auch ganz ohne Body oder ohne URL-Parameter lieferbar.

  **Auth:** erforderlich (Bearer Token)

  **Beispiel-Antwort:**
  ```json
  {
    "url": { "id": 42, "filter": "Mueller" },
    "body": { "name": "Helga", "menge": 5 }
  }
  ```
