info:
  name: GET /fuhrpark/getfahrzeugfiltered – Fahrzeuge gefiltert auflisten
  type: http
  seq: 17

http:
  method: GET
  url: "{{baseURL}}/fuhrpark/getfahrzeugfiltered"
  body:
    type: json
    data: |-
      {
        "fields": "*",
        "kennzeichen": "B-RX 123",
        "hersteller": "Setra",
        "orderby": "kennzeichen"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Listet Datensätze der Tabelle FAHRZEUG gefiltert auf (Aufruf: `DoSelectFilteredDynamic('FAHRZEUG', ALLOWED, CONDITIONS, FILTER_PARAMS)`).

  **Erlaubte Felder (ALLOWED):** kennzeichen, bezeichnung, hersteller, typ, fahrzeugart, baujahr, leistung, hubraum, fahrgestellnr, motornr, briefnr, scheinnr, standort, angeschaft, abgeschaft, status, treibstoff, sitzplatz, achsen, text, bild, sitznummern, sitzgesperrt, personen, gesperrt, zusatzfeld1, zusatzfeld2, kmsatz, sortierung, reihen, betrieb, profil, zuschlag1, zuschlag2, zuschlagarten, pin, telematikdevice, xkoord, ykoord, standort_aktuell, sv_fahrzeugprofil, din_norm, hinweise, km, lift, rueckfahrkamera, stammfahrer1, stammfahrer2, telematik_gelesen_am

  **Filter-Parameter (alle optional, jeder gesetzte erzeugt eine AND-verknüpfte WHERE-Bedingung `feld = :feld`):** kennzeichen, bezeichnung, hersteller, typ, fahrzeugart, baujahr, leistung, hubraum, fahrgestellnr, motornr, briefnr, scheinnr, standort, angeschaft, abgeschaft, status, treibstoff, sitzplatz, achsen, sitznummern, sitzgesperrt, personen, gesperrt, zusatzfeld1, zusatzfeld2, kmsatz, sortierung, reihen, betrieb, profil, zuschlag1, zuschlag2, zuschlagarten, pin, telematikdevice, xkoord, ykoord, standort_aktuell, sv_fahrzeugprofil, din_norm, hinweise, km, lift, rueckfahrkamera, stammfahrer1, stammfahrer2, telematik_gelesen_am — **ohne** `text` und `bild` (BLOB-Felder sind laut Code-Kommentar bewusst nicht filterbar, da InterBase keinen Gleichheitsvergleich auf BLOBs unterstützt).

  **Body:** `{ "fields": [...] | "*", "<filterfeld>": <wert>, ..., "orderby": "feld", "limit": 10, "offset": 0 }`

  **Auth:** erforderlich (Bearer Token)

  **Antwort:** ohne `limit` `{"header":{"<feld>":"<typ>",...},"data":[{...},...]}` (SerializeQuery: `header` = Feldname -> Typ, `data` = Datensaetze); mit `limit` `{"total":N,"limit":N,"offset":N,"data":{"header":{...},"data":[...]}}`.
