info:
  name: GET /fuhrpark/getfahrzeugfiltered – Fahrzeuge gefiltert auflisten
  type: http
  seq: 17

http:
  method: GET
  url: "{{baseURL}}/fuhrpark/getfahrzeugfiltered"
  body:
    type: json
    data: |-
      {
        "fields": "*",
        "kennzeichen": "B-RX 123",
        "hersteller": "Setra",
        "orderby": "kennzeichen"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  **Fahrzeuge gefiltert auflisten.** Sucht Einträge in `FAHRZEUG` – du gibst die Suchkriterien als Felder im Body mit.

  | | |
  |---|---|
  | **Aufruf** | `GET {{baseURL}}/fuhrpark/getfahrzeugfiltered` |
  | **Anmeldung** | nötig – Token aus `/login` (wird in Bruno automatisch mitgeschickt) |
  | **Berechtigung** | Der Benutzer braucht diesen Endpunkt in seinen Rollen (sonst Fehler 403) |

  ### Suchkriterien (Filter)
  **Alle Felder außer Blobfeldern und Passwortfeldern können als Filterparameter verwendet werden.** Hier nicht filterbar: `text`, `bild`.

  So funktioniert die Suche:
  - Jedes mitgeschickte Feld ist ein Kriterium, z.B. `{"ort": "Berlin"}`.
  - **Mehrere Kriterien müssen alle zutreffen** (UND): `{"ort": "Berlin", "plz": "10115"}`.
  - **Der Wert muss genau stimmen** – keine Teilsuche, Groß-/Kleinschreibung zählt („berlin“ findet nicht „Berlin“).
  - Datum als `"2026-09-01"` oder mit Uhrzeit `"2026-09-01 08:00:00"`. Bei Feldern mit Uhrzeit findet ein reines Datum nur Einträge um 00:00 Uhr.
  - Ohne Kriterien kommen alle Einträge.

  ### Weitere Angaben (optional)
  | Parameter | Wert | Pflicht | Bedeutung |
  |---|---|---|---|
  | `fields` | `"*"` oder Liste, z.B. `["nr","bezeichnung"]` | nein | Welche Felder zurückkommen sollen. `"*"` oder weglassen = alle Felder aus der Liste unten. |
  | `orderby` | Feldname | nein | Sortierung nach genau einem Feld, aufsteigend. |
  | `limit` | Zahl | nein | Höchstens so viele Datensätze liefern (zum Blättern). Weglassen = alle. |
  | `offset` | Zahl | nein | So viele Datensätze überspringen (nur zusammen mit `limit`). Beispiel: `limit` 20 und `offset` 40 = Seite 3. |

  ### Verfügbare Felder (für `fields` und `orderby`)
  | Feld | Typ |
  |---|---|
  | `kennzeichen` | Text (max. 15 Zeichen) |
  | `bezeichnung` | Text (max. 40 Zeichen) |
  | `hersteller` | Text (max. 40 Zeichen) |
  | `typ` | Text (max. 40 Zeichen) |
  | `fahrzeugart` | Text (max. 40 Zeichen) |
  | `baujahr` | Ganzzahl |
  | `leistung` | Text (max. 20 Zeichen) |
  | `hubraum` | Text (max. 20 Zeichen) |
  | `fahrgestellnr` | Text (max. 20 Zeichen) |
  | `motornr` | Text (max. 20 Zeichen) |
  | `briefnr` | Text (max. 20 Zeichen) |
  | `scheinnr` | Text (max. 20 Zeichen) |
  | `standort` | Text (max. 40 Zeichen) |
  | `angeschaft` | Datum/Uhrzeit |
  | `abgeschaft` | Datum/Uhrzeit |
  | `status` | Text (max. 1 Zeichen) |
  | `treibstoff` | Text (max. 40 Zeichen) |
  | `sitzplatz` | Text (max. 20 Zeichen) |
  | `achsen` | Ganzzahl |
  | `text` | Langtext |
  | `bild` | Langtext/Datei |
  | `sitznummern` | Text (max. 2100 Zeichen) |
  | `sitzgesperrt` | Text (max. 140 Zeichen) |
  | `personen` | Ganzzahl |
  | `gesperrt` | Text (max. 4 Zeichen) |
  | `zusatzfeld1` | Text (max. 30 Zeichen) |
  | `zusatzfeld2` | Text (max. 30 Zeichen) |
  | `kmsatz` | Kommazahl |
  | `sortierung` | Ganzzahl |
  | `reihen` | Text (max. 80 Zeichen) |
  | `betrieb` | Text (max. 8 Zeichen) |
  | `profil` | Text (max. 40 Zeichen) |
  | `zuschlag1` | Kommazahl |
  | `zuschlag2` | Kommazahl |
  | `zuschlagarten` | Text (max. 20 Zeichen) |
  | `pin` | Text (max. 30 Zeichen) |
  | `telematikdevice` | Text (max. 50 Zeichen) |
  | `xkoord` | Text (max. 20 Zeichen) |
  | `ykoord` | Text (max. 20 Zeichen) |
  | `standort_aktuell` | Text (max. 120 Zeichen) |
  | `sv_fahrzeugprofil` | Text (max. 40 Zeichen) |
  | `din_norm` | Text (max. 30 Zeichen) |
  | `hinweise` | Text (max. 255 Zeichen) |
  | `km` | Ganzzahl |
  | `lift` | Text (max. 4 Zeichen) |
  | `rueckfahrkamera` | Text (max. 4 Zeichen) |
  | `stammfahrer1` | Text (max. 30 Zeichen) |
  | `stammfahrer2` | Text (max. 30 Zeichen) |
  | `telematik_gelesen_am` | Datum/Uhrzeit |

  ### Was zurückkommt
  ```json
  {
    "header": {"nr": "ftinteger", ...},
    "data": [ {"kennzeichen": "Text", "bezeichnung": "Text", "hersteller": "Text", ...} ]
  }
  ```
  `data` enthält die Datensätze, `header` nennt zu jedem Feld den technischen Typ. **Mit `limit`** sieht die Antwort so aus: `{"total": 123, "limit": 20, "offset": 0, "data": { "header": ..., "data": [...] }}` – `total` ist die Gesamtzahl aller Treffer.

  ### Was schiefgehen kann
  - **401** – nicht angemeldet oder Token abgelaufen → neu einloggen.
  - **403** – keine Berechtigung für diesen Endpunkt.
  - **Fehlermeldung im Text** (`{"status":"error","message":"..."}`), z.B. wenn ein Feldname in `fields` oder `orderby` nicht erlaubt ist. Achtung: Solche Fehler kommen teilweise mit HTTP-Status 200 – deshalb immer auf `"status": "error"` prüfen.

  ### Gut zu wissen
  - **Achtung bei Tippfehlern:** Ein falsch geschriebener Feldname wird einfach ignoriert – dann kommen *alle* Einträge statt der gesuchten.
  - Der Body muss mindestens `{}` sein, sonst kommt ein Fehler.

  <details><summary>Für Entwickler</summary>

  - Controller: `TDataModulFuhrpark.getFahrzeugFiltered` in `Shared/DataModuls/DataModulFuhrparkClass.pas`
  - Tabelle: `FAHRZEUG`, Schlüssel `kennzeichen`
  - Umsetzung: generische Methode `DoSelectFilteredDynamic` der Basisklasse `TDataModulTableBase`; Filter über `CONDITIONS`/`FILTER_PARAMS`
  - Der Server wertet die HTTP-Methode nicht aus – GET und POST funktionieren gleich.

  </details>
