info:
  name: GET /fuhrpark/getrepvorgang – Reparaturvorgänge auflisten
  type: http
  seq: 21

http:
  method: GET
  url: "{{baseURL}}/fuhrpark/getrepvorgang"
  body:
    type: json
    data: |-
      {
        "fields": "*",
        "orderby": "datum"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Listet Datensätze der Tabelle REPVORGANG auf (Aufruf: `DoSelect('REPVORGANG', ALLOWED)`).

  **Erlaubte Felder (ALLOWED):** nr, kennzeichen, bezeichnung, vorgangsart, unfall, erledigt, datum, meldungam, meldungvon, beschreibung, dringlichkeit, zyklischertermin, wiedervorlage, notizen

  **Body:** `{ "fields": [...] | "*", "orderby": "feld", "limit": 10, "offset": 0 }` (alle Angaben optional)

  **Auth:** erforderlich (Bearer Token)

  **Antwort:** ohne `limit` `{"header":{"<feld>":"<typ>",...},"data":[{...},...]}` (SerializeQuery: `header` = Feldname -> Typ, `data` = Datensaetze); mit `limit` `{"total":N,"limit":N,"offset":N,"data":{"header":{...},"data":[...]}}`.
