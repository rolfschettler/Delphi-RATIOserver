info:
  name: POST /fuhrpark/insertrepvorgang – Reparaturvorgang anlegen
  type: http
  seq: 31

http:
  method: POST
  url: "{{baseURL}}/fuhrpark/insertrepvorgang"
  body:
    type: json
    data: |-
      {
        "kennzeichen": "B-RX 123",
        "bezeichnung": "Bremsen prüfen",
        "vorgangsart": "Wartung",
        "unfall": "N",
        "erledigt": "N",
        "datum": "2026-08-31",
        "beschreibung": "Bremsbeläge quietschen",
        "dringlichkeit": "hoch"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  **Reparaturvorgang anlegen.** Legt einen neuen Eintrag in `REPVORGANG` an.

  | | |
  |---|---|
  | **Aufruf** | `POST {{baseURL}}/fuhrpark/insertrepvorgang` |
  | **Anmeldung** | nötig – Token aus `/login` (wird in Bruno automatisch mitgeschickt) |
  | **Berechtigung** | Der Benutzer braucht diesen Endpunkt in seinen Rollen (sonst Fehler 403) |

  ### Was du mitschickst
  Die gewünschten Felder als `"feld": wert`. Nicht mitgeschickte Felder bleiben leer, `null` macht ein Feld ausdrücklich leer.

  | Feld | Typ |
  |---|---|
  | `kennzeichen` | Text (max. 15 Zeichen) |
  | `bezeichnung` | Text (max. 200 Zeichen) |
  | `vorgangsart` | Text (max. 30 Zeichen) |
  | `unfall` | Text (max. 4 Zeichen) |
  | `erledigt` | Text (max. 4 Zeichen) |
  | `datum` | Datum/Uhrzeit |
  | `meldungam` | Datum/Uhrzeit |
  | `meldungvon` | Text (max. 30 Zeichen) |
  | `beschreibung` | Langtext/Datei |
  | `dringlichkeit` | Text (max. 30 Zeichen) |
  | `zyklischertermin` | Text (max. 4 Zeichen) |
  | `wiedervorlage` | Datum/Uhrzeit |
  | `notizen` | Langtext/Datei |

  ### Was zurückkommt
  ```json
  {"status": "OK"}
  ```

  ### Was schiefgehen kann
  - **401** – nicht angemeldet oder Token abgelaufen → neu einloggen.
  - **403** – keine Berechtigung für diesen Endpunkt.
  - **400** mit Fehlermeldung – die Datenbank lehnt die Daten ab, z.B. Text zu lang für das Feld oder Buchstaben in einem Zahlenfeld.
  - **Fehlermeldung mit Status 200** (`{"status":"error","message":"..."}`), z.B. wenn kein einziges gültiges Feld mitgeschickt wurde – deshalb immer auf `"status": "error"` prüfen.

  ### Gut zu wissen
  - **Die Nummer (`nr`) vergibt die Datenbank automatisch** – mitschicken geht nicht, sie würde ignoriert. Die Antwort enthält die neue Nummer nicht; wer sie braucht, sucht den Eintrag danach (z.B. über den `…filtered`-Endpunkt).
  - **Unbekannte Felder werden ohne Meldung ignoriert.** Ein Tippfehler im Feldnamen fällt also nicht auf – das Feld bleibt einfach leer.
  - **Nicht setzbar** sind hier: `beteiligtes_fahrzeug_verursacher`, `linie_umlauf`, `unfallnummer_polizei`, `unfallort`, `verunglueckte_person_verhalten`, `zusatzfeld1`, `zusatzfeld2`, `zusatzfeld3`, `zusatzfeld4`, `zusatzfeld5`, `zusatzfeld6`, `zusatzfeld7`, `zusatzfeld8`.

  <details><summary>Für Entwickler</summary>

  - Controller: `TDataModulFuhrpark.insertRepvorgang` in `Shared/DataModuls/DataModulFuhrparkClass.pas`
  - Tabelle: `REPVORGANG`, Schlüssel `nr`
  - Umsetzung: generische Methode `DoInsert` der Basisklasse `TDataModulTableBase`
  - Der Server wertet die HTTP-Methode nicht aus – GET und POST funktionieren gleich.

  </details>
