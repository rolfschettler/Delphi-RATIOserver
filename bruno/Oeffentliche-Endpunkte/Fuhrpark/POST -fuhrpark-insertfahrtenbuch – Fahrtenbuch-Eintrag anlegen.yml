info:
  name: POST /fuhrpark/insertfahrtenbuch – Fahrtenbuch-Eintrag anlegen
  type: http
  seq: 30

http:
  method: POST
  url: "{{baseURL}}/fuhrpark/insertfahrtenbuch"
  body:
    type: json
    data: |-
      {
        "kz": "A",
        "von": "2026-06-19T08:00",
        "bis": "2026-06-19T18:00",
        "strecke": "Berlin - München",
        "auftragsgeber": "Musterfirma GmbH",
        "kennzeichen": "B-RX 123",
        "fahrer": "Schmidt",
        "personen": 45,
        "kmgesamt": 600,
        "umsatz": 1200.00
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  **Fahrtenbuch-Eintrag anlegen.** Legt einen neuen Eintrag in `FAHRTENBUCH` an.

  | | |
  |---|---|
  | **Aufruf** | `POST {{baseURL}}/fuhrpark/insertfahrtenbuch` |
  | **Anmeldung** | nötig – Token aus `/login` (wird in Bruno automatisch mitgeschickt) |
  | **Berechtigung** | Der Benutzer braucht diesen Endpunkt in seinen Rollen (sonst Fehler 403) |

  ### Was du mitschickst
  Die gewünschten Felder als `"feld": wert`. Nicht mitgeschickte Felder bleiben leer, `null` macht ein Feld ausdrücklich leer.

  | Feld | Typ |
  |---|---|
  | `kz` | Text (max. 1 Zeichen) |
  | `von` | Datum/Uhrzeit |
  | `bis` | Datum/Uhrzeit |
  | `strecke` | Text (max. 120 Zeichen) |
  | `auftragsgeber` | Text (max. 90 Zeichen) |
  | `kminland` | Ganzzahl |
  | `kmausland` | Ganzzahl |
  | `kmleer` | Ganzzahl |
  | `kmanfang` | Ganzzahl |
  | `kmende` | Ganzzahl |
  | `kmgesamt` | Ganzzahl |
  | `personen` | Ganzzahl |
  | `fahrer` | Text (max. 50 Zeichen) |
  | `umsatz` | Kommazahl |
  | `rvlin` | Kommazahl |
  | `rvlaus` | Kommazahl |
  | `eleistung` | Kommazahl |
  | `kennzeichen` | Text (max. 15 Zeichen) |
  | `text` | Text (max. 50 Zeichen) |
  | `steuerfahr` | Kommazahl |
  | `steuermarge` | Kommazahl |
  | `freiemarge` | Kommazahl |
  | `freieumsatz` | Kommazahl |
  | `ratiobusfahrtnr` | Ganzzahl |
  | `steuer` | Kommazahl |
  | `sonstigervl` | Kommazahl |
  | `sonstrvlpz` | Kommazahl |
  | `steuermarge2` | Kommazahl |
  | `fahrer2` | Text (max. 50 Zeichen) |
  | `beguenstigt` | Text (max. 4 Zeichen) |
  | `zusatz1` | Text (max. 50 Zeichen) |
  | `zusatz2` | Text (max. 50 Zeichen) |
  | `km_stand_zustieg_1_kunde` | Ganzzahl |
  | `km_stand_ausstieg_l_kunde` | Ganzzahl |

  ### Was zurückkommt
  ```json
  {"status": "OK"}
  ```

  ### Was schiefgehen kann
  - **401** – nicht angemeldet oder Token abgelaufen → neu einloggen.
  - **403** – keine Berechtigung für diesen Endpunkt.
  - **400** mit Fehlermeldung – die Datenbank lehnt die Daten ab, z.B. Text zu lang für das Feld oder Buchstaben in einem Zahlenfeld.
  - **Fehlermeldung mit Status 200** (`{"status":"error","message":"..."}`), z.B. wenn kein einziges gültiges Feld mitgeschickt wurde – deshalb immer auf `"status": "error"` prüfen.

  ### Gut zu wissen
  - **Die Nummer (`nr`) vergibt die Datenbank automatisch** – mitschicken geht nicht, sie würde ignoriert. Die Antwort enthält die neue Nummer nicht; wer sie braucht, sucht den Eintrag danach (z.B. über den `…filtered`-Endpunkt).
  - **Unbekannte Felder werden ohne Meldung ignoriert.** Ein Tippfehler im Feldnamen fällt also nicht auf – das Feld bleibt einfach leer.

  <details><summary>Für Entwickler</summary>

  - Controller: `TDataModulFuhrpark.insertFahrtenbuch` in `Shared/DataModuls/DataModulFuhrparkClass.pas`
  - Tabelle: `FAHRTENBUCH`, Schlüssel `nr`
  - Umsetzung: generische Methode `DoInsert` der Basisklasse `TDataModulTableBase`
  - Der Server wertet die HTTP-Methode nicht aus – GET und POST funktionieren gleich.

  </details>
