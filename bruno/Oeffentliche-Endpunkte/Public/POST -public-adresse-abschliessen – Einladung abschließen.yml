info:
  name: POST /public/adresse/abschliessen – Einladung abschließen
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseURL}}/public/adresse/abschliessen"
  body:
    type: json
    data: |-
      {
        "token": "{{einladungstoken}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  **Adress-Einladung abschließen.** Der Gast drückt „Ich bin fertig“. Danach ist sein Einladungslink beendet und kann nicht mehr benutzt werden.

  | | |
  |---|---|
  | **Aufruf** | `POST {{baseURL}}/public/adresse/abschliessen` |
  | **Anmeldung** | kein Login – stattdessen Einladungs-Token im Body |

  ### Was du mitschickst
  | Parameter | Wert | Pflicht | Bedeutung |
  |---|---|---|---|
  | `token` | Text, im JSON-Body (ersatzweise in der URL `?token=…`) | ja | Der Token aus der Einladungsmail. Muss ein **Adress-Einladungs-Token** sein. |

  ### Was zurückkommt
  ```json
  {"status": "OK"}
  ```

  ### Was schiefgehen kann
  - **401 / 403** – Probleme mit dem Token, als `{"status":"ERROR","message":"..."}`, Meldungen wie bei `/public/getadresse`: `Kein Token uebergeben.`, `Token unbekannt.`, `Token wurde widerrufen.`, `Sie haben diesen Vorgang bereits abgeschlossen.`, `Token ist abgelaufen.`, `Token wurde bereits verwendet.` (alle 401), `Token gehoert nicht zu diesem Vorgang.` (403, falscher Token-Typ).
  - **400** `{"status":"error","message":"..."}` – Datenbankfehler.

  ### Gut zu wissen
  - **Achtung beim Testen: Der Token ist danach endgültig verbraucht.** Für weitere Tests brauchst du eine neue Einladung.
  - **Danach geht mit diesem Token nichts mehr:** Alle Public-Endpunkte antworten mit 401 „Sie haben diesen Vorgang bereits abgeschlossen.“
  - **An der Adresse selbst ändert sich nichts.** Gespeichert wird nur, dass und wann der Gast fertig war.
  - **Gedacht als Knopf-Aktion:** Der Abschluss soll nur durch einen bewussten Klick passieren, nicht schon durch das Öffnen des Links. Der Server prüft die Aufrufart (GET/POST) aber nicht – auch ein GET-Aufruf schließt ab.

  <details><summary>Für Entwickler</summary>

  - Controller: `TDataModulPublic.abschliessenByToken` in `Shared/DataModuls/DataModulPublicClass.pas`; Token-Prüfung `ValidatePublicToken`, Abschluss `CloseToken`
  - Tabelle: `ACCESS_TOKENS` (`REFERENCE_TYPE` = `ADRESSEN`, `PURPOSE` = `einladung`)
  - `CloseToken`: `UPDATE ACCESS_TOKENS SET REVOKED = 1, USED_AT = CURRENT_TIMESTAMP, USED_FROM_IP = <RemoteAddr> WHERE ID = <Token-ID> AND REVOKED = 0` in eigener Transaktion. Hinter dem PHP-Proxy ist `USED_FROM_IP` die Adresse des Proxys, nicht die des Gastes.
  - Route mit `Auth=false`, `LocalOnly=false`; kein JWT, keine Rollenprüfung.

  </details>
