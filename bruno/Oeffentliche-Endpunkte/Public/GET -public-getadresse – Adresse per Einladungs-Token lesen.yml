info:
  name: GET /public/getadresse – Adresse per Einladungs-Token lesen
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseURL}}/public/getadresse?token={{einladungstoken}}"
  params:
    - name: token
      value: "{{einladungstoken}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  **Adresse per Einladungs-Token lesen.** Der Gast öffnet den Link aus seiner Einladungsmail; die Seite holt damit seine gespeicherte Adresse, damit er sie prüfen und ändern kann – ganz ohne Login.

  | | |
  |---|---|
  | **Aufruf** | `GET {{baseURL}}/public/getadresse?token={{einladungstoken}}` |
  | **Anmeldung** | kein Login – stattdessen Einladungs-Token in der URL oder im Body |

  ### Was du mitschickst
  | Parameter | Wert | Pflicht | Bedeutung |
  |---|---|---|---|
  | `token` | Text, im Body oder in der URL (`?token=…`) | ja | Der Token aus der Einladungsmail. Steht er in beiden, gilt der im Body. |

  Welche Adresse gelesen wird, legt allein der Token fest – eine Kennziffer kannst du nicht mitgeben. In Bruno steht der Token in der Variable `{{einladungstoken}}`; für diesen Endpunkt muss es ein **Adress-Einladungs-Token** sein.

  ### Was zurückkommt
  ```json
  {"status":"OK","data":{"kennziffer":4711,"anrede":"Herr","titel":null,"name1":"Max","name2":"Mustermann","strasse":"Musterstraße 1","plz":"88487","ort":"Mietingen","telefon1":"07392 123456","email":"max@example.com","recipient_email":"max@example.com"}}
  ```
  In `data` steht genau eine Adresse (kein Array): `kennziffer`, `anrede`, `titel`, `name1` (Vorname), `name2` (Nachname), `strasse`, `plz`, `ort`, `telefon1`, `email`. Dazu `recipient_email` – die Adresse, an die die Einladung ging. Leere Felder kommen als `null`, Leerzeichen am Ende sind entfernt.

  ### Was schiefgehen kann
  Fehler kommen als `{"status":"ERROR","message":"..."}` (großgeschrieben):

  | Status | Meldung | Bedeutung |
  |---|---|---|
  | 401 | `Kein Token uebergeben.` | Token fehlt. |
  | 401 | `Token unbekannt.` | Den Token gibt es nicht (Tippfehler, unvollständig kopiert). |
  | 401 | `Token wurde widerrufen.` | Der Link wurde von uns ungültig gemacht. |
  | 401 | `Sie haben diesen Vorgang bereits abgeschlossen.` | Der Gast hat schon auf „Fertig“ gedrückt. |
  | 401 | `Token ist abgelaufen.` | Die Gültigkeit ist vorbei → neue Einladung schicken. |
  | 401 | `Token wurde bereits verwendet.` | Einmal-Link, der schon benutzt wurde. |
  | 403 | `Token gehoert nicht zu diesem Vorgang.` | Falscher Token-Typ, z.B. ein Passwort- oder Fragebogen-Token. |
  | 404 | `Datensatz nicht gefunden.` | Die Adresse zum Token gibt es nicht mehr. |

  Datenbankfehler kommen als `{"status":"error","message":"..."}` mit Status 400.

  ### Gut zu wissen
  - **Lesen verbraucht den Link nicht.** Der Gast kann die Seite beliebig oft öffnen; auch Virenscanner oder Link-Vorschauen in Mailprogrammen machen ihn nicht unbrauchbar. Beendet wird der Link erst mit `/public/adresse/abschliessen` oder wenn er abläuft.
  - **Kein Login nötig – und auch keiner möglich:** Ein mitgeschicktes Anmelde-Token wird ignoriert. Der Endpunkt ist bewusst aus dem Internet erreichbar.
  - **Token in der URL landet in Protokollen:** Webserver und Proxys speichern Adressen oft mit. Wo es geht, den Token lieber im Body schicken.

  <details><summary>Für Entwickler</summary>

  - Controller: `TDataModulPublic.getAdresseByToken` in `Shared/DataModuls/DataModulPublicClass.pas`; Token-Prüfung `ValidatePublicToken`, Ausgabe `SendRecordByKey`
  - Tabellen: `ACCESS_TOKENS` (SHA-256 des Klartext-Tokens gegen `TOKEN_HASH`; geprüft `REVOKED`, `EXPIRES_AT`, `SINGLE_USE`/`USED_AT`, `REFERENCE_TYPE` = `ADRESSEN`, `PURPOSE` = `einladung`), `ADRESSEN` (Schlüssel `kennziffer` = `ACCESS_TOKENS.REFERENCE_ID`)
  - Route mit `Auth=false`, `LocalOnly=false`; kein JWT, keine Rollenprüfung. Der Request läuft deshalb mit `auth: inherit` ohne Bearer-Token.
  - `USED_AT` wird beim Lesen nicht gesetzt – `SINGLE_USE` wird für diese Tokens dadurch nie wirksam.
  - Ein Token ohne `EXPIRES_AT` (NULL) gilt als abgelaufen (`AsDateTime` = 0).
  - Der Server wertet die HTTP-Methode nicht aus.

  </details>
