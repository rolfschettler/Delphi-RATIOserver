info:
  name: POST /public/setpasswort – Passwort per Einladungs-Token setzen
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseURL}}/public/setpasswort"
  body:
    type: json
    data: |-
      {
        "token": "{{einladungstoken}}",
        "pwd2": "{{testpasswordhash}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  **Passwort per Passwort-Token setzen.** Der Benutzer vergibt über den Link aus seiner Passwort-Mail ein neues Passwort. Danach ist der Link beendet.

  | | |
  |---|---|
  | **Aufruf** | `POST {{baseURL}}/public/setpasswort` |
  | **Anmeldung** | kein Login – stattdessen Passwort-Token im Body |

  ### Was du mitschickst
  Im JSON-Body:

  | Parameter | Wert | Pflicht | Bedeutung |
  |---|---|---|---|
  | `token` | Text | ja | Der Token aus der Passwort-Mail (ersatzweise in der URL `?token=…`). Muss ein **Passwort-Token** sein – Adress- oder Fragebogen-Einladungen werden abgewiesen. |
  | `pwd2` | Text | ja | **Nicht das Passwort selbst, sondern sein bcrypt-Hash** (z.B. aus PHP `password_hash()`). Muss mit `$` beginnen und mindestens 20 Zeichen lang sein. |

  Für einen Test in Bruno einen echten bcrypt-Hash in der Variable `{{testpasswordhash}}` hinterlegen.

  ### Was zurückkommt
  ```json
  {"status": "OK"}
  ```

  ### Was schiefgehen kann
  - **400** `{"status":"ERROR","message":"pwd2 ist kein gueltiger Passwort-Hash."}` – `pwd2` fehlt, ist kürzer als 20 Zeichen oder beginnt nicht mit `$`.
  - **401 / 403** – Probleme mit dem Token, Meldungen wie bei `/public/getadresse`: `Kein Token uebergeben.`, `Token unbekannt.`, `Token wurde widerrufen.`, `Sie haben diesen Vorgang bereits abgeschlossen.`, `Token ist abgelaufen.`, `Token wurde bereits verwendet.` (alle 401), `Token gehoert nicht zu diesem Vorgang.` (403, falscher Token-Typ).
  - **400** `{"status":"error","message":"..."}` – Datenbankfehler.

  ### Gut zu wissen
  - **Achtung beim Testen:** Der Aufruf überschreibt das Passwort des Benutzers und verbraucht den Token endgültig.
  - **Den Hash erzeugt die aufrufende Seite,** nicht dieser Server. Steht in `pwd2` das Passwort im Klartext, wird es zwar gespeichert, aber die Anmeldung klappt danach nie. Hashes mit einem Kostenfaktor über 14 werden gespeichert, beim Login aber abgelehnt.
  - **Nur das Passwort wird geändert.** Sperre, Fehlversuche, Benutzertyp usw. lassen sich hierüber nicht ändern; weitere Felder im Body werden ignoriert.
  - **Andere offene Passwort-Links werden ungültig:** Hat der Benutzer noch weitere Passwort-Mails bekommen, funktionieren deren Links danach nicht mehr.
  - **Teilerfolg möglich:** Passwort setzen, Link beenden und andere Links ungültig machen sind drei getrennte Schritte. Scheitert ein späterer Schritt, ist das Passwort trotzdem schon gesetzt.
  - **Kein Fehler, wenn das Konto fehlt:** Gibt es das Benutzerkonto zum Token nicht mehr, wird nichts geändert – der Token wird trotzdem beendet und die Antwort ist `{"status":"OK"}`.

  <details><summary>Für Entwickler</summary>

  - Controller: `TDataModulPublic.setPasswortByToken` in `Shared/DataModuls/DataModulPublicClass.pas`; Token-Prüfung `ValidatePublicToken`, danach `CloseToken` und `RevokeOtherPasswordTokens`
  - Tabellen: `ACCESS_TOKENS` (`REFERENCE_TYPE` = `REGISTRIERUNG`, `PURPOSE` = `passwort`), `REGISTRIERUNG` (Schlüssel `nr` = `REFERENCE_ID`)
  - Geschrieben wird nur `UPDATE REGISTRIERUNG SET PWD2 = :pwd2 WHERE NR = <aus Token>` (fest verdrahtet).
  - Drei getrennte Transaktionen (Passwort, `CloseToken`: `REVOKED = 1`/`USED_AT`/`USED_FROM_IP`, Widerruf aller anderen offenen Passwort-Tokens desselben Benutzers mit `REVOKED = 1`).
  - Kein 404, wenn das UPDATE keine Zeile trifft.
  - Der Code-Kommentar „Delphi hat kein bcrypt, der Login prüft über PHP“ ist veraltet: `/login` prüft den Hash inzwischen direkt in Delphi (`uBCrypt`). Der Hash muss aber weiterhin vom Aufrufer kommen.
  - Route mit `Auth=false`, `LocalOnly=false`; kein JWT, keine Rollenprüfung.

  </details>
