info:
  name: Registrierung
  type: folder
  seq: 7

request:
  auth: inherit

docs:
  content: |-
    **Benutzerkonten verwalten:** Konten (Registrierungen) auflisten, suchen, anlegen, ändern und löschen sowie die nächste freie Konto-Nummer ermitteln. Dazu kommt ein lesender Zugriff auf die Benutzerliste (Users).

    Beim Anlegen eines Kontos bestimmt der Benutzertyp (`typ`) die Berechtigungen: Der Server trägt automatisch die passende Rollen-Vorlage ein (z.B. `@KUNDE` für `kunde`). Die Rollen selbst lassen sich über diese Endpunkte weder lesen noch ändern.

    Alle Endpunkte brauchen eine Anmeldung (Token aus `/login`), und der Benutzer muss den jeweiligen Endpunkt in seinen Rollen haben (sonst Fehler 403).

    Technik: Controller `TDataModulRegistrierung` (`Shared/DataModuls/DataModulRegistrierungClass.pas`), Tabelle `REGISTRIERUNG`; die nur lokal erreichbaren Registrierungs-Endpunkte sind nicht in dieser Collection.
  type: text/markdown
