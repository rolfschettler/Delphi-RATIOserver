info:
  name: GET /registrierung/getregistrierung – Registrierungen auflisten
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseURL}}/registrierung/getregistrierung"
  body:
    type: json
    data: |-
      {
        "fields": "*",
        "orderby": "nr"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Generische Liste aller REGISTRIERUNG-Datensaetze (`DoSelect('REGISTRIERUNG', ALLOWED)`).

  **Erlaubte Felder (ALLOWED):** nr, kennziffer, username, userkonfig, erstellt, geaendert, gesperrt, versuche, zeitsperre, pushid, letzter_login, hauptregistrierung, typ. Nicht lesbar: pwd, pwd2 und rollen (nicht in ALLOWED; die Rollen eines Benutzers stehen nach dem Login im Token unter role.rollen, siehe /verifytoken).

  **Body (optional):** `fields` (Array der gewuenschten Felder oder `"*"` fuer alle), `orderby` (Feldname), `limit`, `offset`.

  **Antwort:** ohne `limit` `{"header":{"<feld>":"<typ>",...},"data":[{...},...]}` (SerializeQuery: `header` = Feldname -> Typ, `data` = Datensaetze); mit `limit` `{"total":N,"limit":N,"offset":N,"data":{"header":{...},"data":[...]}}`.

  **Auth:** erforderlich (Bearer Token).
