info:
  name: POST /registrierung/updateregistrierung – Registrierung aendern
  type: http
  seq: 7

http:
  method: POST
  url: "{{baseURL}}/registrierung/updateregistrierung"
  body:
    type: json
    data: |-
      {
        "nr": 42,
        "username": "mmustermann",
        "gesperrt": "NEIN",
        "versuche": 0,
        "letzter_login": "2026-08-31 10:15:00"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  **Registrierung aendern.** Ändert einen vorhandenen Eintrag in `REGISTRIERUNG`. Gefunden wird er über `nr`.

  | | |
  |---|---|
  | **Aufruf** | `POST {{baseURL}}/registrierung/updateregistrierung` |
  | **Anmeldung** | nötig – Token aus `/login` (wird in Bruno automatisch mitgeschickt) |
  | **Berechtigung** | Der Benutzer braucht diesen Endpunkt in seinen Rollen (sonst Fehler 403) |

  ### Was du mitschickst
  | Parameter | Wert | Pflicht | Bedeutung |
  |---|---|---|---|
  | `nr` | Ganzzahl | **ja** | Welcher Eintrag geändert wird. |
  | weitere Felder | siehe Liste | mind. eins | Nur die mitgeschickten Felder werden geändert. `null` macht ein Feld leer. |

  ### Änderbare Felder
  | Feld | Typ |
  |---|---|
  | `kennziffer` | Ganzzahl |
  | `pwd` | Text (max. 40 Zeichen) |
  | `username` | Text (max. 120 Zeichen) |
  | `userkonfig` | Langtext/Datei |
  | `erstellt` | Datum/Uhrzeit |
  | `geaendert` | Datum/Uhrzeit |
  | `gesperrt` | Text (max. 4 Zeichen) |
  | `pwd2` | Text (max. 255 Zeichen) |
  | `versuche` | Ganzzahl |
  | `zeitsperre` | Datum/Uhrzeit |
  | `pushid` | Text (max. 255 Zeichen) |
  | `letzter_login` | Datum/Uhrzeit |
  | `hauptregistrierung` | Ganzzahl |
  | `typ` | Text (max. 30 Zeichen) |
  | `email` | Text (max. 100 Zeichen) |
  | `rollen` | Langtext/Datei |
  | `personalzeichen` | Text (max. 15 Zeichen) |
  | `usersloginname` | Text (max. 20 Zeichen) |

  ### Was zurückkommt
  ```json
  {"status": "OK"}
  ```

  ### Was schiefgehen kann
  - **401** – nicht angemeldet oder Token abgelaufen → neu einloggen.
  - **403** – keine Berechtigung für diesen Endpunkt.
  - **400** mit Fehlermeldung – die Datenbank lehnt die Daten ab, z.B. Text zu lang für das Feld oder Buchstaben in einem Zahlenfeld.
  - **Fehlermeldung mit Status 200** (`{"status":"error","message":"..."}`), z.B. wenn kein einziges gültiges Feld mitgeschickt wurde – deshalb immer auf `"status": "error"` prüfen.

  ### Gut zu wissen
  - **Passwort nur als Hash:** `pwd` und `pwd2` werden genau so gespeichert, wie sie ankommen. In `pwd2` muss ein bcrypt-Hash stehen (z.B. aus PHP `password_hash()`) – ein Passwort im Klartext sperrt den Benutzer aus.
  - **Hier lassen sich Berechtigungen vergeben:** Über `rollen` (eine Rolle bzw. ein Endpunkt pro Zeile) kann jeder, der diesen Endpunkt nutzen darf, Rechte verteilen – auch sich selbst. Die Änderung wirkt erst, wenn sich der Benutzer neu anmeldet.
  - **Nur mitgeschickte Felder werden geändert**, alle anderen bleiben, wie sie sind.
  - **Keine Meldung, wenn es den Eintrag nicht gibt:** Auch bei einem falschen oder fehlenden `nr` kommt `{"status": "OK"}` – geändert wurde dann aber nichts.
  - `nr` selbst lässt sich hier nicht ändern.
  - **Unbekannte Felder werden ohne Meldung ignoriert** – ein Tippfehler im Feldnamen fällt also nicht auf.

  <details><summary>Für Entwickler</summary>

  - Controller: `TDataModulRegistrierung.updateRegistrierung` in `Shared/DataModuls/DataModulRegistrierungClass.pas`
  - Tabelle: `REGISTRIERUNG`, Schlüssel `nr`
  - Umsetzung: generische Methode `DoUpdate` der Basisklasse `TDataModulTableBase`
  - Der Server wertet die HTTP-Methode nicht aus – GET und POST funktionieren gleich.

  </details>
