info:
  name: GET /registrierung/getregistrierungkey – Naechste REGISTRIERUNG-Nr ermitteln
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseURL}}/registrierung/getregistrierungkey"
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Eigene (nicht-generische) Query-Logik: liefert den naechsten Wert des Generators `REGISTRIERUNG_NR_GEN` (`SELECT GEN_ID(REGISTRIERUNG_NR_GEN, 1) AS nr FROM RDB$DATABASE`). Kein Request-Body erforderlich.

  **Antwort (Beispiel):** `{"header":{"nr":"ftinteger"},"data":[{"nr":43}]}` (SerializeQuery).

  **Auth:** erforderlich (Bearer Token).
