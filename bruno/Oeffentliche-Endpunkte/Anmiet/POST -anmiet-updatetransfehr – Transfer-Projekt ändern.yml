info:
  name: POST /anmiet/updatetransfehr – Transfer-Projekt ändern
  type: http
  seq: 22

http:
  method: POST
  url: "{{baseURL}}/anmiet/updatetransfehr"
  body:
    type: json
    data: |-
      {
        "nr": 42,
        "status": "Auftrag",
        "perszahl": 48,
        "bearbeiter": "hw"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  **Transfer-Projekt ändern.** Ändert einen vorhandenen Eintrag in `TRANSFEHR`. Gefunden wird er über `nr`.

  | | |
  |---|---|
  | **Aufruf** | `POST {{baseURL}}/anmiet/updatetransfehr` |
  | **Anmeldung** | nötig – Token aus `/login` (wird in Bruno automatisch mitgeschickt) |
  | **Berechtigung** | Der Benutzer braucht diesen Endpunkt in seinen Rollen (sonst Fehler 403) |

  ### Was du mitschickst
  | Parameter | Wert | Pflicht | Bedeutung |
  |---|---|---|---|
  | `nr` | Ganzzahl | **ja** | Welcher Eintrag geändert wird. |
  | weitere Felder | siehe Liste | mind. eins | Nur die mitgeschickten Felder werden geändert. `null` macht ein Feld leer. |

  ### Änderbare Felder
  | Feld | Typ |
  |---|---|
  | `kunde` | Ganzzahl |
  | `ansprechpartner` | Ganzzahl |
  | `hinfahrt` | Datum/Uhrzeit |
  | `hinfahrtende` | Datum/Uhrzeit |
  | `rueckfahrt` | Datum/Uhrzeit |
  | `rueckfahrtende` | Datum/Uhrzeit |
  | `abfahrthin` | Text (max. 40 Zeichen) |
  | `ankunfthin` | Text (max. 40 Zeichen) |
  | `abfahrtrueck` | Text (max. 40 Zeichen) |
  | `ankunftrueck` | Text (max. 40 Zeichen) |
  | `zeit1h` | Text (max. 5 Zeichen) |
  | `zeit2h` | Text (max. 5 Zeichen) |
  | `zeit1r` | Text (max. 5 Zeichen) |
  | `zeit2r` | Text (max. 5 Zeichen) |
  | `text1` | Text (max. 40 Zeichen) |
  | `text2` | Text (max. 40 Zeichen) |
  | `text3` | Text (max. 40 Zeichen) |
  | `text4` | Text (max. 40 Zeichen) |
  | `text5` | Text (max. 40 Zeichen) |
  | `text6` | Text (max. 40 Zeichen) |
  | `datum1` | Datum/Uhrzeit |
  | `datum2` | Datum/Uhrzeit |
  | `kurztext` | Text (max. 600 Zeichen) |
  | `text` | Langtext/Datei |
  | `bearbeiter` | Text (max. 30 Zeichen) |
  | `erstellt` | Datum/Uhrzeit |
  | `perszahl` | Text (max. 25 Zeichen) |
  | `personen` | Ganzzahl |
  | `status` | Ganzzahl |
  | `symbol` | Ganzzahl |
  | `projektart` | Text (max. 40 Zeichen) |
  | `angebot_gedruckt` | Text (max. 4 Zeichen) |
  | `auftrag_gedruckt` | Text (max. 4 Zeichen) |
  | `optionsdatum` | Datum/Uhrzeit |
  | `filiale` | Text (max. 10 Zeichen) |
  | `kontaktentstehung` | Text (max. 8 Zeichen) |
  | `bearbeiter2` | Text (max. 30 Zeichen) |
  | `vertretung` | Text (max. 30 Zeichen) |
  | `reiseart` | Text (max. 8 Zeichen) |

  ### Was zurückkommt
  ```json
  {"status": "OK"}
  ```

  ### Was schiefgehen kann
  - **401** – nicht angemeldet oder Token abgelaufen → neu einloggen.
  - **403** – keine Berechtigung für diesen Endpunkt.
  - **400** mit Fehlermeldung – die Datenbank lehnt die Daten ab, z.B. Text zu lang für das Feld oder Buchstaben in einem Zahlenfeld.
  - **Fehlermeldung mit Status 200** (`{"status":"error","message":"..."}`), z.B. wenn kein einziges gültiges Feld mitgeschickt wurde – deshalb immer auf `"status": "error"` prüfen.

  ### Gut zu wissen
  - **Nur mitgeschickte Felder werden geändert**, alle anderen bleiben, wie sie sind.
  - **Keine Meldung, wenn es den Eintrag nicht gibt:** Auch bei einem falschen oder fehlenden `nr` kommt `{"status": "OK"}` – geändert wurde dann aber nichts.
  - `nr` selbst lässt sich hier nicht ändern.
  - **Unbekannte Felder werden ohne Meldung ignoriert** – ein Tippfehler im Feldnamen fällt also nicht auf.

  <details><summary>Für Entwickler</summary>

  - Controller: `TDataModulAnmiet.updateTransfehr` in `Shared/DataModuls/DataModulAnmietClass.pas`
  - Tabelle: `TRANSFEHR`, Schlüssel `nr`
  - Umsetzung: generische Methode `DoUpdate` der Basisklasse `TDataModulTableBase`
  - Der Server wertet die HTTP-Methode nicht aus – GET und POST funktionieren gleich.

  </details>
