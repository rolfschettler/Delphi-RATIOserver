info:
  name: POST /anmiet/inserttransfehr – Transfer-Projekt anlegen
  type: http
  seq: 21

http:
  method: POST
  url: "{{baseURL}}/anmiet/inserttransfehr"
  body:
    type: json
    data: |-
      {
        "kunde": 123,
        "ansprechpartner": "Frau Schmidt",
        "hinfahrt": "2026-10-15",
        "rueckfahrt": "2026-10-18",
        "abfahrthin": "Berlin ZOB",
        "ankunfthin": "Hamburg Hbf",
        "kurztext": "Klassenfahrt Hamburg",
        "perszahl": 45,
        "status": "Angebot",
        "bearbeiter": "hw",
        "reiseart": "Gruppenreise"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  **Transfer-Projekt anlegen.** Legt einen neuen Eintrag in `TRANSFEHR` an.

  | | |
  |---|---|
  | **Aufruf** | `POST {{baseURL}}/anmiet/inserttransfehr` |
  | **Anmeldung** | nötig – Token aus `/login` (wird in Bruno automatisch mitgeschickt) |
  | **Berechtigung** | Der Benutzer braucht diesen Endpunkt in seinen Rollen (sonst Fehler 403) |

  ### Was du mitschickst
  Die gewünschten Felder als `"feld": wert`. Nicht mitgeschickte Felder bleiben leer, `null` macht ein Feld ausdrücklich leer.

  | Feld | Typ |
  |---|---|
  | `kunde` | Ganzzahl |
  | `ansprechpartner` | Ganzzahl |
  | `hinfahrt` | Datum/Uhrzeit |
  | `hinfahrtende` | Datum/Uhrzeit |
  | `rueckfahrt` | Datum/Uhrzeit |
  | `rueckfahrtende` | Datum/Uhrzeit |
  | `abfahrthin` | Text (max. 40 Zeichen) |
  | `ankunfthin` | Text (max. 40 Zeichen) |
  | `abfahrtrueck` | Text (max. 40 Zeichen) |
  | `ankunftrueck` | Text (max. 40 Zeichen) |
  | `zeit1h` | Text (max. 5 Zeichen) |
  | `zeit2h` | Text (max. 5 Zeichen) |
  | `zeit1r` | Text (max. 5 Zeichen) |
  | `zeit2r` | Text (max. 5 Zeichen) |
  | `text1` | Text (max. 40 Zeichen) |
  | `text2` | Text (max. 40 Zeichen) |
  | `text3` | Text (max. 40 Zeichen) |
  | `text4` | Text (max. 40 Zeichen) |
  | `text5` | Text (max. 40 Zeichen) |
  | `text6` | Text (max. 40 Zeichen) |
  | `datum1` | Datum/Uhrzeit |
  | `datum2` | Datum/Uhrzeit |
  | `kurztext` | Text (max. 600 Zeichen) |
  | `text` | Langtext/Datei |
  | `bearbeiter` | Text (max. 30 Zeichen) |
  | `erstellt` | Datum/Uhrzeit |
  | `perszahl` | Text (max. 25 Zeichen) |
  | `personen` | Ganzzahl |
  | `status` | Ganzzahl |
  | `symbol` | Ganzzahl |
  | `projektart` | Text (max. 40 Zeichen) |
  | `angebot_gedruckt` | Text (max. 4 Zeichen) |
  | `auftrag_gedruckt` | Text (max. 4 Zeichen) |
  | `optionsdatum` | Datum/Uhrzeit |
  | `filiale` | Text (max. 10 Zeichen) |
  | `kontaktentstehung` | Text (max. 8 Zeichen) |
  | `bearbeiter2` | Text (max. 30 Zeichen) |
  | `vertretung` | Text (max. 30 Zeichen) |
  | `reiseart` | Text (max. 8 Zeichen) |

  ### Was zurückkommt
  ```json
  {"status": "OK"}
  ```

  ### Was schiefgehen kann
  - **401** – nicht angemeldet oder Token abgelaufen → neu einloggen.
  - **403** – keine Berechtigung für diesen Endpunkt.
  - **400** mit Fehlermeldung – die Datenbank lehnt die Daten ab, z.B. Text zu lang für das Feld oder Buchstaben in einem Zahlenfeld.
  - **Fehlermeldung mit Status 200** (`{"status":"error","message":"..."}`), z.B. wenn kein einziges gültiges Feld mitgeschickt wurde – deshalb immer auf `"status": "error"` prüfen.

  ### Gut zu wissen
  - **Die Nummer (`nr`) vergibt die Datenbank automatisch** – mitschicken geht nicht, sie würde ignoriert. Die Antwort enthält die neue Nummer nicht; wer sie braucht, sucht den Eintrag danach (z.B. über den `…filtered`-Endpunkt).
  - **Unbekannte Felder werden ohne Meldung ignoriert.** Ein Tippfehler im Feldnamen fällt also nicht auf – das Feld bleibt einfach leer.

  <details><summary>Für Entwickler</summary>

  - Controller: `TDataModulAnmiet.insertTransfehr` in `Shared/DataModuls/DataModulAnmietClass.pas`
  - Tabelle: `TRANSFEHR`, Schlüssel `nr`
  - Umsetzung: generische Methode `DoInsert` der Basisklasse `TDataModulTableBase`
  - Der Server wertet die HTTP-Methode nicht aus – GET und POST funktionieren gleich.

  </details>
