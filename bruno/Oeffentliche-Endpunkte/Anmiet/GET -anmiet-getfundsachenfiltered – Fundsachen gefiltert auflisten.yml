info:
  name: GET /anmiet/getfundsachenfiltered – Fundsachen gefiltert auflisten
  type: http
  seq: 10

http:
  method: GET
  url: "{{baseURL}}/anmiet/getfundsachenfiltered"
  body:
    type: json
    data: |-
      {
        "fields": "*",
        "status": "offen",
        "verlustort": "Bahnhof",
        "orderby": "erfasst_am"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Listet FUNDSACHEN-Datensätze gefiltert auf (generisches `DoSelectFilteredDynamic`).

  **Tabelle:** FUNDSACHEN

  **Erlaubte Felder (ALLOWED):** identisch zu `getfundsachen` (siehe dort)

  **Filterparameter (alle optional, AND-verknüpft, je `feld = :feld`):** nr, abgeholt_am, abgeholt_von, abholort, bearbeitet_am, bearbeitet_von, beschreibung, erfasst_am, erfasst_von, status, text_intern, verlustdatum, verlustort, zusatzfeld1, zusatzfeld2, zusatzfeld3 – nur im Body vorhandene (nicht-null) Parameter erzeugen eine WHERE-Bedingung; ohne Filter werden alle Datensätze geliefert.

  **Hinweis:** Die BLOB-Felder `bilder`, `bild_klein`, `unterschrift` sind nicht filterbar (nicht in FILTER_PARAMS).


  **Body:** `{ "fields": [...] | "*", "status": "...", "verlustort": "...", ... }` – zusätzlich `orderby` (ALLOWED-Feld), `limit`, `offset`. Der Body muss ein gültiges JSON-Objekt sein (mindestens `{}`), sonst Fehler.

  **Auth:** erforderlich (Bearer Token); zusätzlich Rollenprüfung gegen REGISTRIERUNG.ROLLEN (leer/Supervisor/passende Rolle oder Endpunkt, sonst 403)

  **LocalOnly:** nein (auch extern erreichbar)

  **Antwort:** ohne `limit` das Ergebnis von `SerializeQuery`: `{"header":{"feld":"typ",...},"data":[{...},...]}`; mit `limit` > 0 `{"total":N,"limit":N,"offset":N,"data":{"header":{...},"data":[...]}}`.
