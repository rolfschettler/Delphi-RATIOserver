info:
  name: GET /anmiet/gettransfehrbyid – Transfer-Projekt per Nr abrufen
  type: http
  seq: 18

http:
  method: GET
  url: "{{baseURL}}/anmiet/gettransfehrbyid"
  body:
    type: json
    data: |-
      {
        "nr": 501,
        "fields": "*"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Liefert genau einen TRANSFEHR-Datensatz anhand des Primärschlüssels `nr` (generisches `DoSelectOne`).

  **Tabelle:** TRANSFEHR

  **Erlaubte Felder (ALLOWED):** identisch zu `gettransfehr` (siehe dort), inkl. `nr`

  **Key-Feld:** `nr`

  **Body:** `{ "nr": <wert>, "fields": [...] | "*" }` – nr ist Pflicht.

  **Auth:** erforderlich (Bearer Token); zusätzlich Rollenprüfung gegen REGISTRIERUNG.ROLLEN (leer/Supervisor/passende Rolle oder Endpunkt, sonst 403)

  **LocalOnly:** nein (auch extern erreichbar)

  **Antwort:** `{"header":{"feld":"typ",...},"data":[{...}]}` – `data` enthält genau einen Datensatz bzw. ist leer, wenn zum Schlüssel kein Datensatz existiert.
