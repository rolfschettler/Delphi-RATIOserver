info:
  name: GET /anmiet/gettransfehrbyid – Transfer-Projekt per Nr abrufen
  type: http
  seq: 18

http:
  method: GET
  url: "{{baseURL}}/anmiet/gettransfehrbyid"
  body:
    type: json
    data: |-
      {
        "nr": 42,
        "fields": "*"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  **Transfer-Projekt per Nr abrufen.** Liefert genau einen Eintrag aus `TRANSFEHR`, gesucht über `nr`.

  | | |
  |---|---|
  | **Aufruf** | `GET {{baseURL}}/anmiet/gettransfehrbyid` |
  | **Anmeldung** | nötig – Token aus `/login` (wird in Bruno automatisch mitgeschickt) |
  | **Berechtigung** | Der Benutzer braucht diesen Endpunkt in seinen Rollen (sonst Fehler 403) |

  ### Was du mitschickst
  | Parameter | Wert | Pflicht | Bedeutung |
  |---|---|---|---|
  | `nr` | Ganzzahl | **ja** | Der gesuchte Eintrag. |
  | `fields` | `"*"` oder Liste | nein | Welche Felder zurückkommen sollen. Weglassen = alle. |

  ### Verfügbare Felder
  | Feld | Typ |
  |---|---|
  | `nr` | Ganzzahl |
  | `kunde` | Ganzzahl |
  | `ansprechpartner` | Ganzzahl |
  | `hinfahrt` | Datum/Uhrzeit |
  | `hinfahrtende` | Datum/Uhrzeit |
  | `rueckfahrt` | Datum/Uhrzeit |
  | `rueckfahrtende` | Datum/Uhrzeit |
  | `abfahrthin` | Text (max. 40 Zeichen) |
  | `ankunfthin` | Text (max. 40 Zeichen) |
  | `abfahrtrueck` | Text (max. 40 Zeichen) |
  | `ankunftrueck` | Text (max. 40 Zeichen) |
  | `zeit1h` | Text (max. 5 Zeichen) |
  | `zeit2h` | Text (max. 5 Zeichen) |
  | `zeit1r` | Text (max. 5 Zeichen) |
  | `zeit2r` | Text (max. 5 Zeichen) |
  | `text1` | Text (max. 40 Zeichen) |
  | `text2` | Text (max. 40 Zeichen) |
  | `text3` | Text (max. 40 Zeichen) |
  | `text4` | Text (max. 40 Zeichen) |
  | `text5` | Text (max. 40 Zeichen) |
  | `text6` | Text (max. 40 Zeichen) |
  | `datum1` | Datum/Uhrzeit |
  | `datum2` | Datum/Uhrzeit |
  | `kurztext` | Text (max. 600 Zeichen) |
  | `text` | Langtext/Datei |
  | `bearbeiter` | Text (max. 30 Zeichen) |
  | `erstellt` | Datum/Uhrzeit |
  | `perszahl` | Text (max. 25 Zeichen) |
  | `personen` | Ganzzahl |
  | `status` | Ganzzahl |
  | `symbol` | Ganzzahl |
  | `projektart` | Text (max. 40 Zeichen) |
  | `angebot_gedruckt` | Text (max. 4 Zeichen) |
  | `auftrag_gedruckt` | Text (max. 4 Zeichen) |
  | `optionsdatum` | Datum/Uhrzeit |
  | `filiale` | Text (max. 10 Zeichen) |
  | `kontaktentstehung` | Text (max. 8 Zeichen) |
  | `bearbeiter2` | Text (max. 30 Zeichen) |
  | `vertretung` | Text (max. 30 Zeichen) |
  | `reiseart` | Text (max. 8 Zeichen) |

  ### Was zurückkommt
  ```json
  {"header": {...}, "data": [ {"nr": 42, "kunde": 42, "ansprechpartner": 42, ...} ]}
  ```

  ### Was schiefgehen kann
  - **401** – nicht angemeldet oder Token abgelaufen → neu einloggen.
  - **403** – keine Berechtigung für diesen Endpunkt.
  - **Fehlermeldung im Text** (`{"status":"error","message":"..."}`), z.B. wenn ein Feldname in `fields` oder `orderby` nicht erlaubt ist. Achtung: Solche Fehler kommen teilweise mit HTTP-Status 200 – deshalb immer auf `"status": "error"` prüfen.

  ### Gut zu wissen
  - **Nicht gefunden = leere Liste:** Gibt es den Eintrag nicht, kommt kein Fehler, sondern `"data": []`.
  - **`nr` muss mitgeschickt werden**, sonst kommt eine Fehlermeldung.

  <details><summary>Für Entwickler</summary>

  - Controller: `TDataModulAnmiet.getTransfehrById` in `Shared/DataModuls/DataModulAnmietClass.pas`
  - Tabelle: `TRANSFEHR`, Schlüssel `nr`
  - Umsetzung: generische Methode `DoSelectOne` der Basisklasse `TDataModulTableBase`
  - Der Server wertet die HTTP-Methode nicht aus – GET und POST funktionieren gleich.

  </details>
