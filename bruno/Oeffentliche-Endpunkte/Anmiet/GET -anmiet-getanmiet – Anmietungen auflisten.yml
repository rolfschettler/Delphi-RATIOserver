info:
  name: GET /anmiet/getanmiet – Anmietungen auflisten
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseURL}}/anmiet/getanmiet"
  body:
    type: json
    data: |-
      {
        "fields": "*",
        "orderby": "von"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Listet Datensätze der Tabelle ANMIET (Fahrzeuganmietungen/Reisevorgänge) auf (generisches `DoSelect`, kein Filter).

  **Tabelle:** ANMIET

  **Erlaubte Felder (ALLOWED):** nr, vorgang, anrede, name1, name2, name3, land, plz, ort, strasse, telefon, telefax, ziel, erstellt, kunde, preis, status, von, bis, vonzeit, biszeit, vart, rueckort, stunden, zustieg1, zustieg2, zustieg3, zustieg4, zustieg5, zustieg6, zustiegzeit1, zustiegzeit2, zustiegzeit3, zustiegzeit4, zustiegzeit5, zustiegzeit6, bearbeiter, perszahl, notiz, fahrerinfo, fahrtstrecke, optionsdatum, geaendert_am, kennzeichen, fahrer, fahrer2, fahrtnr, kmleer, kmanfang, kmende, kmgesamt, personen, buchungsdatum, datevkto, faellig, berechnung, gedruckt, erledigt, fest, uebernommen, ausvorgang, haupttext, storniert, kalkulation, disponr, bereitstellung, bereitdatum, bereitzeiet, basisvorgang, transferfahrt, symbol, eart, rueckzeit, abfahrtszeit, terminnr, bereich, rueckzustieg, rueckabfahrt, rueckabzeit, fusstext, ansprechpartner, provsatz1, provsatz2, provsatz3, provsteuer, transfehrnr, abfahrtsdatum, feld1, feld2, feld3, feld4, feld5, feld6, feld7, feld8, datumfeld1, datumfeld2, ausstiegrueck, disponentinfo, kontaktentstehung, reiseart, agentur, notiz2, azbis, rzbis, azbetrag, fahrtenplan, abrechnungsart, nrkreis, ankunftort, ankunftdatum, ankunftzeit, fahrzeugprofil, fahrerprofil, filialnr, lzugriff, lzugriff_von, stornogrund, sammelrechnung, anzahlung, anzfaelligam, zusatzinfo, stand, bereitstellung2, ankunftort2, rueckort2, rueckzustieg2, fibu_archiv_am, bestellnummer, unterschrift, datumfeld3, datumfeld4, schnittstelle_sendtime, geaendert_von, mandant

  **Body (optional):** `{ "fields": [...] | "*", "orderby": "feld", "limit": 10, "offset": 0 }` – ohne `fields` bzw. mit `"*"` werden alle ALLOWED-Felder geliefert; `orderby` muss ein ALLOWED-Feld sein. Ein leerer/fehlender Body ist erlaubt.

  **Auth:** erforderlich (Bearer Token); zusätzlich Rollenprüfung gegen REGISTRIERUNG.ROLLEN (leer/Supervisor/passende Rolle oder Endpunkt, sonst 403)

  **LocalOnly:** nein (auch extern erreichbar)

  **Antwort:** ohne `limit` das Ergebnis von `SerializeQuery`: `{"header":{"feld":"typ",...},"data":[{...},...]}`; mit `limit` > 0 `{"total":N,"limit":N,"offset":N,"data":{"header":{...},"data":[...]}}`.
