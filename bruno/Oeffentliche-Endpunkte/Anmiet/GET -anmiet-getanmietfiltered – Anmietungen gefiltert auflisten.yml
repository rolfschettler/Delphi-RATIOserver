info:
  name: GET /anmiet/getanmietfiltered – Anmietungen gefiltert auflisten
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseURL}}/anmiet/getanmietfiltered"
  body:
    type: json
    data: |-
      {
        "fields": "*",
        "vorgang": "VG-2026-001",
        "orderby": "von"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Listet ANMIET-Datensätze gefiltert auf (generisches `DoSelectFilteredDynamic`).

  **Tabelle:** ANMIET

  **Erlaubte Felder (ALLOWED):** identisch zu `getanmiet` (siehe dort)

  **Filterparameter (alle optional, AND-verknüpft, je `feld = :feld`):** vorgang – nur im Body vorhandene (nicht-null) Parameter erzeugen eine WHERE-Bedingung; ohne Filter werden alle Datensätze geliefert.

  **Body:** `{ "fields": [...] | "*", "vorgang": "..." }` – zusätzlich `orderby` (ALLOWED-Feld), `limit`, `offset`. Der Body muss ein gültiges JSON-Objekt sein (mindestens `{}`), sonst Fehler.

  **Auth:** erforderlich (Bearer Token); zusätzlich Rollenprüfung gegen REGISTRIERUNG.ROLLEN (leer/Supervisor/passende Rolle oder Endpunkt, sonst 403)

  **LocalOnly:** nein (auch extern erreichbar)

  **Antwort:** ohne `limit` das Ergebnis von `SerializeQuery`: `{"header":{"feld":"typ",...},"data":[{...},...]}`; mit `limit` > 0 `{"total":N,"limit":N,"offset":N,"data":{"header":{...},"data":[...]}}`.
