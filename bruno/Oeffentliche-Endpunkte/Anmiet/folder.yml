info:
  name: Anmiet
  type: folder
  seq: 6

request:
  auth: inherit

docs:
  content: |-
    Hier verwaltest du **Anmietungen** (Busanmietungen – Angebote, Aufträge und Fahrtaufträge mit Kunde, Termin, Fahrzeug und Fahrer), **Fundsachen** (verlorene Gegenstände, auch mit Foto und Abhol-Unterschrift) und **Transfer-Projekte** (Fahrtprojekte mit Hin- und Rückfahrt).

    Für alle drei Bereiche gibt es dieselben Endpunkte: auflisten, gefiltert suchen, einzeln abrufen, neue Nummer holen, anlegen, ändern und löschen. Dazu kommen `/anmiet/insertfundsachenmitbildern` (Fundsache inklusive Bildern in einem Schritt) und `/anmiet/demo` zum Testen.

    Alle Endpunkte brauchen eine Anmeldung (Token aus `/login`) und die Berechtigung für den jeweiligen Endpunkt in den Rollen des Benutzers (sonst Fehler 403).

    Technik: Controller `TDataModulAnmiet` in `Shared/DataModuls/DataModulAnmietClass.pas`, Tabellen `ANMIET`, `FUNDSACHEN`, `TRANSFEHR`.
  type: text/markdown
