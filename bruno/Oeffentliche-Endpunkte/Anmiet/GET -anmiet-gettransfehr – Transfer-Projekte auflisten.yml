info:
  name: GET /anmiet/gettransfehr – Transfer-Projekte auflisten
  type: http
  seq: 17

http:
  method: GET
  url: "{{baseURL}}/anmiet/gettransfehr"
  body:
    type: json
    data: |-
      {
        "fields": "*",
        "orderby": "hinfahrt"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  **Transfer-Projekte auflisten.** Liefert alle Einträge aus `TRANSFEHR` – auf Wunsch sortiert und seitenweise.

  | | |
  |---|---|
  | **Aufruf** | `GET {{baseURL}}/anmiet/gettransfehr` |
  | **Anmeldung** | nötig – Token aus `/login` (wird in Bruno automatisch mitgeschickt) |
  | **Berechtigung** | Der Benutzer braucht diesen Endpunkt in seinen Rollen (sonst Fehler 403) |

  ### Was du mitschickst
  Alles ist optional – ein leerer Body `{}` liefert alles.

  | Parameter | Wert | Pflicht | Bedeutung |
  |---|---|---|---|
  | `fields` | `"*"` oder Liste, z.B. `["nr","bezeichnung"]` | nein | Welche Felder zurückkommen sollen. `"*"` oder weglassen = alle Felder aus der Liste unten. |
  | `orderby` | Feldname | nein | Sortierung nach genau einem Feld, aufsteigend. |
  | `limit` | Zahl | nein | Höchstens so viele Datensätze liefern (zum Blättern). Weglassen = alle. |
  | `offset` | Zahl | nein | So viele Datensätze überspringen (nur zusammen mit `limit`). Beispiel: `limit` 20 und `offset` 40 = Seite 3. |

  ### Verfügbare Felder
  | Feld | Typ |
  |---|---|
  | `nr` | Ganzzahl |
  | `kunde` | Ganzzahl |
  | `ansprechpartner` | Ganzzahl |
  | `hinfahrt` | Datum/Uhrzeit |
  | `hinfahrtende` | Datum/Uhrzeit |
  | `rueckfahrt` | Datum/Uhrzeit |
  | `rueckfahrtende` | Datum/Uhrzeit |
  | `abfahrthin` | Text (max. 40 Zeichen) |
  | `ankunfthin` | Text (max. 40 Zeichen) |
  | `abfahrtrueck` | Text (max. 40 Zeichen) |
  | `ankunftrueck` | Text (max. 40 Zeichen) |
  | `zeit1h` | Text (max. 5 Zeichen) |
  | `zeit2h` | Text (max. 5 Zeichen) |
  | `zeit1r` | Text (max. 5 Zeichen) |
  | `zeit2r` | Text (max. 5 Zeichen) |
  | `text1` | Text (max. 40 Zeichen) |
  | `text2` | Text (max. 40 Zeichen) |
  | `text3` | Text (max. 40 Zeichen) |
  | `text4` | Text (max. 40 Zeichen) |
  | `text5` | Text (max. 40 Zeichen) |
  | `text6` | Text (max. 40 Zeichen) |
  | `datum1` | Datum/Uhrzeit |
  | `datum2` | Datum/Uhrzeit |
  | `kurztext` | Text (max. 600 Zeichen) |
  | `text` | Langtext/Datei |
  | `bearbeiter` | Text (max. 30 Zeichen) |
  | `erstellt` | Datum/Uhrzeit |
  | `perszahl` | Text (max. 25 Zeichen) |
  | `personen` | Ganzzahl |
  | `status` | Ganzzahl |
  | `symbol` | Ganzzahl |
  | `projektart` | Text (max. 40 Zeichen) |
  | `angebot_gedruckt` | Text (max. 4 Zeichen) |
  | `auftrag_gedruckt` | Text (max. 4 Zeichen) |
  | `optionsdatum` | Datum/Uhrzeit |
  | `filiale` | Text (max. 10 Zeichen) |
  | `kontaktentstehung` | Text (max. 8 Zeichen) |
  | `bearbeiter2` | Text (max. 30 Zeichen) |
  | `vertretung` | Text (max. 30 Zeichen) |
  | `reiseart` | Text (max. 8 Zeichen) |

  ### Was zurückkommt
  ```json
  {
    "header": {"nr": "ftinteger", ...},
    "data": [ {"nr": 42, "kunde": 42, "ansprechpartner": 42, ...} ]
  }
  ```
  `data` enthält die Datensätze, `header` nennt zu jedem Feld den technischen Typ. **Mit `limit`** sieht die Antwort so aus: `{"total": 123, "limit": 20, "offset": 0, "data": { "header": ..., "data": [...] }}` – `total` ist die Gesamtzahl aller Treffer.

  ### Was schiefgehen kann
  - **401** – nicht angemeldet oder Token abgelaufen → neu einloggen.
  - **403** – keine Berechtigung für diesen Endpunkt.
  - **Fehlermeldung im Text** (`{"status":"error","message":"..."}`), z.B. wenn ein Feldname in `fields` oder `orderby` nicht erlaubt ist. Achtung: Solche Fehler kommen teilweise mit HTTP-Status 200 – deshalb immer auf `"status": "error"` prüfen.

  ### Gut zu wissen
  - **Ohne `limit` kommt die komplette Tabelle** – bei vielen Einträgen besser seitenweise abrufen.
  - **Zum Suchen** den passenden `…filtered`-Endpunkt verwenden, für einen einzelnen Eintrag `…byid`.

  <details><summary>Für Entwickler</summary>

  - Controller: `TDataModulAnmiet.getTransfehr` in `Shared/DataModuls/DataModulAnmietClass.pas`
  - Tabelle: `TRANSFEHR`, Schlüssel `nr`
  - Umsetzung: generische Methode `DoSelect` der Basisklasse `TDataModulTableBase`
  - Der Server wertet die HTTP-Methode nicht aus – GET und POST funktionieren gleich.

  </details>
