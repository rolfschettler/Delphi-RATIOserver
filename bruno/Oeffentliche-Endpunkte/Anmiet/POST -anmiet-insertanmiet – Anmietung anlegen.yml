info:
  name: POST /anmiet/insertanmiet – Anmietung anlegen
  type: http
  seq: 12

http:
  method: POST
  url: "{{baseURL}}/anmiet/insertanmiet"
  body:
    type: json
    data: |-
      {
        "vorgang": "VG-2026-0451",
        "anrede": "Herr",
        "name1": "Mustermann",
        "ort": "München",
        "strasse": "Bahnhofstr. 1",
        "plz": "80331",
        "von": "2026-09-01",
        "bis": "2026-09-05",
        "vonzeit": "09:00",
        "biszeit": "18:00",
        "status": "offen",
        "preis": "450.00",
        "bearbeiter": "hw"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Legt einen neuen ANMIET-Datensatz an (generisches `DoInsert`).

  **Tabelle:** ANMIET

  **Erlaubte Felder (ALLOWED):** vorgang, anrede, name1, name2, name3, land, plz, ort, strasse, telefon, telefax, ziel, erstellt, kunde, preis, status, von, bis, vonzeit, biszeit, vart, rueckort, stunden, zustieg1, zustieg2, zustieg3, zustieg4, zustieg5, zustieg6, zustiegzeit1, zustiegzeit2, zustiegzeit3, zustiegzeit4, zustiegzeit5, zustiegzeit6, bearbeiter, perszahl, notiz, fahrerinfo, fahrtstrecke, optionsdatum, geaendert_am, kennzeichen, fahrer, fahrer2, fahrtnr, kmleer, kmanfang, kmende, kmgesamt, personen, buchungsdatum, datevkto, faellig, berechnung, gedruckt, erledigt, fest, uebernommen, ausvorgang, haupttext, storniert, kalkulation, disponr, bereitstellung, bereitdatum, bereitzeiet, basisvorgang, transferfahrt, symbol, eart, rueckzeit, abfahrtszeit, terminnr, bereich, rueckzustieg, rueckabfahrt, rueckabzeit, fusstext, ansprechpartner, provsatz1, provsatz2, provsatz3, provsteuer, transfehrnr, abfahrtsdatum, feld1, feld2, feld3, feld4, feld5, feld6, feld7, feld8, datumfeld1, datumfeld2, ausstiegrueck, disponentinfo, kontaktentstehung, reiseart, agentur, notiz2, azbis, rzbis, azbetrag, fahrtenplan, abrechnungsart, nrkreis, ankunftort, ankunftdatum, ankunftzeit, fahrzeugprofil, fahrerprofil, filialnr, lzugriff, lzugriff_von, stornogrund, sammelrechnung, anzahlung, anzfaelligam, zusatzinfo, stand, bereitstellung2, ankunftort2, rueckort2, rueckzustieg2, fibu_archiv_am, bestellnummer, unterschrift, datumfeld3, datumfeld4, schnittstelle_sendtime, geaendert_von, mandant – nur diese Felder werden aus dem Body übernommen, alle anderen ignoriert (mindestens ein gültiges Feld nötig, sonst „Keine gueltigen Felder uebergeben.“).

  **Hinweis:** Der Primärschlüssel `nr` ist NICHT in ALLOWED und wird ignoriert – die Vergabe muss datenbankseitig (Generator ANMIETNR/Trigger) erfolgen; `/anmiet/getanmietkey` liefert nur den nächsten Generatorwert.

  **Body:** `{ "vorgang": "...", "name1": "...", "von": "...", "bis": "...", ... }`

  **Auth:** erforderlich (Bearer Token); zusätzlich Rollenprüfung gegen REGISTRIERUNG.ROLLEN (leer/Supervisor/passende Rolle oder Endpunkt, sonst 403)

  **LocalOnly:** nein (auch extern erreichbar)

  **Antwort:** `{"status":"OK"}`
