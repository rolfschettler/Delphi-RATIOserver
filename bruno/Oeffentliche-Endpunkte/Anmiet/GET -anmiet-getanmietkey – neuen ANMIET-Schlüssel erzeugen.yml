info:
  name: GET /anmiet/getanmietkey – neuen ANMIET-Schlüssel erzeugen
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseURL}}/anmiet/getanmietkey"
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Kein generischer CRUD-Endpunkt: führt die feste Abfrage `SELECT GEN_ID(ANMIETNR, 1) FROM RDB$DATABASE` aus und liefert den nächsten Generatorwert für den Primärschlüssel `nr` der Tabelle ANMIET. Body wird nicht ausgewertet.

  **Tabelle:** ANMIET

  **Key-Feld:** `nr`

  **Hinweis:** Die Select-Spalte hat KEINEN Alias (anders als z.B. bei `getfundsachenkey`) – der JSON-Schlüssel ist daher nicht `nr`, sondern der von InterBase vergebene Ausdrucksname (i.d.R. `gen_id`).

  **Body:** keiner

  **Auth:** erforderlich (Bearer Token); zusätzlich Rollenprüfung gegen REGISTRIERUNG.ROLLEN (leer/Supervisor/passende Rolle oder Endpunkt, sonst 403)

  **LocalOnly:** nein (auch extern erreichbar)

  **Antwort:** `{"header":{"gen_id":"ftinteger"},"data":[{"gen_id":<nächster Wert>}]}` (Spaltenname siehe Hinweis)
