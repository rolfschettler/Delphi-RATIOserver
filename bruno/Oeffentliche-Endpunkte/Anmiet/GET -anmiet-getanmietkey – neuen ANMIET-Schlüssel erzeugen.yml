info:
  name: GET /anmiet/getanmietkey – neuen ANMIET-Schlüssel erzeugen
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseURL}}/anmiet/getanmietkey"
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  **Neuen Anmietungs-Schlüssel erzeugen.** Reserviert die nächste freie Anmietungs-Nummer und gibt sie zurück.

  | | |
  |---|---|
  | **Aufruf** | `GET {{baseURL}}/anmiet/getanmietkey` |
  | **Anmeldung** | nötig – Token aus `/login` (wird in Bruno automatisch mitgeschickt) |
  | **Berechtigung** | Der Benutzer braucht diesen Endpunkt in seinen Rollen (sonst Fehler 403) |

  ### Was du mitschickst
  Nichts – ein Body wird nicht benötigt (und ignoriert).

  ### Was zurückkommt
  ```json
  {"header": {"gen_id": "ftinteger"}, "data": [ {"gen_id": 4711} ]}
  ```
  Die neue Nummer steht in `data[0].gen_id`.

  ### Was schiefgehen kann
  - **401** – nicht angemeldet oder Token abgelaufen → neu einloggen.
  - **403** – keine Berechtigung für diesen Endpunkt.

  ### Gut zu wissen
  - **Das Feld in der Antwort heißt `gen_id`** – nicht `nr` wie bei den anderen Schlüssel-Endpunkten (z.B. `/anmiet/getfundsachenkey`).
  - **Jeder Aufruf verbraucht eine Nummer** – auch wenn danach nichts angelegt wird. Lücken in der Nummerierung sind deshalb normal.
  - **Die Nummer gehört dir:** Kein anderer Aufruf bekommt dieselbe Nummer – auch die Datenbank vergibt sie beim Anlegen einer Anmietung nicht noch einmal.
  - **Beim Anlegen über `/anmiet/insertanmiet` kannst du die Nummer nicht mitgeben.** Dort vergibt die Datenbank `nr` immer selbst, ein mitgeschicktes `nr` wird ignoriert. Die hier geholte Nummer lässt sich dort also nicht verwenden.

  <details><summary>Für Entwickler</summary>

  - Controller: `TDataModulAnmiet.getAnmietKey` in `Shared/DataModuls/DataModulAnmietClass.pas`
  - InterBase-Generator `ANMIETNR`: `SELECT GEN_ID(ANMIETNR, 1) FROM RDB$DATABASE` – **ohne Alias**, daher heißt das Feld `gen_id` (per DB geprüft).
  - Derselbe Generator wird vom Trigger `TI_ANMIET` benutzt, wenn beim Insert `NR` leer ist.
  - Auffälligkeiten: fehlendes `AS nr` (Antwort weicht von den übrigen Key-Endpunkten ab); `insertAnmiet` hat `nr` nicht in der Whitelist, die geholte Nummer ist für den Insert also nicht nutzbar.
  - Der Server wertet die HTTP-Methode nicht aus.

  </details>
