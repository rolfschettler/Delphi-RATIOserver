info:
  name: GET /anmiet/demo – Demo-/Testendpunkt
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseURL}}/anmiet/demo?id=42&filter=Mueller"
  params:
    - name: id
      value: "42"
      type: query
    - name: filter
      value: Mueller
      type: query
  body:
    type: json
    data: |-
      {
        "name": "Helga",
        "menge": 5
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Referenz-/Testendpunkt für die Entwicklung neuer Endpunkte. Demonstriert den sicheren Zugriff auf Parameter aus zwei Quellen: URL-Query (`id` als Zahl, `filter` als String, über `Request.QueryFields`) und JSON-Body (`name` als String, `menge` als Zahl, über `isParamFromBody`/`getParamFromBody`). Fehlende Werte erzeugen keinen Fehler, sondern erscheinen im Ergebnis als `null`.

  **Tabelle:** keine (kein Datenbankzugriff)

  **Query-Parameter (optional):** `id`, `filter`

  **Body (optional):** `{ "name": "...", "menge": <zahl> }`

  **Auth:** erforderlich (Bearer Token); zusätzlich Rollenprüfung gegen REGISTRIERUNG.ROLLEN (leer/Supervisor/passende Rolle oder Endpunkt, sonst 403)

  **LocalOnly:** nein (auch extern erreichbar)

  **Antwort:** `{"url":{"id":42,"filter":"Mueller"},"body":{"name":"Helga","menge":5}}` (per `SendJson`)
