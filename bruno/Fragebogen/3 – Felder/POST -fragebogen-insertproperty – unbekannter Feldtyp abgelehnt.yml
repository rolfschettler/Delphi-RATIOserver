info:
  name: POST /fragebogen/insertproperty – unbekannter Feldtyp abgelehnt
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseURL}}/fragebogen/insertproperty"
  body:
    type: json
    data: |-
      {
        "kartei_id": {{kartei_id}},
        "label": "Falscher Typ",
        "proptyp": "XYZ"
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        let rumpf = null;
        try { rumpf = res.getBody(); if (typeof rumpf === "string") rumpf = JSON.parse(rumpf); } catch (e) {}

        test("HTTP 400", () => expect(res.getStatus()).to.equal(400));
        test("status ERROR", () => expect(rumpf && rumpf.status).to.equal("ERROR"));
        test("Meldung enthält \"Unbekannte Art\"", () => expect(rumpf && rumpf.message).to.include("Unbekannte Art"));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  **Auth:** erforderlich (Bearer {{jwttoken}}); zusätzlich Rollenprüfung gegen REGISTRIERUNG.ROLLEN (sonst 403). **LocalOnly:** nein.

  proptyp nicht in der Liste -> 400 'Unbekannte Art des Feldes: "XYZ".'.
