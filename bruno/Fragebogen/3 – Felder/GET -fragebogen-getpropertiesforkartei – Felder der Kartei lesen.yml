info:
  name: GET /fragebogen/getpropertiesforkartei – Felder der Kartei lesen
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseURL}}/fragebogen/getpropertiesforkartei"
  body:
    type: json
    data: |-
      {
        "kartei_id": {{kartei_id}}
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        let rumpf = null;
        try { rumpf = res.getBody(); if (typeof rumpf === "string") rumpf = JSON.parse(rumpf); } catch (e) {}

        const zeilen = (rumpf && Array.isArray(rumpf.data)) ? rumpf.data : [];
        const feld = (id) => zeilen.find(z => Number(z.id ?? z.ID) === Number(id));
        const wert = (z, k) => z ? (z[k] ?? z[k.toUpperCase()]) : undefined;
        const txt = feld(bru.getVar("prop_txt_id"));
        const sel = feld(bru.getVar("prop_sel_id"));

        test("HTTP 200", () => expect(res.getStatus()).to.equal(200));
        test("genau 2 Felder", () => expect(zeilen.length).to.equal(2));
        test("Textfeld: Sortierung 99", () => expect(Number(wert(txt, "sortierung"))).to.equal(99));
        test("Textfeld: options NULL", () => expect(wert(txt, "options") ?? null).to.be.oneOf([null, ""]));
        test("Textfeld: proptyp groß", () => expect(String(wert(txt, "proptyp")).trim()).to.equal("TXT"));
        test("Auswahlliste: Umlaute in options", () => expect(wert(sel, "options")).to.equal("rot,grün,blau,weiß"));
        test("Auswahlliste: bereich NULL", () => expect(wert(sel, "bereich") ?? null).to.be.oneOf([null, ""]));
        test("inuse = 0", () => zeilen.forEach(z => expect(Number(wert(z, "inuse"))).to.equal(0)));
        test("Reihenfolge nach Sortierung", () => expect(Number(wert(zeilen[0], "id"))).to.equal(Number(bru.getVar("prop_sel_id"))));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  **Auth:** erforderlich (Bearer {{jwttoken}}); zusätzlich Rollenprüfung gegen REGISTRIERUNG.ROLLEN (sonst 403). **LocalOnly:** nein.

  **Body:** {"kartei_id": 3} – Pflicht.

  **Antwort:** {"header":{...},"data":[{id, label, proptyp, options, maxwidth, bereich, sortierung, system, kartei_id, inuse}, ...]}
  sortiert nach sortierung, id. "inuse" = Anzahl gespeicherter Werte zu diesem
  Feld (FORM_KARTEI_CONTENT); die Oberfläche warnt damit vor dem Löschen.

  **Fehler:** 400 '"kartei_id" fehlt oder ist keine Zahl.'.

  Prüft die Ergebnisse von 3/1, 3/2 und 3/5, u.a. die Umlaute im OPTIONS-Memo.
  Schlägt nur der Umlaut-Test fehl: Verbindung läuft mit Zeichensatz NONE
  (siehe webUtils.pas) – Zeichen außerhalb Windows-1252 gehen verloren, ä/ö/ü/ß
  sollten aber durchkommen.
