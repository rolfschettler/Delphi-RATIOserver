info:
  name: GET /fragebogen/getpropertiesforkartei – Felder per CASCADE weg
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseURL}}/fragebogen/getpropertiesforkartei"
  body:
    type: json
    data: |-
      {
        "kartei_id": {{kartei_id}}
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        let rumpf = null;
        try { rumpf = res.getBody(); if (typeof rumpf === "string") rumpf = JSON.parse(rumpf); } catch (e) {}

        test("HTTP 200", () => expect(res.getStatus()).to.equal(200));
        test("keine Felder mehr", () => expect(rumpf && rumpf.data).to.be.an("array").that.is.empty);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  **Auth:** erforderlich (Bearer {{jwttoken}}); zusätzlich Rollenprüfung gegen REGISTRIERUNG.ROLLEN (sonst 403). **LocalOnly:** nein.

  Nach dem Löschen der Kartei sind auch ihre Felder weg (ON DELETE CASCADE).
