info:
  name: POST /fragebogen/deleteproperty – Feld löschen
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseURL}}/fragebogen/deleteproperty"
  body:
    type: json
    data: |-
      {
        "id": {{prop_txt_id}}
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        let rumpf = null;
        try { rumpf = res.getBody(); if (typeof rumpf === "string") rumpf = JSON.parse(rumpf); } catch (e) {}

        test("HTTP 200", () => expect(res.getStatus()).to.equal(200));
        test("status OK", () => expect(rumpf && rumpf.status).to.equal("OK"));
        if (res.getStatus() !== 200)
            console.warn(JSON.stringify(res.getBody()));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  **Auth:** erforderlich (Bearer {{jwttoken}}); zusätzlich Rollenprüfung gegen REGISTRIERUNG.ROLLEN (sonst 403). **LocalOnly:** nein.

  **Body:** {"id": 7}
  Gespeicherte Werte zu diesem Feld löscht die Datenbank per CASCADE mit.

  **Antwort:** 200 {"status":"OK"}
  **Fehler:** 400 ungültige id, 403 "Systemfeld - geschützt.", 404 "Feld nicht gefunden.".
