info:
  name: POST /fragebogen/deletekartei – Kartei löschen
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseURL}}/fragebogen/deletekartei"
  body:
    type: json
    data: |-
      {
        "id": {{kartei_id}}
      }
  auth:
    type: bearer
    token: "{{jwttoken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        let rumpf = null;
        try { rumpf = res.getBody(); if (typeof rumpf === "string") rumpf = JSON.parse(rumpf); } catch (e) {}

        test("HTTP 200", () => expect(res.getStatus()).to.equal(200));
        test("status OK", () => expect(rumpf && rumpf.status).to.equal("OK"));
        if (res.getStatus() !== 200)
            console.warn(JSON.stringify(res.getBody()));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  **Auth:** erforderlich (Bearer {{jwttoken}}); zusätzlich Rollenprüfung gegen REGISTRIERUNG.ROLLEN (sonst 403). **LocalOnly:** nein.

  Löscht die in Ordner 2 angelegte Kartei samt verbliebenem Feld (prop_sel_id) per CASCADE.

  **Antwort:** 200 {"status":"OK"}
