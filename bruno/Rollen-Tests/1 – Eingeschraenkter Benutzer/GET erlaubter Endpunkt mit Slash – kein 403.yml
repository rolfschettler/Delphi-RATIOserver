info:
  name: GET erlaubter Endpunkt mit Slash – kein 403
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseURL}}{{erlaubt_endpunkt}}/"
  auth:
    type: bearer
    token: "{{jwttoken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        test("kein 403", () => expect(res.getStatus()).to.not.equal(403));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Abschliessender Slash darf die Pruefung nicht beeinflussen.
