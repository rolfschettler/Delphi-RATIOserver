info:
  name: GET erlaubter Endpunkt – 200
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseURL}}{{erlaubt_endpunkt}}"
  auth:
    type: bearer
    token: "{{jwttoken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        test("kein 403", () => expect(res.getStatus()).to.not.equal(403));
        test("HTTP 200", () => expect(res.getStatus()).to.equal(200));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  erlaubt_endpunkt steht in den Rollen des Benutzers -> Zugriff.
