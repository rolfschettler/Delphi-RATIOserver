info:
  name: GET verbotener Endpunkt – 403
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseURL}}{{verboten_endpunkt}}"
  auth:
    type: bearer
    token: "{{jwttoken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        const text = typeof res.getBody() === "string" ? res.getBody() : JSON.stringify(res.getBody());
        test("HTTP 403", () => expect(res.getStatus()).to.equal(403));
        test("Meldung 'Keine Berechtigung'", () => expect(text).to.contain("Keine Berechtigung"));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  verboten_endpunkt steht NICHT in den Rollen -> 403.
