info:
  name: GET verbotener Endpunkt in Grossschreibung – 403
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseURL}}{{verboten_endpunkt}}"
  auth:
    type: bearer
    token: "{{jwttoken}}"

runtime:
  scripts:
    - type: before-request
      code: |-
        // Pfad in Grossschreibung: die Pruefung darf sich dadurch nicht umgehen lassen
        req.setUrl(bru.getCollectionVar("baseURL") + String(bru.getCollectionVar("verboten_endpunkt")).toUpperCase());
    - type: after-response
      code: |-
        test("HTTP 403", () => expect(res.getStatus()).to.equal(403));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Gleicher Endpunkt wie vorher, aber in Grossschreibung -> ebenfalls 403.
