info:
  name: GET geschuetzter Endpunkt ohne Token – 401
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseURL}}{{erlaubt_endpunkt}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("HTTP 401", () => expect(res.getStatus()).to.equal(401));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Bewusst OHNE {{jwttoken}} (auth: inherit, die Collection hat keine Auth):
  ohne Anmeldung darf kein Zugriff bestehen.
