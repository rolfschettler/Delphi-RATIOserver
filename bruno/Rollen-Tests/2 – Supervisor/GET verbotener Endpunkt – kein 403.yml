info:
  name: GET verbotener Endpunkt – kein 403
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseURL}}{{verboten_endpunkt}}"
  auth:
    type: bearer
    token: "{{jwttoken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Supervisor darf alles (kein 403)", () => expect(res.getStatus()).to.not.equal(403));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Derselbe Endpunkt, der in Ordner 1 mit 403 abgelehnt wird.
