info:
  name: GET verbotener Endpunkt – 403
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseURL}}{{verboten_endpunkt}}"
  auth:
    type: bearer
    token: "{{jwttoken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        test("HTTP 403", () => expect(res.getStatus()).to.equal(403));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Erwartet, dass verboten_endpunkt NICHT in der Blaupause @MITARBEITER steht.
