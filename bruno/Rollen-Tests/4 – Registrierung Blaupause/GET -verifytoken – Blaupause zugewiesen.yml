info:
  name: GET /verifytoken – Blaupause zugewiesen
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseURL}}/verifytoken"
  auth:
    type: bearer
    token: "{{jwttoken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        let rumpf = null;
        try { rumpf = res.getBody(); if (typeof rumpf === "string") rumpf = JSON.parse(rumpf); } catch (e) {}
        const rollen = (rumpf && rumpf.role && rumpf.role.rollen) || "";

        test("rollen enthaelt @mitarbeiter", () => expect(rollen.split(",")).to.include("@mitarbeiter"));
        test("rollen nicht leer (kein voller Zugriff)", () => expect(rollen).to.not.be.empty);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  '@mitarbeiter' bleibt nach der Aufloesung in der Liste stehen - auch wenn
  die Blaupause fehlt, ist die Liste damit nie leer.
